      const k = rig.ord[i] - pn;
      if (k >= 0 && k < EYE.dots * 2) { rig.eyeSlot[k] = i; rig.isEye[i] = k < EYE.dots ? 1 : 2; }
    }
  }
  // height up the body, from the bind pose, per particle
  const P = R.dec.P;
  let lo = 1e30, hi = -1e30;
  for (let v = 0; v < R.dec.n; v++) { const y = P[v * 3 + 1]; if (y < lo) lo = y; if (y > hi) hi = y; }
  const sp = hi - lo || 1;
  figH.fill(1);
  for (let i = 0; i < rig.ord.length; i++) {
    const vv = rig.ord[i];
    // an eye point has no bind-pose height; mid-body means the wipe covers it early
    figH[i] = vv >= pn ? 0.5
            : ((S ? S.WA[vv] * P[S.A[vv] + 1] + S.WB[vv] * P[S.B[vv] + 1] + S.WC[vv] * P[S.C[vv] + 1]
                  : P[vv * 3 + 1]) - lo) / sp;
  }

  // no beat before the lines: the wipe schedule owns their timing now
  wireAt = 0;
  // the shader's wipe reads the raw POSITION attribute, so its bounds are the
  // bind pose's, not the fit's
  gl.uLo.value = lo; gl.uSpan.value = sp;
  /* Started AFTER the GPU copy is in, not before it. Three quarters of a second
     of parsing a 3.6MB file went by with the build clock already running, so
     the first thing on screen was a figure two thirds assembled. */
  worldReset();
  rig.fs0 = FIG_FS;
  rig.R = R; rig.src = src; rig.on = 1; rig.out = 0; rig.loading = 0;
  /* Measured off the skeleton rather than declared per model: a rig with no
     foot and no toe in it is not standing on anything. A head floats; a body
     does not, and nobody has to remember to say so. */
  rig.floats = 0;
  rig.eyeB = null; blink.ids = null; blink.next = 0;
  try {
    const bs = (gl.mesh && gl.mesh.skeleton && gl.mesh.skeleton.bones) || [];
    rig.floats = bs.length && !bs.some((b) => /foot|toe/i.test(b.name)) ? 1 : 0;
  } catch (e) {}
  rig.t = 0; rig.at = performance.now(); rig.stage = -1; rig.hold = 0; rig.speed = 1;
  rig.orbN = 0; rig.oH = null;
  rig.wipe = [0, 0, 0, 0];
  solidWant = 1;
  figChooser(1);
  caption(null, src + " · building");
  return true;
}

function figStop() {
  if (!rig.on) return false;
  rig.out = performance.now();
  return true;
}
function figClear() {
  mini.set = 0;
  rig.orbN = 0; rig.oH = null;
  // his body is gone, so the orb has the microphone back
  brain.persona = "";
  worldReset();
  rig.on = 0; rig.R = null; rig.ord = null; rig.out = 0; rig.hold = 0;
  rig.portrait = 0; rig.pose = null;
  rig.isEye = null; rig.eyeSlot = null; rig.eyeBones = null; rig.feat = null; rig.eb = null;
  gl.ready = 0;
  figChooser(0);
}

/* Where the four wipes are, this frame. Building runs them up in order; leaving
   runs them DOWN in the opposite order, so the colour goes first and the dots
   go last -- undressing rather than rewinding. */
function figWipes(now) {
  const W2 = rig.wipe;
  if (rig.hold) { for (let k = 0; k < 4; k++) W2[k] = rig.hold[k]; return; }
  if (rig.out) {
    const e = (now - rig.out) / 1000;
    for (let k = 0; k < 4; k++) {
      const u = (e - FIG.start[3 - k] * 0.55) / (FIG.climb * 0.8);
      W2[k] = FIG.top * Math.max(0, 1 - Math.max(0, u));
    }
    return;
  }
  const e = (now - rig.at) / 1000;
  for (let k = 0; k < 4; k++)
    W2[k] = FIG.top * Math.max(0, Math.min(1, (e - FIG.start[k]) / FIG.climb));
}
// 0..1 for one particle against one wipe, with a soft front
function figGate(i, k) {
  const d = (rig.wipe[k] - figH[i]) / FIG.soft;
  return d <= 0 ? 0 : d >= 1 ? 1 : d;
}
/* An edge or a face belongs to its LOWEST corner. Taking the highest makes the
   surface trail the lines by a whole limb near the shoulders, where a triangle
   can span a lot of body; taking the lowest makes each stage arrive as one
   front instead of a fringe. */
function figGate3(a, b, c, k) {
  let h = figH[a];
  if (figH[b] < h) h = figH[b];
  if (c !== undefined && figH[c] < h) h = figH[c];
  const d = (rig.wipe[k] - h) / FIG.soft;
  return d <= 0 ? 0 : d >= 1 ? 1 : d;
}

/* Once per frame: advance the take, pose the skeleton, blend the vertices, and
   write the result into the formation the particles are already chasing. They
   chase it through a spring, which is why the figure has a little weight in it
   -- the dots lag the skeleton by a frame or two and settle, and that lag is
   free character nobody had to animate. */
function updateFigure(dt, now) {
  if (!rig.on) return;
  // something else took the field -- a shell, a word, a reload. Nothing to wipe.
  if (!formWant && !rig.out) { figClear(); return; }
  if (rig.out && now - rig.out > (FIG.start[3] * 0.55 + FIG.climb * 0.8 + 0.4) * 1000) {
    /* formT goes with it, and this is the one line that made the deconstruct
       incoherent.

       A rig particle's hold is TWO gates multiplied: formT globally, and
       figGate(i,0) per particle as the dots wipe runs down the body. By the
       time the rig ends the wipe has been at zero for four hundred milliseconds
       -- every particle is already free and drifting back to the ring -- but
       formT is still 1, because nothing was driving it down. So the frame
       rig.on cleared, the gate stopped being formT * 0 and became plain formT,
       and all 3,085 particles snapped back onto the figure's last pose at full
       strength before dissolving a second time.

       Measured over the whole exit: every frame moves a particle 1.4px on
       average, except that one, which moved them 107.9px (worst 211px). It is
       the only discontinuity in the sequence.

       Zeroing formT here is exactly continuous -- every gate is already zero at
       this instant, so nothing moves on the frame it happens. It just removes
       something for the field to snap back to. */
    formWant = 0; formUntil = 0; formT = 0; figClear(); return;
  }
  figWipes(now);
  const R = rig.R;
  rig.t += (dt / 1000) * rig.speed;
  /* setTime, not update(dt). Two skinning implementations are running -- three's
     on the GPU for the render, this file's on the CPU for the dots -- and they
     have to be at the same instant of the same take or the particles crawl
     around on a body that is somewhere else. One clock, pushed to both. */
  /* The pose is READ from three, not computed alongside it.

     Two skinning implementations agreeing on one clock was fine when the file
     had one clip. With thirty-six and a crossfade between them there is no
     clock to agree on: the mixer is blending two clips by an amount only it
     knows. So the dots take the matrices three has just finished computing.
     One skeleton, one answer, and the particles cannot drift off him. */
  if (gl.ready && gl.mesh && gl.mesh.skeleton) {
    /* Built from the BONES, in the mesh's own space:

           jm[j] = inverse(mesh.matrixWorld) * bone[j].matrixWorld * inverseBind[j]

       which is the textbook formula and depends on nothing three does
       privately. The first two attempts went through `skeleton.boneMatrices`
       and three's bind matrices instead, and both scattered all 3,085 particles
       evenly across the screen while the render beside them was perfectly
       correct -- every dot transformed by a matrix that was almost right.

       The reason: boneMatrices are in WORLD space, and the world here has the
       stage's scale in it (about 38) and the glTF scene node's own scale (0.01,
       because the model came out of a tool that works in centimetres). three
       cancels that with bindMatrixInverse, which it recomputes from the mesh's
       world matrix -- but it leaves bindMatrix at whatever it was when the mesh
       was bound, which is identity. So the composition the shader uses is not
       one you can reproduce from the two matrices named after it. Going
       straight to the bones sidesteps the whole question. */
    /* three's own answer, per vertex, rather than a reconstruction of it.

       Two attempts went through the matrices first -- skeleton.boneMatrices,
       then the bones composed by hand -- and both scattered all 3,085 particles
       evenly across the screen while the render beside them was perfectly
       correct. The world those matrices live in has the stage's scale in it
       (about 38) AND the glTF scene node's own (0.01, because the model came
       out of a tool that works in centimetres), and three cancels that with a
       bindMatrixInverse it recomputes while leaving bindMatrix at the identity
       it was bound with. The composition the shader actually performs is not
       one you can rebuild from the two matrices named after it.

       applyBoneTransform is that composition, exported. It costs a call per
       vertex instead of a matrix per joint, which at this count is about a
       millisecond -- and it cannot disagree with the picture, because it IS
       the picture. */
    // after the mixer's stomp, before the skin. Not portrait-only: the mixer
    // stomps a mesh figure's jaw bone exactly as hard as a portrait's.
    visApplyJaw();
    skinGL(R);
    skinPoints(R);
  } else {
    rigPose(R, rig.t);                       // no GPU: the file's first clip
    rigSkin(R, R.wp, R.wn);
  }
  const f = R.fit, P = R.wp, N = R.wn, ord = rig.ord;
  const n = Math.min(formN, ord.length);
  // and where he is standing, which the render applies to its own root
  /* THIS is the loop that decides which way he faces, not rigPoint -- that one
     builds the point list once and this overwrites it every frame. Patching the
     wrong one is why two opposite yaw values rendered pixel for pixel the same.

     A portrait stands nowhere. world.yaw and world.x/y/z place a figure in the
     room and walk him about in it, which is exactly right for a body and is
     what was turning a face away from you. POSE replaces them: two numbers, one
     place, checkable in a reload. */
  /* THIS is the loop that decides which way he faces, not rigPoint -- that one
     builds the point list once and this overwrites it every frame. Patching the
     wrong one is why two opposite rotations rendered pixel for pixel the same.

     A portrait stands nowhere: world.yaw and world.x/y/z place a figure in the
     room and walk him about it, which is right for a body and was turning a
     face away from you. It uses the basis solved from its own skeleton instead
     of the room's camera or a hand-picked angle. */
  const port = rig.portrait;
  let M = port ? rig.pose : null;
  const tSec = now * 0.001;
  let bobY = 0, bobX = 0, bobZ = 0;
  if (M) {
    M = bobMatrix(M, tSec);
    // three incommensurate periods, so the drift never lands twice
    bobY = Math.sin(tSec * 0.55) * BOB.y;
    bobX = Math.sin(tSec * 0.37 + 2.1) * BOB.x;
    bobZ = Math.sin(tSec * 0.23 + 4.3) * BOB.z;
  }
  const cw = Math.cos(world.yaw + flo.ry), sw = Math.sin(world.yaw + flo.ry);
  const S = rig.samp, pn = rig.pn != null ? rig.pn : R.dec.n;
  let bXL = 1e30, bXH = -1e30, bYL = 1e30, bYH = -1e30, bZL = 1e30, bZH = -1e30;
  for (let i = 0; i < n; i++) {
    if (ord[i] >= pn) continue;            // an eye slot; its writer runs below
    /* A sample is three vertices and three weights. Everything below is
       unchanged -- it reads a position and a normal and does not care that
       they came off a triangle rather than off a corner of one. */
    let px2, py2, pz2, nx2, ny2, nz2;
    if (S) {
      const k2 = ord[i], a = S.A[k2], b = S.B[k2], c = S.C[k2];
      const wa = S.WA[k2], wb = S.WB[k2], wc = S.WC[k2];
      px2 = wa * P[a] + wb * P[b] + wc * P[c];
      py2 = wa * P[a + 1] + wb * P[b + 1] + wc * P[c + 1];
      pz2 = wa * P[a + 2] + wb * P[b + 2] + wc * P[c + 2];
      nx2 = wa * N[a] + wb * N[b] + wc * N[c];
      ny2 = wa * N[a + 1] + wb * N[b + 1] + wc * N[c + 1];
      nz2 = wa * N[a + 2] + wb * N[b + 2] + wc * N[c + 2];
      const L2 = Math.hypot(nx2, ny2, nz2) || 1;
      nx2 /= L2; ny2 /= L2; nz2 /= L2;
    } else {
      const v = ord[i] * 3;
      px2 = P[v]; py2 = P[v + 1]; pz2 = P[v + 2];
      nx2 = N[v]; ny2 = N[v + 1]; nz2 = N[v + 2];
    }
    const x = px2 - f.c[0], y = py2 - f.c[1], z = pz2 - f.c[2];
    let fx, fy, fz, gx, gy, gz;
    if (M) {
      const ax = x * f.k, ay = -y * f.k, az = -z * f.k;
      fx = M[0]*ax + M[1]*ay + M[2]*az;
      fy = M[3]*ax + M[4]*ay + M[5]*az;
      fz = M[6]*ax + M[7]*ay + M[8]*az;
      const bx = nx2, by = -ny2, bz = -nz2;
      gx = M[0]*bx + M[1]*by + M[2]*bz;
      gy = M[3]*bx + M[4]*by + M[5]*bz;
      gz = M[6]*bx + M[7]*by + M[8]*bz;
    } else {
      const rx = x * cw + z * sw, rz = -x * sw + z * cw;
      fx = (rx + world.x + flo.x) * f.k;
      fy = -(y + world.y + flo.y) * f.k;
      fz = -(rz + world.z + flo.z) * f.k;
      gx = nx2 * cw + nz2 * sw; gy = -ny2; gz = -(-nx2 * sw + nz2 * cw);
    }
    if (M) {
      /* The wisp. Each particle wanders a little off its post on its own
         phase, and the trail (the low clear alpha while a portrait is up)
         stretches that wander into a short-lived streak that fades out --
         which is the energy-trail look: the structure holds because the
         wander is small and the spring pulls home, and the ghost happens
         because the canvas remembers where the dot just was. */
      const ph = i * 2.399963;
      fx += bobX + Math.sin(tSec * 1.3 + ph) * BOB.und;
      fy += bobY + Math.sin(tSec * 1.7 + ph * 1.31) * BOB.und;
      fz += bobZ + Math.sin(tSec * 1.1 + ph * 2.17) * BOB.und;
    }
    if (M) {
      if (fx < bXL) bXL = fx; if (fx > bXH) bXH = fx;
      if (fy < bYL) bYL = fy; if (fy > bYH) bYH = fy;
      if (fz < bZL) bZL = fz; if (fz > bZH) bZH = fz;
    }
    formX[i] = fx; formY[i] = fy; formZ[i] = fz;
    fnx[i] = gx; fny[i] = gy; fnz[i] = gz;
  }
  /* The eyes, placed from their bones each frame so they ride the head, the
     pose and the bob exactly like the mesh does. Nothing here guesses where a
     socket is. If the bones are missing or parked on top of each other (a
     future export that drops them), the slots just stay parked at the origin
     of the face -- visible failure, not a crash. */
  if (port && M && gl.mesh && gl.mesh.skeleton) {
    /* Placed from the EYE BONES, which turned out to be there all along.

       I wrote them off as parked at the armature origin after a first attempt
       put both eyes in a pile at the bottom of the screen, and placed them by
       head proportion instead -- which is why they have sat on his ears
       through two rounds of nudging. The bones were fine. The transform was
       not: getWorldPosition returns SCENE space, and rig.toGroup expects
       MESH-LOCAL, which is what applyBoneTransform hands it for every vertex.
       Feeding it a world position put the eyes four times too far out.

       Through the mesh's inverse first, and they land in the sockets the model
       actually has -- no proportions, no nudging, and correct on any head. */
    const T = window.THREE, sk = gl.mesh.skeleton;
    if (!rig.eyeBones) {
      rig.eyeBones = [
        sk.bones.find((b2) => /l_eye/i.test(b2.name)) || null,
        sk.bones.find((b2) => /r_eye/i.test(b2.name)) || null,
      ];
      rig.eyeV = new T.Vector3(); rig.eyeInv = new T.Matrix4();
      console.log("orb eyes:", rig.eyeBones.map((b2) => b2 ? b2.name : "missing").join(", "));
    }
    rig.eyeInv.copy(gl.mesh.matrixWorld).invert();
    const toForm = (b2) => {
      const v = b2.getWorldPosition(rig.eyeV).applyMatrix4(rig.eyeInv).applyMatrix4(rig.toGroup);
      const ax = (v.x - f.c[0]) * f.k, ay = -(v.y - f.c[1]) * f.k, az = -(v.z - f.c[2]) * f.k;
      return [M[0]*ax + M[1]*ay + M[2]*az + bobX,
              M[3]*ax + M[4]*ay + M[5]*az + bobY,
              M[6]*ax + M[7]*ay + M[8]*az + bobZ];
    };
    const span = (bXH - bXL) || 1;
    /* Both bones first, because "wider" has to mean wider. Which of the two is
       on the left of the SCREEN depends on the pose matrix and on which way the
       export faces, so a hard-coded sign would have spread them on one model
       and crossed them on the next. Pushing each away from the midpoint between
       them cannot get that wrong. */
    const EP = [rig.eyeBones[0] && toForm(rig.eyeBones[0]),
                rig.eyeBones[1] && toForm(rig.eyeBones[1])];
    const midX = EP[0] && EP[1] ? (EP[0][0] + EP[1][0]) / 2 : 0;
    // once per figure, on the first frame the sockets are known
    if (!rig.feat && EP[0] && EP[1])
      rig.feat = figFeatures(EP, Math.abs(EP[0][0] - EP[1][0]) || span * 0.4);
    for (let e = 0; e < 2; e++) {
      const P2 = EP[e];
      if (!P2 || !EYE.on || !rig.eyeSlot) continue;
      // the spoken trim, in head-widths, on top of wherever the bone is
      P2[0] += (P2[0] < midX ? -1 : 1) * span * EYE.apart;
      P2[1] += span * EYE.down;
      const rr0 = span * EYE.r;
      for (let k2 = 0; k2 < EYE.dots; k2++) {
        const i2 = rig.eyeSlot[e * EYE.dots + k2];
        if (i2 < 0) continue;
        const ang = k2 * 2.399963, rr = rr0 * Math.sqrt((k2 + 0.5) / EYE.dots);
        formX[i2] = P2[0] + Math.cos(ang) * rr;
        formY[i2] = P2[1] + Math.sin(ang) * rr * 0.85;
        formZ[i2] = P2[2];
        fnx[i2] = 0; fny[i2] = 0; fnz[i2] = -1;
      }
    }
    // the draw reads these for its depth cue
    rig.zLo = bZL; rig.zHi = bZH;
  }
  /* The split. The last arc of the ring does not trace him: it lifts off and
     becomes the orb, hovering over the source machine. GPU only -- the 2D
     fallback fills triangles between particle slots, and a triangle with one
     corner hijacked to the orb is a shard stretched across the room. (The GL
     path never fills from the slots, and the edge pass skips the arc.) */
  // and the ball waits for its machine, or it hovers over an empty floor
  /* How many of them are the orb. A few while he is being drawn -- enough to
     say the orb is still here doing it -- and then most of them once the
     texture wipe has finished, because at that point every remaining dot has
     faded out against the model anyway. They are not taken away from him; they
     are finished with him. Leaving, the wipe runs back down and they return in
     time to un-draw him.

     No positions here any more. They are free particles with a moved centre;
     the physics loop places them. */
  const built = rig.wipe[3] >= 0.001
    ? Math.max(0, Math.min(1, (rig.wipe[3] - (FIG.top - FIG.rim)) / FIG.rim)) : 0;
  const shareNow = ORB.share + (ORB.full - ORB.share) * built;
  /* The same number, kept for the renderer. It is how far the orb has lifted
     away from the field -- see the placement block. */
  rig.built = built;
  /* The hand-off SLIDES. It used to step, and that is the choppiness.

     Membership is a boundary -- a particle below rig.orbFrom belongs to the
     field, one above it belongs to the orb -- and crossing it changes the
     centre a particle is driven toward from the middle of the screen to a
     point behind his head. The containment wall then finds it far outside
     itself and projects it onto the ellipse, which is a teleport. One particle
     doing that is invisible. Hundreds on the same frame is the thing you saw.

     Measured across a build and a teardown, at 3200 particles: the median
     frame moves the worst particle 4.6px. Three frames moved it 284, 306 and
     285, and each one is a step in the boundary -- 1389 particles reassigned
     on a single frame when world.on crossed 0.30, then 615 and 2685 on the way
     out. Nothing else in the sequence came close.

     Two causes, two fixes. world.on > 0.30 was a STEP: below it no orb at all,
     above it every particle the share calls for, arriving at a centre that has
     already finished lifting away. It ramps now, so the block grows from
     nothing while the orb is still sitting in the field where its particles
     are indistinguishable from their neighbours.

     And the count itself is rate-limited, in both directions and per second
     rather than per frame, so however fast `built` or `world.on` move, the
     boundary cannot cross more than a fixed slice of the field in one frame.
     That is what turns a teleport into him drawing something. */
  const gOn = Math.max(0, Math.min(1, (world.on - 0.16) / 0.30));
  const gate = gOn * gOn * (3 - 2 * gOn);
  const wantN = gl.ready ? Math.round(n * shareNow * gate) : 0;
  if (rig.orbN == null) rig.orbN = 0;
  const cap = Math.max(4, n * ORB.rate * (dt / 16.67));
  rig.orbN += Math.max(-cap, Math.min(cap, wantN - rig.orbN));
  if (rig.orbN < 0) rig.orbN = 0; else if (rig.orbN > n) rig.orbN = n;
  const orbN = Math.round(rig.orbN);
  rig.orbFrom = orbN ? n - orbN : 1e9;
  // the surface only exists once its own wipe has started climbing
  solidWant = rig.wipe[2] > 0.001 ? 1 : 0;
  const st = rig.wipe[3] >= FIG.top ? 3 : rig.wipe[2] > 0 ? 2 : rig.wipe[1] > 0 ? 1 : 0;
  if (st !== rig.stage && !rig.hold) {
    rig.stage = st;
    if (!rig.out) caption(null, rig.src + (st === 3 ? " · dancing" : " · building"));
    figChooser(1);
  }
}

/* Five buttons: the four states, and auto. Holding a state freezes the wipes
   where that state covers the whole body, which is how each one gets looked at
   on its own -- the build is over in five seconds and the interesting middle of
   it is about four hundred milliseconds wide. `auto` hands it back to the
   timeline, which restarts the build from the floor. */
const figEl = document.getElementById("fig");
function figChooser(on) {
  if (!on) { figEl.className = ""; figEl.innerHTML = ""; return; }
  if (!figEl.children.length) {
    for (const nm of FIG_STAGE.concat(["auto"])) {
      const b = document.createElement("button");
      b.textContent = nm;
      b.onclick = (e) => { e.preventDefault(); e.stopPropagation(); figPick(nm); };
      figEl.appendChild(b);
    }
  }
  figEl.className = "on";
  const at = rig.hold ? rig.holdName : "auto";
  for (const b of figEl.children) b.className = b.textContent === at ? "at" : "";
}
function figPick(nm) {
  if (!rig.on) return;
  if (nm === "auto") {
    rig.hold = 0; rig.holdName = ""; rig.at = performance.now(); rig.out = 0;
  } else {
    const k = FIG_STAGE.indexOf(nm);
    // everything up to and including this stage covers the whole body; nothing
    // above it has started
    rig.hold = [0, 1, 2, 3].map((j) => (j <= k ? FIG.top : 0));
    rig.holdName = nm;
    rig.out = 0;
  }
  figChooser(1);
  caption(null, rig.src + " · " + nm);
}

async function showModel(src, seconds) {
  takeScreen("model");
  const m = await loadModel(src);
  if (!m) return false;
  const ok = setFormation({ points: m.pts, edges: m.edges, tris: m.tris,
                            yaw0: m.yaw0, label: src }, seconds);
  if (ok) caption(null, "showing " + src + " · " + m.pts.length + " points" +
                        (m.edges ? " · " + m.edges.length / 2 + " edges" : ""));
  return ok;
}

function faceGlyph() {
  const pts = [];
  for (let i = 0; i < 90; i++) {                    // head
    const a = (i / 90) * TAU;
    pts.push([Math.cos(a) * 0.92, Math.sin(a) * 0.92]);
  }
  for (const ex of [-0.34, 0.34])                   // eyes
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * TAU;
      pts.push([ex + Math.cos(a) * 0.09, -0.28 + Math.sin(a) * 0.13]);
    }
  for (let i = 0; i <= 46; i++) {                   // smile
    const a = Math.PI * 0.18 + (i / 46) * Math.PI * 0.64;
    pts.push([Math.cos(a) * -0.56, Math.sin(a) * 0.5 + 0.12]);
  }
  return pts;
}

/* Heard locally, drawn locally. Recognition delivers interim words in a couple

/* ---------------- menu ----------------
   Say "menu" and the field rearranges into one: the orb stays as a cluster in
   the middle, six satellites come out on arms, and each one is a thing you can
   ask for -- by touching it or by saying its name. Nothing new was needed to
   draw it. Satellites and arms are points, the arms' segments are edges, and
   the wireframe pass that grew a mesh out of a point cloud draws them.

   Edit this list and the menu changes. Six because six fits round a circle at a
   readable size; the geometry is built from MENU.length, so it will take more,
   it will just get tighter. */
/* RETIRED. Nothing reaches this any more -- `menu` in TRIGGERS and on the
   brain's show tool both open the site now. Six labelled satellites on spokes
   was a diagram of a menu rather than a place, and next to a wall of real
   photographs it was plainly the part that had not been designed yet.

   Kept, not deleted, because the satellite drawing is the nicest piece of
   formation code in here -- every node is a small orb with its own ring, core
   and gap -- and it will be worth something again the moment there is a reason
   for a hub with things hanging off it. `setFormation({ menu: true, hub: true })`
   still builds it. */
const MENU = [
  { label: "head",      act: { figure: "colin_head" } },
  { label: "knot",      act: { model: "knot" } },
  { label: "shapes",    act: { solid: "torus" } },
  { label: "fireworks", act: { show: [["peony", 0], ["nova", 760], ["valentine", 1520],
                                      ["pinwheel", 2280], ["willow", 3060]] } },
  { label: "about",     act: { text: "GLORB" } },
  { label: "images",    act: { gallery: true } }
];

const menuGroup = new Int8Array(MAX);      // -1 hub or arm, 0..n satellite
let menuOn = false, menuHit = -1;
/* Left alone long enough, it offers rather than waits. Anything that counts as
   someone being there resets the clock -- a touch, a word, a formation. */
let lastActive = performance.now();
const stirred = () => { lastActive = performance.now(); };
const menuAt = [];                         // satellite centres, in formation units
/* Six satellites in one colour read as one object with lumps on it. Coloured
   directly rather than by nudging `size`, which is what the first attempt did
   -- size is also the dot's radius, so half the satellites were pushed through
   the zero crossing and simply stopped being drawn. */
/* Shared with the draw, which needs to know how big a satellite is in order to
   put its colour split in the right place. */
const MENU_HUB_R = 0.235, MENU_SAT_R = 0.265;

function menuPoints() {
  const pts = [], E = [], grp = [], N = MENU.length;
  // hub -1, satellite k as k, the arm to satellite k as -(2 + k) -- so an arm
  // can be told from a hub and can find its own spoke
  const HUB = 380, SAT = 380, ARM = 16, R = 0.80, sr = MENU_SAT_R;
  menuAt.length = 0;

  /* Every node is a small orb. The old menu wore six hues off a wheel, which
     read as a toy -- and the field already knows how to draw exactly one thing
     beautifully, so the answer was to draw that thing seven times rather than
     to pick better colours. A ring bloomed inward, a core, and a gap between
     them where size crosses zero: it is the orb's own distribution, at a
     seventh of the size. The colour comes out of the same palette by itself. */
  const orb = (ox, oy, r, n2, g) => {
    /* The radius has to be uncorrelated with the angle. A linear fraction of the
       index looked like a fine dither and drew a clean spiral, because the angle
       is a linear fraction of the index too -- two arithmetic sequences beating
       against each other. */
    const h = (n3) => { const x = Math.sin(n3 * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
    for (let i = 0; i < n2; i++) {
      const a = i * 2.399963;                       // golden angle: even, never banded
      const core = i % 4 === 3;                     // a quarter of them inside
      const rr = core ? r * 0.32 * Math.sqrt(h(i))  // sqrt, or the core clots at its middle
                      : r * (1 - 0.34 * h(i + 0.5));
      pts.push([ox + Math.cos(a) * rr, oy + Math.sin(a) * rr]); grp.push(g);
    }
  };

  orb(0, 0, MENU_HUB_R, HUB, -1);
  for (let k = 0; k < N; k++) {
    // -PI/2 puts the first one straight up, which is where a menu starts
    const a = -Math.PI / 2 + (k / N) * TAU;
    const cxk = Math.cos(a) * R, cyk = Math.sin(a) * R;
    menuAt.push([cxk, cyk, MENU[k].label]);

    const armFrom = pts.length;
    for (let j = 0; j < ARM; j++) {
      const t = 0.30 + (j / (ARM - 1)) * 0.44;      // stops short of both ends
      pts.push([Math.cos(a) * R * t, Math.sin(a) * R * t]); grp.push(-(2 + k));
      if (j) E.push(armFrom + j - 1, armFrom + j);
    }
    // no edges on a satellite any more: an orb is not an outline
    orb(cxk, cyk, sr, SAT, k);
  }
  return { pts, edges: Int32Array.from(E), groups: grp };
}

/* Pick one. The same call whether it was touched or spoken, because there is no
   reason for those to be different code paths. */
/* Out. Whatever is up -- a menu, a sequence, a hologram, a firework, a word --
   this puts the orb back. There was no way to leave the menu except by choosing
   from it, which is a corner to be stuck in, and nothing at all could be
   cancelled once it started. */
/* Quiet, whatever else this does. Raising the bar for barge-in means he talks
   through more of the room -- which is the point -- but it also means the only
   way to stop him was to say four words at him, and if the recogniser is having
   a bad time that is not a way out at all. Every tap-out the app already has
   comes through here: the little one on his perch, a tap on the sky in the
   room, a tap on a hologram, the dock bar. All of them now also shut him up. */
function hush() {
  if (!ttsPlaying) return;
  ttsGen++;                                  // the clip being stopped says nothing
  ttsStop();
  ttsPlaying = false; ttsText = ""; plan = null;
  echoUntil = performance.now() + 200;
}
function goHome(why) {
  hush();
  stopSequence();
  /* A figure LEAVES rather than vanishing: the same four wipes, run down in the
     opposite order, so the colour drains off before the surface does and the
     dots are the last thing to go. Which means goHome cannot simply drop the
     formation -- updateFigure owns the ending and clears it when it is done. */
  if (rig.on && !rig.out) { figStop(); if (why) caption(null, why); stirred(); return true; }
  gallery.on = false; gallery.shots = []; gallery.drag = null; clearPhoto();
  pagesClose();
  dockStop();
  mini.set = 0;
  clearTimeout(answerAt);
  menuOn = false; menuHit = -1;
  formWant = 0; formUntil = 0; solidWant = 0;
  if (firing.s) { firing.until = 0; firing.s = null; }
  if (why) caption(null, why);
  stirred();
  return true;
}

function menuPick(k) {
  if (k < 0 || k >= MENU.length) return false;
  const item = MENU[k];
  menuOn = false; menuHit = -1;
  formWant = 0; formUntil = 0;               // the menu gets out of its own way
  caption(null, item.label);
  // a beat, or the choice and its answer arrive on top of each other
  setTimeout(() => setFormation(item.act, 8), 260);
  return true;
}

function menuNear(clientX, clientY) {
  if (!menuOn || formT < 0.35) return -1;
  const s = scale * formS;
  let best = -1, bd = 1e9;
  for (let k = 0; k < menuAt.length; k++) {
    const dx = clientX - (cx + menuAt[k][0] * s), dy = clientY - (cy + menuAt[k][1] * s);
    const d = dx * dx + dy * dy;
    if (d < bd) { bd = d; best = k; }
  }
  // generous, because these are touched with a thumb
  return bd < (0.30 * s) * (0.30 * s) ? best : -1;
}

/* ---------------- muses ----------------
   What it does while you are talking to it. Spelling the words back was legible
   and dull -- a transcript, drawn. This is the other reading of "it is
   listening": the field wanders through a handful of abstract behaviours, none
   of them about what was said, all of them driven by the sound of it.

   Each muse is a pair of numbers per particle -- a radius multiplier and an
   angle offset -- applied to the ring target before anything else touches it.
   That is the whole interface, and it is why none of these had to know about
   the shape, the membrane, the containment or the colour: they move the target,
   and the rest of the program does what it always does with a target.

   Written into module scratch rather than returned, because this runs per
   particle per physics substep and an allocated pair each time is millions of
   objects a second. */
let muR = 1, muA = 0;
const MUSE_N = 6;
const MUSE_HUE = [0, 34, -30, 74, -64, 18];    // each one shifts the palette too
const MUSE_NAME = ["rings", "wave", "comet", "twin", "lattice", "sparks"];

function muse(k, i, a, t, lvl, imp, spec) {
  /* Every one of these carries the spectrum. The first version used level for a
     third of a radius and let time do the rest, which made six clocks that were
     dimly aware of a room -- the pattern has to be the carrier and the sound the
     thing being carried, or this is a screensaver with a microphone attached. */
  const sp = spec * 1.9;
  switch (k) {
    case 0: {                                   // three shells, counter-turning
      const band = i % 3;
      muR = (band === 0 ? 0.48 : band === 1 ? 0.82 : 1.16) * (1 + lvl * 0.9 + sp * 0.55);
      muA = t * (band - 1) * 0.55 * (0.4 + lvl * 2.2);
      return;
    }
    case 1: {                                   // a wave travelling round the rim
      muR = 1 + (0.10 + lvl * 1.5) * Math.sin(a * 5 - t * 2.2) + sp * 0.5;
      muA = 0;
      return;
    }
    case 2: {                                   // a comet: one bright arc sweeping
      let d = a - t * 1.1;
      d = d - TAU * Math.round(d / TAU);        // wrap to the short way round
      const w = 1 / (1 + 16 * d * d);
      muR = 1 + (0.16 + lvl * 1.9) * w + sp * 0.42;
      muA = -0.55 * d * w;                      // and it bunches as it passes
      return;
    }
    case 3: {                                   // two lobes orbiting each other
      muR = 1 + (0.14 + lvl * 1.5) * Math.cos(2 * (a - t * 0.5)) + sp * 0.45;
      muA = 0;
      return;
    }
    case 4: {                                   // snapped to a polar grid
      const step = TAU / 18;
      muA = Math.round(a / step) * step - a;
      muR = (0.55 + 0.22 * ((i * 7) % 4)) * (1 + lvl * 0.9) + sp * 0.7;
      return;
    }
    default: {                                  // every fifth one thrown on onsets
      const out = i % 5 === 0;
      muR = (out ? 1 + imp * 2.2 + lvl * 0.7 : 1 - imp * 0.2) + sp * 0.5;
      muA = out ? imp * 0.7 : 0;
      return;
    }
  }
}

/* Which one, and how much of it. It changes every few seconds and cross-fades,
   because a hard cut between two of these reads as a glitch rather than as a
   thought moving on. */
const muses = { amt: 0, a: 0, b: 1, mix: 1, next: 0 };
function updateMuses(dt, now, listening) {
  muses.amt += ((listening ? 1 : 0) - muses.amt) * (1 - Math.pow(1 - 0.022, dt / 16.67));
  if (muses.amt < 0.002) { muses.amt = 0; return; }
  if (now > muses.next) {
    muses.next = now + 4200 + Math.random() * 2600;
    muses.a = muses.b;
    // never twice in a row: repeating one reads as the thing having stalled
    muses.b = (muses.a + 1 + ((Math.random() * (MUSE_N - 1)) | 0)) % MUSE_N;
    muses.mix = 0;
  }
  if (muses.mix < 1) muses.mix = Math.min(1, muses.mix + dt / 900);
}

/* ---------------- shells ----------------
   A celebration is not a picture of a firework, it is one. Nothing is drawn
   here: the field is thrown outward and the pattern is whatever the launch
   geometry and the decay make of it. Which is why congratulations and boom do
   not look alike -- same particles, different physics.

     speed    how fast stars leave, min..max
     shell    1 puts every star at one speed, which opens as a clean expanding
              ring; 0 spreads them across the range, which fills the ball in
     spokes   0 for a cloud, N for N thick fingers
     up       upward bias, so it arcs instead of only spreading
     drag     air. What makes a star slow and hang before it falls
     hue      degrees of rotation on the whole palette: the shell's colour
     form     optional. Packs the stars into a shape on the way out
     formPow  how hard to exaggerate that shape. A figure with shallow corners
              needs more of it than one with deep ones
     swirl    optional. Tangential speed, which turns a shell into a pinwheel
     star     drawn radius. Everywhere else in this program a dot's size comes
              from its distance, which for a shell is backwards -- the further
              out a star gets the fatter it draws, until the whole thing is one
              opaque blob. A star is a star: fixed and small
     trail    overrides cfg.trail. Lower smears longer, which is the streak
   speed, up, gravity and star are all in reference units against a 400px short
   edge, like falloff and sizeHi, so a shell is the same shell on a phone. */
/* A pattern shell. A real one packs its stars into a shape inside the casing,
   so the wall of light that comes out is a heart or a star and not a circle.
   Same trick: scale each star's launch speed by a radius function of its own
   angle, and the expanding front carries the outline out with it. Normalised to
   an average of 1, so giving a shell a shape does not also change its size. */
const FORMS = (() => {
  const norm = (t) => {
    let s = 0;
    for (let i = 0; i < t.length; i++) s += t[i];
    const m = s / t.length || 1;
    for (let i = 0; i < t.length; i++) t[i] /= m;
    return t;
  };
  const fromFn = (fn) => {
    const t = new Float32Array(SHAPE_N);
    for (let i = 0; i < SHAPE_N; i++) t[i] = fn((i / SHAPE_N) * TAU);
    return norm(t);
  };
  /* The classic parametric heart, binned by angle. A cardioid is the easy polar
     answer and is not heart-shaped enough -- no cleft at the top. Screen y grows
     downward, hence the flip, or it lands point-up.

     Centred on its own bounding box first, and that is the whole trick. The
     curve's origin sits up near the cleft, not in the middle of the figure, so
     r measured from it runs 5 at the top lobes and 17 at the point: taken raw
     it fires a spike upward and a flat sheet downward, which is what the first
     attempt did. */
  const P = [];
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let i = 0; i < 24000; i++) {
    const t = (i / 24000) * TAU;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    P.push(x, y);
    if (x < x0) x0 = x; if (x > x1) x1 = x;
    if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  const ox = (x0 + x1) / 2, oy = (y0 + y1) / 2;
  const heart = new Float32Array(SHAPE_N);
  for (let i = 0; i < P.length; i += 2) {
    const x = P[i] - ox, y = P[i + 1] - oy;
    let a = Math.atan2(y, x); if (a < 0) a += TAU;
    let k = ((a / TAU) * SHAPE_N) | 0; if (k >= SHAPE_N) k = SHAPE_N - 1;
    const r = Math.sqrt(x * x + y * y);
    if (r > heart[k]) heart[k] = r;      // outermost hit wins: the curve doubles back
  }
  for (let pass = 0; pass < 2; pass++)   // two passes, so a gap at index 0 fills too
    for (let i = 0; i < SHAPE_N; i++)
      if (!heart[i]) heart[i] = heart[(i + SHAPE_N - 1) % SHAPE_N];

  /* Hard-edged ones. A rounded pattern disperses into a cloud within half a
     second; a corner stays a corner, because the stars either side of it are
     travelling at visibly different speeds and keep the discontinuity alive. */
  const rays = (n) => fromFn((t) => {
    const step = TAU / n, d = Math.abs(((t % step) + step) % step - step / 2);
    return 0.24 + 1.9 / (1 + 90 * d * d);       // n needle-thin spokes
  });
  return { heart: norm(heart), star: fromFn(SHAPES[5]), hex: fromFn(SHAPES[4]),
           tri: fromFn(SHAPES[1]), square: fromFn(SHAPES[2]),
           rays8: rays(8), rays16: rays(16) };
})();

/* `hue` is a shift through the SPLIT, the same one the orb's own colour rides
   on -- not a flat rotation of the whole wheel. That is the entire fix for the
   reds and yellows. A flat rotation moves the rim and the core together, and
   they sit 180 degrees apart, so there is no rotation that puts the rim in the
   blues without dropping the core into the yellows -- which is exactly what
   `hue:110` was doing to the peony: rim to orange, core to blue. Through the
   split the rim swings a long way and the core barely moves, so every value in
   the range below lands somewhere between magenta and cyan with a green core,
   and red and yellow are unreachable at any setting.

     hue     rim              core
     -40     330 pink         98  green
       0     290 violet       108 green      <- the orb's own colour
      40     250 blue-violet  118 green
      80     210 cyan-blue    128 mint

   No `trail`. Every shell used to carry its own, all of them well under
   cfg.trail, so a firework smeared where nothing else in the program does --
   which reads as a different renderer rather than as a different event. The
   shell now clears at the same rate as everything else, and one thing that
   fixes on its own: individual stars stay individual instead of dissolving
   into the big cluster they were being complained about as.

   `grain` is the other half of that. Every star was drawn at exactly one size,
   and a cloud of identical dots is a texture, not a firework. */
const SHELLS = {
  /* Hollow now, not 0.3. A filled ball IS the big soft poof -- with the stars
     spread evenly by area there is no front, so it reads as a cloud that grows
     rather than as a casing that bursts. A real peony is a shell. */
  peony:  { speed:[5.4, 8.6], shell:0.7,  spokes:0, up:2.2, gravity:0.045, drag:0.030,
            hue:0,   star:2.4, flash:0.55, sparkle:0.9, grain:0.9, dur:2400 },
  ring:   { speed:[7.6, 8.3], shell:1,    spokes:0, up:1.2, gravity:0.030, drag:0.034,
            hue:62,  star:2.1, flash:0.50, sparkle:0.5, grain:0.4, dur:2600 },
  // slow, heavy, and glittering: the one that hangs
  willow: { speed:[2.8, 5.8], shell:0.6,  spokes:0, up:3.6, gravity:0.090, drag:0.010,
            hue:-24, star:2.9, flash:0.45, sparkle:0.5, grain:1.1, glitter:0.011, dur:3200 },
  palm:   { speed:[6.4, 9.8], shell:0.85, spokes:7, up:2.8, gravity:0.055, drag:0.026,
            hue:78,  star:3.1, flash:0.50, sparkle:0.4, grain:0.7, dur:2600 },
  shock:  { speed:[12.5, 14], shell:1,    spokes:0, up:0,   gravity:0.020, drag:0.075,
            hue:44,  star:3.6, flash:0.85, sparkle:0,   grain:0.3, dur:1600 },

  // shaped: one speed, or the outline blurs into a cloud before it reads
  /* Shaped shells hang rather than fall: gravity is what rounds an outline off,
     because the top of the figure sags toward the middle within half a second.
     Low grain as well -- a size spread is texture, and texture is the enemy of
     an outline. */
  valentine: { speed:[8.0, 8.6], shell:1, spokes:0, up:0.8, gravity:0.008, drag:0.020,
               form:"heart", hue:-38, star:2.5, flash:0.5, sparkle:0.5, grain:0.3, dur:3000 },
  nova:      { speed:[8.2, 8.8], shell:1, spokes:0, up:0.8, gravity:0.008, drag:0.020,

  pinwheel:  { speed:[7.4, 8.0], shell:1, spokes:0, up:0.5, gravity:0.010, drag:0.024,
               swirl:0.75, hue:52, star:2.3, flash:0.45, sparkle:0.3, grain:0.3, dur:2900 },

     the whole reason they are here: a display of six round bursts is one burst
     six times. Low drag and almost no gravity, because an outline only survives
     as long as nothing is pulling parts of it around. */
  prism:  { speed:[8.2, 8.6], shell:1, spokes:0, up:0.5, gravity:0.005, drag:0.014,
            form:"tri", formPow:3.0, hue:30, star:2.5, flash:0.5, sparkle:0.2, grain:0.25, dur:3000 },
  frame:  { speed:[8.0, 8.4], shell:1, spokes:0, up:0.4, gravity:0.005, drag:0.014,
            form:"square", formPow:4.2, hue:72, star:2.4, flash:0.5, sparkle:0.2, grain:0.25, dur:3000 },
  spokes: { speed:[7.6, 8.2], shell:1, spokes:0, up:0.4, gravity:0.004, drag:0.012,
            form:"rays16", hue:36, star:2.6, flash:0.55, sparkle:0.15, grain:0.25,

  crown:  { speed:[7.8, 8.4], shell:1, spokes:0, up:1.0, gravity:0.006, drag:0.016,

/* A ring reads at 400 particles; a sky full of sparks does not. Borrowed for
   the shell and handed back once it has settled, same bargain formations make. */
const SHELL_N = 1800;
const firing = { s:null, name:"", until:0, flashAt:0, flashRgb:"255,255,255", was:0 };

function fireShell(name) {
  const s = SHELLS[name] || SHELLS.peony;
  const now = performance.now();
  formWant = 0; formUntil = 0;      // a shell and a glyph cannot both own the field

  const prev = Math.min(MAX, Math.round(cfg.count));
  const n = Math.min(MAX, Math.max(prev, SHELL_N));
  if (n > prev) {
    if (!firing.was) firing.was = cfg.count;
    cfg.count = n; syncPanel();
  }

  const kk = scale / 400;           // same reference short edge as falloff and sizeHi
  const form = s.form ? FORMS[s.form] : null;
  for (let i = 0; i < n; i++) {
    // borrowed stars have never been anywhere: start them at the mortar
    if (i >= prev) { px[i] = cx + (Math.random() - 0.5) * 8; py[i] = cy + (Math.random() - 0.5) * 8; }
    const a = s.spokes
      ? (Math.floor(Math.random() * s.spokes) / s.spokes) * TAU + (Math.random() - 0.5) * 0.34
      : Math.random() * TAU;
    // sqrt, or a filled ball crowds at the centre instead of spreading evenly by area
    const f = s.shell + (1 - s.shell) * Math.sqrt(Math.random());
    let sp = (s.speed[0] + (s.speed[1] - s.speed[0]) * f) * kk;
    if (form) {
      let t = a % TAU; if (t < 0) t += TAU;
      let k = ((t / TAU) * SHAPE_N) | 0; if (k >= SHAPE_N) k = SHAPE_N - 1;
      /* Raised, not used flat, and by how much depends on the figure. A heart
         spans 0.66 to 1.39 and needs a little; a square spans corner to edge by
         only 1.41, which after normalising is nearly nothing -- at 1.8 it came
         out as a round green mass. A polygon needs its corners exaggerated into
         points before a field of dots reads it as having corners at all. */
      sp *= Math.pow(form[k], s.formPow || 1.8);
    }
    vx[i] = Math.cos(a) * sp;
    vy[i] = Math.sin(a) * sp - s.up * kk;
    // tangential, so the whole shell turns as it opens
    if (s.swirl) { vx[i] -= Math.sin(a) * sp * s.swirl; vy[i] += Math.cos(a) * sp * s.swirl; }
  }

  firing.s = s; firing.name = name;
  firing.until = now + s.dur;
  firing.flashAt = now;
  // the palette's far colour rotated the way the shell rotates it, but pale:
  // a saturated wash reads as a filter over the scene, a pale one as light
  // negated, because hue is now a shift through the split and the rim moves
  // opposite to it -- the wash has to be the colour of the light in the shell
  firing.flashRgb = toRgb(255, 168, 255, -s.hue).slice(4, -1);
  return true;
}

/* Successive breaks, which is the whole difference between a firework and a
   fireworks display. Each one re-fires the field, so they land as separate
   detonations rather than one long smear. */
function fireShow(seq) {
  for (const [nm, at] of seq) {
    if (at) setTimeout(() => fireShell(nm), at);
    else fireShell(nm);
  }
  return true;
}

/* Shrinking the field is not just drawing fewer of them. A particle's ring slot
   is its index over the count, so going from 1800 back to 400 leaves every
   survivor pointing at the same narrow arc it used to own, and the orb re-forms
   as a bunch on one side. Keep one particle in every prev/n instead: the same
   field with holes in it, each survivor already standing near its new slot. */
function handBack(was) {
  const prev = Math.min(MAX, Math.round(cfg.count));
  const n = Math.min(MAX, Math.round(was));
  for (let i = 0; i < n && n < prev; i++) {
    const j = (i * prev / n) | 0;      // j >= i, so nothing is read after it is written
    px[i] = px[j]; py[i] = py[j]; vx[i] = vx[j]; vy[i] = vy[j];
  }
  cfg.count = was; syncPanel();
}

function updateShell() {
  // Late, because the stars need a moment to cross back. Hand the borrowed ones
  // back while they are still spread and they wink out where they float, which
  // reads as half the sky going dark at once rather than as a shell ending.
  if (firing.was && performance.now() > firing.until + 1200) {
    handBack(firing.was); firing.was = 0;
  }
}
let echoSeen = 0, lastLive = "";

/* Interim results grow and revise, and the final word of one is usually still
   being decided -- flashing it means flashing half-heard guesses. Take only
   the words behind the cursor, and only ones not shown yet. */
/* What to do with a finished sentence. Its own function because the decision is
   the interesting part and because a handler wired to a browser API cannot be
   tested; this can. */
const HOME_SAID = /\b(go|take me|bring me|head|get)? ?(home|back)\b|\b(exit|quit|stop|halt|cancel|dismiss|reset|never ?mind|forget it|close (this|it)|all done|get out of (this|here))\b/;

function heardSentence(heard) {
  // somebody is talking to him: stop, turn round. Before anything is parsed,
  // because it is true whatever the words turn out to be
  attend();
  const flat = heard.toLowerCase().replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim();
  /* A phrase, not a word. Nobody says a command as one word -- "can you go
     home" was caught by nothing, went to the brain, and came back as "I do not
     know where you are" from an orb that had in fact just gone home. */
  /* Short, as well as matching. "back" and "home" are ordinary words in the
     middle of ordinary sentences -- "I went back to the shop yesterday" is not
     a request to close the gallery. A command is a short thing said on its own;
     five words is generous for one and far below anything conversational. */
  const brief = flat.split(" ").length <= 5;
  /* Going somewhere is a decision, so it needs a sentence that reads like one:
     either almost nothing but the name of the place, or an actual instruction
     with a verb in it. "pictures" goes. "show me the pictures" goes. "I like
     your pictures" does not, and neither does "what is this for". */
  const ASKED_FOR = /\b(show|shows?|open|opens?|go|take|bring|pull|see|view|display|let'?s|lets|give)\b/;
  /* The 3D scene has more names than "Colin". It is the sandbox, the 3D scene,
     the 3D characters, the 3D world -- and it is where every character will
     live, so anything asking for that place goes to the same door.

     Matched against a SECOND normalisation that keeps digits: `flat` has had
     every non-letter replaced with a space, so "3d scene" arrives as "d scene"
     and "3D" is unfindable in it. */
  const flatN = heard.toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  const SCENE_SAID = /\b(3\s?d|three\s?d|threed)\b|\bsandbox\b/;
  const deliberate = flat.split(" ").length <= 2 || ASKED_FOR.test(flat);
  /* An introduction outranks everything, because in the beat after being asked
     "who are you" a bare name is exactly the kind of one-word utterance the
     command table would otherwise grab. Answered here, out loud, with no round
     trip -- the brain does not need to be consulted about somebody's name. */
  {
    const nm = readName(flat, !!guest.asked);
    if (nm) {
      const first = !guest.name;
      setGuest(nm); guest.asked = 0;
      caption(heard, "");
      const prof = profileOf(nm);
      remark(prof ? fill(prof.greet, nm)
                  : first ? fill(MET, nm)
                  : ["{} it is, then.".replace("{}", nm), "Noted — {}.".replace("{}", nm)]);
      return "name";
    }
    // asked once, not twice: whatever that was, it was not a name, and pressing
    // somebody for one is the opposite of the intended effect
    if (guest.asked) guest.asked = 0;
  }
  /* "Stop" while he is crossing the room means stop walking, not leave the
     room -- HOME_SAID owns the word everywhere else, and everywhere else it is
     the only thing it can mean. Narrow, and only while he is actually moving:
     a "stop" said to a standing figure still gets you out. */
  if (world.on > 0.5 && world.walking && /\b(stop|wait|hold on|stay)\b/.test(flat)) {
    sandboxSay(flat); caption(heard, ""); return "act";
  }
  /* "Go back" is his instruction while he is in the room, not yours. HOME_SAID
     owns the word everywhere else -- and "back" alone has always been a way out
     -- but said to a figure standing in front of you it is plainly a direction,
     and the ways out that cannot be misread (home, exit, quit, leave, never
     mind) all still work. */
  if (world.on > 0.5 && /\b(go|move|step|back|get)\b/.test(flat) &&
      /\b(back|backwards|away|further|farther)\b/.test(flat) &&
      !/\b(home|exit|quit|cancel|never ?mind)\b/.test(flat)) {
    const d0 = sandboxMove(flat);
    if (d0) { caption(heard, ""); return "act"; }
  }
  /* MUSIC FIRST, and specifically before HOME_SAID, which owns the word "stop"
     everywhere else. "Stop the music" was matching the way out and sending him
     home with the track still playing -- the one reading of that sentence
     nobody could have meant.

     Safe to put ahead of it because the stop branch in there needs the word
     music, song, track or tune as well as the word stop. A bare "stop" still
     falls through to here and still means what it always meant. */
  /* The 3D head, before the image mouth test -- otherwise "3d lip sync" matches
     the flat cards first, which is exactly the confusion this is fixing. The
     two tests share every word except the one that distinguishes them.

     Matched against flatN, for the reason written twenty lines up and then
     promptly ignored when this branch was added: `flat` has replaced every
     non-letter with a space, so "3-D lip sync" -- which is how a dictation
     engine writes it -- arrives here as "d lip sync" with the 3 gone. The
     branch could never fire, and every attempt fell through to the 2D cards.
     Reusing SCENE_SAID rather than a second copy of the same pattern, so there
     is only one place that knows how people say "3D". */
  /* The eyes, steered by the person looking at them. */
  if (rig.on && rig.portrait && /\beyes?\b/.test(flat)
      && /\b(down|up|lower|higher|raise|wider|apart|closer|together|bigger|larger|smaller|centre|center|reset|default)\b/.test(flat)) {
    // a trim on top of the bones, so the range is small and centred on zero
    if (/\b(down|lower)\b/.test(flat)) EYE.down = Math.min(0.14, EYE.down + 0.012);
    if (/\b(up|higher|raise)\b/.test(flat)) EYE.down = Math.max(-0.14, EYE.down - 0.012);
    if (/\b(wider|apart)\b/.test(flat)) EYE.apart = Math.min(0.10, EYE.apart + 0.008);
    if (/\b(closer|together)\b/.test(flat)) EYE.apart = Math.max(-0.10, EYE.apart - 0.008);
    if (/\b(bigger|larger)\b/.test(flat)) EYE.r = Math.min(0.14, EYE.r * 1.18);
    if (/\b(smaller)\b/.test(flat)) EYE.r = Math.max(0.03, EYE.r / 1.18);
    // "centre"/"reset" puts them back on the bones, which is where they belong
    if (/\b(centre|center|reset|default)\b/.test(flat)) { EYE.down = 0; EYE.apart = 0; }
    eyeSave();
    caption(null, "eyes \u00b7 trim " + EYE.down.toFixed(3) + " / "
      + EYE.apart.toFixed(3) + " \u00b7 r " + EYE.r.toFixed(3));
    return "eyes";
  }

  /* Turn him. Only means anything while the particle head is up, and it is the
     way out of an orientation I could not derive: step, look, stop. */
  if (rig.on && rig.portrait
      && /\b(turn|spin|rotate|flip)\b/.test(flat) && !/\b(off|back to normal)\b/.test(flat)) {
    POSE.ix = (POSE.ix + 1) % 24;
    try { localStorage.setItem("orbPoseIx", String(POSE.ix)); } catch (e) {}
    if (rig.R) rig.pose = portraitBasis(rig.R);
    caption(null, "orientation " + POSE.ix + " of 24");
    console.log("orb portrait orientation", POSE.ix);
    return "figure";
  }

  /* The particle head, formed HERE out of the orb rather than on another page.
     It is the same machinery that builds any figure -- the mesh handed to it
     just happens to be a head, trimmed to the neck so the orb does not spend
     most of its particles on a torso nobody is looking at. Which means it is
     his voice, his colours and his reactions, not a separate mode with a text
     box in it. */
  if (/\b(particles?|dots?|dotted)\b/.test(flat)
      && /\b(face|head|mode|version|him|talk|talking|lip ?sync|mouth)\b/.test(flat)) {
    /* Held at dots. The figure stages run dots -> lines -> fill -> texture on a
       timer, which is right for showing off a model and wrong here: ask for the
       PARTICLE face and thirty seconds later you are looking at a solid white
       bust. Asking for particles should get particles and keep them. */
    /* Set BEFORE the load, not after it. rigPoint runs while showFigure is
       building the point list, so a flag set in the .then() arrives after every
       point has already been placed -- which is why the pose transform below
       had no effect at all and two opposite yaw values rendered pixel for pixel
       the same. */
    showFigure("toon_head", 1).then((ok) => {
      if (ok === false) return;
      figPick("dots");
      /* Straight on, whatever the tune sliders say. formTilt null means "use
         cfg.tilt", and cfg.tilt is a slider somebody set while looking at a
         whole body from above -- which is why this arrived as a head pointing
         at the floor for you and dead level for me. A face you are talking to
         faces you; it does not inherit a camera angle chosen for a torso. */
      formTilt = 0; formSpin = 0;
    });
    return "figure";
  }
  /* His own head, as a MESH.

     Deliberately not in the single-word TRIGGERS table: "head" and "face" turn
     up in far too many ordinary sentences, and the table matches one word
     anywhere in one. This wants a possessive in front of it -- somebody asking
     for COLIN's head, or the new one, or the real one -- which is how people
     actually ask for it and cannot be said by accident.

     It has to run before the table, too, or the bare word "colin" in the same
     sentence would fetch colin_slim out from under it.

     No portrait flag and no dots hold: the particle face was the last thing
     and this is not that. He is a rendered character with skin, hair and a
     textured mouth, and the build runs all the way through to it. */
  /* Two tests ANDed rather than one long one, because they fail for different
     reasons and a route test can tell them apart. Whose head, and whether this
     is a request to SEE it -- "can you make him turn his head" and "what does
     my face look like" both name a head and neither is asking for one, and
     both fetched it until the verb was required. `see` on its own is not
     enough either: "I can see his face" is a remark.

     `flat` has already turned every non-letter into a space, so "colin's"
     arrives as "colin s" and "colin_head" as "colin head" -- both spelled out
     here rather than hoped for. */
  const HEAD_SHOW = /\b(show|bring|load|display|render|put up|pull up|switch to|go to|become)\b|\b(let me see|let s see|lets see|can i see|i want to see|wanna see|want to see)\b/;
  /* col+in, because the recogniser hears his name with two Ls about as often
     as with one -- "Let me see Collin's head" is what actually came back, and
     it missed, fell through to the brain, and the brain guessed test_head. */
  const HEAD_WHOSE = /\b(col+ins?|col+in s|my|his|the new|the real|textured)\s+(head|face|mug)\b/;
  if ((HEAD_SHOW.test(flat) && HEAD_WHOSE.test(flat)) || /\bcol+in head\b/.test(flat)) {
    showFigure("colin_head").then((ok) => {
      if (ok === false) return;
      // straight on. cfg.tilt is a slider somebody set looking down at a whole
      // body, and a head does not want a torso's camera any more than a
      // portrait did.
      formTilt = 0; formSpin = 0;
    });
    caption(heard, "");
    return "colinhead";
  }
  /* The ragdoll box, which is its own page.

     "ragdoll" carries this on its own -- nothing else in here wants the word,
     and it is what anybody would actually say. "box" cannot: the single-word
     table already maps it to a cube, and the room has a stereo in it, so a
     bare box has two other meanings before this one. It needs a verb in front
     of it or the word test after it.

     Ahead of the table for the same reason the head route is: the word `box`
     inside "open the box" would otherwise be caught on the way past and turned
     into a cube. */
  if (/\brag ?doll\b/.test(flat)
      || /\b(box|physics|gravity|tilt) test\b/.test(flat)
      || /\b(open|show|go to|take me to|launch|start|bring up|let me see)\b[^]*\bthe box\b/.test(flat)) {
    caption(null, "opening the ragdoll box");
    setTimeout(() => { location.href = "box-test.html"; }, 350);
    return "boxtest";
  }
  if (/\b(face test|head test)\b/.test(flat)
      || (SCENE_SAID.test(flatN) && !/\b(scene|sandbox|room)\b/.test(flatN)
          && /\b(lip ?sync|lipsync|mouth|face|head|viseme|visemes|talk|talking|test)\b/.test(flat))) {
    caption(null, "opening the 3D head test");
    setTimeout(() => { location.href = "face-test.html"; }, 350);
    return "facetest";
  }
  /* The mouth test, before the ways out claim "stop". */
  if (/\b(mouth|mouths|lip ?sync|phoneme|phonemes|viseme|visemes)\b/.test(flat)) {
    const off = /\b(hide|close|stop|off|no more|done with)\b/.test(flat);
    visSet(!off);
    caption(null, off ? "mouth test off" : "mouth test \u00b7 say something");
    return "visemes";
  }
  if (musicSay(flat)) { caption(heard, ""); return "music"; }
  if (brief && HOME_SAID.test(flat)) {
    goHome(""); caption(heard, ""); localTook = 0; echoSeen = 0; lastLive = "";
    return "home";
  }
  // a command already carried out here is already answered
  if (localTook) { localTook = 0; caption(heard, ""); return "local"; }
  /* While he is standing in his room, what he can do outranks the brain. "Do a
     backflip" is not a question. */
  if (world.on > 0.5 && sandboxSay(flat)) { caption(heard, ""); return "act"; }
  /* The places, now that the whole sentence is here to judge. */
  if (deliberate) {
    // the 3D place, before the single-word table -- "show me the 3d characters"
    // has no single word in it that means this
    if (SCENE_SAID.test(flatN) && !rig.on) {
      setFormation({ figure: "colin_anim2" }, 10); caption(heard, ""); return "place";
    }
    for (const w of flat.split(" ")) {
      const tg = TRIGGERS[w];
      if (tg && (tg.solid || tg.model || tg.image || tg.holo || tg.seq ||
                 tg.gallery || tg.figure || tg.pages || tg.menu)) {
        setFormation(tg, 10); caption(heard, ""); return "place";
      }
    }
  }
  /* With the site on screen, its own page names outrank the brain. "About" is a
     preposition most of the time and a page exactly when there is a card
     labelled ABOUT in front of you. */
  if (pages.on && !pages.open && brief && deliberate) {
    const kp = pageSaid(flat);
    if (kp >= 0) { pageOpen(kp); caption(heard, ""); return "page"; }
  }
  /* A menu owns what you say; a FIGURE does not.

     This swallowed every sentence whenever a 3D formation was up -- captioned
     it and dropped it, never asked the brain. That was right when a 3D
     formation meant a knot or a hologram you were poking at. It is exactly
     wrong for a head: ask for the particle face, talk to it, and it captions
     your words and says nothing back, which reads as broken and was. A menu is
     genuinely modal. A face is the thing you came to talk to. */
  if (formWant && (menuOn || (form3d && !rig.on))) { caption(heard, ""); return "owned"; }
  if (echoMode === 1) { caption(heard, ""); return "echo"; }   // no brain, no wait
  ask(heard);
  return "brain";
}

/* Set when a spoken word was a command and was carried out here. The brain must
   not then be asked about it: saying "can you go home" put the orb back AND sent
   the sentence on, so it came home and then told you it did not know where you
   were. A command is answered by doing it. */
let localTook = 0;

function feedWords(finalText, interimText) {
  const live = (finalText + " " + interimText).trim();
  if (!live) return;
  /* Recognition revises as it goes and starts fresh utterances without always
     closing the last one, so the cursor has to notice when the text is no
     longer an extension of what it already counted -- otherwise a stale count
     swallows every word of the next sentence. */
  if (!live.startsWith(lastLive)) echoSeen = 0;
  lastLive = live;
  const w = live.split(/\s+/).filter(Boolean);
  const settled = finalText ? w.length : w.length - 1;
  for (let i = echoSeen; i < settled; i++) {
    const word = w[i].replace(/[^a-z0-9']/gi, "");
    if (!word) continue;
    const w2 = word.toLowerCase();
    /* While the menu is up its labels outrank everything, including the brain.
       Saying "head" at a menu with head on it means that one, not a question. */
    if (menuOn) {
      const k = MENU.findIndex((it) => it.label === w2);
      if (k >= 0) { menuPick(k); echoSeen = settled; return; }
    }
    /* Commands, always. Saying "menu" or "hologram" is asking for a thing --
       unless he said it. A word arriving while he is talking, or inside the
       room's reverb afterwards, is his own voice coming back through the
       speaker, and acting on it means the app drives itself. */
    if (ttsPlaying || performance.now() < echoUntil) continue;
    const trig = TRIGGERS[w2];
    /* Home is NOT handled word by word. "home" and "back" are ordinary words,
       and firing on them as they go past closed the gallery on "I went back to
       the shop yesterday". The sentence matcher owns leaving, because it can
       see how long the sentence is; a word cannot. */
    if (trig && trig.home) continue;
    /* Anything that CHANGES WHERE YOU ARE waits for the sentence. A single word
       going past is not a request to go somewhere: "I like your pictures" was
       opening the gallery, and "what is this for" was landing on the site. The
       transient ones -- an emoji, a firework -- still fire on the word, because
       they are over in a second and cost nothing if they were not meant. */
    if (trig && (trig.solid || trig.model || trig.image || trig.holo || trig.seq ||
                 trig.gallery || trig.figure || trig.pages || trig.menu)) continue;
    /* Pictures, only if asked for. TRIGGERS is full of ordinary words -- think,
       cool, love, wow, hmm -- and every one of them took the whole field for a
       second of ordinary conversation, which is a second the field spends not
       reacting to the voice that triggered it. Echo is where that belongs. */
    if (trig && echoMode === 1) setFormation(trig, cfg.flashMs / 1000);
    /* Only echo spells what it hears. Duet used to as well, and a transcript
       drawn in particles turns out to be the least interesting thing this can
       do with a voice -- the muse has the listening half now. */
    else if (echoMode === 1 && word.length > 1 && !trig)
      setFormation({ text: word.toUpperCase() }, cfg.flashMs / 1000);
  }
  if (settled > echoSeen) echoSeen = settled;
}

function setFormation(spec, seconds) {

     A word wants that -- the ring would draw straight through the letters. A

     field is still him, resting in the middle where he always is. */

     containment wall -- that is what the wall is -- so the only way to have a

     angle too means the ring unfolds into the shape instead of scrambling

     out from under it wires every edge to the wrong pair of particles -- which

    /* Multiply before dividing. (j / take) * pts.length lands a hair BELOW j
       when take equals pts.length -- floating point, for about one index in
       twenty-five -- and floor then hands two particles the same point and
       skips another. Which is invisible until something indexes those points:
       an edge list then draws a chord straight across the shape. */
    const p = pts[Math.min(pts.length - 1, Math.floor((j * pts.length) / take))];
    formOn[i] = 1;

    formHY = Math.max(formHY, Math.abs(p[1]));
    formX[i] = p[0]; formY[i] = p[1]; formZ[i] = p[2] || 0;
    fnx[i] = p[3] || 0; fny[i] = p[4] || 0; fnz[i] = p[5] || 0;
    formB[i] = p[6] || 0;

     full turn before it leaves. That ignored `seconds` entirely -- which is
     fine for a head and wrong for the figure, which asked for ten minutes and
     got twenty-three seconds and then stopped dancing and disappeared. An
     explicit duration past the hold threshold wins over the spin: it is a
     place, however it was made. */
  const asked = Math.max(0.3, seconds || 5);
  const secs = asMenu ? 30                 // it waits to be chosen from
             : asked > HOLD_S ? asked
             : form3d ? 1 / Math.max(0.05, Math.abs(formSpin != null ? formSpin : cfg.spin)) + 3.4
                      : asked;
  formRate = secs < 2 ? 0.12 : 0.045;      // a glimpse has to arrive before it goes
  /* A formation is either a GLIMPSE or a PLACE, and the difference is whether
     it expires. Everything went through one 30-second cap, so the site's border
     lines -- asked for with 3600 seconds -- quietly released after half a minute
     and the field drifted back to the ring behind the cards. It read as a bug
     that appeared when you left the app and came back, because half a minute is
     about how long that takes. The figure had it too: it would have stopped
     dancing and vanished after thirty seconds of anybody watching it.

     Anything asking for longer than the cap is held instead: it stays until its
     owner takes it down, which is what goHome and the page navigation already
     do. The cap still bounds a word, which is what it was for. */
  formHold = secs > HOLD_S ? 1 : 0;
  formUntil = performance.now() + Math.min(HOLD_S, secs) * 1000;
  formLabel = asMenu ? "menu" : spec && (spec.label || spec.solid) ? String(spec.label || spec.solid)

}

function updateFormation(dt) {
  /* A portrait never expires. Everything else the field can hold is a DISPLAY --
     a word, a shell, a glyph -- and displays time out so the orb comes back.
     A face is not a display, it is a form he is in: he stays in it, talks in
     it, and leaves it when you tell him to. Letting the timer take it meant
     that talking to him dropped him back to the ring mid-conversation, which
     is the opposite of the point. goHome and figStop still end it. */
  if (formWant && !formHold && !rig.portrait && performance.now() > formUntil) formWant = 0;
  /* Ease both ways; a formation that snaps in reads as a glitch, not a gesture.
     But the ease is a fixed fraction per frame, which takes about a second to
     arrive -- fine for a shape that then stands there, useless for a word meant
     to be glimpsed as it is spoken. A short show gets a quicker ease so it has
     time to actually be a word before it leaves. */
  const rate = 1 - Math.pow(1 - formRate, dt / 16.67);
  formT += (formWant - formT) * rate;

    formHold = 0; formKeepRing = 0;

     strength it wins: drag kills the outward velocity within a second, and from
     then on the only force left is the ring, so the explosion collapses onto
     the silhouette and hangs there as a hollow outline. Off entirely while the
     shell flies, cubed back in over the last stretch so the stars stream home
     rather than snapping there. */
  const since = now - firing.until;            // negative while a shell is up
  const bs = firing.s && since < 0 ? firing.s : null;
  const back = bs ? Math.max(0, 1 + since / 900) : 1;
  const pull = bs ? back * back * back : 1;
  /* Coming home is the other half of the problem, and force does not solve it:
     the field ends up hanging low and the ring needs the better part of ten
     seconds to gather it, long after the bang is over. Steering cannot hit a
     mark in time -- the same reason formations snap -- so ease position toward
     the ring directly for a moment instead. */
  const homeT = (!bs && firing.s && since < 1600) ? 1 - since / 1600 : 0;

  if (seededFor !== n) {
    buildBase(n);
    for (let i = 0; i < n; i++) {
      mSpd[i] = cfg.speedLo + Math.random() * (cfg.speedHi - cfg.speedLo);
      // each particle gets its own wall radius, so a saturated orb rests in a
      // fuzzy band instead of tracing the containment ellipse as a hard edge
      bnd[i] = 0.84 + Math.random() * 0.16;
      // fixed lottery ticket per particle. Core membership is pr[i] < core, so
      // the slider re-sorts the field with no reseed, and members are scattered
      // through the index rather than taken as a contiguous arc, which would
      // cut a gap out of the ring.
      pr[i] = Math.random();
    }
    if (!seeded) { seedNear(n, baseR); seeded = true; }
    seededFor = n;
  }

  const fr2 = cfg.fleeRadius * cfg.fleeRadius;
  const hasMouse = mx > -9000;
  /* A resting orb that holds one shape forever reads as a screensaver. Two slow
     sines with periods that do not divide into each other, so it wanders rather
     than ticks -- and it fades out the moment anything is actually happening,
     because drift is what the orb does when nothing else is asking. */
  /* Only ever turning while there is something with depth to look at. A
     spinning flat ring is just a ring that wobbles. */
  view.deep = form3d && formT > 0.002;
  // turning from the first moment, so it arrives already moving
  if (view.deep && formWant && view.turn < 1)
    view.turn = Math.min(1, view.turn + Math.abs(formSpin != null ? formSpin : cfg.spin) * (dt / 1000));
  /* Only while it is actually listening to someone, and only in duet -- echo
     is the literal mode and should stay literal. */
  /* Whenever there is a live microphone and nothing else has the field --
     which includes idle. Gating it on the listening STATE meant it only ran
     inside the second or two between the voice detector firing and the reply
     starting, and it spent most of that fading in. The visualiser is the point;
     it should be on whenever there is something to visualise. */
  updateMuses(dt, now, echoMode === 2 && !!A && !formWant && !bs);

  if (cfg.idleS > 0.5 && !formWant && !bs && !brain.busy &&
      now - lastActive > cfg.idleS * 1000) setFormation({ menu: true });

  // the cloud lands first and holds for a beat, then the mesh draws itself in
  /* A figure's wireframe is a STAGE, not a hint. cfg.wire is 0.12, which is
     right for a mesh whose lines are a suggestion under a cloud of dots and
     invisible when the lines are the whole thing you are being shown -- the
     lines step of the build did not read at all until this. */
  const wireWant = (formE || rig.samp) && formWant && now > wireAt ? (rig.on || formHasB ? 1 : cfg.wire) : 0;
  wireT += (wireWant - wireT) * (1 - Math.pow(1 - 0.030, dt / 16.67));
  /* The picture comes up, and the drawing that announced it stands down. Both
     are eased, and they overlap: for about a second you can see the dots
     through the photograph, which is the only frame in which it is obvious that
     one became the other. */
  // (the gallery used to refresh formUntil here every frame, which was this
  //  same idea done once, for one caller, by hand)
  if (photo.at && now > photo.at) { photo.want = 1; photo.at = 0; }
  photo.t += (photo.want - photo.t) * (1 - Math.pow(1 - 0.022, dt / 16.67));
  // ...but not while one is still waiting its beat. This cleanup ran on the very
  // next frame after the picture was handed over and threw it away before its
  // own fade-in had started: alpha climbing on nothing at all.
  if (photo.t < 0.002 && !photo.want && !photo.at) { photo.t = 0; photo.img = null; }
  if (photo.t > 0.55 && formWant && formLabel && photo.img) formWant = 0;
  // the surface fills in behind the outline, and drains back out of it
  solidT += ((formTri && formWant ? solidWant : 0) - solidT) *
            (1 - Math.pow(1 - 0.026, dt / 16.67));
  if (solidT < 0.002 && !solidWant) solidT = 0;
  const tiltWant = formTilt != null ? formTilt : cfg.tilt;
  view.pitch += ((view.deep ? tiltWant : 0) - view.pitch) * 0.04;
  // an easing curve never actually reaches zero, and a residual pitch leaves a
  // residual perspective on a field that is supposed to be exactly flat
  if (!view.deep && Math.abs(view.pitch) < 0.002) view.pitch = 0;
  /* Scaled by formT, and this is the bug it fixes: a formation releases over a
     second and a half, and for all of it the field is flat again while the
     camera is still turned -- so the ring, and whatever was asked for next,
     came back skewed and then snapped straight. The rotation now unwinds
     exactly as the shape dissolves. */
  view.yaw = view.yaw0 * formT +
             (view.turn >= 1 ? 0 : view.turn * TAU *
               ((formSpin != null ? formSpin : cfg.spin) < 0 ? -1 : 1)) * formT;

  const rest = cfg.drift * (1 - Math.min(1, drive.scale * 2.4)) * (1 - formT) * (bs ? 0 : 1) *
               (1 - muses.amt);
  const wander = rest * (0.62 * Math.sin(tt / 7.3) + 0.38 * Math.sin(tt / 11.9 + 1.7));
  const drift2 = driftOn * DRIFT.shapeAmp *
                 (0.62 * Math.sin(tt / DRIFT.shapeA) + 0.38 * Math.sin(tt / DRIFT.shapeB + 2.4));
  const gScale = (1 + drive.scale * rmsNow) * (1 + rest * 0.05 * Math.sin(tt / 9.1));
  const maxR = Math.min(W, H) * 0.5 * cfg.fit;

  // falloff / sizeHi were absolute px, which is why desktop looked nothing
  // like mobile. Normalise against a 400px reference short edge.
  const k = scale / 400;
  // The black ring is wherever size crosses zero, i.e. dist == falloffPx. Fixed
  // in px it stops tracking the orb: shrink radius and the whole thing ends up
  // inside the green zone with no ring and no purple at all. follow blends the
  // split toward a fraction of the current ring radius, so the three layers
  // hold at any size. falloffGain only rides the absolute term — in follow mode
  // gScale already carries loudness.
  const ringNow = baseR * gScale;
  const fAbs = cfg.falloff * k * (1 + drive.scale * cfg.falloffGain);
  // The field spreads outward faster than the ring grows -- median particle
  // distance runs ~0.44 of the ring at rest but ~0.60 under audio -- so a fixed
  // fraction falls behind and every particle ends up on the far side with no
  // negative space left. falloffGain pushes the split out with level to match.
  const fRel = ringNow * cfg.split * (1 + drive.scale * cfg.falloffGain * 0.3);
  const falloffPx = fAbs + (fRel - fAbs) * cfg.follow;
  const sizeHiPx = cfg.sizeHi * k;
  const radCap = 22 * k * cfg.dot;

  // Containment. `fit` only clamps the target ring; momentum, the onset kick
  // and turbulence still throw particles well past it. This is a positional
  // wall, so the orb can explode to the viewport edge and never through it.
  // Ellipse matches the viewport aspect (a phone gets its full height), inset
  // by the largest dot we can draw so blobs don't clip on the edge.
  const hx = Math.max(20, W * 0.5 - radCap);
  const hy = Math.max(20, H * 0.5 - radCap);
  /* The wall exists to keep the ORB on screen. A menu is a deliberate layout
     that wants the whole frame, and at the tuned 0.56 its satellites sat
     outside the wall and got shoved back into the middle -- which is why they
     came out as spiky blobs at twice their radius rather than as rings. */
  /* The wall exists to keep the ORB on screen, and a room is meant to run off
     the edges: a floor wider than the viewport was being squeezed back inside
     it, which drew as a tangle down both sides rather than as a grid going
     away. So a hologram has no wall at all once it has landed -- everything in
     it is standing on a target, not drifting. */
  const containNow = menuOn ? Math.max(cfg.contain, 0.93)
                   : formWide ? Math.max(cfg.contain, 0.99) : cfg.contain;
  /* A wide formation has no wall either. The wall is an ELLIPSE fitted to the
     viewport, so a straight line across the top of the screen has both its ends
     outside it -- and the hard stop projects them back onto the curve. Two
     straight lines came out as two arcs, which is the wall drawing its own
     shape rather than the formation's. */
  const walled = !((formHasB || formWide) && formT > 0.02);
