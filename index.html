<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glorb</title>
<meta name="theme-color" content="#0B0B0B">
<meta name="description" content="Glorb: an audio-reactive orb you can talk to.">
<!-- Added to the home screen it launches without Safari chrome, which is the
     point: full bleed, dark status bar, no browser furniture over the field. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glorb">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0B0B0B;overflow:hidden;
    font-family:'DM Mono',ui-monospace,monospace;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:fixed;left:14px;top:calc(14px + env(safe-area-inset-top));
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#4A4A4A;pointer-events:none}
  #meter{position:fixed;left:14px;top:calc(32px + env(safe-area-inset-top));
    font-size:10px;letter-spacing:.1em;color:#3E4A38;pointer-events:none;white-space:pre}
  #tr{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;display:flex;gap:7px}
  button{background:rgba(15,15,15,.85);border:1px solid #262626;color:#7A7A7A;
    font-family:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    padding:7px 12px;border-radius:4px;cursor:pointer}
  button:hover,button:focus-visible{border-color:#C8F49A;color:#E8FFD2}
  button.on{color:#C8F49A;border-color:#C8F49A}
  /* Bare mode. Everything on this screen except the field itself is a readout,
     and a readout is for building with -- at some point this is a thing people
     look at, and none of it should be there. One class on the body takes all of
     it off; the toggle stays, very dim, because a way out that you cannot see
     is not a way out. It survives a reload, so "show somebody" is one tap and
     not a setup. */
  body.bare #hud, body.bare #meter, body.bare #tr, body.bare #cap,
  body.bare #fig, body.bare #panel { display:none !important }
  /* Under the button row while the chrome is up, and slid into the corner the
     row leaves behind when it goes. Not at the bottom: the caption lives across
     the full width down there and a long reply runs straight under it. */
  /* An eye, not a dot. It was a 30px circle at half opacity showing a bare
     glyph, and the feature behind it -- the one that takes every readout off
     the screen -- went unfound: asked for as a new thing to build while it was
     sitting in the corner working perfectly. Bigger, brighter, and an icon
     everybody already reads as show/hide. */
  #bareBtn{position:fixed;right:12px;top:calc(56px + env(safe-area-inset-top));
    z-index:8;width:38px;height:38px;padding:0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    line-height:1;letter-spacing:0;color:#7FA36A;
    background:rgba(11,11,11,.72);border:1px solid #33402C;opacity:.85;
    transition:top .18s ease,opacity .18s ease}
  #bareBtn svg{width:19px;height:19px;fill:none;stroke:currentColor;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  body.bare #bareBtn{top:calc(12px + env(safe-area-inset-top))}
  #bareBtn:hover,#bareBtn:focus-visible{opacity:1}
  /* dim once the screen is clean, but never invisible: a way out you cannot
     see is not a way out */
  body.bare #bareBtn{opacity:.30}
  body.bare #bareBtn:hover{opacity:.9}
  #err{position:fixed;top:calc(52px + env(safe-area-inset-top));right:14px;left:14px;
    max-width:340px;margin-left:auto;background:rgba(40,16,16,.94);border:1px solid #4A2020;
    color:#D89A94;font-size:11.5px;line-height:1.55;padding:11px 13px;border-radius:6px;display:none}
  /* bottom sheet — the orb stays visible above it while you tune */
  #panel{position:fixed;left:0;right:0;bottom:0;
    background:rgba(10,10,10,.93);border-top:1px solid #2A2A2A;
    border-radius:14px 14px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));
    max-height:42vh;overflow-y:auto;display:none;
    -webkit-overflow-scrolling:touch;touch-action:pan-y;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    box-shadow:0 -14px 40px rgba(0,0,0,.55)}
  #panel::before{content:"";display:block;width:34px;height:3px;border-radius:2px;
    background:#333;margin:0 auto 12px}
  @media (min-width:900px){
    #panel{left:auto;right:14px;bottom:14px;width:370px;border-radius:10px;
      border:1px solid #2A2A2A;max-height:78vh}
  }
  .grp{margin-bottom:13px}
  .grp>h3{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#C8F49A;
    margin-bottom:10px;opacity:.75;font-weight:400}
  .sl{margin-bottom:9px}
  .sl .t{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:#6B6B6B;margin-bottom:2px}
  .sl .t b{color:#C8F49A;font-weight:400}
  /* touch-action:none is what lets you DRAG the thumb on iOS instead of
     only tapping the track — without it Safari claims the gesture. */
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;
    background:transparent;outline:none;touch-action:none;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:#2E2E2E;border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
    margin-top:-10px;border-radius:50%;background:#C8F49A;cursor:pointer;
    box-shadow:0 1px 5px rgba(0,0,0,.6)}
  input[type=range]::-moz-range-track{height:2px;background:#2E2E2E;border-radius:2px}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
    background:#C8F49A;border:none;cursor:pointer}
  #row{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid #1E1E1E}
  .brow{display:flex;gap:8px;flex-wrap:wrap}
  input[type=text]{width:100%;background:#101010;border:1px solid #2A2A2A;color:#9A9A9A;
    font-family:inherit;font-size:11px;padding:7px 9px;border-radius:4px;margin-bottom:8px}
  input[type=text]:focus{outline:none;border-color:#C8F49A;color:#E8FFD2}
  #cap{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));
    font-size:12px;line-height:1.5;color:#6B6B6B;pointer-events:none;text-align:center;
    max-width:520px;margin:0 auto}
  /* The one control that matters, where a thumb already is. The top-right
     button is still there and still works; nobody found it. */
  /* The stage chooser. Only up while a figure is, and it is a tuning tool as
     much as a control: the four states are worth being able to sit in. */
  #fig{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(150px + env(safe-area-inset-bottom));
    display:none;gap:5px;z-index:6;-webkit-tap-highlight-color:transparent}
  #fig.on{display:flex}
  #fig button{font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:#9FB98B;background:rgba(11,11,11,.72);border:1px solid #3B4A31;
    border-radius:11px;padding:6px 9px;cursor:pointer}
  #fig button.at{color:#0B0B0B;background:#B6E08A;border-color:#B6E08A}
  /* Never on screen. It is rendered to and then drawn INTO the 2D canvas, which
     is the only way the model can be layered between the trail and the
     particles rather than simply on top of everything. */
  #gl{position:fixed;left:0;top:0;pointer-events:none;opacity:0;
    width:1px;height:1px}
  /* It used to be a red circle with a microphone in it, which is the browser's
     idea of what this is rather than ours -- a warning colour, on a screen that
     has no warning colours anywhere else in it, for the one thing you are meant
     to press. It says what it does now, and it is the same violet and green as
     everything else. */
  /* No words. It was a red circle with a microphone in it, which is the
     browser's idea of what this is; then it was a pill reading TALK TO GLORB,
     which is a caption on a button that did not need one -- and it introduced
     him by name before he had introduced himself. A microphone in the palette
     says press this, and everything else he says out loud. */
  #mic{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(74px + env(safe-area-inset-bottom));
    width:58px;height:58px;padding:0;border-radius:50%;
    border:1px solid #6B2FB5;background:rgba(24,10,38,.82);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    box-shadow:0 0 0 0 rgba(139,47,214,.5);animation:micPulse 2.8s ease-out infinite}
  #mic:active{background:rgba(46,18,72,.94)}
  #mic svg{width:24px;height:24px;fill:#B6E08A;flex:none}
  #mic.off{display:none}
  @keyframes micPulse{
    0%{box-shadow:0 0 0 0 rgba(139,47,214,.45)}
    70%{box-shadow:0 0 0 15px rgba(139,47,214,0)}
    100%{box-shadow:0 0 0 0 rgba(139,47,214,0)}}
  #cap b{display:block;color:#C8F49A;font-weight:400;margin-bottom:3px}
  #cap i{display:block;font-style:normal;color:#3E4A38;font-size:10px;
    letter-spacing:.08em;margin-top:5px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- The GPU layer. Everything in this program is drawn with Canvas 2D, which is
     a 2D rasteriser -- and a 2D rasteriser cannot map a texture across a
     triangle, interpolate a normal, or antialias a fill. A model rendered
     through it is a software renderer written by hand, and it looks like one.
     A rigged character is where that stops being acceptable. So the figure, and
     only the figure, is rendered by three.js on its own canvas and composited
     into the 2D one. Everything else -- the orb, the menu, the gallery, the
     holograms -- is untouched. -->
<canvas id="gl"></canvas>
<div id="hud">— fps</div>
<div id="meter"></div>
<button id="bareBtn" aria-label="hide the readouts" title="hide the readouts"></button>
<div id="tr">
  <button id="micBtn">enable mic</button>
  <button id="frzBtn" style="display:none">freeze</button>
  <button id="tuneBtn">tune</button>
</div>
<div id="err"></div>
<button id="mic" aria-label="talk"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg></button>
<div id="cap"></div>
<div id="fig"></div>
<div id="panel"></div>

<!-- Vendored, not from a CDN, and resolved by the browser's own import map
     rather than by a bundler. The whole bargain this file is built on is that
     there is no build step; an import map keeps that true while still letting
     three's own modules use bare specifiers. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module">
  import * as THREE from "three";
  import { GLTFLoader } from "./vendor/GLTFLoader.js";
  import { RoomEnvironment } from "./vendor/RoomEnvironment.js";
  /* Handed to the classic script through the window, because the classic script
     is four thousand lines of top-level consts that everything else -- onclick
     handlers, the test rigs -- reaches by name. Module scope would hide all of
     it. Module scripts are deferred, so this runs after the page below; the
     figure waits on the event. */
  window.THREE = THREE; window.GLTFLoader = GLTFLoader; window.RoomEnvironment = RoomEnvironment;
  window.__three = 1;
  window.dispatchEvent(new Event("threeready"));
</script>

<script>
"use strict";
const BANDS = 64, TAU = Math.PI * 2;

const DEFAULTS = {
  count:3200, radius:0.26, rateX:4200, rateY:6900, bloom:0.34, fit:0.75, contain:0.56,
  shape:0, shapeGain:0, core:0.2, coreR:0.34, drift:0.1, depth:0, spin:0, tilt:0, solid:0.08, wire:0.12, muse:0, share:1, idleS:0,
  speedLo:1, speedHi:3, forceRatio:0.18, fleeRadius:200, fleeMult:4.6,
  rmsGain:0.9, specGain:0.5, membrane:0.1, membGain:1.7, ellipse:1, jaw:1.05, gate:1, gateFloor:0.05, kickShape:0,
  falloffGain:0, turbGain:1.1, impulseGain:2.3, hueGain:2.55, attack:0.34, release:0.16, dbMargin:2, dbRange:18,
  autoWord:0,
  dot:0.52, sizeHi:26, falloff:70, follow:1, split:0.44, splitEll:0, splitJaw:0, splitShape:0,
  trail:0.46, rK:-0.5, gK:7, bK:-2, base:120,
  vadOn:0.14, holdMs:700, thinkMs:1500, speakMs:2800, sylRate:4.2, echoTail:850,
  /* The gap after the last WORD that ends a sentence, and whether talking over
     him stops him. gapMs is the whole latency story in a noisy room: recognition
     will happily sit on a finished sentence for seconds waiting for the music to
     stop. */
  gapMs:620, barge:4, volume:3.4, snap:0.3, flashMs:1100
};
const cfg = Object.assign({}, DEFAULTS);

/* Named looks. Each is applied over DEFAULTS, so a preset only has to list what
   it changes. Reconstructed from the commits they were first rendered at and
   re-verified against this build -- the neutralisers matter, since anything
   added later (the deformable split, the growth term, the deform gate) will
   quietly alter a look that predates it. */
const PRESETS = {
  base: {},
  // shaped silhouette: low bloom so the target reads as a line, heavy membrane
  // to hold particles on it, gate 0 so the resting orb keeps its stretch
  shaped: {
    count:570, radius:0.30, rateX:23000, rateY:6500, bloom:0.25, fit:1.19, contain:0.86,
    shape:1, shapeGain:0, core:0, coreR:0.18, drift:0, muse:0, share:1, idleS:0, depth:0, spin:0, tilt:0, solid:0, wire:0, kickShape:0, speedLo:3.5, speedHi:19.5, forceRatio:0.045,
    fleeRadius:100, fleeMult:1.8, rmsGain:1.15, specGain:0.65, membrane:1.1, membGain:0,
    ellipse:0.45, jaw:0, gate:0, falloffGain:1.7, turbGain:1.6, impulseGain:2.7,
    hueGain:2.55, attack:0.35, release:0.31, dot:1.0, sizeHi:26, falloff:45,
    follow:0, split:0.46, splitEll:0, splitJaw:0, splitShape:0,
    trail:0.41, rK:-0.5, gK:7, bK:-2, base:130
  },
  /* Exactly the config that was the default before the resting state was
     opened up -- kept whole so it is one tap back, not a reconstruction. */
  lips: {
    count:4777, radius:0.16, rateX:14000, rateY:23500, bloom:0.6, fit:0.75, contain:0.56,
    shape:7, shapeGain:0, core:0.1, coreR:0.19, drift:0.44, depth:0, spin:0, tilt:0,
    solid:0.08, wire:0.12, muse:0, share:1, idleS:0,
    speedLo:1, speedHi:3, forceRatio:0.18, fleeRadius:200, fleeMult:4.6,
    rmsGain:0.9, specGain:0.5, membrane:0.1, membGain:0, ellipse:1, jaw:1.05, gate:1, gateFloor:0.05,
    kickShape:0, falloffGain:0, turbGain:1.1, impulseGain:2.3, hueGain:2.55,
    /* Its own 9 and 31 are gone. They were tuned against a noise floor that ran
       28 dB below the room, and against a floor that is actually the room they
       reject an ordinary voice outright -- the preset would come back deaf. */
    attack:0.34, release:0.16, dbMargin:2, dbRange:18,
    dot:0.65, sizeHi:26, falloff:70, follow:1, split:0.46, splitEll:0, splitJaw:0, splitShape:0,
    trail:0.46, rK:-0.5, gK:7, bK:-2, base:120
  },
  // lips: mouth silhouette with a hard centroid ellipse. falloffGain 0 keeps the
  // split at a plain fraction of the ring, which is what this was built against
  mouth: {
    count:900, radius:0.16, rateX:14000, rateY:23500, bloom:0.60, fit:0.75, contain:0.56,
    shape:7, shapeGain:0, core:0, coreR:0.18, drift:0, muse:0, share:1, idleS:0, depth:0, spin:0, tilt:0, solid:0, wire:0, kickShape:0, speedLo:1, speedHi:3, forceRatio:0.18,
    fleeRadius:200, fleeMult:4.6, rmsGain:0.9, specGain:0.7, membrane:0.5, membGain:0,
    ellipse:1.8, jaw:1.2, gate:1, falloffGain:0, turbGain:1.1, impulseGain:2.7,
    hueGain:2.55, attack:0.35, release:0.11, dot:0.65, sizeHi:26, falloff:70,
    follow:1, split:0.46, splitEll:0, splitJaw:0, splitShape:0,
    trail:0.46, rK:-0.5, gK:7, bK:-2, base:120
  }
};

/* the only channel audio has into physics */
const drive = { scale:0, spectrum:new Float32Array(BANDS), turbulence:0, impulse:0, hue:0,
  /* 0 for a voice, 1 for a record, and everything in between while it fades.
     The music visualiser is a different instrument from the one a conversation
     plays, and this is the crossfade between them -- so nothing below has to
     know whether music is on, only how much. */
  music: 0,
  /* Per band, what is NEW this frame rather than how much is there. A drum is
     an onset; a bass note that has been ringing for a bar is not a kick. */
  hit: new Float32Array(BANDS) };

/* ---------------- states ----------------
   idle | listening | thinking | speaking. Every state writes the SAME five
   channels; the visual system never learns which one is talking. That is the
   entire point of the seam -- listening fills them from the microphone, the
   other three from script, and physics cannot tell the difference.

   mic is where analyse() puts its results now. Keeping it separate from drive
   is what lets voice-activity detection keep running while a scripted state
   owns the visuals -- otherwise the orb could never hear you interrupt it. */
const mic  = { scale:0, spectrum:new Float32Array(BANDS), turbulence:0, impulse:0, hue:0 };
const srcD = { scale:0, spectrum:new Float32Array(BANDS), turbulence:0, impulse:0, hue:0 };
const fromD = { scale:0, spectrum:new Float32Array(BANDS), turbulence:0, impulse:0, hue:0 };

const STATES = ["idle", "listening", "thinking", "speaking"];
const BLEND = 260;                       // ms to cross-fade on a state change
let state = "idle", stateT = 0, blendT = 1e9;
let manual = false, heardVoice = false, quietT = 0;
let smoothScale = 0;

function setState(next) {
  if (next !== state) {
    // snapshot what physics is currently seeing, and ease off it rather than
    // snapping -- a hard cut between sources reads as a glitch, not a mood
    fromD.scale = drive.scale; fromD.hue = drive.hue;
    fromD.turbulence = drive.turbulence; fromD.impulse = drive.impulse;
    fromD.spectrum.set(drive.spectrum);
    state = next; stateT = 0; blendT = 0;
    if (next === "listening") { heardVoice = false; quietT = 0; }
  }
  syncStateBtns();
}

// deterministic per-syllable noise, so speech has structure instead of jitter
const hash = (i) => { const v = Math.sin(i * 12.9898) * 43758.5453; return v - Math.floor(v); };

/* Vowel -> centroid. These are not arbitrary: /i/ and /e/ carry a high second
   formant and spread the lips, /o/ and /u/ are low and round them. Feeding real
   vowels into the hue channel means the mouth shapes the actual words. */
const VOWEL_TONE = { a:0.42, e:0.86, i:0.95, o:0.24, u:0.12, y:0.72 };
let plan = null, planMs = 0;

function planSpeech(text) {
  const out = [];
  for (const word of String(text).toLowerCase().split(/\s+/)) {
    let n = 0, prevVowel = false;
    for (const ch of word) {
      const v = VOWEL_TONE[ch];
      if (v === undefined) { prevVowel = false; continue; }
      if (!prevVowel) { out.push({ v, pause:false }); n++; }  // a vowel run is one syllable
      prevVowel = true;
    }
    // Speech pauses at punctuation, not between every word. A gap per word makes
    // a short sentence take half again as long as it should to say.
    if (n && /[,.;:!?]$/.test(word)) out.push({ v:0.3, pause:true });
  }
  plan = out.length ? out : null;
  planMs = plan ? (plan.length / cfg.sylRate) * 1000 : 0;
}

function srcIdle(t) {
  srcD.scale = 0.05 + 0.035 * Math.sin(t * 0.6);
  srcD.hue = 0.05 + 0.05 * Math.sin(t * 0.17);
  srcD.turbulence = 0.02;
  srcD.impulse = 0;
  for (let b = 0; b < BANDS; b++) srcD.spectrum[b] = 0.04 + 0.03 * Math.sin(b * 0.25 + t * 0.7);
}

function srcThinking(t) {
  // a bright lobe orbits the ring. Nothing about it is random, which is what
  // makes it read as working on something rather than reacting to something.
  const pos = (t * 0.55 % 1) * BANDS;
  for (let b = 0; b < BANDS; b++) {
    let d = Math.abs(b - pos); if (d > BANDS / 2) d = BANDS - d;
    srcD.spectrum[b] = 0.10 + 0.85 * Math.exp(-(d * d) / 26);
  }
  srcD.scale = 0.34 + 0.10 * Math.sin(t * 2.1);
  srcD.hue = 0.5 + 0.42 * Math.sin(t * 0.42);      // sweeps shape and palette
  srcD.turbulence = 0.06;
  srcD.impulse = Math.max(0, Math.sin(t * 2.1)) * 0.10;
}

function srcSpeaking(t) {
  // Real audio when there is any; the syllable clock only covers its absence.
  if (ttsPlaying) {
    srcD.scale = tts.scale; srcD.hue = tts.hue;
    srcD.turbulence = tts.turbulence; srcD.impulse = tts.impulse;
    srcD.spectrum.set(tts.spectrum);
    return;
  }
  /* A syllable clock, not a noise generator. Each slot gets an envelope, a
     vowel and a chance of being a pause, so the rhythm reads as speech. The
     vowel drives hue, which is the centroid channel -- so the mouth widens and
     the silhouette morphs per syllable exactly as they would on real audio. */
  const sy = t * cfg.sylRate;
  const idx = Math.floor(sy), f = sy - idx;
  // With a plan the syllables are the reply's own; without one it falls back to
  // the scripted babble, which is what runs when no brain is wired up.
  const step = plan ? (idx < plan.length ? plan[idx] : { v:0.3, pause:true }) : null;
  const voiced = step ? !step.pause : hash(idx) > 0.2;
  const env = voiced ? Math.pow(Math.sin(Math.PI * Math.min(1, f * 1.3)), 0.75) : 0;
  const vowel = step ? step.v : hash(idx * 7 + 3);
  const sib = hash(idx * 3 + 11) > 0.65;           // sibilant syllables hiss
  const stressed = hash(idx * 5 + 7) > 0.55;       // and only some carry an onset

  srcD.scale = 0.12 + 0.72 * env;
  srcD.hue += (vowel * env - srcD.hue) * 0.25;
  srcD.turbulence = 0.10 + 0.55 * (sib ? env : 0);
  /* An onset of 0.9 on every syllable was nothing like real speech. The kick
     integrates to roughly 31 * impulse px/frame of velocity, and the arrive
     force is capped near 0.6 px/frame^2 -- so at 4.2 syllables a second the
     field was re-kicked long before it could be pulled back, and just wandered
     outward until it hit the wall. Real flux peaks lower and only fires on
     genuine onsets, so do the same. */
  srcD.impulse = (voiced && stressed && f < 0.16) ? 0.25 : srcD.impulse * 0.86;
  for (let b = 0; b < BANDS; b++) {
    const fb = b / BANDS;
    const f1 = Math.exp(-Math.pow((fb - 0.06) / 0.05, 2));               // voice bar
    const f2 = Math.exp(-Math.pow((fb - (0.12 + vowel * 0.45)) / 0.09, 2)); // formant
    srcD.spectrum[b] = env * (0.85 * f1 + 0.6 * f2);
  }
}

function updateState(dt) {
  stateT += dt; blendT += dt;
  analyseTts();
  analyseMusic();

  if (!manual) {
    // barge-in: voice wins from any state, so it can be interrupted mid-sentence
    if (A && mic.scale > cfg.vadOn) {
      if (state !== "listening") setState("listening");
      heardVoice = true; quietT = 0;
    } else if (state === "listening") {
      quietT += dt;
      /* Idle, not thinking, when there is a microphone. Thinking is a scripted
         state -- it animates a canned envelope, because its job is to look like
         work is happening while a reply is fetched -- and dropping into it three
         quarters of a second after every pause meant the field spent those
         seconds ignoring the room. A real question sets it from ask(); nothing
         else should. Idle with a live mic still reads the microphone. */
      if (heardVoice && quietT > cfg.holdMs) setState(A ? "idle" : "thinking");
      else if (!heardVoice && quietT > cfg.holdMs * 3) setState("idle");
    } else if (state === "thinking" && stateT > cfg.thinkMs) {
      /* A real request in flight owns the thinking state -- it ends when the
         reply lands, not when a timer says so. And when nothing was asked at
         all, go back to LISTENING rather than on into a scripted reply.

         The think-then-speak pair is the demo for a page with no microphone and
         no brain. With a live mic it fired every time somebody stopped talking
         for three quarters of a second, and its canned envelope runs nearly
         twice as strong as an actual voice -- so the orb went quiet while you
         were speaking and then flailed about the moment you stopped, which
         reads exactly like a visualiser ignoring you. Measured through the real
         path: drive 0.19 under speech, 0.35 in the silence after it. */
      if (!brain.busy) setState(A ? "listening" : "speaking");
    } else if (state === "speaking" && stateT > (planMs || cfg.speakMs)) {
      plan = null; planMs = 0;
      setState(A ? "listening" : "idle");
    }
  }

  const t = stateT / 1000;
  /* Music takes the visuals while it is on. Not while he is SPEAKING -- his
     own voice has to keep the mouth, or he mouths the track instead of the
     sentence -- and not while he is thinking, which has a look of its own. The
     rest of the time the orb is reacting to the room, and the loudest thing in
     the room is the music. */
  const onMusic = music.playing && state !== "speaking" && state !== "thinking";
  /* Eased, so switching a track on or off is a change of instrument rather
     than a jump cut. About a third of a second either way. */
  drive.music += ((onMusic ? 1 : 0) - drive.music) * 0.06;
  if (onMusic) drive.hit.set(music.hit);
  else for (let b = 0; b < BANDS; b++) drive.hit[b] *= 0.9;

  if (onMusic) {
    srcD.scale = music.scale; srcD.hue = music.hue;
    srcD.turbulence = music.turbulence; srcD.impulse = music.impulse;
    srcD.spectrum.set(music.spectrum);
  }
  else if (state === "listening") {
    srcD.scale = mic.scale; srcD.hue = mic.hue;
    srcD.turbulence = mic.turbulence; srcD.impulse = mic.impulse;
    srcD.spectrum.set(mic.spectrum);
  } else if (state === "idle") {
    /* A live mic still drives the visuals while idle. Idle means nobody has
       said anything yet -- not that the orb has stopped hearing. Routing idle
       through the scripted breath made it deaf to everything under vadOn and
       painted constants over the tuned resting state. The breath is only for
       when there is no audio source at all. */
    if (A) {
      srcD.scale = mic.scale; srcD.hue = mic.hue;
      srcD.turbulence = mic.turbulence; srcD.impulse = mic.impulse;
      srcD.spectrum.set(mic.spectrum);
    } else srcIdle(t);
  }
  else if (state === "thinking") srcThinking(t);
  else srcSpeaking(t);

  /* The mic path shapes level with attack/release; the scripted sources wrote
     raw values straight in, so speaking stepped between syllables instead of
     breathing between them. Run them through the same envelope -- states are
     only interchangeable if they are shaped alike. */
  if (state === "listening") smoothScale = srcD.scale;
  else {
    const ka = srcD.scale > smoothScale ? cfg.attack : cfg.release;
    smoothScale += (srcD.scale - smoothScale) * ka;

  }

  drive.turbulence += (srcD.turbulence - drive.turbulence) * e;
  drive.impulse += (srcD.impulse - drive.impulse) * e;
  for (let b = 0; b < BANDS; b++)
    drive.spectrum[b] += (srcD.spectrum[b] - drive.spectrum[b]) * e;
}

/* ---------------- brain ----------------
   Speech in via the browser's own recogniser, thinking out to Claude through a
   proxy, and the reply drives the speaking state. The API key is deliberately
   NOT here: this page is served from GitHub Pages, so anything in it is public
   and a leaked key is billable. worker/ holds the proxy that keeps it server
   side. With no endpoint configured everything below stays dormant and the
   scripted states run instead. */
const cap = document.getElementById("cap");
/* Added to the home screen, iOS runs this in a different context from Safari:
   its own permission grants, often its own storage partition, and a long
   history of WebKit bugs around media capture there. Worth knowing which one
   we are in before blaming anything else. */
const standalone = window.navigator.standalone === true ||
  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
/* Baked in because neither is a secret -- the browser calls this URL in the
   clear, and voice ids are public. The API keys stay in the Worker. This also
   fixes the home-screen app, which gets its own localStorage partition and so
   launched with nothing to call. A stored value still wins, so a blank field
   stays blank rather than springing back to the default. */
const DEFAULT_BRAIN = "https://orb-brain.colinwillowtree.workers.dev";
const stored = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };

const brain = {
  url: stored("orbBrain") === null ? DEFAULT_BRAIN : stored("orbBrain"),
  // left blank on purpose: the Worker already defaults to the chosen voice, and
  // one source of truth beats two that can disagree. Set it here to override.
  voice: stored("orbVoice") || "",
  history: [],
  busy: false
};

let lastAsked = "", lastTiming = "";
function caption(said, said2) {
  if (said !== null) lastAsked = said;
  cap.innerHTML = "";
  if (lastAsked) { const b = document.createElement("b"); b.textContent = lastAsked; cap.appendChild(b); }
  if (said2) cap.appendChild(document.createTextNode(said2));
  if (lastTiming) { const i = document.createElement("i"); i.textContent = lastTiming; cap.appendChild(i); }
}

/* Where the wait actually goes. The pipeline is serial -- full reply, then
   full clip, then speak -- so knowing which leg dominates is the difference
   between optimising the right thing and the loud thing. */
const clock = { t0:0, firstTok:0, lastTok:0, audio:0, claudeMs:0, endpoint:0, via:"", legs:null };

/* When the words stopped, which is not when the question was sent. Recognition
   decides on its own when a sentence has ended, and that decision happens after
   the last word and before anything here has run -- so the whole of it fell
   outside the measurement and read as the model being slow. Kept as the time of
   the last INTERIM result: the last moment there was evidence of talking. */
let sawSpeechAt = 0, endpointMs = 0;

/* ---------------- endpointing ----------------
   When is a sentence over?

   Recognition's own answer -- the isFinal result -- is that the ROOM has gone
   quiet. Sitting at a desk with music playing, the room never goes quiet, so
   the reply waited and waited while the visualiser bounced along to the
   stereo. The right answer is that the WORDS have stopped: the transcript has
   not changed for a while, whatever the level is doing.

   So the sentence is sent on the gap in the interim stream, and the isFinal
   that arrives later for the same utterance is swallowed. It is the difference
   between an endpointer that listens to a room and one that listens to a
   person. */
let lastHeard = "", lastHeardAt = 0, finalSwallow = 0;
function endpointCheck() {
  if (!lastHeard || sttPaused || ttsPlaying || brain.busy) return;
  if (performance.now() - lastHeardAt < cfg.gapMs) return;
  const said = lastHeard;
  lastHeard = "";
  finalSwallow = performance.now() + 3000;
  endpointMs = Math.round(performance.now() - lastHeardAt);
  sawSpeechAt = 0; echoSeen = 0; lastLive = "";
  heardSentence(said);
}
setInterval(endpointCheck, 80);

/* How many words in `a` are not in `b`. Used for one thing: telling somebody
   talking over him apart from his own voice coming back through the speaker.
   Deliberately blunt -- a bag of words, no order -- because the recogniser is
   hearing a mixture of both and a careful comparison of a mixture is a careful
   comparison of nothing. */
const bag = (t) => String(t || "").toLowerCase().replace(/[^a-z0-9' ]/g, " ").split(/\s+/).filter(Boolean);
function novelWords(a, b) {
  const have = new Set(bag(b));
  let n = 0;

  return n;
}
let ttsText = "";
/* What it takes to stop him mid-sentence.

   The word test was right and the arithmetic around it was not. It counted
   novel words in the WHOLE transcript and stopped at two -- so over a ten
   second reply, any two stray words at any two moments were enough, and a
   recogniser has only one thing it can turn a cough or a television into:
   words. He interrupted himself constantly, two words into his own answer,
   and there was no getting the answer back.

   Same principle as the endpointer, then, applied the other way round: judge
   it on words, and on words that arrive like somebody TALKING. Two things
   have to be true.

   - `gap`: the words have to keep coming. A transcript that has not changed
     for this long is a room, not a sentence, and the count starts over. Note
     that it is the TRANSCRIPT changing, not the novel count going up: somebody
     saying "hang on, wait, what about the other one" is talking the whole way
     through, and the fact that "about" and "the" are words he happened to use
     as well does not mean they stopped. Keyed on the count, that sentence
     reset its own burst two words from the end and let it through.
   - `grace`: nothing counts for the first stretch of his reply. When he starts
     talking, the transcript still holds the tail of the question that prompted
     him, and every word of it is novel by construction. That window is the
     baseline, not an interruption.

   nothing does: he finishes every thought, and recognition is paused while he
   talks, so he cannot hear himself at all. */
const BARGE = { gap: 900, grace: 700 };
let bargeN = 0, bargeBase = 0, bargeLast = 0, bargeFrom = 0, bargeLive = "";
function bargeWatch(live) {
  const now = performance.now();
  if (live === bargeLive) return;            // nothing new was said
  const quiet = bargeLast ? now - bargeLast : 1e9;
  bargeLive = live; bargeLast = now;
  const n = novelWords(live, ttsText);
  if (now < bargeFrom) { bargeBase = bargeN = n; return; }
  // the transcript restarted -- a new utterance, not a longer one
  if (n < bargeN || quiet > BARGE.gap) bargeBase = n === 0 ? 0 : bargeN;
  bargeN = n;
  if (n - bargeBase >= cfg.barge) bargeIn();
}
function bargeIn() {
  if (!ttsPlaying) return;
  hush();
  // the transcript so far is half his and half yours; drop it and start clean
  lastHeard = "";
  pauseSTT();
  setTimeout(resumeSTT, 200);
  setState("listening");
  caption(null, "…");
}
function mark(k) { clock[k] = performance.now(); }
function reportTiming() {
  const ms = (a, b) => Math.round(clock[b] - clock[a]);
  const parts = [];
  if (clock.endpoint) parts.push("endpoint " + clock.endpoint + "ms");
  if (clock.firstTok) {
    // split the wait: what Claude spent, and what the trip cost on top
    const think = ms("t0", "firstTok");
    parts.push(clock.claudeMs
      ? "think " + think + "ms (claude " + clock.claudeMs + (clock.via ? " via " + clock.via : "")
        + ", net " + Math.max(0, think - clock.claudeMs) + ")"
      : "think " + think + "ms");
    /* Every attempt the worker made, in order, including the ones that failed.
       One slow answer and two dead round trips add up to the same number and
       want completely different fixes. */
    const legs = clock.legs && Object.keys(clock.legs);
    if (legs && legs.length > 1)
      parts.push("tried " + legs.map((k) => k + " " + clock.legs[k] + "ms").join(" then "));
  }
  if (clock.lastTok) parts.push("write " + ms("firstTok", "lastTok") + "ms");
  if (clock.audio) parts.push("voice " + ms("lastTok", "audio") + "ms");
  const total = clock.audio ? ms("t0", "audio") : 0;
  // from when the talking stopped, because that is when the waiting starts
  if (total) parts.push("= " + (total + clock.endpoint) + "ms to first sound");
  lastTiming = parts.join("   ");
  if (!lastTiming) return;
  console.log("orb timing:", lastTiming);
  // append rather than re-render: the reply text lives in the DOM already and
  // this fires after the last caption() call, which would otherwise hide it
  const i = document.createElement("i");
  i.textContent = lastTiming;
  cap.appendChild(i);
}

async function ask(text) {
  if (brain.busy) return;
  clearTimeout(answerAt);          // a new question cancels the last answer's picture
  caption(text, "");
  if (!brain.url) { setState("thinking"); return; }   // scripted reply, no brain wired

  brain.busy = true;
  clock.t0 = performance.now(); clock.firstTok = clock.lastTok = clock.audio = 0; clock.claudeMs = 0;
  clock.endpoint = endpointMs; endpointMs = 0; clock.via = ""; clock.legs = null;
  brain.history.push({ role:"user", content:text });
  // the proxy is stateless, so trimming here is what bounds the token bill
  if (brain.history.length > 20) brain.history.splice(0, brain.history.length - 20);
  setState("thinking");

  let full = "", shown = false, pendingShow = null;   // the brain may pick the picture itself
  try {
    const res = await fetch(brain.url, {
      method: "POST",
      headers: { "content-type": "application/json" },
      /* The brain cannot see the folder, so it is told what is in it. Without
         this it answers that it has no pictures -- which was true from where it
         was standing, and is the kind of gap that reads as the feature being
         broken rather than unwired. */
      /* And who it is talking to. The name is the page's to know -- it is in
         localStorage, not in the twenty messages the proxy is sent -- so it has
         to travel with every turn or the model forgets it mid-conversation. */
      body: JSON.stringify({ messages: brain.history, images: imageList || [],
                             guest: guest.name || "",
                             // one line of who they are, when it is somebody it knows
                             about: (profileOf(guest.name) || {}).is || "",
                             /* and everything it has been told since. Sent every turn
                                for the same reason the name is: the twenty messages the
                                proxy holds are a conversation, not a memory. */
                             memory: memOf(guest.name) })
    });
    if (!res.ok) throw new Error("HTTP " + res.status + " " + (await res.text()).slice(0, 120));

    const reader = res.body.getReader(), dec = new TextDecoder();
    let raw = "";
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      if (!clock.firstTok) mark("firstTok");
      raw += dec.decode(value, { stream:true });
      // everything past the NUL is a command for the page, never speech
      const cut = raw.indexOf("\u0000");
      full = cut >= 0 ? raw.slice(0, cut) : raw;
      caption(text, full);
    }
    mark("lastTok");

    const cut = raw.indexOf("\u0000");
    if (cut >= 0) {
      full = raw.slice(0, cut);
      try {
        const ctl = JSON.parse(raw.slice(cut + 1));
        /* Held, not formed. A word thrown up the instant the text arrives stands
           there through the whole reply -- so the mouth is dead for the sentence
           it was meant to punctuate, and the word itself is long gone from the
           speech by the time it lands. Wait for the audio: only then is it known
           how long the reply takes to say, and therefore where in it the word
           falls. A firework and a mesh are events in their own right and keep
           firing on arrival. */
        if (ctl.remember) memAdd(guest.name, ctl.remember);
        if (ctl.show) {
          shown = true;
          if (ctl.show.shell || ctl.show.model || ctl.show.menu || ctl.show.gallery ||
              ctl.show.figure || ctl.show.pages)
            setFormation(ctl.show, ctl.show.seconds);
          else pendingShow = ctl.show;
        }
        if (ctl.ms && ctl.ms.claude) clock.claudeMs = ctl.ms.claude;
        if (ctl.via) clock.via = ctl.via;
        if (ctl.legs) clock.legs = ctl.legs;
      } catch (e) { /* a malformed frame must never cost us the reply */ }
    }
    brain.history.push({ role:"assistant", content: full });
  } catch (err) {
    full = "I couldn't reach my brain.";
    caption(text, full + "  (" + err.message + ")");
    brain.history.pop();
  }

  brain.busy = false;
  /* Hold in thinking until the voice is ready, so the mouth starts when the
     sound does. Mouthing early and letting audio catch up puts the two out of
     step, which reads worse than the wait. */
  const spoke = await playReply(full);
  // playReply reports once audio starts; without a voice nothing ever would,
  // and the legs before the voice are exactly the ones worth seeing
  if (!spoke) { planSpeech(full); reportTiming(); }
  setState("speaking");
  if (pendingShow) flashAtWord(pendingShow, full, planMs);
  /* Muted. Duet used to pick the longest word out of every reply and spell it,
     which means a picture on every answer whether or not there was anything
     worth picturing -- and the field cannot be a word and a mouth at once, so
     the cost of a picture nobody asked for is the reaction to the voice saying
     it. Drawing a word is worth keeping for when the reply turns on one: a
     name, a colour, a number. That is a judgement, and the longest word in the
     sentence is not it. The machinery stays; nothing calls it. */
  if (cfg.autoWord > 0.5 && echoMode === 2 && !shown) answerVisual(full, planMs);
}

/* A glimpse, timed to the word it is a picture of.

   Two things were wrong with throwing it up as soon as the text arrived. It sat
   there for five seconds, which is most of a spoken reply, and the field cannot
   be a word and a mouth at once -- so the sentence the word was meant to
   punctuate went by with nothing moving. And it appeared at the start whatever
   the word was, when the word it draws is usually somewhere in the middle: shown
   first and said later reads as two unrelated events.

   So it waits for the audio, finds its own word in the reply, and lands there --
   a little early, because a picture arriving with the word reads as arriving
   late. Then it goes, and the mouth has the rest of the sentence back. */
const FLASH_S = 0.55;
function flashAtWord(spec, text, ms) {
  const w = String(text || "").toLowerCase().match(/[a-z']+/g) || [];
  const key = String(spec.text || spec.image || "").toLowerCase().replace(/[^a-z']/g, "");
  let at = key ? w.indexOf(key) : -1;
  // an emoji, or a picture named for something said a different way, has no
  // position in the sentence -- those simply come up now
  const delay = at < 0 || !ms ? 0 : Math.max(0, (at / w.length) * ms - 260);
  clearTimeout(answerAt);
  answerAt = setTimeout(() => {
    if (!((form3d || menuOn) && formWant)) setFormation(spec, FLASH_S);
  }, delay);
}

/* The other half of duet. A trigger word inside the reply wins outright -- it
   says "I'm Glorb" and spells GLORB, says congratulations and the sky goes up --
   and otherwise the longest word carrying any weight stands in for the
   sentence. Timed to where that word actually falls, so the picture and the
   voice land together instead of the picture leading by a sentence. */
const FILLER = new Set(("a about all also am an and any are as at be been but by can could did do does " +
  "for from get got had has have here how i if in is it its just like made make me more most my no not " +
  "now of on one only or our out so some than that the their them then there these they thing things " +
  "this those to too up us very was way we well were what when where which who why will with would you " +
  "your im ive dont thats youre").split(" "));

function answerVisual(text, ms) {
  const w = String(text || "").toLowerCase().match(/[a-z']+/g);
  if (!w || !w.length) return;
  let at = -1, spec = null;
  for (let i = 0; i < w.length && !spec; i++)
    if (TRIGGERS[w[i]]) { at = i; spec = TRIGGERS[w[i]]; }
  if (!spec) {
    let best = -1;
    for (let i = 0; i < w.length; i++)
      if (w[i].length >= 4 && !FILLER.has(w[i]) && (best < 0 || w[i].length > w[best].length)) best = i;
    if (best < 0) return;

  const delay = Math.max(0, (at / w.length) * (ms || 0) - 260);

    if (!((form3d || menuOn) && formWant)) setFormation(spec, FLASH_S);
  }, delay);
}

/* ---------------- voice out ----------------
   The reply is played AND analysed. Once real audio exists there is no reason
   to keep guessing at syllables: the speaking state reads the same five
   channels off its own voice that listening reads off the microphone, which is
   what the drive seam was for. The scripted plan stays as the fallback for
   when no voice is configured or the request fails. */
let ttsCtx = null, ttsAn = null, ttsSrc = null, ttsFreq = null, ttsTime = null, ttsPrev = null;

// Built on a real click, because Safari will not start an AudioContext
// anywhere else -- and by the time the reply lands we are long past the gesture.
function ensureTtsCtx() {

       scale -- a phone at maximum still sounded like someone talking in the
       next room. Boost, then limit: gain alone would just clip the peaks into
       distortion, and a compressor alone cannot make anything louder.

       The analyser stays where it was, tapping the signal BEFORE the boost.
       The mouth animation is tuned against those numbers, and moving the tap
       would have quietly re-tuned the speaking state along with the volume. */
    ttsGain = ttsCtx.createGain();
    ttsGain.gain.value = cfg.volume;

function analyseTts() {
  if (!ttsPlaying || !ttsAn) return;
  ttsAn.getByteFrequencyData(ttsFreq);
  ttsAn.getFloatTimeDomainData(ttsTime);

  let sum = 0, zc = 0, last = ttsTime[0];
  for (let i = 0; i < ttsTime.length; i++) {
    const v = ttsTime[i]; sum += v * v;
    if ((v >= 0) !== (last >= 0)) zc++;
    last = v;

  const zcr = zc / ttsTime.length;

  const db = 20 * Math.log10(rms + 1e-7);

  tts.scale += (lvl - tts.scale) * k;

  const N = ttsFreq.length;
  for (let b = 0; b < BANDS; b++) {
    const lo = Math.floor(Math.pow(b / BANDS, 2) * N);
    const hi = Math.max(lo + 1, Math.floor(Math.pow((b + 1) / BANDS, 2) * N));
    let acc = 0;
    for (let i = lo; i < hi; i++) acc += ttsFreq[i];
    tts.spectrum[b] += (acc / (hi - lo) / 255 - tts.spectrum[b]) * 0.35;
  }
  let cn = 0, cd = 0, flux = 0;
  for (let i = 0; i < N; i++) {
    const val = ttsFreq[i] / 255;
    cn += i * val; cd += val;
    const diff = val - ttsPrev[i];
    if (diff > 0) flux += diff;
    ttsPrev[i] = val;
  }
  let centroid = cd > 0.001 ? cn / cd / N : 0;
  centroid = (centroid - 0.03) / 0.20;
  if (centroid < 0) centroid = 0; else if (centroid > 1) centroid = 1;
  const g = Math.min(1, Math.max(0, (tts.scale - cfg.gateFloor) / 0.12));
  tts.hue += (centroid * g - tts.hue) * 0.06;
  tts.turbulence += (Math.min(1, zcr * 26) * g - tts.turbulence) * 0.16;
  tts.impulse = Math.max(tts.impulse * 0.86, Math.min(1, flux * 0.05) * g);
}

/* ---------------- music ----------------

   Files live in music/ and are listed in music/manifest.json, so adding a
   track is dropping a file next to a line of JSON rather than editing this
   page. Each entry is { file, title, bpm } and only `file` is required -- the
   tempo is measured from the audio if it is not declared, and a declared one
   is trusted over the measurement because a number typed by someone who knows
   the track beats an onset detector every time.

   It shares the TTS AudioContext deliberately. Safari will only start a
   context inside a real gesture, that one is already built inside a click and
   already gets resumed everywhere iOS suspends it, and a second context would
   be a second thing to keep alive for no benefit. */
const MUSIC_DIR = "music/";
/* How far below a track's own loudest moment counts as silence. Eighteen
   decibels is about the dynamic range of a mastered pop record, so a chorus
   lands at the top and a verse sits comfortably below it. */
const MUSIC_RANGE = 18;
/* What the average band should read, across every record. Measured off the
   five here before any of this existed, a well-behaved master ran a mean band
   around 0.45 and looked right; Heat Waves ran 0.16 and looked dead. */
const MUSIC_SPEC = 0.42;
/* The music visualiser's own instrument. `low` and `mid` are band indices, and
   the band mapping is quadratic, so band 9 is about 430Hz and band 26 about
   3.6kHz -- kick and bass below the first, snare and voice between them, hats
   and air above. hue is how much wider the palette swings on a record than on
   a sentence; it widens the range travelled without moving any faster, because
   the hue that feeds it is smoothed and a faster palette is how a visualiser
   becomes something nobody can look at. */
/* roles: 0. OFF, and not as a tuning -- as a verdict.

   Giving each band its own behaviour is a good idea that this field will not
   take, and the reason is structural rather than a matter of degree. Index is
   angle here, so a band is an ARC, and any force that is not the same all the
   way round moves one arc relative to the others:

     tangential   a torque. It does not snap the arc, it carries it. Measured,
                  the snare group turned 3.6 degrees a second while the other
                  two sat at nothing, and ring density went from 78-130% of
                  even to 48-145% -- half of it piling up, half emptying. That
                  is the thin bottom.
     alternating  nearly cancels, and only nearly: 1.2 degrees a second left,
                  because the force cap clips the two directions differently
                  once particles sit at different radii.
     inward       cannot rotate anything, and is worse: 41-186%, because a pull
                  that strong drags that arc through the middle and scatters it
                  out the far side.

   With them off, ring density under music is 87-125% -- more even than the
   resting field's own 75-138%, because the spectrum spreads it. Nothing about
   the ring is wrong any more.

   The code stays, because a much gentler version driven off something that is
   not a force -- dot size, or brightness, which cannot transport anybody -- is
   probably the right shape for this idea. Raising kick/snap/hat turns what is
   here back on. */
const MUSIC_VIS = { low: 9, mid: 26, roles: 0, kick: 1.8, snap: 1.5, hat: 0.9, hue: 0.15 };

/* THE SLOW CLOCKS.

   radius and shape are the two that change what the thing IS rather than how
   hard it is reacting, so putting them on slow clocks makes a record play as a
   sequence of looks instead of one look bouncing. Both are already sliders and
   both keep working as sliders: these ride ON TOP of whatever they are set to
   and fade back to exactly that when the music stops.

   There was already a drift like this on shape -- `wander`, two sines at 7.3
   and 11.9 seconds -- and it has never been visible during music because it is
   multiplied by `rest`, which is cut to nothing the moment anything is loud. It
   is a resting-state idle. This is the loud-state one.

   Shape does not need bouncing off its ends: buildShapeLut takes its index
   modulo the number of shapes, so the list is a ring and a big swing simply
   travels round it -- circle, triangle, square, pentagon, hexagon, star,
   rosette, mouth, and back to circle.

   Two rates on shape and a third on radius, none of them a multiple of another,
   so the pair never lines up the same way twice: 41s, 67s and 53s take about
   forty minutes to repeat. That is the difference between a pattern and a
   loop. */
const DRIFT = {
  // 1 to run these all the time rather than only under music
  always: 0,
  /* rms -> size, not radius. You said RMS size and shape and I drifted radius,
     which is a different slider that happens to also change how big it is. This
     is the one: how much the level opens the ring, rather than how big the ring
     is to begin with. */
  rmsLo: 0.62, rmsHi: 1.45, rmsSec: 53,
  /* And a fraction of what it was. At 3.6 the drift swamped the slider, which
     is why moving shape stopped appearing to do anything -- it was still being
     added, it was just the small term. At 1.1 the slider sets the shape and
     this wanders around it. */
  shapeAmp: 1.1, shapeA: 41, shapeB: 67
};
const music = {
  el: null, an: null, gain: null, freq: null, time: null, prev: null,
  raw: new Float32Array(BANDS),
  list: null, i: -1, playing: false, title: "", unlocked: 0,
  // why the last attempt produced no music, so the page can say which
  err: "",
  // 1 when the dance started it, so the dance can stop it again
  byDance: 0,
  scale: 0, spectrum: new Float32Array(BANDS), turbulence: 0, impulse: 0, hue: 0,
  // beat: a second of low-band energy history, and the intervals it has seen
  /* Every master is different, and a visualiser with fixed numbers in it shows
     some tracks and not others. Measured across these five, playing each one
     through the real page: Yoga Pants drove the spectrum to 31 and the level to
     0.70, Heat Waves to 10 and 0.49, Cosmic to 2.6 and 0.07 -- and Heat Waves
     has the LOUDEST RMS of the five, so this is not about volume. It is a warm,
     filtered mix with little at the top, and half the bands sit up there.

     So the music path gets what the microphone path has always had and the
     voice path never needed: a reference it follows. The voice is one rendered
     speaker and can be measured against fixed numbers; five records cannot.
     Each track is normalised against its OWN recent loudest moment, so every
     one of them reaches the top of the range on its choruses. */
  refDb: -14, specRef: 0.42,
  /* Ten seconds of loudness history, and the reference is a high percentile of
     it. A decaying maximum was the obvious thing and it does not work: it can
     only fall at whatever rate you pick, so it is either too slow to reach a
     quiet record (a decibel a second needs sixteen seconds to find Heat Waves,
     which is fifteen seconds of a dead visualiser) or fast enough to pump on
     every bar. A window has no rate at all -- it is simply right, ten seconds
     late, and ten seconds is one chorus. */
  hist: new Float32Array(600), histAt: 0, histN: 0, sortBuf: new Float32Array(600),
  hit: new Float32Array(BANDS),
  eHist: new Float32Array(60), eAt: 0, lastBeat: 0, ivs: [], bpm: 0, bpmSaid: 0,
  // the tempo the dance is currently stretched to, so a change can be noticed
  bpmApplied: -1
};

async function musicList() {
  if (music.list) return music.list;
  music.list = [];
  music.listErr = "";
  try {
    const r = await fetch(MUSIC_DIR + "manifest.json", { cache: "no-store" });
    if (!r.ok) music.listErr = "music/manifest.json returned " + r.status;
    else {
      const j = await r.json();
      const arr = Array.isArray(j) ? j : (j && j.tracks) || [];
      music.list = arr.filter((t) => t && t.file);
      if (!music.list.length) music.listErr = "music/manifest.json lists nothing";
    }
  } catch (e) {
    music.listErr = "could not read music/manifest.json (" + (e && e.message || "failed") + ")";
  }
  return music.list;
}

/* Half a millisecond of silence, as a file.
   An audio element on iOS is not allowed to play until it has been played once
   inside a real gesture, and there is no gesture anywhere near "play some
   music" -- by then the only thing that happened was a person talking, which
   Safari does not count and should not. So the element is started and stopped
   on something inaudible at the moment somebody taps the microphone, and from
   then on it will start when it is asked to. */
const SILENCE = "data:audio/wav;base64,UklGRqQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YYAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==";
function musicUnlock() {
  musicWire();
  if (!music.el || music.unlocked) return;
  music.unlocked = 1;
  try {
    music.el.src = SILENCE;
    const p = music.el.play();
    if (p && p.then) p.then(() => { try { music.el.pause(); } catch (e) {} }, () => {});
  } catch (e) { /* a browser that did not need this is not a problem */ }
}

/* Any first touch, not just the microphone.

   The microphone tap is a gesture and it was already being spent on the audio
   context -- but the AUDIO ELEMENT is gated separately and did not exist yet at
   that moment, so it never got its turn. That is the whole bug: the context was
   unlocked and running, speech was working, and the one object that needed the
   tap was created several minutes later by a sentence. Take the first touch
   anywhere, whatever it lands on. */
["pointerdown", "touchstart", "mousedown", "keydown"].forEach((ev) =>
  addEventListener(ev, function once() {
    ["pointerdown", "touchstart", "mousedown", "keydown"].forEach((e2) =>
      removeEventListener(e2, once, true));
    try { musicUnlock(); } catch (e) {}
  }, true));

function musicWire() {
  ensureTtsCtx();
  if (music.an || !ttsCtx) return;
  if (!music.el) {
    music.el = new Audio();
    music.el.preload = "auto";
    music.el.crossOrigin = "anonymous";
    music.el.addEventListener("ended", () => { if (music.playing) musicPlay(music.i + 1); });
  }
  const an = ttsCtx.createAnalyser();
  an.fftSize = 2048; an.smoothingTimeConstant = 0.5;
  /* Once per element, ever. createMediaElementSource re-routes the element
     away from the speakers into the graph, and calling it twice throws. */
  const src = ttsCtx.createMediaElementSource(music.el);
  const g = ttsCtx.createGain();
  g.gain.value = 0.75;
  src.connect(an); an.connect(g); g.connect(ttsCtx.destination);
  music.an = an; music.gain = g;
  music.freq = new Uint8Array(an.frequencyBinCount);
  music.prev = new Float32Array(an.frequencyBinCount);
  music.time = new Float32Array(an.fftSize);
}

async function musicPlay(which) {
  music.err = "";
  const list = await musicList();
  if (!list.length) {
    /* Two different failures used to read as one line, and the one it printed
       was the wrong one: "nothing in music/ yet" for a shelf that was full and
       a browser that had refused to start it. */
    music.err = music.listErr || "nothing listed in music/manifest.json";
    return "";
  }
  let idx;
  if (typeof which === "number") idx = ((which % list.length) + list.length) % list.length;
  else if (which) {
    const q = String(which).toLowerCase().trim();
    const f = list.findIndex((t) =>
      (t.title || "").toLowerCase().includes(q) || (t.file || "").toLowerCase().includes(q));
    idx = f >= 0 ? f : (Math.random() * list.length) | 0;
  } else idx = (Math.random() * list.length) | 0;
  musicWire();
  if (!music.el) { music.err = "no audio output on this browser"; return ""; }
  const t = list[idx];
  music.i = idx;
  music.el.src = MUSIC_DIR + t.file;
  // one track on the shelf means that track on repeat, gaplessly, rather than
  // an `ended` and a reload every few minutes
  music.el.loop = list.length === 1;

    if (ttsCtx && ttsCtx.state === "suspended") await ttsCtx.resume();
    await music.el.play();
  } catch (e) {
    music.err = music.unlocked
      ? "the browser would not start it (" + (e && e.name || "blocked") + ")"
      : "tap the mic once first — this browser needs a tap before it will play audio";
    return "";
  }

  music.title = t.title || t.file.replace(/\.[a-z0-9]+$/i, "").replace(/[_-]+/g, " ");

  music.bpmSaid = +t.bpm || 0;
  music.bpm = music.bpmSaid;
  music.ivs.length = 0; music.lastBeat = 0; music.bpmApplied = -1;
  // a new record is a new reference, or the last one's loud parts set the bar
  music.refDb = -14; music.specRef = 0.42; music.histAt = 0; music.histN = 0;

}
function musicStop() {
  if (music.el) music.el.pause();
  music.playing = false; music.byDance = 0; music.bpmApplied = -1;
  // back to its own speed, or he keeps dancing to a tempo that is not there
  if (gl.action) gl.action.setEffectiveTimeScale(1);
}

/* The same numbers the voice produces, from the same kind of analyser, so the
   orb reacts to a track exactly the way it reacts to a sentence -- plus the
   one thing a sentence does not have. */
function analyseMusic() {
  if (!music.playing || !music.an) return;
  /* `playing` is the INTENT, and only musicStop clears it. Reading it off the
     element instead meant the gap between one track ending and the next
     starting counted as the music being off -- and the dance, which asks
     whether music is playing to decide how fast to run, fell back to its own
     speed for a clip and then stayed there. */
  if (music.el && music.el.paused) return;
  music.an.getByteFrequencyData(music.freq);
  music.an.getFloatTimeDomainData(music.time);

  let sum = 0, zc = 0, last = music.time[0];
  for (let i = 0; i < music.time.length; i++) {
    const v = music.time[i]; sum += v * v;
    if ((v >= 0) !== (last >= 0)) zc++;
    last = v;
  }
  const rms = Math.sqrt(sum / music.time.length);
  const zcr = zc / music.time.length;
  const db = 20 * Math.log10(rms + 1e-7);
  music.hist[music.histAt % music.hist.length] = db;
  music.histAt++;
  if (music.histN < music.hist.length) music.histN++;
  /* The 92nd percentile rather than the maximum: one cymbal crash should not
     set the level the whole song is measured against. Recomputed every
     sixteenth frame, which is four times a second and far more often than a
     ten-second window can move. */
  if ((music.histAt & 15) === 0) {
    const nH = music.histN, buf = music.sortBuf.subarray(0, nH);
    buf.set(music.hist.subarray(0, nH));
    buf.sort();
    music.refDb = buf[Math.min(nH - 1, Math.floor(nH * 0.92))];
    if (music.refDb < -45) music.refDb = -45;
  }
  /* A FLOOR, NOT A LEVELLER, and this is the whole shape of the fix.

     Normalising every track to its own reference is the obvious reading of
     "make them all react" and it quietly breaks the ones that already worked:
     measured, Yoga Pants went from 0.78 to 0.36, because it is a dynamic
     master and its 92nd percentile sits well above its average. It did not
     need helping and it got levelled.

     So the reference only ever lifts. Whichever of the two readings is higher
     wins -- the fixed mapping the voice path has always used, or the track's
     own -- which leaves a well-behaved record exactly where it was and brings
     a quiet or filtered one up to meet it.

     Headroom on the normalised branch, too: the 92nd percentile is ordinary
     loudness, not a peak, so mapping it to 1.0 pins the orb open with nothing
     left for a chorus. It lands at 0.85. */
  const fixedLvl = (db + 52) / 34;
  const normLvl = (db - (music.refDb - MUSIC_RANGE)) / (MUSIC_RANGE / 0.85);
  let lvl = fixedLvl > normLvl ? fixedLvl : normLvl;
  if (lvl < 0) lvl = 0; else if (lvl > 1) lvl = 1;
  music.scale += (lvl - music.scale) * (lvl > music.scale ? cfg.attack : cfg.release);

  /* The same reference again, on the spectrum. A dull mix has to fill the ring
     as much as a bright one -- what the ring is showing is the SHAPE of the
     sound, and a shape drawn at a tenth of the size is not a quieter shape, it
     is an invisible one. Two passes, because the ceiling has to be known before
     anything is divided by it. */
  const N = music.freq.length;
  let sumB = 0;
  for (let b = 0; b < BANDS; b++) {
    const lo = Math.floor(Math.pow(b / BANDS, 2) * N);
    const hi = Math.max(lo + 1, Math.floor(Math.pow((b + 1) / BANDS, 2) * N));
    let acc = 0;
    for (let i = lo; i < hi; i++) acc += music.freq[i];
    const v = acc / (hi - lo) / 255;
    music.raw[b] = v;
    sumB += v;
  }
  /* Against the MEAN, not the ceiling. Scaling so the loudest band hits full
     was the obvious reading of "make every record fill the ring" and it is the
     wrong one: it drives most of the other sixty-three bands up with it, and
     the ring radius is per band -- so the whole thing inflates into one fat
     green doughnut with no shell and no gap, which is not a louder orb, it is
     a different and worse object. The average band is what the shape is made
     of, so that is what gets held steady. */
  const meanB = sumB / BANDS;
  if (meanB > music.specRef) music.specRef += (meanB - music.specRef) * 0.25;
  else music.specRef -= 0.002;
  if (music.specRef < 0.02) music.specRef = 0.02;
  // and the same on the spectrum: never below 1, so a bright master keeps its
  // own shape, and capped, so a dull one is lifted rather than turned to snow
  const sg = Math.max(1, Math.min(2.4, MUSIC_SPEC / music.specRef));
  for (let b = 0; b < BANDS; b++) {
    const nb = Math.min(1, music.raw[b] * sg);
    /* The onset in this band: how far it has jumped ABOVE its own smoothed
       self. Level cannot tell a kick from a bass note held through the bar --
       both are simply energy down there -- and what a drum is, is the jump.
       Held with a fast decay so a hit is a shape in time rather than one
       frame nobody sees. */
    const rise = nb - music.spectrum[b];
    const h = rise > 0 ? Math.min(1, rise * 3.4) : 0;
    music.hit[b] = h > music.hit[b] ? h : music.hit[b] * 0.82;
    music.spectrum[b] += (nb - music.spectrum[b]) * 0.35;
  }
  let cn = 0, cd = 0, flux = 0;
  for (let i = 0; i < N; i++) {
    const val = music.freq[i] / 255;
    cn += i * val; cd += val;
    const diff = val - music.prev[i];
    if (diff > 0) flux += diff;
    music.prev[i] = val;
  }
  let centroid = cd > 0.001 ? cn / cd / N : 0;
  centroid = (centroid - 0.03) / 0.20;
  if (centroid < 0) centroid = 0; else if (centroid > 1) centroid = 1;
  const g = Math.min(1, Math.max(0, (music.scale - cfg.gateFloor) / 0.12));
  music.hue += (centroid * g - music.hue) * 0.06;
  music.turbulence += (Math.min(1, zcr * 26) * g - music.turbulence) * 0.16;
  music.impulse = Math.max(music.impulse * 0.86, Math.min(1, flux * 0.05) * g);

  /* THE BEAT. Energy in the bottom of the spectrum against its own recent
     average: a kick is a large brief rise in a band a voice does not live in.
     A ratio rather than a threshold, so it works on a quiet track and a loud
     one; a refractory period, because one kick spread over three frames is one
     beat; and the tempo is the MEDIAN interval rather than the mean, because a
     detector that misses a beat produces one double-length interval and a mean
     swallows it whole. */
  let lowE = 0;
  for (let i = 0; i < 24; i++) { const v = music.freq[i] / 255; lowE += v * v; }
  lowE /= 24;
  let mean = 0;
  for (let i = 0; i < music.eHist.length; i++) mean += music.eHist[i];
  mean /= music.eHist.length;
  music.eHist[music.eAt++ % music.eHist.length] = lowE;
  const now = performance.now();
  if (lowE > mean * 1.45 && lowE > 0.004 && now - music.lastBeat > 240) {
    if (music.lastBeat) {
      const iv = now - music.lastBeat;
      if (iv < 1500) { music.ivs.push(iv); if (music.ivs.length > 32) music.ivs.shift(); }
    }
    music.lastBeat = now;
    if (!music.bpmSaid && music.ivs.length >= 8) {
      const srt = music.ivs.slice().sort((a, b) => a - b);
      let t = 60000 / srt[srt.length >> 1];
      /* Folded into the octave a person would tap. A detector counting every
         hi-hat as well as every kick reports a tempo two or four times the one
         anybody is dancing to -- Cosmic came out at 190 -- and since this
         number's only job is to stretch a dance to fit, being an octave out is
         worse than being a little off. */
      while (t > 150) t /= 2;
      while (t < 65) t *= 2;
      music.bpm = t;
    }
  }

  /* And whatever is dancing gets the tempo the moment it is known, rather than
     at the next hand-off. The first dance starts before the track has even
     loaded, and a measured tempo needs a few seconds of kicks to settle, so
     waiting would leave the opening ten seconds -- the ten seconds anyone is
     actually watching -- running free. Changing a timeScale mid-clip costs
     nothing: it is a speed, not a position, so nothing jumps. */
  if (world.seq && gl.action && Math.abs(music.bpm - music.bpmApplied) > 0.5) {
    music.bpmApplied = music.bpm;
    const c = gl.clips && gl.clips[world.act];
    if (c) gl.action.setEffectiveTimeScale(beatWarp(c.duration));
  }
}

/* Dancing TO it rather than NEAR it.

   A clip has its own length and the track has its own beat, and there is no
   reason for them to agree. Stretch the clip by the smallest amount that makes
   its length a whole number of beats, and every repeat lands on one -- which is
   most of what "in time" looks like, without touching the choreography.

   Clamped, because past about a fifth either way it stops being the same dance:
   a flare at 1.3x is a blur and a k-kick at 0.8x is a man wading. Outside the
   clamp it plays at its own speed and simply is not in time, which looks better
   than the alternative. */
function beatWarp(dur) {
  if (!music.playing || !music.bpm || !dur) return 1;
  const beat = 60 / music.bpm;
  /* Over a RUN of the clip, not one pass of it. The flares is 1.03s, and at 92
     BPM one pass wants to be either 1 beat (a 58% speed-up) or 2 (a 21%
     slow-down) -- both far enough to wreck it, so it ran free and off the
     beat. Four passes want to be 6 beats, which is a 5% stretch. Every fourth
     landing is still a landing, and a phrase that comes round every six beats
     is a phrase; what it is not is drift.

     Clips are held for several passes anyway (see MIN_HOLD), so this costs
     nothing. The smallest stretch that fits wins, and if none fits inside the
     clamp it runs at its own speed, which looks better than a blur. */
  let best = 1, bestErr = 1e9;
  for (let reps = 1; reps <= 4; reps++) {
    const total = dur * reps;
    const beats = Math.max(1, Math.round(total / beat));
    const r = total / (beats * beat);
    if (r < 0.88 || r > 1.14) continue;
    const err = Math.abs(Math.log(r));
    if (err < bestErr) { bestErr = err; best = r; }
  }
  return best;
}

let ttsGen = 0;
async function playReply(text) {
  if (!brain.url) return false;
  try {
    const res = await fetch(new URL("/speak", brain.url), {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ text, voice: brain.voice || undefined })
    });
    if (!res.ok) {
      // 501 just means no voice key is set; anything else is worth showing
      if (res.status !== 501) caption(null, "voice: " + (await res.text()).slice(0, 160));
      return false;
    }
    // A non-audio 200 -- an error page, a redirect, an HTML shell -- otherwise
    // fails deep inside decodeAudioData as "Unable to decode audio data",
    // which says nothing about what actually came back.
    const ctype = res.headers.get("content-type") || "";
    if (!/audio|octet-stream/i.test(ctype)) {
      caption(null, "voice: expected audio, got " + (ctype || "no content-type"));
      return false;
    }
    ensureTtsCtx();
    /* Resumed here, every time. iOS suspends an AudioContext whenever the page
       loses focus, and a permission dialog counts -- so the context built during
       the tap was already asleep by the time the first sentence tried to play,
       and the sentence failed. Resuming is free when it is already running. */
    if (ttsCtx.state === "suspended") { try { await ttsCtx.resume(); } catch (e) {} }
    const audio = await ttsCtx.decodeAudioData(await res.arrayBuffer());
    if (ttsSrc) { try { ttsSrc.stop(); } catch (e) {} }
    ttsSrc = ttsCtx.createBufferSource();
    ttsSrc.buffer = audio;
    ttsSrc.connect(ttsAn);

       stopped. Interrupting one -- which happens whenever a second line starts
       before the first has finished -- fires the OLD source's onended, and that
       switched the ears back on in the middle of the new sentence. He then
       heard himself say "say pages" and opened the pages.

       That is the whole of the "it goes to pages on its own" bug, and the
       answer to "is he registering his own word": he was. */
    const gen = ++ttsGen;
    ttsSrc.onended = () => {
      if (gen !== ttsGen) return;            // a clip that was cut short
      ttsPlaying = false; ttsText = "";

         accumulating a transcript of his own voice for the whole reply, and
         that transcript is still sitting in the engine -- left alone it arrives
         as a finished sentence a moment later and gets answered. Aborting drops
         it on the floor, which is where it belongs. */
      lastHeard = "";
      echoUntil = performance.now() + cfg.echoTail;

      setTimeout(resumeSTT, cfg.echoTail);

       his own voice and none of it is acted on -- the only question asked of it
       is whether the words are his. Deaf, he cannot be interrupted at all. */

    bargeFrom = performance.now() + BARGE.grace;
    if (cfg.barge >= 1) { if (sttPaused) resumeSTT(); } else pauseSTT();

  } catch (err) {
    caption(null, "voice failed: " + err.message);
    return false;
  }
}

   doing it -- and the result was that the most theatrical thing this does
   happened in total silence. So the page keeps a few lines of its own and puts
   them through the same voice, which means the field reacts to them like any

   about a thing that just happened on screen. */

  remarkLast = k;

   changed their mind about since.

   waiting to be removed -- it is what makes this work the moment it deploys,
   with no database to create and no dashboard to visit, and it is what keeps
   it working if the shared shelf is ever unbound. Every turn sends what this
   browser knows and gets back anything new, and the worker merges its own copy
   in on the way past, so the two converge without either being in charge.

   time. Who is in the room is a different question from what they told you,

   one that greets the wrong person. */

    const seen = new Set(have.map((m) => String(m.s).toLowerCase()));
    for (const f of facts) {
      const t = String(f || "").trim().slice(0, 400);
      if (!t || seen.has(t.toLowerCase())) continue;   // said twice, known once
      seen.add(t.toLowerCase());

   Two ways in. The explicit one works whenever it is said, so you can rename
   yourself later; the bare one -- somebody simply saying "Colin" -- only counts
   in the beat after being asked, because on its own a single word is far more
   likely to be a command than an introduction.

   The stop list is doing real work in both. "I'm not sure" would otherwise
   introduce a man called Not, and after "who are you" the honest answers are
   mostly refusals -- nobody, why, none of your business -- none of which should
   be written down and read back for ever. */
const NOT_A_NAME = new Set(("yes no yeah nope hello hi hey nobody none nothing " +
  "who what why how when where sure okay ok fine good great well stop home back " +
  "pages menu gallery images pictures site exit quit cancel wait hold dunno " +
  "whatever guest human person friend someone anyone me you it us them thing " +
  "not just going trying looking sorry here again repeat still gonna kind sort " +
  "later tomorrow tonight soon please maybe raining fine cold hot " +
  "sir madam mate man dude buddy boss god the a an my your his her our their").split(" "));
/* Two tiers, because the introducers are not equally sure of themselves.

   STRONG ones are never said casually -- nobody says "my name is" or "call me"
   about anything but a name -- so they count whenever they are said, which is
   what lets somebody rename themselves later in a conversation.

   man called Raining, and "I'm just looking" a man called Just. They only count
   in the beat after being asked, where the sentence is an answer to a question
   about a name and nothing else.

   every non-letter with a space, so by the time a sentence reaches here "i'm
   colin" is "i m colin". Written with the apostrophes in -- which is how this
   went out the first time -- neither form ever matched anything. */
const NAME_STRONG = /\b(?:my name is|my name s|the name is|name is|call me)\s+([a-z][a-z-]{1,15})\b/;

  let m = NAME_STRONG.exec(flat);

  if (bare) {
    m = NAME_SOFT.exec(flat);
    if (m) { const n = cleanName(m[1]); if (n) return n; }
  }
  // bare: only right after being asked, and only if the whole thing is a name
  if (bare) {
    const w = flat.split(" ").filter(Boolean);
    if (w.length === 1) return cleanName(w[0]);
    // "colin willow" -- take the first, which is what he will be called
    if (w.length === 2 && !NOT_A_NAME.has(w[0])) return cleanName(w[0]);
  }

}

       the one that asks LAST is the one that keeps it -- which is why the
       analyser used to go dead the moment recognition started, and why granting
       a THIRD time, after recognition was already running, was what fixed it.
       Both prompts still happen, but in the order that survives, and inside the
       same tap. */
    if (talkPref && !recOn) {

         reading a permission dialog, and a second and a half is not long enough
         to read one -- so the wait timed out with the first dialog still open
         and getUserMedia was called into the middle of it. That is the "asks,
         fails, asks again, works" sequence: the second request arrived while
         the first was unanswered, failed, and had to be made again afterwards.
         recReady resolves on the grant, on a refusal, or on the timeout. */
      await recReady(9000);
    }
    await openAnalyser();
    micBig.classList.add("off");
    micBtn.textContent = "mic";

/* Coming back to it. iOS suspends an AudioContext the moment the app goes to
   the background and does not resume it on return -- the analyser then reads a
   dead stream and the orb sits there deaf with the mic button still saying
   live. Speech recognition is stopped outright, and its onend restart is not
   reached because the page was hidden when it fired.

   Everything here is a resume rather than a request: the permission is still
   granted, so none of it needs another gesture. Only a track that has actually
   ENDED does, and that is worth saying rather than silently doing nothing. */
function wake() {
  if (document.visibilityState !== "visible") return;
  if (A && A.ac && A.ac.state === "suspended") A.ac.resume();
  if (ttsCtx && ttsCtx.state === "suspended") ttsCtx.resume();
  if (A && A.stream && A.stream.getAudioTracks().some((t) => t.readyState === "ended")) {
    micState = "denied"; A = null;
    micBig.classList.remove("off"); micBig.style.animation = "";
    micBtn.style.display = ""; micBtn.textContent = "retry mic";
    caption("", "the mic was released while this was in the background — tap to start it again");
    return;
  }
  /* Recognition stops on its own the moment the app goes to the background, and
     its onend restart cannot run while hidden. Coming back is the moment to
     start it again -- through the same backing-off path as everything else,
     and with a beat first, because the engine is not ready the instant the app
     is foregrounded. */
  if (recOn && rec && !sttPaused) { recRunning = 0; recKick(350); }
}
document.addEventListener("visibilitychange", wake);
