     smear; a particle still on the rim wants all of it, or the perimeter freezes
     into a dead circle for as long as the word is up -- which looks worse than
     no perimeter at all. */
  const hold = 1 - formT;   // audio keeps running, it just stops smearing the shape
  /* And it blooms with the sound rather than running flat out. Quiet room, it
     is barely there and the orb is the orb; talk to it and the pattern opens.
     That difference IS the reaction -- without it a muse is a thing that
     happens to be playing while you speak. */
  const muAmt = muses.amt * cfg.muse * (0.22 + 0.78 * Math.min(1, drive.scale * 3.2));
  const muHeld = muAmt * hold;
  const turbFree = drive.turbulence * cfg.turbGain, turb = turbFree * hold;
  const kickFree = drive.impulse * cfg.impulseGain * pull, kick = kickFree * hold;
  /* The membrane is a spring toward the ring surface, and at rest it is the
     strongest thing in here -- a star 300px out gets nearly 2px/frame of inward
     pull, which is why the first shells expanded, sprang back, and hung on the
     silhouette. It has to come off with the ring, not just be outrun. */
  /* And it comes ON with the sound. The membrane is what ties the cloud to the
     ring, so it is also what makes the cloud breathe when the ring does -- at
     0.1 the particles are loose enough to drift beautifully and far too loose
     to follow. Measured against a fixed syllable train, raising it alone very
     nearly doubles every reaction the field has: median distance swing 27.7% to
     52.8%, per-frame motion 5.5% to 13.8%. That is the whole of what went
     missing, and no other parameter moves those numbers more than a few
     percent. Additive on level, so a quiet room keeps whatever slack it was
     tuned with and only a voice pulls the field taut. */
  /* Where the small orb is this frame, in screen pixels, and how big. Its
     place is a world position -- behind and above him -- so it goes through the
     same projection everything else does, and the perspective divide comes back
     out as part of its scale, so it shrinks with distance like a real object. */
  orbK = 0;
  if (rig.on && rig.R && gl.ready && rig.orbFrom < 1e8) {
    const fo = rig.R.fit, H1o = figH1();
    const ow = [world.x, (fo.lo[1] - fo.c[1]) + ORB.y * H1o, world.z + ORB.z * H1o];
    const kk = scale * formS;
    const oxw = ow[0] * fo.k * kk, oyw = -ow[1] * fo.k * kk, ozw = -ow[2] * fo.k * kk;
    const cyw3 = Math.cos(view.yaw), syw3 = Math.sin(view.yaw);
    const pit3 = view.pitch * formT;
    const cpt3 = Math.cos(pit3), spt3 = Math.sin(pit3);
    const FOC3 = scale * 1.7;
    const rx3 = oxw * cyw3 + ozw * syw3;
    let rz3 = -oxw * syw3 + ozw * cyw3;
    const ry3 = oyw * cpt3 - rz3 * spt3;
    rz3 = oyw * spt3 + rz3 * cpt3;
    const pp3 = FOC3 / Math.max(FOC3 * 0.25, FOC3 + rz3);
    /* The orb LIFTS out of the field rather than appearing in place. At the
       start of the build the block is the field -- same centre, same radius,
       so its particles are indistinguishable from their neighbours -- and it
       rises to its own place behind him as he finishes.

       This is not a flourish. The block gains and loses particles as `built`
       moves, and a particle handed across a boundary between two frames that
       are hundreds of pixels apart does not travel: the containment wall finds
       it far outside itself and projects it onto the ellipse, which is a
       teleport. Measured at the deconstruct it was 235 px on one frame, in the
       middle of the transition the whole thing is judged on. With the two
       frames converging as the hand-off happens there is nowhere to jump to. */
    const oH = rig.built || 0;
    orbCX = cx + rx3 * pp3 * oH; orbCY = cy + ry3 * pp3 * oH;
    orbK = 1 + (ORB.k * pp3 - 1) * oH;
    // and its clock eases in with it, so that while the block is still sitting
    // in the field its particles run at exactly the field's speed
    orbT = 1 + (ORB.tempo / orbK - 1) * oH;
  }
  else orbT = 1;
  const membNow = cfg.membrane + drive.scale * cfg.membGain;
  const membFree = membNow * pull, memb = membFree * hold;

  physAcc += dt;
  let steps = 0;
  while (physAcc >= STEP && steps < 4) {
    physAcc -= STEP; steps++; frame++;
    for (let i = 0; i < n; i++) {
      // the core sits out the ring entirely: no spectrum, no shape, no membrane
      // and no kick, so it holds while the silhouette works. It still breathes,
      // because gScale is loudness. It does not sit out a shell, though --
      // everything launches, or a fifth of the field stays home as a bright
      // lump in the middle of the explosion.
      const isCore = !bs && pr[i] < cfg.core;
      const held = formOn[i] === 1;            // is this one holding the shape
      /* An orb particle is a FREE particle whose ring happens to be smaller and
         somewhere else. fT of zero is what makes that true: no formation pull,
         no formation force budget, no snap, and a z target of zero, which is
         what keeps it flat in the screen plane exactly as the big one is. It
         stays `held`, though, so it does not join the arch the free ones make
         around a shape. */
      const isOrb = orbK > 0 && i >= rig.orbFrom;
      const fT = isOrb ? 0 : held ? (rig.on ? formT * figGate(i, 0) : formT) : 0;
      /* Index IS angle in this field -- particle i sits at i/n of the way round
         -- and the orb is a contiguous block of indices at the end. Taken as
         given, it inherits an ARC of the ring rather than a ring, and its
         spectrum is whichever bands that arc happens to cover. Measured: it
         came out as a solid vertical lozenge 33px wide. Its own local fraction
         puts it all the way round and gives it the whole spectrum. */
      const lf = isOrb ? (i - rig.orbFrom) / (n - rig.orbFrom) : i / n;
      let ringR;
      // kept for the band roles further down, which need to know which part of
      // the song this particle is standing in
      let mBand = -1;
      if (isCore) {
        ringR = baseR * gScale * cfg.coreR;
      } else {
        const band = (lf * BANDS) | 0;
        mBand = band < BANDS ? band : BANDS - 1;
        const sk = (lf * SHAPE_N) | 0;
        ringR = (baseR * gScale + drive.spectrum[band < BANDS ? band : BANDS - 1] * baseR * cfg.specGain)
                * shapeLut[sk < SHAPE_N ? sk : SHAPE_N - 1];
      }
      /* One multiplier for everything that scales the ring, because the
         membrane is a spring toward the ring surface and it has now quietly
         undone two separate features by not knowing about them. Anything that
         moves the target has to move `surf` with it or it is simply sprung
         back to where it would have been. */
      let ringMul = 1;
      if (ringR > maxR) ringR = maxR;
      // bloom 1 = original (sine swings through zero, target crosses centre)
      // bloom 0 = stable ring. Anything below ~0.6 lets audio actually read.
      // and its direction comes from that fraction too, or it is still an arc
      let ux = bx[i], uy = by[i];
      if (isOrb) { const aa = lf * TAU; ux = Math.cos(aa); uy = Math.sin(aa); }
      /* The muse moves the target and nothing else, which is why none of them
         had to know about the shape, the membrane, the wall or the colour. */
      const mu = held ? muHeld : muAmt;
      if (mu > 0.001 && !isCore) {
        const ang = i * TAU / n;
        const spc = drive.spectrum[(i * BANDS / n) | 0];
        muse(muses.b, i, ang, tt, drive.scale, drive.impulse, spc);
        let dR = muR, dA = muA;
        if (muses.mix < 1) {
          muse(muses.a, i, ang, tt, drive.scale, drive.impulse, spc);
          dR += (dR - muR) * -(1 - muses.mix); dA += (dA - muA) * -(1 - muses.mix);
        }
        ringMul *= 1 + (dR - 1) * mu;
        if (dA) {
          const ca = Math.cos(dA * mu), sa = Math.sin(dA * mu);
          ux = bx[i] * ca - by[i] * sa; uy = bx[i] * sa + by[i] * ca;
        }
      }
      /* Bloom smears each particle's target across a range of radii, which is
         what gives the resting orb its depth -- and which sands off anything
         with radial structure. Three concentric shells inside a 0.43 bloom come
         out as one thick restless band. Damped in proportion to how much muse
         is running. */
      ringR *= ringMul;
      // bloom scatters a target across radii, which is depth on a ring and just
      // noise on an arc
      const bl = cfg.bloom * (1 - mu * 0.8) * (held ? 1 : 1 - formT * 0.85);
      /* And a fixed offset per particle, or the wave has a place where every
         particle agrees -- which is a knot.

         `ph` multiplies the FREQUENCY, so this is a chirp along the index: fine
         and shimmering at high index, slower and slower toward low index, and
         at index 0 the argument is exactly 0 for ever. Index 0 is angle 0 is
         three o'clock, so a few hundred particles there sat at one static
         radius while the rest of the ring was smeared across many -- a dense
         coherent lump at the right of the orb with a trail of dots running out
         of it, in every screenshot, at every setting, for the life of the
         project. Nothing there was clumping. Everything else was spreading.

         The offset gives the chirp no anchor. It costs nothing anywhere else:
         a fixed phase per particle is what bloom already is. */
      /* Radially, and with no anchor. Two things were wrong and they made the
         same lump.

         `ph` multiplied the FREQUENCY, so this was a chirp along the index:
         fine and shimmering at high index, slower and slower toward low index,
         and at index 0 the argument was exactly 0 for ever. Index 0 is angle 0
         is three o'clock. A fixed offset per particle gives the wave nowhere
         that every particle agrees.

         And x and y were smeared independently, which is an ELLIPTICAL scatter,
         not the radial one this is for. Independent axes mean the mean radius
         depends on the angle -- larger on the diagonals, where two draws are
         averaged, than on the axes, where there is only one -- and the particles
         chase those targets through a capped force, so they lag and pool where
         the flow is slowest. Measured off the lit pixels: 1.72x the mean
         density at four o'clock, against 1.33x now, and what is left is a clean
         top-to-bottom symmetry that comes from the containment wall matching a
         tall screen.

         The chirp is kept, because the chirp IS the depth -- a particle whose
         target moves slowly follows it and spreads across the band, one whose
         target moves fast cannot and hovers near the middle of it, and the ring
         having both is what makes it look thick rather than drawn. It is drawn
         per particle now instead of read off the index, so the same mixture is
         scattered through the field rather than laid out around it: slow ones
         at three o'clock and fast ones everywhere else was the lump. */
      const jit = hash(i + 7) * TAU;
      const sw = 900 * hash(i + 3);
      const sq = 1 - bl + bl * (0.6 * Math.sin(frame / cfg.rateX * sw + jit) +
                                0.4 * Math.sin(frame / cfg.rateY * sw * 1.7 + jit * 1.31));
      const sqx = sq, sqy = sq;
      const oCx = isOrb ? orbCX : cx, oCy = isOrb ? orbCY : cy;
      const oRk = isOrb ? orbK : 1;
      /* The orb stays ROUND. ex and ey are the mouth: ey carries a jaw term
         that doubles the vertical extent at full level, and ecc spreads or
         rounds the lips by spectral centroid -- all of which is why the big orb
         reads as something speaking rather than something pulsing.

         At a third of the size, behind his head, it does not read as a mouth.
         It reads as a circle being pulled into a tall thin slot, which is the
         crevice. Take the two of them out and the only reaction left is the one
         that was always the good one: ringR growing per particle with its own
         frequency band, and the membrane and the kick pushing along the radius.
         Those are radial in every direction, so it swells and breathes instead
         of gaping. */
      const oEx = isOrb ? 1 : ex, oEy = isOrb ? 1 : ey;
      let tx = oCx + ux * ringR * oRk * sqx * oEx;
      let ty = oCy + uy * ringR * oRk * sqy * oEy;
      /* The free particles part rather than surround. A ring big enough to
         encircle a word has to be as wide as the word is long, which means a
         huge circle round a small piece of text -- so the top half arches over
         it and the bottom half under it, and the word can stay small. The
         arch peaks in the middle because (1 - ux^2) is 1 there and 0 at the
         ends, which is the shape a brow makes. */
      if (!held && formT > 0.002 && !isCore && !formKeepRing) {
        /* Walked along the arc, not taken from cos of the angle. cos bunches
           hard at both ends -- uniform angles are not uniform in x -- and the
           first version piled a third of the field into two lumps at the tips.
           Index maps straight to position instead: first half above, second
           half below, evenly across. */
        const two = (i * 2) / n;
        const lower = two >= 1;
        const e = (lower ? two - 1 : two) * 2 - 1;          // -1 .. 1 along the arc
        const clear = formHY * scale * formS + scale * 0.055;
        const arcX = cx + e * maxR * 0.95;
        const arcY = cy + (lower ? 1 : -1) * (clear + (1 - e * e) * maxR * 0.30);
        tx += (arcX - tx) * formT;
        ty += (arcY - ty) * formT;
      }
      if (fT > 0.002) {
        tx += (cx + formX[i] * scale * formS - tx) * fT;
        ty += (cy + formY[i] * scale * formS - ty) * fT;
        /* A menu of six identical circles is a diagram. Each satellite gets its
           own lobe count and its own drift, so they read as six live things
           rather than six instances of the same one -- and they breathe with
           the room, because everything else here does. */
        const g2 = menuGroup[i];
        if (g2 <= -2) {
          /* Straight lines are the least alive thing on the screen. Each arm
             gets a travelling wave across it, pinned at both ends by a sine
             envelope so it undulates rather than detaching. */
          const k2 = -g2 - 2;
          const a2 = -Math.PI / 2 + (k2 / MENU.length) * TAU;
          const ax2 = Math.cos(a2), ay2 = Math.sin(a2);
          const s3 = scale * formS;
          const along = ((tx - cx) * ax2 + (ty - cy) * ay2) / s3;
          const u3 = Math.max(0, Math.min(1, (along - 0.30) / 0.44));
          const env = Math.sin(u3 * Math.PI);
          const w2 = env * s3 * (0.045 + drive.scale * 0.09) *
                     Math.sin(u3 * 6.5 - tt * (1.6 + k2 * 0.23));
          tx += -ay2 * w2 * fT; ty += ax2 * w2 * fT;
        } else if (g2 >= 0) {
          const sxg = cx + menuAt[g2][0] * scale * formS;
          const syg = cy + menuAt[g2][1] * scale * formS;
          const dxg = tx - sxg, dyg = ty - syg;
          const ag = Math.atan2(dyg, dxg);
          /* Gentle, and slow. The particles chase this target through a spring,
             so a fast or deep wobble is not a wobble -- it is a target they
             never catch, and it draws as spikes. */
          const w = 1 + (0.09 + drive.scale * 0.20) * Math.sin(ag * (3 + g2) + tt * (0.22 + g2 * 0.06))
                      + 0.045 * Math.sin(ag * (5 + g2) - tt * 0.3);
          tx = sxg + dxg * w * fT + dxg * (1 - fT);
          ty = syg + dyg * w * fT + dyg * (1 - fT);
        }
      }
      /* z has no shape, no membrane, no wall and no mouse: it is only ever
         pulled toward a target, so one damped spring is the entire model. Its
         target is zero unless a 3D formation is holding, which is what keeps
         the flat orb exactly as flat as it was. */
      const tz = fT > 0.002 ? formZ[i] * scale * formS * fT : 0;
      vz[i] += (tz - pz[i]) * 0.020 - vz[i] * 0.20;
      pz[i] += vz[i];
      /* Orb particles are not hitting a mark, they ARE the ring, so they get
         the free field's force budget rather than a formation's. This is the
         whole difference between the two orbs: the steering below is a
         Reynolds one -- desired velocity minus current velocity, capped at
         maxF -- and that cap is what produces momentum, overshoot and settling,
         which is the swarming. Lend a particle six times the force and it
         arrives instantly instead, in lockstep with every other one. */
      const loose = isOrb ? 0 : 1;
      /* A smaller copy of a motion is a slower motion. Halve every distance and
         keep the same clock and every velocity halves with it -- measured, the
         small orb ran 0.148 px a step against the big one's 0.338, which is the
         size ratio and nothing else. Its relative tempo was already right (3.7
         against 4.22); what was wrong was that relative tempo is not what you
         see. You see pixels moving.

         So it runs a faster clock, in proportion to how much smaller it is.
         Scaling positions by k and time by k leaves velocity alone and divides
         acceleration by k, which is where these exponents come from: the
         desired speed and the force cap take one power of the tempo, and the
         membrane takes two because its push already carries a distance. This is
         also just true of small things -- a sparrow's wings beat faster than a
         swan's, and a sparrow moving at swan tempo reads as a model of a bird
         rather than a bird. */
      const oT = isOrb ? orbT : 1;
      // These particles are slow on purpose, which is lovely for a ring and
      // useless for hitting a mark. Lend them force while a shape is holding.
      const maxF = mSpd[i] * cfg.forceRatio * (1 + fT * 5 * loose) * pull * oT;

      const ddx = tx - px[i], ddy = ty - py[i];
      const dd = Math.sqrt(ddx * ddx + ddy * ddy) || 0.0001;
      let spd = mSpd[i];
      if (dd < 500) spd = (dd / 100) * mSpd[i];
      spd *= oT;
      let ax = (ddx / dd) * spd - vx[i];
      let ay = (ddy / dd) * spd - vy[i];
      const am = Math.sqrt(ax * ax + ay * ay);
      if (am > maxF) { ax = ax / am * maxF; ay = ay / am * maxF; }

      /* Radial, so it cannot hold an arc -- left on, it reels the two halves
         back into the circle they were just talked out of. It fades on the free
         particles as the shape forms and comes back with them. */
      const mb = held ? memb : membFree * (1 - formT), kk2 = held ? kick : kickFree;
      if (!isCore && (mb > 0.001 || kk2 > 0.01)) {
        /* In the orb's frame, not the field's. Both of these are RADIAL, and
           radial from where decides everything they do. Measured from the field
           centre a particle sitting in the middle of the orb reads as 200px out
           and almost straight up -- so the membrane, which is the strongest
           force at rest and the one carrying drive.scale, was shoving the whole
           orb up and down as a block instead of breathing it in and out. That
           is the reaction that was missing: it was there, pointed the wrong
           way. */
        const rx = px[i] - oCx, ry = py[i] - oCy;
        const rd = Math.sqrt(rx * rx + ry * ry) || 0.0001;
        let th = Math.atan2(ry, rx); if (th < 0) th += TAU;
        let s2 = ((th / TAU) * SHAPE_N) | 0; if (s2 >= SHAPE_N) s2 = SHAPE_N - 1;

        if (mb > 0.001) {
          const b2 = ((th / TAU) * BANDS) | 0;
          // sample the shape at the current angle too, otherwise the membrane
          // pulls everything back onto a circle and sands the corners off
          /* The membrane has to follow the muse or it undoes it. It is a spring
             toward the ring surface and it is the strongest force here at rest,
             so three concentric shells get sprung back onto one and the whole
             muse comes out as a slightly restless circle. */
          // ...and its own radius, for the same reason the target above has one
          let surf = (baseR * gScale + drive.spectrum[b2] * baseR * cfg.specGain) * shapeLut[s2] * ringMul * oRk;
          // radius of the ellipse at this angle, or the membrane rounds the lips
          // straight back off the way it used to round off the corners
          const elx = oEy * (rx / rd), ely = oEx * (ry / rd);
          surf *= oEx * oEy / Math.sqrt(elx * elx + ely * ely);
          if (surf > maxR * oRk) surf = maxR * oRk;
          const push = (surf - rd) * 0.02 * mb * oT * oT;
          ax += (rx / rd) * push; ay += (ry / rd) * push;
        }

        // The kick used to fire straight out from centre, identically in every
        // direction -- it can only inflate, never shape, which is why every
        // loud moment collapsed to the same oval. Fire it along the outward
        // normal of the shape instead, so a hit drives edges out as faces and
        // corners along their bisector, exaggerating the silhouette.
        // For P(t) = (r cos t, r sin t) the outward normal is
        // (r cos t + r' sin t, r sin t - r' cos t), which reduces to radial
        // when r' is 0, i.e. on a circle.
        if (kk2 > 0.01) {
          // Pushing every particle out by the SAME amount adds a constant to
          // r(theta), and adding a constant to a radial function is precisely
          // what rounds it toward a circle -- which is why every onset used to
          // collapse the silhouette. Scale each push by that particle's own
          // shape radius instead: pushing by c*r turns r into r*(1+c), a pure
          // dilation, so the outline stays similar to itself however hard it
          // is hit.
          const mag = 1 + (shapeLut[s2] - 1) * cfg.kickShape;
          ax += (rx / rd) * kk2 * 1.6 * mag * oT;
          ay += (ry / rd) * kk2 * 1.6 * mag * oT;
        }
      }

      if (bs) {
        // fades out as the ring takes over, or a shell leaves the whole field
        // sitting low and it spends the next five seconds climbing back
        ay += bs.gravity * k * (1 - back);
        // air. Drag is why a star decelerates and hangs at the top of its arc
        if (bs.drag) { ax -= vx[i] * bs.drag; ay -= vy[i] * bs.drag; }
      }

      /* THE BAND ROLES.

         Index is angle in this field and band is index, so frequency already
         runs round the ring -- the bass lives at one o'clock and the air at
         seven whether anybody asked for it or not. What was missing is that
         every band did the same THING with its energy: pushed the ring out a
         bit. So a record came out as one shape breathing, which reads as
         "reacting to sound" and not as reading a song.

         Three behaviours instead, on the onset rather than the level, because
         a bass note held through a bar is not a kick:

           bass   a heavy shove straight out and a slow settle -- the thump
           snare  a snap ALONG the ring, sideways, which the eye reads as a
                  crack rather than a swell because nothing else here moves
                  that way
           hats   fine fast jitter, small enough to shimmer rather than blur

         Only while music is playing, and faded in by drive.music, so a
         conversation is still the tempered thing it was. */
      if (MUSIC_VIS.roles && drive.music > 0.01 && mBand >= 0) {
        const h = drive.hit[mBand] * drive.music;
        if (h > 0.012) {
          if (mBand < MUSIC_VIS.low) {
            ax += ux * h * MUSIC_VIS.kick * oT;
            ay += uy * h * MUSIC_VIS.kick * oT;
          } else if (mBand < MUSIC_VIS.mid) {
            // see the note on MUSIC_VIS.roles for why none of these ship on
            ax -= ux * h * MUSIC_VIS.snap * oT;
            ay -= uy * h * MUSIC_VIS.snap * oT;
          } else {
            ax += (Math.random() - 0.5) * h * MUSIC_VIS.hat * oT;
            ay += (Math.random() - 0.5) * h * MUSIC_VIS.hat * oT;
          }
        }
      }

      const tb = held ? turb : turbFree;
      if (tb > 0.01) {
        ax += (Math.random() - 0.5) * tb * 2.4 * oT;
        ay += (Math.random() - 0.5) * tb * 2.4 * oT;
      }

      if (hasMouse) {
        const fx = mx - px[i], fy = my - py[i];
        const fd2 = fx * fx + fy * fy;
        if (fd2 < fr2 && fd2 > 0.01) {
          const fd = Math.sqrt(fd2);
          let sx = -(fx / fd) * mSpd[i] - vx[i];
          let sy = -(fy / fd) * mSpd[i] - vy[i];
          const sm = Math.sqrt(sx * sx + sy * sy);
          if (sm > maxF) { sx = sx / sm * maxF; sy = sy / sm * maxF; }
          ax += sx * cfg.fleeMult; ay += sy * cfg.fleeMult;
        }
      }

      vx[i] += ax; vy[i] += ay;
      px[i] += vx[i]; py[i] += vy[i];

      if (homeT > 0) {
        px[i] += (tx - px[i]) * 0.06 * homeT;
        py[i] += (ty - py[i]) * 0.06 * homeT;
      }

      /* Steering cannot hit a mark that only exists for 400 ms: these
         particles travel 1-3 px a frame, so by the time they arrive the word
         is over. Pull position directly toward the target while a shape is
         holding -- the force model still runs underneath and takes back over
         as the formation releases. */
      /* And no snap at all for them. Moving position directly toward the
         target overrides the force model completely -- 30% of the gap every
         frame, identically for every particle -- which is exactly why they all
         moved outward and inward together like one rigid object. */
      if (fT > 0.002 && cfg.snap > 0.001 && loose) {
        const k2 = cfg.snap * fT;
        px[i] += (tx - px[i]) * k2;
        py[i] += (ty - py[i]) * k2;
        pz[i] += (tz - pz[i]) * k2;
      }

      // q is the position in wall units: 1.0 is exactly on the boundary.
      // Names are w-prefixed so they never collide with the membrane block's
      // rx/ry/rd if a transpiler flattens the block scopes.
      const bi = bnd[i];
      /* The orb gets a wall of its own rather than an exemption. The field's
         ellipse is centred on the FIELD, and the orb lives well above that
         centre, so every one of its particles was outside it and being shoved
         back toward the middle of the screen -- which flattened its top into an
         arc. But no wall at all is just as wrong: the wall is what stops the
         loudest particles sailing off, and without it the shell went to a few
         enormous purple blobs a long way out. Same ellipse, moved onto the orb
         and scaled with it. */
      const wcx = isOrb ? orbCX : cx, wcy = isOrb ? orbCY : cy;
      const wek = isOrb ? orbK : 1;
      /* And a round wall, for the same reason. The field's ellipse is fitted to
         the viewport so a phone gets its full height -- 1:2 on this screen --
         and a 1:2 wall around a round orb is a bias with nothing to justify it:
         a stray leaving sideways is caught at half the distance of one leaving
         upward. The narrow axis, applied to both. */
      const wxh = hx * bi * wek, wyh = (isOrb ? hx : hy) * bi * wek;
      const qx = (px[i] - wcx) / wxh, qy = (py[i] - wcy) / wyh;
      const q = Math.sqrt(qx * qx + qy * qy);
      if ((walled || isOrb) && q > containNow) {
        const wx = px[i] - wcx, wy = py[i] - wcy;
        const wd = Math.sqrt(wx * wx + wy * wy) || 0.0001;
        const wnx = wx / wd, wny = wy / wd;
        // quadratic ramp — barely there at the soft edge, firm at the wall
        let over = (q - containNow) / softSpan; if (over > 1) over = 1;
        const pull = over * over * wall;
        vx[i] -= wnx * pull; vy[i] -= wny * pull;
        if (q > 1) {
          // hard stop. Project back onto the ellipse and drop only the
          // outward velocity — tangential motion survives, so particles graze
          // along the wall instead of piling up dead against it.
          px[i] = wcx + (qx / q) * wxh; py[i] = wcy + (qy / q) * wyh;
          const vn = vx[i] * wnx + vy[i] * wny;
          if (vn > 0) { vx[i] -= wnx * vn; vy[i] -= wny * vn; }
        }
      }
    }
  }

  /* One trail, always -- a shell used to bring its own, and a firework smearing
     where nothing else does read as a different renderer.

     Except behind a solid rendered figure. The trail is a partial clear: what
     was on the canvas last frame is still there at 54%, which is the whole look
     of a particle field and is a disaster for an opaque character, who came out
     as three of himself trailing off to one side. The clear goes to full as his
     own texture arrives -- so the dots still smear while they are the drawing,
     and stop the moment they are a rim on something solid. */
  /* And the smear thins as the shape arrives.

     cfg.trail is 0.46 -- each frame paints over less than half the last one, so
     a dot lingers for several frames. That is the orb's motion blur and it is
     most of why the resting field looks liquid. It is also, during a build, the
     thing doing the work that the sizes were supposed to do: the clear only
     started lifting once the TEXTURE wipe began climbing, two and a half
     seconds in, so the whole assembly happened under a heavy smear and read as
     a dissolve. Blended with formT it thins as the figure forms -- some smear
     is what stops the dots looking like a spreadsheet, but not this much. */
  const trailBase = form3d && formWant
    ? cfg.trail + (0.78 - cfg.trail) * Math.max(0, Math.min(1, formT)) : cfg.trail;
  const trail = rig.on && gl.ready
    ? Math.max(trailBase, Math.min(1, rig.wipe[3] / FIG.top)) : trailBase;
  ctx.fillStyle = "rgba(11,11,11," + trail + ")";
  ctx.fillRect(0, 0, W, H);

  /* The figure, rendered on the GPU and drawn in here. This is the one moment
     in the frame where it belongs: after the trail, which would otherwise paint
     over it, and before the particles, which are announcing it and should be in
     front. */
  if (rig.on && gl.ready) {
    glFrame(rig.R.fit.k * scale * formS, scale * 1.7);
    /* The orb goes UNDER him, and the compositing order is the only place that
       can be decided: the 2D canvas has no depth buffer, so a dot drawn after
       the model is in front of it, full stop. Everything else in the loop wants
       to be in front -- the dots are announcing the figure -- so the orb, and
       only the orb, is drawn here instead, in its own small pass before the
       model lands on top of it. He stands on it rather than wearing it. */
    if (rig.orbFrom < 1e8) {
      const nAll = Math.round(cfg.count);
      const cyw0 = Math.cos(view.yaw), syw0 = Math.sin(view.yaw);
      const pit0 = view.pitch * formT;
      const cpt0 = Math.cos(pit0), spt0 = Math.sin(pit0);
      const FOC0 = scale * 1.7;
      /* Painter's order, far first. The main loop sorts by depth and this pass
         has to as well: drawn in index order, the near rim of the ring lands on
         top of the green core and buries the one part of the orb that says it
         is an orb. */
      const oq = ordOrb.subarray(0, nAll - rig.orbFrom);
      for (let q = 0; q < oq.length; q++) {
        const ii = rig.orbFrom + q;
        const oxq = px[ii] - cx, oyq = py[ii] - cy;
        zbufOrb[q] = oyq * spt0 + (-oxq * syw0 + pz[ii] * cyw0) * cpt0;
        oq[q] = ii;
      }
      oq.sort((a, b) => zbufOrb[b - rig.orbFrom] - zbufOrb[a - rig.orbFrom]);
      const fRad0 = falloffPx * orbK;
      for (let q = 0; q < oq.length; q++) {
        const i = oq[q];
        const dx0 = px[i] - orbCX, dy0 = py[i] - orbCY;
        const sz0 = (1 - Math.sqrt(dx0 * dx0 + dy0 * dy0) / fRad0) * sizeHiPx;
        /* Dots do NOT scale with the orb. Scaling both, so that the small one
           is a true uniform copy, is the obvious thing and it looks worse: at
           0.57 the dots stop overlapping and the shell breaks into separate
           circles with black between them. What makes the big orb read as a
           cloud is dots fat enough to merge, so the small one keeps the same
           absolute dot and runs a chunkier dot-to-whole ratio than the big one
           on purpose. ORB.fat is the dial if that ever needs softening. */
        let r0 = Math.abs(sz0) * 0.5 * cfg.dot * ORB.fat;
        if (r0 <= 0.2) continue;
        const ox0 = px[i] - cx, oy0 = py[i] - cy, oz0 = 0;
        const rx0 = ox0 * cyw0 + oz0 * syw0;
        let rz0 = -ox0 * syw0 + oz0 * cyw0;
        const ry0 = oy0 * cpt0 - rz0 * spt0;
        rz0 = oy0 * spt0 + rz0 * cpt0;
        const pp0 = FOC0 / Math.max(FOC0 * 0.25, FOC0 + rz0);
        r0 *= pp0;
        if (r0 > radCap) r0 = radCap;
        let li0 = ((sz0 - LUT_LO) / (LUT_HI - LUT_LO) * (LUT_N - 1)) | 0;
        if (li0 < 0) li0 = 0; else if (li0 > LUT_N - 1) li0 = LUT_N - 1;
        ctx.fillStyle = lut[li0];
        ctx.beginPath();
        ctx.arc(cx + rx0 * pp0, cy + ry0 * pp0, r0, 0, TAU);
        ctx.fill();
      }
    }
    ctx.drawImage(glCanvas, 0, 0, W, H);
  }

  const span = LUT_HI - LUT_LO;
  const shaped = cfg.splitShape > 0.001;

  /* One rotation and one divide per particle, and both are the identity while
     z is zero -- which is every frame that is not holding a model. FOC is far
     enough back that perspective reads as depth rather than as a fisheye. */
  const deep = view.deep;
  const cyw = Math.cos(view.yaw), syw = Math.sin(view.yaw);
  // pitch unwinds with the shape for the same reason yaw does
  const pitchNow = view.pitch * formT;
  const cpt = Math.cos(pitchNow), spt = Math.sin(pitchNow);
  const FOC = scale * 1.7;
  const zSpan = scale * formS;

  if (deep) {
    /* Painter's order. These dots are opaque, so without it the far side of a
       model draws over the near side about half the time and the solid reads
       inside out. Sorting indices rather than the arrays themselves keeps every
       particle's index -- and therefore its ring slot and its lottery ticket --
       exactly where it was. */
    for (let i = 0; i < n; i++) {
      const ox = px[i] - cx, oy = py[i] - cy;
      zbuf[i] = oy * spt + (-ox * syw + pz[i] * cyw) * cpt;
      ord[i] = i;
    }
    const view2 = ord.subarray(0, n);
    view2.sort((a, b) => zbuf[b] - zbuf[a]);   // far first
  }

  /* Without this a solid is a speckle: nothing occludes anything, so the far
     surface shows straight through the near one and a head reads as a cloud
     shaped vaguely like a head. Rotate each point's own surface normal with the
     camera and drop the ones facing away. Softened at the boundary, or the
     silhouette pops as a hard edge sweeps around it while the model turns. */
  /* About a second to close most of the gap, per second rather than per frame
     so a 30Hz phone shrinks at the same rate as a 120Hz laptop. */
  const radEase = 1 - Math.pow(1 - 0.055, dt / 16.67);
  if (form3d) radTail = now + 900;
  const culling = formHasN && deep && cfg.solid > 0.001 && formT > 0.02;
  const cullK = cfg.solid * formT;

  for (let q2 = 0; q2 < n; q2++) {
    const i = deep ? ord[q2] : q2;
    /* Hidden rather than skipped, because the edges still need to know where a
       back-facing vertex is standing -- an edge is drawn only when BOTH ends
       face the camera, and that test needs the position of the one that does
       not. */
    const held = formOn[i] === 1;
    // a figure is built from the floor up: a particle whose height the wipe has
    // not reached yet is still out in the ring, on its way
    const fT = held ? (rig.on ? formT * figGate(i, 0) : formT) : 0;
    /* The half that stayed behind, while he is docked. At full strength it
       competes with the page; gone entirely and he is only the bar. Dimmed, it
       is a presence behind the cards that moves when you talk. */
    const backT = dock.on && !held ? 1 - (1 - DOCK.dim) * formT : 1;
    let hidden = false;
    if (culling && held) {
      const nzv = fny[i] * spt + (-fnx[i] * syw + fnz[i] * cyw) * cpt;
      // facing the camera is nzv < 0, since near is -z after projection
      // hash(i), not Math.random(): a fresh draw every frame makes the soft
      // boundary band flicker, where a per-particle constant dithers it once
      const d2 = hash(i);
      if (nzv > 0.10) hidden = d2 < cullK;
      else if (nzv > -0.10) hidden = d2 < cullK * (nzv + 0.10) * 5;
    }
    const ox = px[i] - cx, oy = py[i] - cy, oz = pz[i];
    let fRad = falloffPx;
    if (shaped) {
      let th = Math.atan2(oy, ox); if (th < 0) th += TAU;
      let si = ((th / TAU) * SHAPE_N) | 0; if (si >= SHAPE_N) si = SHAPE_N - 1;
      fRad *= 1 + (shapeLut[si] - 1) * cfg.splitShape;
    }
    // distance measured against the deformed boundary: 1.0 is exactly on it, so
    // size still crosses zero there and the colour split rides the new outline.
    // z joins the distance, which turns the negative-space ring into a shell.
    /* Measured from the orb's own centre and against its own ring when this is
       one of its particles. That single substitution is the whole of its
       colour and its dot size: the same crossing-zero-at-the-boundary rule the
       field has always used, so it cannot help but look like the field. */
    const isOrbD = orbK > 0 && i >= rig.orbFrom;
    const dcx = isOrbD ? orbCX : cx, dcy = isOrbD ? orbCY : cy;
    const dRad = isOrbD ? fRad * orbK : fRad;
    const dox = isOrbD ? px[i] - orbCX : ox, doy = isOrbD ? py[i] - orbCY : oy;
    const ndx = dox / (dRad * fex), ndy = doy / (dRad * fey), ndz = oz / dRad;
    let size = (1 - Math.sqrt(ndx * ndx + ndy * ndy + ndz * ndz)) * sizeHiPx;

    // rotate about the vertical, then the horizontal, then project
    const rx = ox * cyw + oz * syw;
    let rz = -ox * syw + oz * cyw;
    const ry = oy * cpt - rz * spt;
    rz = oy * spt + rz * cpt;
    const persp = FOC / Math.max(FOC * 0.25, FOC + rz);

    /* Size keys off distance from centre, which is the whole charm of the orb
       and precisely wrong for a glyph: outer letters bloom shut while the
       middle ones vanish. Converge toward one size while a shape holds, but
       not all the way -- a little variation keeps it from looking printed.
       A model converges on its own depth instead: near stars land on the
       positive end of the palette and far ones on the negative, so the colour
       split that separates the core from the ring becomes the shading. */
    if (form3d && held && !isOrbD) {
      /* 0.88 leaves an eighth of the old size behind, and for a glyph that
         residue is the point -- it keeps the letters from looking printed. For
         a solid it is fatal: a particle 400px out starts at size -250, and an
         eighth of that swamps a depth signal worth a few dozen. Converge, and
         stretch the two halves separately, because the palette is not
         symmetric -- green arrives by +sizeHi and magenta needs several times
         that in the other direction. */
      /* Hiding the far surface costs the contrast that made depth read: what
         is left all sits on the near half, so a symmetric mapping paints the
         whole thing green. Re-centre on the visible range instead -- nearest
         point green, silhouette magenta, which lands as a rim light. */
      let want;
      if (rig.on && i >= rig.orbFrom) {
        /* The FIELD's rule, not a shading trick. size = (1 - dist/radius) *
           sizeHi is the entire orb: fat and green at the middle, exactly zero
           on the ring -- which is the black gap the whole look is built around
           -- and negative and purple outside it, growing as it goes.

           Shading it by the surface normal instead, which is what this did,
           gives a ball that is green towards you and purple at the edges. That
           is a lit sphere. It is not the orb, and side by side with the real
           one it read as a different object entirely. */
        const w = (1 - orbD[i]) * sizeHiPx * ORB.fat;
        /* The same asymmetry the field uses -- the palette is not symmetric and
           magenta needs more reach than green -- but 2.4, the field's own
           figure, made the purple so much fatter than the core that lying flat
           it simply covered it. */
        want = w >= 0 ? w : w * ORB.purple;
      } else if (formHasB && formB[i] > HOLO_SHADE + 1) {
        // brought its own place on the palette. Depth shading would fight it:
        // a lit dot at the back would go dark and the model would come apart.
        want = formB[i] * sizeHiPx;
      } else {
        const t3 = culling ? Math.max(-1, Math.min(1, -rz / (zSpan * 0.36) - 1))
                           : Math.max(-1, Math.min(1, -rz / (zSpan * 0.6)));
        want = (t3 >= 0 ? t3 : t3 * 2.4) * sizeHiPx;
      }
      size += (want - size) * fT * 0.98;
    } else if (fT > 0.002) {
      size += (-1.15 * sizeHiPx - size) * fT * 0.88;
    }
    /* A menu node keys its size off the distance to its OWN centre rather than
       the field's. Everything that makes the orb an orb then happens for free,
       seven times over: fat magenta outside, black where size crosses zero, a
       green core inside it -- in one colour scheme instead of six. The arms are
       connective tissue and take a flat faint value, or they would read as
       enormous magenta blobs simply for being far from the middle. */
    if (menuOn && fT > 0.002) {
      const g3 = menuGroup[i], s4 = scale * formS;
      let want2;
      if (g3 >= 0) {
        const dxm = ox - menuAt[g3][0] * s4, dym = oy - menuAt[g3][1] * s4;
        want2 = (1 - Math.sqrt(dxm * dxm + dym * dym) / (MENU_SAT_R * s4 * 0.55)) * sizeHiPx;
      } else if (g3 === -1) {
        want2 = (1 - Math.sqrt(ox * ox + oy * oy) / (MENU_HUB_R * s4 * 0.55)) * sizeHiPx;
      } else want2 = -0.30 * sizeHiPx;
      size += (want2 - size) * fT;
    }
    let li = ((size - LUT_LO) / span * (LUT_N - 1)) | 0;
    if (li < 0) li = 0; else if (li >= LUT_N) li = LUT_N - 1;
    ctx.fillStyle = lut[li];
    // `dot` scales the drawn radius only. `size` (and therefore the LUT
    // index) is deliberately left alone, so this never moves the colour split.
    // A formation throws particles far from centre, where size is very negative
    // and dots are largest -- exactly the wrong place for legibility. Thin them
    // while a shape is holding so the glyph reads instead of blooming shut.
    /* A solid draws at one size, scaled only by perspective. Radius normally
       comes from |size|, and size is now carrying depth as a colour -- and the
       magenta half of the palette is stretched 2.4x to reach it, which would
       otherwise make the FAR side of a model the fattest thing on screen. */
    let rad = bs ? bs.star * k * (bs.grain ? 1 - bs.grain * 0.5 + bs.grain * hash(i + 5) : 1)
            /* A hologram has to be able to be faint. A solid draws every star
               the same size, which is right when size is carrying depth and
               wrong when it is carrying brightness -- the unlit lattice would
               be as fat as the model standing in it and there would be nothing
               to see. */
            : form3d && held && formHasB && formB[i] > HOLO_SHADE + 1
              ? sizeHiPx * cfg.dot * 0.09 * (0.25 + 1.3 * Math.abs(formB[i]))
                * (1 - fT * 0.15) * (1 - wireT * 0.55)
            : form3d && held && !isOrbD
              ? sizeHiPx * cfg.dot * 0.13 * (1 - fT * 0.15)
            : Math.abs(size) * 0.5 * cfg.dot * (1 - fT * 0.62)
              // the rim is a frame, not a second drawing competing with the first
              * (held ? 1 : 1 - formT * 0.72);
    /* And the dots hand over. The particles are announcing the figure, not
       standing in for it -- the same bargain the photographs make with the
       drawings that introduce them -- so once the real surface has arrived
       under a particle it has done its job and gets out of the way.

       On the silhouette they stay a while longer. `nzv` is the vertex normal's
       component along the view axis, already computed above for the
       back-surface culling, and a particle whose normal is nearly
       perpendicular to the camera is standing on the edge of the figure. A rim
       of dots around him while he is arriving is the one moment the field and
       the model are obviously the same object.

       A WHILE longer, not for ever. The rim used to be permanent, which meant
       he walked around his room wearing a green outline: the transition never
       finished, it just became part of how he looked. So the rim itself fades
       out across the last stretch of the texture wipe. By the time the front
       clears the top of his head every held particle is at zero radius and what
       is on screen is the model and nothing else -- which is the whole point of
       having built a model.

       Nothing here is one-way. figWipes runs the same four numbers DOWN when he
       leaves, so this reads backwards for free: the texture front descends, the
       rim comes back up out of it, then the surface goes, then the lines, then
       he is dots again. */
    if (rig.on && gl.ready) {
      if (i >= rig.orbFrom) {
        // already drawn, underneath him, before the model was composited
        rad = 0;
      } else {
        const g4 = figGate(i, 3);
        if (g4 > 0) {
          const nzv2 = fny[i] * spt + (-fnx[i] * syw + fnz[i] * cyw) * cpt;
          const edge = 1 - Math.min(1, Math.abs(nzv2) / 0.34);
          // 1 while the front is still climbing, 0 once it has finished
          const rimK = 1 - Math.max(0, Math.min(1,
            (rig.wipe[3] - (FIG.top - FIG.rim)) / FIG.rim));
          rad *= 1 - g4 * (1 - edge * 0.85 * rimK);
        }
      }
    }
    // stars twinkle. Without this a shell is a smooth cloud, which is the one
    // thing a firework never looks like
    if (bs && bs.sparkle) rad *= 1 + bs.sparkle * (Math.random() - 0.42) * 1.2;
    /* Glitter is not sparkle. Sparkle is per-frame noise on the radius, which
       reads as a shimmering surface; glitter is each star on its own slow
       cycle, which reads as a sky full of separate points going in and out.
       It is what makes a willow a willow rather than a slow green cloud. */
    if (bs && bs.glitter)
      rad *= 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(now * bs.glitter + hash(i + 11) * TAU));
    // the one under your thumb swells, which is the only feedback a field of
    // dots can give that reads as "this one"
    if (menuOn && menuHit >= 0 && menuGroup[i] === menuHit) rad *= 1 + 0.9 * formT;
    // the dots on a menu are the menu; the ring-sized ones are too timid for it
    if (menuOn && menuGroup[i] !== -1) rad *= 1 + 0.75 * formT;
    if (deep) rad *= persp;              // near is bigger, which is most of the depth
    if (backT < 1) rad *= 0.30 + 0.70 * backT;
    if (rad > radCap) rad = radCap;
    /* And the size TRAVELS, like everything else in here.

       A held 3D particle takes its radius from a constant -- sizeHiPx * dot *
       0.13 -- and the branch that picks it flips the instant the formation is
       set. Measured across a build, every particle sat at 1.89px on the first
       frame and 1.61px at the end: a 0.28px change over four seconds, which is
       to say the dots never shrank at all. They were swapped, in one frame,
       for smaller ones, while the trail kept the old fat ones on screen for
       several frames afterwards -- and two populations overlapping while one
       decays is a crossfade. That is exactly what it looked like.

       Eased from whatever was drawn last frame, it is the same dot getting
       smaller, which is what it was always supposed to be. Only for models:
       a firework's sparkle IS per-frame noise on the radius and smoothing it
       would take the fizz out, and a menu node's swell is meant to be
       immediate feedback under a thumb. */
    /* The tail matters as much as the ease. form3d is cleared the moment formT
       reaches zero, which is BEFORE the dots have finished becoming the orb
       again -- so gating on form3d alone let the last leg out snap: measured,
       the radius went 1.86 to 4.01 in a single frame at the handover, which is
       the one visible jolt in an otherwise smooth exit. The gate stays open for
       a beat after the formation lets go. */
    if (now < radTail && !bs && !menuOn) {
      const prev = radA[i];
      // seeded on first use, or a model would grow in from nothing
      if (prev > 0.001) rad = prev + (rad - prev) * radEase;
    }
    radA[i] = rad;
    const sx = cx + rx * persp, sy = cy + ry * persp;
    if (wireT > 0.002 || solidT > 0.002) {
      sxA[i] = sx; syA[i] = sy; szA[i] = rz; visA[i] = hidden || !held ? 0 : 1;
      /* The vertices thin as the mesh comes in. They do not go: a wireframe
         with no points on it stops looking like it is made of anything. */
      rad *= 1 - 0.55 * wireT;
    }
    if (!hidden && rad > 0.2) {
      ctx.beginPath();
      ctx.arc(sx, sy, rad, 0, 6.2832);
      ctx.fill();
    }
  }

  /* The mesh, drawn last, between dots already standing in the right places.
     Nothing moves and nothing cross-fades: the lines simply appear between the
     particles, which is the only reason this reads as one thing becoming
     another rather than two things swapped.

     Bucketed by depth rather than stroked per edge. Canvas will take six
     thousand separate strokes and will not do it in sixteen milliseconds; six
     passes over the list with one path each costs six. */
  /* ---------------- the surface ----------------
     Triangles, filled, shaded by how squarely they face you, and drawn from the
     same palette as everything else -- so a face turned toward the camera lands
     on the green end and one turned away lands on the violet, which is the same
     split that separates the orb's core from its rim.

     Batched by shade rather than drawn one at a time. Six thousand separate
     fills is not a frame; ten paths of six hundred subpaths each is. Order
     within a batch is lost, which would matter if the back faces were still
     there -- they are culled by winding, and what is left of a closed mesh
     barely overlaps itself. The vertices are the particles, so the surface
     breathes with the audio exactly as the outline does. */
  /* Skipped entirely when the GPU has the figure. The flat-shaded,
     centroid-sampled, 49-colour surface below is the fallback now, not the
     drawing -- it runs when three is missing, WebGL is off, or the file will
     not parse, and for every mesh that is not a rig. */
  if (solidT > 0.002 && formTri && !(rig.on && gl.ready)) {
    /* Shade buckets INSIDE depth buckets, drawn far to near. Shade alone was
       not enough: a head is not convex, so the lit back of the skull is still
       front-facing and drew straight over the shadowed face in front of it --
       the surface came out as a scatter of shards. Culling only removes what
       has turned away; it does not order what is left. */
    const SB = 6, DB = 10, paths = [];
    for (let b = 0; b < SB * DB; b++) paths.push(null);
    const dzs = zSpan * 1.35;
    ctx.globalAlpha = solidT;
    /* The textured half. Canvas 2D cannot draw a perspective-correct textured
       triangle, so "textured" here is the mesh wearing its own colours, one
       flat patch per face, baked once from the map. The cost is that every face
       wants its own fillStyle and the whole reason this draws fast is that it
       batches by colour -- so the map is quantised at load into a few dozen
       colours, and a face is bucketed by (colour, shade, depth) exactly the way
       an untextured one is bucketed by (shade, depth). A character's texture is
       four or five materials, so in practice this is a couple of hundred fills
       rather than seven thousand. */
    const TSB = 3;
    const tex = rig.on && rig.R && rig.R.triPal ? rig.R : null;
    const tp = tex ? new Map() : null;
    for (let t = 0; t < formTri.length; t += 3) {
      const a = formTri[t], b2 = formTri[t + 1], c = formTri[t + 2];
      // the surface wipe, climbing the body a beat behind the lines
      if (rig.on && figGate3(a, b2, c, 2) <= 0) continue;
      /* Not gated on visA. That flag is the back-surface culling for the DOTS,
         and dropping a whole triangle because one of its corners is a hidden
         particle punched holes all over the surface -- which is the one thing a
         surface must not have. Winding already removes what has turned away. */
      if (a >= n || b2 >= n || c >= n) continue;
      const ax = sxA[a], ay = syA[a];
      const ux = sxA[b2] - ax, uy = syA[b2] - ay;
      const vx2 = sxA[c] - ax, vy2 = syA[c] - ay;
      /* Winding IS the culling. The cross product of the two screen-space edges
         is the signed area, and a face that has turned away from the camera
         reverses it -- no normals, no dot product, no dependence on the mesh
         having had any. */
      const cr = ux * vy2 - uy * vx2;
      // and anything under a pixel of area is a cost with no picture in it
      if (cr <= 0.7) continue;
      /* Shade off the NORMAL, not off the screen triangle. The cross product of
         two screen edges divided by their lengths is the sine of the angle
         between them -- the triangle's shape, which is near 1 for any
         well-formed triangle whichever way it is pointing. It came out flat
         green everywhere. The mesh carries per-vertex normals; average the
         three, turn them with the camera, and how much of that points back
         along the view axis is the shading. */
      let nx2 = fnx[a] + fnx[b2] + fnx[c];
      let ny2 = fny[a] + fny[b2] + fny[c];
      let nz2 = fnz[a] + fnz[b2] + fnz[c];
      const nl = Math.sqrt(nx2 * nx2 + ny2 * ny2 + nz2 * nz2) || 1;
      nx2 /= nl; ny2 /= nl; nz2 /= nl;
      const rx2 = nx2 * cyw + nz2 * syw;
      const rr2 = -nx2 * syw + nz2 * cyw;
      const ry2 = ny2 * cpt - rr2 * spt;
      const rz2 = ny2 * spt + rr2 * cpt;
      /* Off to one side, and above. A light AT the camera makes every front
         face equally bright -- a nose and a cheek both point at you, so the
         only shading left is the falloff to the rim and the thing draws as a
         glowing silhouette. Move the light up and to the left and the same
         nose has a lit side and a shadowed one. */
      /* Negated. The vertex normals come out of the mesh pointing the opposite
         way to the winding that survives the cull, so every visible face scored
         below zero and the whole head came back at ambient -- a perfect
         silhouette of a face, entirely in shadow. */
      let f2 = -(LIGHT[0] * rx2 + LIGHT[1] * ry2 + LIGHT[2] * rz2);
      f2 = 0.24 + 0.76 * (f2 < 0 ? 0 : f2 > 1 ? 1 : f2);
      const bk = Math.min(SB - 1, (f2 * SB) | 0);
      const u2 = -(szA[a] + szA[b2] + szA[c]) / 3 / dzs * 0.5 + 0.5;   // 1 near
      const dk = Math.min(DB - 1, Math.max(0, ((1 - u2) * DB) | 0));   // 0 near
      let pth;
      if (tex && figGate3(a, b2, c, 3) > 0.5) {
        // half the depth buckets of the untextured path. Each bucket is a fill
        // call and there are fifty colours in play, so this is the difference
        // between six hundred fills a frame and three hundred.
        const key = (((dk >> 1) * TSB + Math.min(TSB - 1, (f2 * TSB) | 0)) * 256) + tex.triPal[t / 3];
        pth = tp.get(key);
        if (!pth) tp.set(key, pth = new Path2D());
      } else {
        const slot = dk * SB + bk;
        pth = paths[slot];
        if (!pth) { pth = paths[slot] = new Path2D(); }
      }
      pth.moveTo(ax, ay); pth.lineTo(sxA[b2], syA[b2]); pth.lineTo(sxA[c], syA[c]);
      pth.closePath();
    }
    /* Grouped by depth, so the textured faces can be drawn INSIDE the same
       far-to-near pass as the untextured ones. Drawn as a block afterwards they
       land on top of everything, and during the wipe -- which is exactly when
       both kinds are on screen at once -- a textured thigh drew straight over
       the arm in front of it. */
    const tByD = [];
    if (tp) for (const e2 of tp) {
      const d = ((e2[0] >> 8) / TSB | 0) * 2 + 1;         // back to the fine scale
      (tByD[d] || (tByD[d] = [])).push(e2);
    }
    for (let d = DB - 1; d >= 0; d--) {                   // far first
      for (const [key, pth] of tByD[d] || []) {
        const pal = tex.pal[key & 255];
        const sh = ((key >> 8) % TSB + 0.5) / TSB;
        // the same light the untextured surface uses, applied to the map's own
        // colour instead of to the palette -- so the figure is still lit, and
        // the shading is still what says it is a shape and not a sticker
        // brighter than the untextured shading, because a texture is already
        // dark where the model is dark: the hoodie came out near black at the
        // ambient the palette uses, and a figure you cannot see is not lit
        const g3 = 0.52 + 1.05 * sh;
        ctx.fillStyle = "rgb(" + Math.min(255, pal[0] * g3 | 0) + "," +
                                 Math.min(255, pal[1] * g3 | 0) + "," +
                                 Math.min(255, pal[2] * g3 | 0) + ")";
        ctx.fill(pth);
      }
      for (let b = 0; b < SB; b++) {
        const pth = paths[d * SB + b];
        if (!pth) continue;
        // across most of the palette, not the green end of it: the shading is
        // the only thing telling you what the shape is
        const sh = (-1.75 + 2.7 * ((b + 0.5) / SB)) * sizeHiPx;
        let li3 = ((sh - LUT_LO) / span * (LUT_N - 1)) | 0;
        if (li3 < 0) li3 = 0; else if (li3 >= LUT_N) li3 = LUT_N - 1;
        ctx.fillStyle = lut[li3];
        ctx.fill(pth);
      }
    }
    ctx.globalAlpha = 1;
  }

  if (wireT > 0.002 && formE) {
    /* A hologram's edges are sorted by BRIGHTNESS, a mesh's by depth. On a mesh
       every edge is equally part of the surface and the only question is which
       is in front; on a hologram half the lines are the room and half are the
       thing standing in it, and depth has nothing to do with which is which.

       Three passes over the lit ones, and that is where the fill comes from: a
       wide, very transparent stroke, then a narrower one, then a bright core.
       Neighbouring columns overlap in the wide pass, so a solid reads as a
       translucent body rather than as a comb -- no polygons, no second buffer,
       just the same line drawn three times at three widths. */
    const holo = formHasB;
    /* The widest pass is a cell across, so neighbouring columns just touch and
       the body closes up. Any narrower and a solid draws as a comb; wider and
       it bleeds past its own silhouette. */
    const cellPx = (2 / HOLO.cells) * formS * scale;
    /* `b` is the colour, and it has to be stated rather than inferred from the
       band -- read off the band's lower edge, the faint standing lines came out
       the same green as the model and the volume lost its silhouette entirely. */
    const PASS = holo
      ? [{ g: 0, b: -0.55, w: 1.1 * k, a: 0.55 },             // the floor, underneath
         /* and the model on top: a body and an edge. The number of
            depth slices is a fill-rate budget, not a look -- a stroke a cell
            wide, drawn six times over every lit edge, was five screens of
            overdraw a frame and took a phone-sized canvas to 20fps. The body
            barely reads its own fade; the thin core is where it shows. */
         { g: 2, b: 0.95, w: cellPx * 0.92, a: 0.16, fade: 1 },
         { g: 2, b: 0.95, w: 1.3 * k, a: 0.75, fade: 4 },
         /* and the model's own outline, once it has resolved into one. It
            steps back as the surface fills in: a wireframe at full strength
            over a shaded solid is a net thrown over it, and the shading is the
            only thing saying what the shape is. */
         { g: 3, b: 0.62, w: 1.0 * k, a: 0.55 * (1 - solidT * 0.72), fade: 4 }]
      : null;
    ctx.globalAlpha = wireT;
    if (holo) {
      /* Butt, not round. A round cap is two half-discs rasterised per segment,
         and at a cell's width across thousands of segments it was more than
         half the frame on its own: 14fps to 31 from this one word. Consecutive
         runs share their endpoints, so nothing opens up. */
      ctx.lineCap = "butt";
      const dz = zSpan * 1.5;
      for (const ps of PASS) {
        const list = (holoE && holoE[ps.g]) || formE;
        let li2 = ((ps.b * sizeHiPx - LUT_LO) / span * (LUT_N - 1)) | 0;
        if (li2 < 0) li2 = 0; else if (li2 >= LUT_N) li2 = LUT_N - 1;
        ctx.strokeStyle = lut[li2];
        ctx.lineWidth = Math.max(0.6, ps.w);
        /* The model gets split into depth slices and the far ones are dimmed.
           Seen from the front, a column lit for the whole of the model's height
           over its cell is the SILHOUETTE -- every depth stacked on top of every
           other, which draws as one rounded mass with no face in it. Fading
           back to front is what separates the front surface from what is behind
           it, and it is also just what light through a volume does. The floor
           and the standing lattice want none of it: they are the room, and the
           room is not supposed to recede into nothing. */
        const slices = ps.fade || 1;
        for (let d = 0; d < slices; d++) {
          const near = slices === 1 ? 1 : 1 - (d + 0.5) / slices;
          ctx.globalAlpha = wireT * ps.a * (slices === 1 ? 1 : 0.13 + 0.87 * Math.pow(near, 1.7));
          ctx.beginPath();
          let drew = 0;
          for (let e = 0; e < list.length; e += 2) {
            const a = list[e], c = list[e + 1];
            if (a >= n || c >= n || !visA[a] || !visA[c]) continue;
            if (slices > 1) {
              const u = Math.max(0, Math.min(0.999, -(szA[a] + szA[c]) / 2 / dz * 0.5 + 0.5));
              if (((1 - u) * slices | 0) !== d) continue;
            }
            ctx.moveTo(sxA[a], syA[a]); ctx.lineTo(sxA[c], syA[c]);
            drew++;
          }
          if (drew) ctx.stroke();
        }
      }
    } else {
      // fewer depth buckets once a surface is under the outline: the solid is
      // doing the occluding now, so the ordering matters much less
      const BK = solidT > 0.5 ? 2 : 6;
      /* Thinner and softer for a figure. Nine thousand edges over a body 250px
         tall is not a wireframe, it is a grey fill: at full weight the lines
         stage came out as a solid mass with the dots lost inside it. */
      ctx.lineWidth = rig.on ? Math.max(0.5, 0.75 * k) : Math.max(0.6, 1.15 * k);
      if (rig.on) ctx.globalAlpha = wireT * 0.62;
      /* One pass over the edges, not one per bucket. The old shape walked the
         whole list once for every depth bucket and threw away five sixths of it
         each time -- fine at a few hundred edges, and 56,000 wasted iterations
         at a figure's 9,310. Build the paths in a single pass and stroke them
         afterwards. Measured on the figure: 31fps to 44. */
      const wp2 = wirePath;
      for (let b = 0; b < BK; b++) wp2[b] = null;
      for (let e = 0; e < formE.length; e += 2) {
        const a = formE[e], c = formE[e + 1];
        if (a >= n || c >= n || !visA[a] || !visA[c]) continue;
        if (rig.on) {
          // the orb's arc holds no mesh vertices any more; an edge into it is
          // a line from his shoulder to a ball across the room
          if (a >= rig.orbFrom || c >= rig.orbFrom) continue;
          if (figGate3(a, c, undefined, 1) <= 0) continue;
          /* And nothing the surface has already closed over. A wireframe under
             an opaque fill is 9,310 line segments producing a barely visible
             fringe -- it is the single most expensive thing on the screen and
             it is behind something. The lines stay visible exactly where they
             are still the outermost thing: at and above the fill's own front. */
          if (figGate3(a, c, undefined, 2) > 0.9) continue;
        }
        // an edge belongs to the bucket its midpoint falls in
        const u = -(szA[a] + szA[c]) / 2 / (zSpan * 0.72) * 0.5 + 0.5;
        const bk = ((1 - Math.max(0, Math.min(0.999, u))) * BK) | 0;
        const pth = wp2[bk] || (wp2[bk] = new Path2D());
        pth.moveTo(sxA[a], syA[a]); pth.lineTo(sxA[c], syA[c]);
      }
      for (let b = 0; b < BK; b++) {
        if (!wp2[b]) continue;
        const t = 1 - (b + 0.5) / BK;                      // 1 near .. 0 far
        const sz2 = (t * 2 - 1) * sizeHiPx;
        let li2 = ((sz2 - LUT_LO) / span * (LUT_N - 1)) | 0;
        if (li2 < 0) li2 = 0; else if (li2 >= LUT_N) li2 = LUT_N - 1;
        ctx.strokeStyle = lut[li2];
        ctx.stroke(wp2[b]);
      }
    }
    ctx.globalAlpha = 1;
  }

  /* The detonation itself. Every other loud moment in this program is the orb
     getting bigger; a break has to read as light, not size. Radial and growing,
     not a flat fill -- covering the frame evenly reads as a colour filter over
     the scene rather than as something igniting in the middle of it. */
  if (bs) {
    const f = 1 - (now - firing.flashAt) / 170;
    if (f > 0) {
      const R = Math.min(W, H) * (0.16 + 0.55 * (1 - f));
      const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
      const a = f * f * bs.flash;
      g2.addColorStop(0, "rgba(" + firing.flashRgb + "," + a + ")");
      g2.addColorStop(0.55, "rgba(" + firing.flashRgb + "," + a * 0.45 + ")");
      g2.addColorStop(1, "rgba(" + firing.flashRgb + ",0)");
      ctx.fillStyle = g2;
      ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    }
  }

  drawPages();
  drawGallery(dt);
  drawMini(now, k);

  /* The photograph, in the rectangle its own drawing occupied. Drawn after the
     particles so the field reads as being behind it, and never scaled past the
     screen: a picture is for looking at. */
  if (photo.t > 0.004 && photo.img && !gallery.on) {
    const s5 = scale * 0.66;
    let hw = photo.half[0] * s5, hh = photo.half[1] * s5;
    const room = Math.min((W * 0.92) / (hw * 2), (H * 0.78) / (hh * 2), 1.6);
    hw *= room; hh *= room;
    ctx.save();
    ctx.globalAlpha = photo.t;
    // up from where the drawing stood, a little, so it arrives rather than cuts
    const rise = (1 - photo.t) * scale * 0.03;
    ctx.drawImage(photo.img, cx - hw, cy - hh + rise, hw * 2, hh * 2);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* Labels in text, not particles. Six words spelled in dots at this size are
     a smear, and the point of a menu is that it can be read at a glance. Same
     canvas and the same typeface as everything else, so it still belongs. */
  if (menuOn && formT > 0.05) {
    const s2 = scale * formS;
    ctx.save();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = Math.round(13 * k) + "px ui-monospace, SFMono-Regular, Menlo, monospace";
    ctx.globalAlpha = Math.min(1, formT * 1.4);
    /* Under the satellite, not through it. The label used to sit in the middle,
       which was empty when a satellite was a ring and is now a bright green
       core -- so it read as text printed over a light. */
    const off = (MENU_SAT_R + 0.20) * s2, pad = 14 * k;
    for (let m = 0; m < menuAt.length; m++) {
      ctx.fillStyle = m === menuHit ? "#EAFBD2" : "#9FB98B";
      const lx = cx + menuAt[m][0] * s2;
      // below by default; above for the one at the bottom of a short viewport,
      // where below is off the end of the canvas
      let ly = cy + menuAt[m][1] * s2 + off;
      if (ly > H - pad) ly = cy + menuAt[m][1] * s2 - off;
      ctx.fillText(menuAt[m][2], lx, ly);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  if (showBars) {
    if (!barPeak) barPeak = new Float32Array(BANDS);
    const bw = W / BANDS, bwid = Math.max(1, bw - BARS.gap);
    // seconds, clamped, so a stalled frame does not drop every peak at once
    const dts = Math.min(0.1, dt / 1000);
    for (let b = 0; b < BANDS; b++) {
      /* Straight off the music analyser while a record is on, rather than off
         the shared drive. Correct for a music meter -- it is the track being
         drawn, so draw the track -- and it makes this an independent probe of
         the thing you are seeing on Heat Waves. The two now fail differently:
         bars moving with a dead orb means the drive is being taken by
         something else; bars dead means the analyser is getting no audio. */
      const src = music.playing ? music.spectrum : drive.spectrum;
      let v = src[b] * (1 + (b / BANDS) * BARS.tilt);
      if (v > 1) v = 1; else if (v < 0) v = 0;
      /* Peak hold. The bar itself is the sound now and the cap is where it has
         been -- it is what makes a meter readable, because the eye cannot
         follow sixty-four things moving at once but it can follow the line they
         leave behind. Up instantly, down slowly. */
      if (v > barPeak[b]) barPeak[b] = v;
      else { barPeak[b] -= BARS.fall * dts; if (barPeak[b] < v) barPeak[b] = v; }

      /* Coloured out of the orb's OWN palette, sampled at the height the bar
         has reached, so the meter is made of the same light as the thing above
         it and shifts with it when the palette turns. A flat green strip is a
         piece of UI sitting on top of a picture. */
      let li = (((v * sizeHiPx) - LUT_LO) / (LUT_HI - LUT_LO) * (LUT_N - 1)) | 0;
      if (li < 0) li = 0; else if (li > LUT_N - 1) li = LUT_N - 1;
      const col = lut[li];
      const x = b * bw + (bw - bwid) / 2;
      const hB = v * BARS.h, pB = barPeak[b] * BARS.h;

      ctx.globalAlpha = BARS.alpha;
      ctx.fillStyle = col;
      if (hB > 0.6) barRect(x, H - hB, bwid, hB);
      if (pB > 1.5) { ctx.globalAlpha = BARS.peakA; barRect(x, H - pB - 2, bwid, 2); }

      // and the same again off the top edge, shorter and quieter -- an echo of
      // the bottom row rather than a second one competing with it
      const hT = hB * BARS.top, pT = pB * BARS.top;
      ctx.globalAlpha = BARS.alpha * BARS.dim;
      ctx.fillStyle = col;
      if (hT > 0.6) barRect(x, 0, bwid, hT);
      if (pT > 1.5) { ctx.globalAlpha = BARS.peakA * BARS.dim; barRect(x, pT, bwid, 2); }
    }
    ctx.globalAlpha = 1;
  }

  acc += dt; frames++;
  if (acc > 500) {
    hud.textContent = Math.round(frames / (acc / 1000)) + " fps · " + n + " · " +
                      state + (manual ? " (held)" : "") +
                      (formLabel ? " · " + formLabel : "") +
                      (bs ? " · " + firing.name : "");
    const f2 = (x) => x.toFixed(2);
    meter.textContent = "lvl " + f2(drive.scale) + "  hue " + f2(drive.hue) +
                        "  turb " + f2(drive.turbulence) + "  hit " + f2(drive.impulse) +
                        "\nmic " + micWord() +
                        "  hear " + (!recOn ? "off" : recRunning ? "on" : "stalled") +
                        "  in " + f2(mic.scale) +
                        (standalone ? "  [standalone]" : "") +
                        (brain.url ? "" : "  [no endpoint]") +
                        (A ? "  dB " + Math.round(A.db) + "  room " + Math.round(A.floorDb) : "");
    acc = 0; frames = 0;
  }
  requestAnimationFrame(loop);
}
syncStateBtns();
caption("", (standalone ? "home screen app · " : "") + (brain.url
  ? "I\u2019m Glorb. tap enable mic and talk to me \u2014 or say \u201cmenu\u201d"
  : "no brain endpoint set \u2014 open tune and paste the worker url"));
syncBare();
buildLut(0);
loop();
</script>
</body>
</html>
