<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glorb</title>
<meta name="theme-color" content="#0B0B0B">
<meta name="description" content="Glorb: an audio-reactive orb you can talk to.">
<!-- Added to the home screen it launches without Safari chrome, which is the
     point: full bleed, dark status bar, no browser furniture over the field. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glorb">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0B0B0B;overflow:hidden;
    font-family:'DM Mono',ui-monospace,monospace;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:fixed;left:14px;top:calc(14px + env(safe-area-inset-top));
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#4A4A4A;pointer-events:none}
  #meter{position:fixed;left:14px;top:calc(32px + env(safe-area-inset-top));
    font-size:10px;letter-spacing:.1em;color:#3E4A38;pointer-events:none;white-space:pre}
  #tr{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;display:flex;gap:7px}
  button{background:rgba(15,15,15,.85);border:1px solid #262626;color:#7A7A7A;
    font-family:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    padding:7px 12px;border-radius:4px;cursor:pointer}
  button:hover,button:focus-visible{border-color:#C8F49A;color:#E8FFD2}
  button.on{color:#C8F49A;border-color:#C8F49A}
  /* Bare mode. Everything on this screen except the field itself is a readout,
     and a readout is for building with -- at some point this is a thing people
     look at, and none of it should be there. One class on the body takes all of
     it off; the toggle stays, very dim, because a way out that you cannot see
     is not a way out. It survives a reload, so "show somebody" is one tap and
     not a setup. */
  body.bare #hud, body.bare #meter, body.bare #tr, body.bare #cap,
  body.bare #fig, body.bare #panel { display:none !important }
  /* Under the button row while the chrome is up, and slid into the corner the
     row leaves behind when it goes. Not at the bottom: the caption lives across
     the full width down there and a long reply runs straight under it. */
  /* An eye, not a dot. It was a 30px circle at half opacity showing a bare
     glyph, and the feature behind it -- the one that takes every readout off
     the screen -- went unfound: asked for as a new thing to build while it was
     sitting in the corner working perfectly. Bigger, brighter, and an icon
     everybody already reads as show/hide. */
  #bareBtn{position:fixed;right:12px;top:calc(56px + env(safe-area-inset-top));
    z-index:8;width:38px;height:38px;padding:0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    line-height:1;letter-spacing:0;color:#7FA36A;
    background:rgba(11,11,11,.72);border:1px solid #33402C;opacity:.85;
    transition:top .18s ease,opacity .18s ease}
  #bareBtn svg{width:19px;height:19px;fill:none;stroke:currentColor;
    stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  body.bare #bareBtn{top:calc(12px + env(safe-area-inset-top))}
  #bareBtn:hover,#bareBtn:focus-visible{opacity:1}
  /* dim once the screen is clean, but never invisible: a way out you cannot
     see is not a way out */
  body.bare #bareBtn{opacity:.30}
  body.bare #bareBtn:hover{opacity:.9}
  #err{position:fixed;top:calc(52px + env(safe-area-inset-top));right:14px;left:14px;
    max-width:340px;margin-left:auto;background:rgba(40,16,16,.94);border:1px solid #4A2020;
    color:#D89A94;font-size:11.5px;line-height:1.55;padding:11px 13px;border-radius:6px;display:none}
  /* bottom sheet — the orb stays visible above it while you tune */
  #panel{position:fixed;left:0;right:0;bottom:0;
    background:rgba(10,10,10,.93);border-top:1px solid #2A2A2A;
    border-radius:14px 14px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));
    max-height:42vh;overflow-y:auto;display:none;
    -webkit-overflow-scrolling:touch;touch-action:pan-y;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    box-shadow:0 -14px 40px rgba(0,0,0,.55)}
  #panel::before{content:"";display:block;width:34px;height:3px;border-radius:2px;
    background:#333;margin:0 auto 12px}
  @media (min-width:900px){
    #panel{left:auto;right:14px;bottom:14px;width:370px;border-radius:10px;
      border:1px solid #2A2A2A;max-height:78vh}
  }
  .grp{margin-bottom:13px}
  .grp>h3{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#C8F49A;
    margin-bottom:10px;opacity:.75;font-weight:400}
  .sl{margin-bottom:9px}
  .sl .t{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:#6B6B6B;margin-bottom:2px}
  .sl .t b{color:#C8F49A;font-weight:400}
  /* touch-action:none is what lets you DRAG the thumb on iOS instead of
     only tapping the track — without it Safari claims the gesture. */
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;
    background:transparent;outline:none;touch-action:none;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:#2E2E2E;border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
    margin-top:-10px;border-radius:50%;background:#C8F49A;cursor:pointer;
    box-shadow:0 1px 5px rgba(0,0,0,.6)}
  input[type=range]::-moz-range-track{height:2px;background:#2E2E2E;border-radius:2px}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
    background:#C8F49A;border:none;cursor:pointer}
  #row{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid #1E1E1E}
  .brow{display:flex;gap:8px;flex-wrap:wrap}
  input[type=text]{width:100%;background:#101010;border:1px solid #2A2A2A;color:#9A9A9A;
    font-family:inherit;font-size:11px;padding:7px 9px;border-radius:4px;margin-bottom:8px}
  input[type=text]:focus{outline:none;border-color:#C8F49A;color:#E8FFD2}
  #cap{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));
    font-size:12px;line-height:1.5;color:#6B6B6B;pointer-events:none;text-align:center;
    max-width:520px;margin:0 auto}
  /* The one control that matters, where a thumb already is. The top-right
     button is still there and still works; nobody found it. */
  /* The stage chooser. Only up while a figure is, and it is a tuning tool as
     much as a control: the four states are worth being able to sit in. */
  #fig{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(150px + env(safe-area-inset-bottom));
    display:none;gap:5px;z-index:6;-webkit-tap-highlight-color:transparent}
  #fig.on{display:flex}
  #fig button{font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:#9FB98B;background:rgba(11,11,11,.72);border:1px solid #3B4A31;
    border-radius:11px;padding:6px 9px;cursor:pointer}
  #fig button.at{color:#0B0B0B;background:#B6E08A;border-color:#B6E08A}
  /* The music player. Up only when asked for, and it closes itself, because a
     visualiser with a permanent control strip across it is a media player. */
  #mus{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(96px + env(safe-area-inset-bottom));width:min(92vw,420px);
    display:none;z-index:7;background:rgba(11,11,11,.9);border:1px solid #3B4A31;
    border-radius:14px;padding:11px 12px;backdrop-filter:blur(9px);
    font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#9FB98B}
  #mus.on{display:block}
  #mus .now{color:#D8EFC2;font-size:13px;margin-bottom:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #mus .sub{color:#6E8560;margin-bottom:9px}
  #mus .btns{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap}
  #mus button{font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#9FB98B;
    background:rgba(11,11,11,.6);border:1px solid #3B4A31;border-radius:10px;
    padding:7px 10px;cursor:pointer}
  #mus button:active{background:#1c2417}
  #mus ol{list-style:none;margin:0;padding:0;max-height:33vh;overflow:auto}
  #mus li{padding:7px 8px;border-radius:9px;cursor:pointer;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #mus li:active{background:#1c2417}
  #mus li.at{color:#0B0B0B;background:#B6E08A}
  /* The mouth test. All ten stacked and toggled, never swapped by src -- a
     decode in the middle of a sentence is a dropped frame exactly where the
     thing being tested is. */
  #visWrap{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 76px);
    transform:translateX(-50%);display:none;z-index:8;text-align:center}
  #visWrap.on{display:block}
  #vis{position:relative;width:min(58vw,240px);aspect-ratio:1;margin:0 auto;
    border:1px solid #3B4A31;border-radius:16px;overflow:hidden;background:#0B0B0B}
  /* No invert. The source scans are already light-on-dark, so inverting them
     produced a glaring white card in the middle of a black app. */
  #vis img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
    opacity:0;filter:brightness(1.12) contrast(1.12) saturate(0.6)}
  #vis img.on{opacity:1}
  #visLab{margin-top:7px;font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:#6E8560;letter-spacing:.14em}
  /* Never on screen. It is rendered to and then drawn INTO the 2D canvas, which
     is the only way the model can be layered between the trail and the
     particles rather than simply on top of everything. */
  #gl{position:fixed;left:0;top:0;pointer-events:none;opacity:0;
    width:1px;height:1px}
  /* It used to be a red circle with a microphone in it, which is the browser's
     idea of what this is rather than ours -- a warning colour, on a screen that
     has no warning colours anywhere else in it, for the one thing you are meant
     to press. It says what it does now, and it is the same violet and green as
     everything else. */
  /* No words. It was a red circle with a microphone in it, which is the
     browser's idea of what this is; then it was a pill reading TALK TO GLORB,
     which is a caption on a button that did not need one -- and it introduced
     him by name before he had introduced himself. A microphone in the palette
     says press this, and everything else he says out loud. */
  #mic{position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(74px + env(safe-area-inset-bottom));
    width:58px;height:58px;padding:0;border-radius:50%;
    border:1px solid #6B2FB5;background:rgba(24,10,38,.82);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;-webkit-tap-highlight-color:transparent;
    box-shadow:0 0 0 0 rgba(139,47,214,.5);animation:micPulse 2.8s ease-out infinite}
  #mic:active{background:rgba(46,18,72,.94)}
  #mic svg{width:24px;height:24px;fill:#B6E08A;flex:none}
  #mic.off{display:none}
  @keyframes micPulse{
    0%{box-shadow:0 0 0 0 rgba(139,47,214,.45)}
    70%{box-shadow:0 0 0 15px rgba(139,47,214,0)}
    100%{box-shadow:0 0 0 0 rgba(139,47,214,0)}}
  #cap b{display:block;color:#C8F49A;font-weight:400;margin-bottom:3px}
  #cap i{display:block;font-style:normal;color:#3E4A38;font-size:10px;
    letter-spacing:.08em;margin-top:5px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- The GPU layer. Everything in this program is drawn with Canvas 2D, which is
     a 2D rasteriser -- and a 2D rasteriser cannot map a texture across a
     triangle, interpolate a normal, or antialias a fill. A model rendered
     through it is a software renderer written by hand, and it looks like one.
     A rigged character is where that stops being acceptable. So the figure, and
     only the figure, is rendered by three.js on its own canvas and composited
     into the 2D one. Everything else -- the orb, the menu, the gallery, the
     holograms -- is untouched. -->
<canvas id="gl"></canvas>
<div id="hud">— fps</div>
<div id="meter"></div>
<button id="bareBtn" aria-label="hide the readouts" title="hide the readouts"></button>
<div id="tr">
  <button id="micBtn">enable mic</button>
  <button id="frzBtn" style="display:none">freeze</button>
  <button id="tuneBtn">tune</button>
</div>
<div id="err"></div>
<button id="mic" aria-label="talk"><svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11z"/></svg></button>
<div id="cap"></div>
<div id="fig"></div>
<div id="panel"></div>
<div id="mus"></div>
<div id="visWrap"><div id="vis"></div><div id="visLab">rest</div></div>

<!-- Vendored, not from a CDN, and resolved by the browser's own import map
     rather than by a bundler. The whole bargain this file is built on is that
     there is no build step; an import map keeps that true while still letting
     three's own modules use bare specifiers. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module">
  import * as THREE from "three";
  import { GLTFLoader } from "./vendor/GLTFLoader.js";
  import { RoomEnvironment } from "./vendor/RoomEnvironment.js";
  /* Handed to the classic script through the window, because the classic script
     is four thousand lines of top-level consts that everything else -- onclick
     handlers, the test rigs -- reaches by name. Module scope would hide all of
     it. Module scripts are deferred, so this runs after the page below; the
     figure waits on the event. */
  window.THREE = THREE; window.GLTFLoader = GLTFLoader; window.RoomEnvironment = RoomEnvironment;
  window.__three = 1;
  window.dispatchEvent(new Event("threeready"));
</script>

<script>
"use strict";
const BANDS = 64, TAU = Math.PI * 2;

const DEFAULTS = {
  count:3200, radius:0.26, rateX:4200, rateY:6900, bloom:0.34, fit:0.75, contain:0.56,
  shape:0, shapeGain:0, core:0.2, coreR:0.34, drift:0.1, depth:0, spin:0, tilt:0, solid:0.08, wire:0.12, muse:0, share:1, idleS:0,
  speedLo:1, speedHi:3, forceRatio:0.18, fleeRadius:200, fleeMult:4.6,
  rmsGain:0.9, specGain:0.5, membrane:0.1, membGain:1.7, ellipse:1, jaw:1.05, gate:1, gateFloor:0.05, kickShape:0,
  falloffGain:0, turbGain:1.1, impulseGain:2.3, hueGain:2.55, attack:0.34, release:0.16, dbMargin:2, dbRange:18,
  autoWord:0,
  dot:0.52, sizeHi:26, falloff:70, follow:1, split:0.44, splitEll:0, splitJaw:0, splitShape:0,
  trail:0.46, rK:-0.5, gK:7, bK:-2, base:120,
  vadOn:0.14, holdMs:700, thinkMs:1500, speakMs:2800, sylRate:4.2, echoTail:850,
  /* The gap after the last WORD that ends a sentence, and whether talking over
     him stops him. gapMs is the whole latency story in a noisy room: recognition
     will happily sit on a finished sentence for seconds waiting for the music to
     stop. */
  gapMs:620, barge:4, volume:4.5, snap:0.3, flashMs:1100
};
const cfg = Object.assign({}, DEFAULTS);

/* Named looks. Each is applied over DEFAULTS, so a preset only has to list what
   it changes. Reconstructed from the commits they were first rendered at and
   re-verified against this build -- the neutralisers matter, since anything
   added later (the deformable split, the growth term, the deform gate) will
   quietly alter a look that predates it. */
const PRESETS = {
  base: {},
  // shaped silhouette: low bloom so the target reads as a line, heavy membrane
  // to hold particles on it, gate 0 so the resting orb keeps its stretch
  shaped: {
    count:570, radius:0.30, rateX:23000, rateY:6500, bloom:0.25, fit:1.19, contain:0.86,
    shape:1, shapeGain:0, core:0, coreR:0.18, drift:0, muse:0, share:1, idleS:0, depth:0, spin:0, tilt:0, solid:0, wire:0, kickShape:0, speedLo:3.5, speedHi:19.5, forceRatio:0.045,
    fleeRadius:100, fleeMult:1.8, rmsGain:1.15, specGain:0.65, membrane:1.1, membGain:0,
    ellipse:0.45, jaw:0, gate:0, falloffGain:1.7, turbGain:1.6, impulseGain:2.7,
    hueGain:2.55, attack:0.35, release:0.31, dot:1.0, sizeHi:26, falloff:45,
    follow:0, split:0.46, splitEll:0, splitJaw:0, splitShape:0,
    trail:0.41, rK:-0.5, gK:7, bK:-2, base:130
  },
  /* Exactly the config that was the default before the resting state was
     opened up -- kept whole so it is one tap back, not a reconstruction. */
  lips: {
    count:4777, radius:0.16, rateX:14000, rateY:23500, bloom:0.6, fit:0.75, contain:0.56,
    shape:7, shapeGain:0, core:0.1, coreR:0.19, drift:0.44, depth:0, spin:0, tilt:0,
    solid:0.08, wire:0.12, muse:0, share:1, idleS:0,
    speedLo:1, speedHi:3, forceRatio:0.18, fleeRadius:200, fleeMult:4.6,
    rmsGain:0.9, specGain:0.5, membrane:0.1, membGain:0, ellipse:1, jaw:1.05, gate:1, gateFloor:0.05,
    kickShape:0, falloffGain:0, turbGain:1.1, impulseGain:2.3, hueGain:2.55,
    /* Its own 9 and 31 are gone. They were tuned against a noise floor that ran
       28 dB below the room, and against a floor that is actually the room they
       reject an ordinary voice outright -- the preset would come back deaf. */
    attack:0.34, release:0.16, dbMargin:2, dbRange:18,
    dot:0.65, sizeHi:26, falloff:70, follow:1, split:0.46, splitEll:0, splitJaw:0, splitShape:0,
    trail:0.46, rK:-0.5, gK:7, bK:-2, base:120
  },
  // lips: mouth silhouette with a hard centroid ellipse. falloffGain 0 keeps the
  // split at a plain fraction of the ring, which is what this was built against
  mouth: {
    count:900, radius:0.16, rateX:14000, rateY:23500, bloom:0.60, fit:0.75, contain:0.56,
    shape:7, shapeGain:0, core:0, coreR:0.18, drift:0, muse:0, share:1, idleS:0, depth:0, spin:0, tilt:0, solid:0, wire:0, kickShape:0, speedLo:1, speedHi:3, forceRatio:0.18,
    fleeRadius:200, fleeMult:4.6, rmsGain:0.9, specGain:0.7, membrane:0.5, membGain:0,
    ellipse:1.8, jaw:1.2, gate:1, falloffGain:0, turbGain:1.1, impulseGain:2.7,
    hueGain:2.55, attack:0.35, release:0.11, dot:0.65, sizeHi:26, falloff:70,
    follow:1, split:0.46, splitEll:0, splitJaw:0, splitShape:0,
    trail:0.46, rK:-0.5, gK:7, bK:-2, base:120
  }
};

/* the only channel audio has into physics */
const drive = { scale:0, spectrum:new Float32Array(BANDS), turbulence:0, impulse:0, hue:0,
  /* 0 for a voice, 1 for a record, and everything in between while it fades.
     The music visualiser is a different instrument from the one a conversation
     plays, and this is the crossfade between them -- so nothing below has to
     know whether music is on, only how much. */
  music: 0,
  /* Per band, what is NEW this frame rather than how much is there. A drum is
     an onset; a bass note that has been ringing for a bar is not a kick. */
  hit: new Float32Array(BANDS) };

/* ---------------- states ----------------
   idle | listening | thinking | speaking. Every state writes the SAME five
   channels; the visual system never learns which one is talking. That is the
   entire point of the seam -- listening fills them from the microphone, the
   other three from script, and physics cannot tell the difference.

   mic is where analyse() puts its results now. Keeping it separate from drive
   is what lets voice-activity detection keep running while a scripted state
   owns the visuals -- otherwise the orb could never hear you interrupt it. */
const mic  = { scale:0, spectrum:new Float32Array(BANDS), turbulence:0, impulse:0, hue:0 };
const srcD = { scale:0, spectrum:new Float32Array(BANDS), turbulence:0, impulse:0, hue:0 };
const fromD = { scale:0, spectrum:new Float32Array(BANDS), turbulence:0, impulse:0, hue:0 };

const STATES = ["idle", "listening", "thinking", "speaking"];
const BLEND = 260;                       // ms to cross-fade on a state change
let state = "idle", stateT = 0, blendT = 1e9;
let manual = false, heardVoice = false, quietT = 0;
let smoothScale = 0;

function setState(next) {
  if (next !== state) {
    // snapshot what physics is currently seeing, and ease off it rather than
    // snapping -- a hard cut between sources reads as a glitch, not a mood
    fromD.scale = drive.scale; fromD.hue = drive.hue;
    fromD.turbulence = drive.turbulence; fromD.impulse = drive.impulse;
    fromD.spectrum.set(drive.spectrum);
    state = next; stateT = 0; blendT = 0;
    if (next === "listening") { heardVoice = false; quietT = 0; }
  }
  syncStateBtns();
}

// deterministic per-syllable noise, so speech has structure instead of jitter
const hash = (i) => { const v = Math.sin(i * 12.9898) * 43758.5453; return v - Math.floor(v); };

/* Vowel -> centroid. These are not arbitrary: /i/ and /e/ carry a high second
   formant and spread the lips, /o/ and /u/ are low and round them. Feeding real
   vowels into the hue channel means the mouth shapes the actual words. */
const VOWEL_TONE = { a:0.42, e:0.86, i:0.95, o:0.24, u:0.12, y:0.72 };
let plan = null, planMs = 0;

function planSpeech(text) {
  const out = [];
  for (const word of String(text).toLowerCase().split(/\s+/)) {
    let n = 0, prevVowel = false;
    for (const ch of word) {
      const v = VOWEL_TONE[ch];
      if (v === undefined) { prevVowel = false; continue; }
      if (!prevVowel) { out.push({ v, pause:false }); n++; }  // a vowel run is one syllable
      prevVowel = true;
    }
    // Speech pauses at punctuation, not between every word. A gap per word makes
    // a short sentence take half again as long as it should to say.
    if (n && /[,.;:!?]$/.test(word)) out.push({ v:0.3, pause:true });
  }
  plan = out.length ? out : null;
  planMs = plan ? (plan.length / cfg.sylRate) * 1000 : 0;
}

function srcIdle(t) {
  srcD.scale = 0.05 + 0.035 * Math.sin(t * 0.6);
  srcD.hue = 0.05 + 0.05 * Math.sin(t * 0.17);
  srcD.turbulence = 0.02;
  srcD.impulse = 0;
  for (let b = 0; b < BANDS; b++) srcD.spectrum[b] = 0.04 + 0.03 * Math.sin(b * 0.25 + t * 0.7);
}

function srcThinking(t) {
  // a bright lobe orbits the ring. Nothing about it is random, which is what
  // makes it read as working on something rather than reacting to something.
  const pos = (t * 0.55 % 1) * BANDS;
  for (let b = 0; b < BANDS; b++) {
    let d = Math.abs(b - pos); if (d > BANDS / 2) d = BANDS - d;
    srcD.spectrum[b] = 0.10 + 0.85 * Math.exp(-(d * d) / 26);
  }
  srcD.scale = 0.34 + 0.10 * Math.sin(t * 2.1);
  srcD.hue = 0.5 + 0.42 * Math.sin(t * 0.42);      // sweeps shape and palette
  srcD.turbulence = 0.06;
  srcD.impulse = Math.max(0, Math.sin(t * 2.1)) * 0.10;
}

function srcSpeaking(t) {
  // Real audio when there is any; the syllable clock only covers its absence.
  if (ttsPlaying) {
    srcD.scale = tts.scale; srcD.hue = tts.hue;
    srcD.turbulence = tts.turbulence; srcD.impulse = tts.impulse;
    srcD.spectrum.set(tts.spectrum);
    return;
  }
  /* A syllable clock, not a noise generator. Each slot gets an envelope, a
     vowel and a chance of being a pause, so the rhythm reads as speech. The
     vowel drives hue, which is the centroid channel -- so the mouth widens and
     the silhouette morphs per syllable exactly as they would on real audio. */
  const sy = t * cfg.sylRate;
  const idx = Math.floor(sy), f = sy - idx;
  // With a plan the syllables are the reply's own; without one it falls back to
  // the scripted babble, which is what runs when no brain is wired up.
  const step = plan ? (idx < plan.length ? plan[idx] : { v:0.3, pause:true }) : null;
  const voiced = step ? !step.pause : hash(idx) > 0.2;
  const env = voiced ? Math.pow(Math.sin(Math.PI * Math.min(1, f * 1.3)), 0.75) : 0;
  const vowel = step ? step.v : hash(idx * 7 + 3);
  const sib = hash(idx * 3 + 11) > 0.65;           // sibilant syllables hiss
  const stressed = hash(idx * 5 + 7) > 0.55;       // and only some carry an onset

  srcD.scale = 0.12 + 0.72 * env;
  srcD.hue += (vowel * env - srcD.hue) * 0.25;
  srcD.turbulence = 0.10 + 0.55 * (sib ? env : 0);
  /* An onset of 0.9 on every syllable was nothing like real speech. The kick
     integrates to roughly 31 * impulse px/frame of velocity, and the arrive
     force is capped near 0.6 px/frame^2 -- so at 4.2 syllables a second the
     field was re-kicked long before it could be pulled back, and just wandered
     outward until it hit the wall. Real flux peaks lower and only fires on
     genuine onsets, so do the same. */
  srcD.impulse = (voiced && stressed && f < 0.16) ? 0.25 : srcD.impulse * 0.86;
  for (let b = 0; b < BANDS; b++) {
    const fb = b / BANDS;
    const f1 = Math.exp(-Math.pow((fb - 0.06) / 0.05, 2));               // voice bar
    const f2 = Math.exp(-Math.pow((fb - (0.12 + vowel * 0.45)) / 0.09, 2)); // formant
    srcD.spectrum[b] = env * (0.85 * f1 + 0.6 * f2);
  }
}

function updateState(dt) {
  stateT += dt; blendT += dt;
  analyseTts();
  analyseMusic();
  visFrame();
  visRig(dt);

  if (!manual) {
    // barge-in: voice wins from any state, so it can be interrupted mid-sentence
    if (A && mic.scale > cfg.vadOn) {
      if (state !== "listening") setState("listening");
      heardVoice = true; quietT = 0;
    } else if (state === "listening") {
      quietT += dt;
      /* Idle, not thinking, when there is a microphone. Thinking is a scripted
         state -- it animates a canned envelope, because its job is to look like
         work is happening while a reply is fetched -- and dropping into it three
         quarters of a second after every pause meant the field spent those
         seconds ignoring the room. A real question sets it from ask(); nothing
         else should. Idle with a live mic still reads the microphone. */
      if (heardVoice && quietT > cfg.holdMs) setState(A ? "idle" : "thinking");
      else if (!heardVoice && quietT > cfg.holdMs * 3) setState("idle");
    } else if (state === "thinking" && stateT > cfg.thinkMs) {
      /* A real request in flight owns the thinking state -- it ends when the
         reply lands, not when a timer says so. And when nothing was asked at
         all, go back to LISTENING rather than on into a scripted reply.

         The think-then-speak pair is the demo for a page with no microphone and
         no brain. With a live mic it fired every time somebody stopped talking
         for three quarters of a second, and its canned envelope runs nearly
         twice as strong as an actual voice -- so the orb went quiet while you
         were speaking and then flailed about the moment you stopped, which
         reads exactly like a visualiser ignoring you. Measured through the real
         path: drive 0.19 under speech, 0.35 in the silence after it. */
      if (!brain.busy) setState(A ? "listening" : "speaking");
    } else if (state === "speaking" && stateT > (planMs || cfg.speakMs)) {
      plan = null; planMs = 0;
      setState(A ? "listening" : "idle");
    }
  }

  const t = stateT / 1000;
  /* Music takes the visuals while it is on. Not while he is SPEAKING -- his
     own voice has to keep the mouth, or he mouths the track instead of the
     sentence -- and not while he is thinking, which has a look of its own. The
     rest of the time the orb is reacting to the room, and the loudest thing in
     the room is the music. */
  const onMusic = music.playing && state !== "speaking" && state !== "thinking";
  /* Eased, so switching a track on or off is a change of instrument rather
     than a jump cut. About a third of a second either way. */
  drive.music += ((onMusic ? 1 : 0) - drive.music) * 0.06;
  if (onMusic) drive.hit.set(music.hit);
  else for (let b = 0; b < BANDS; b++) drive.hit[b] *= 0.9;

  if (onMusic) {
    srcD.scale = music.scale; srcD.hue = music.hue;
    srcD.turbulence = music.turbulence; srcD.impulse = music.impulse;
    srcD.spectrum.set(music.spectrum);
  }
  else if (state === "listening") {
    srcD.scale = mic.scale; srcD.hue = mic.hue;
    srcD.turbulence = mic.turbulence; srcD.impulse = mic.impulse;
    srcD.spectrum.set(mic.spectrum);
  } else if (state === "idle") {
    /* A live mic still drives the visuals while idle. Idle means nobody has
       said anything yet -- not that the orb has stopped hearing. Routing idle
       through the scripted breath made it deaf to everything under vadOn and
       painted constants over the tuned resting state. The breath is only for
       when there is no audio source at all. */
    if (A) {
      srcD.scale = mic.scale; srcD.hue = mic.hue;
      srcD.turbulence = mic.turbulence; srcD.impulse = mic.impulse;
      srcD.spectrum.set(mic.spectrum);
    } else srcIdle(t);
  }
  else if (state === "thinking") srcThinking(t);
  else srcSpeaking(t);

  /* The mic path shapes level with attack/release; the scripted sources wrote
     raw values straight in, so speaking stepped between syllables instead of
     breathing between them. Run them through the same envelope -- states are
     only interchangeable if they are shaped alike. */
  if (state === "listening") smoothScale = srcD.scale;
  else {
    const ka = srcD.scale > smoothScale ? cfg.attack : cfg.release;
    smoothScale += (srcD.scale - smoothScale) * ka;
    srcD.scale = smoothScale;
  }

  let f = blendT / BLEND; if (f > 1) f = 1;
  const e = f * f * (3 - 2 * f);
  drive.scale += (srcD.scale - drive.scale) * e;
  drive.hue += (srcD.hue - drive.hue) * e;
  drive.turbulence += (srcD.turbulence - drive.turbulence) * e;
  drive.impulse += (srcD.impulse - drive.impulse) * e;
  for (let b = 0; b < BANDS; b++)
    drive.spectrum[b] += (srcD.spectrum[b] - drive.spectrum[b]) * e;
}

/* ---------------- brain ----------------
   Speech in via the browser's own recogniser, thinking out to Claude through a
   proxy, and the reply drives the speaking state. The API key is deliberately
   NOT here: this page is served from GitHub Pages, so anything in it is public
   and a leaked key is billable. worker/ holds the proxy that keeps it server
   side. With no endpoint configured everything below stays dormant and the
   scripted states run instead. */
const cap = document.getElementById("cap");

   we are in before blaming anything else. */

  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);

   clear, and voice ids are public. The API keys stay in the Worker. This also
   fixes the home-screen app, which gets its own localStorage partition and so
   launched with nothing to call. A stored value still wins, so a blank field
   stays blank rather than springing back to the default. */

/* Which character is talking, as an ID rather than as a prompt.

   More than one of them shares the brain now: the orb, and the avatar. They
   differ in who they are and what they sound like, and both of those are
   looked up in the Worker from this id. Deliberately not the text: this page
   is served from GitHub Pages, so every field in the request is something a
   stranger can set to anything, and an id is a key into a table -- the worst a
   forged one does is pick a character that exists, or miss and get the orb.
   Send the system prompt from here instead and anyone with the endpoint could
   run whatever prompt they liked on the account's credits.

   Empty means the orb, which is the default and always will be. */
const CAST_OF = {

  // model's name here and the particle face speaks in his voice too.
  colin_slim: "colin", colin_dance: "colin", colin_animations: "colin",
  // and the head with his face and his mouth on it
  colin_head: "colin", colin_anim2: "colin",
};

const brain = {
  url: stored("orbBrain") === null ? DEFAULT_BRAIN : stored("orbBrain"),
  /* Left blank on purpose, and the blank is load-bearing. The Worker resolves
     a voice in four steps -- this field, then the character's own voice, then
     the account default, then a stock id -- so anything set HERE is a manual

/* What is actually happening, told to the brain every turn.

   The voice and the page have been two separate programs that happen to share
   a user. Ask it to play something and it plays; ask it what is playing and it
   says it has no music, because the half that answers has never been told
   anything the half that plays knows. Same for whose body is on screen, what
   stage the build is at, whether a picture is up. Every one of those reads as
   the thing being broken rather than unwired.

   So: one snapshot, sent with the sentence. Small on purpose -- this rides
   every turn, and a paragraph of state is a paragraph of prompt per question
   forever. Only what a person in the room could see or hear.

   Everything is read defensively. This runs before the brain call on every
   single turn, and a state reporter that can throw is a reporter that takes
   the whole conversation down with it the first time something is null. */
function worldState() {
  const st = {};
  const safe = (f, d) => { try { const v = f(); return v == null ? d : v; } catch (e) { return d; } };
  if (safe(() => music.playing, false)) {
    st.music = {
      title: safe(() => music.title, "") || "unknown",
      artist: safe(() => music.artist, "") || undefined,
      bpm: Math.round(safe(() => music.bpm, 0)) || undefined,
      paused: safe(() => !!music.paused, false) || undefined,
      of: safe(() => (music.list || []).length, 0) || undefined,
    };
  }
  const on = safe(() => !!rig.on, false);
  if (on) {
    st.figure = {
      model: safe(() => rig.src, "") || "?",
      // who that model IS, which is the thing worth knowing about it
      who: safe(() => CAST_OF[String(rig.src || "").toLowerCase()], "") || undefined,
      stage: safe(() => FIG_STAGE[rig.stage], "") || undefined,
      particles: safe(() => !!rig.portrait, false) || undefined,
    };
  }
  if (safe(() => !!world.on, false) && safe(() => world.on > 0.5, false)) st.room = true;
  if (safe(() => !!photo.img, false)) st.picture = safe(() => formLabel, "") || true;
  if (safe(() => menuOn, false)) st.menu = true;
  if (safe(() => !!vis.on, false)) st.mouthTest = true;
  if (safe(() => !!A, false)) st.mic = "live";

}

let lastAsked = "", lastTiming = "";
function caption(said, said2) {
  if (said !== null) lastAsked = said;
  cap.innerHTML = "";
  if (lastAsked) { const b = document.createElement("b"); b.textContent = lastAsked; cap.appendChild(b); }
  if (said2) cap.appendChild(document.createTextNode(said2));
  if (lastTiming) { const i = document.createElement("i"); i.textContent = lastTiming; cap.appendChild(i); }
}

/* Where the wait actually goes. The pipeline is serial -- full reply, then
   full clip, then speak -- so knowing which leg dominates is the difference
   between optimising the right thing and the loud thing. */
const clock = { t0:0, firstTok:0, lastTok:0, audio:0, claudeMs:0, endpoint:0, via:"", legs:null };

/* When the words stopped, which is not when the question was sent. Recognition
   decides on its own when a sentence has ended, and that decision happens after
   the last word and before anything here has run -- so the whole of it fell
   outside the measurement and read as the model being slow. Kept as the time of
   the last INTERIM result: the last moment there was evidence of talking. */
let sawSpeechAt = 0, endpointMs = 0;

/* ---------------- endpointing ----------------
   When is a sentence over?

   Recognition's own answer -- the isFinal result -- is that the ROOM has gone
   quiet. Sitting at a desk with music playing, the room never goes quiet, so
   the reply waited and waited while the visualiser bounced along to the
   stereo. The right answer is that the WORDS have stopped: the transcript has
   not changed for a while, whatever the level is doing.

   So the sentence is sent on the gap in the interim stream, and the isFinal
   that arrives later for the same utterance is swallowed. It is the difference
   between an endpointer that listens to a room and one that listens to a
   person. */
let lastHeard = "", lastHeardAt = 0, finalSwallow = 0;
function endpointCheck() {
  if (!lastHeard || sttPaused || ttsPlaying || brain.busy) return;
  if (performance.now() - lastHeardAt < cfg.gapMs) return;
  const said = lastHeard;
  lastHeard = "";
  finalSwallow = performance.now() + 3000;
  endpointMs = Math.round(performance.now() - lastHeardAt);
  sawSpeechAt = 0; echoSeen = 0; lastLive = "";
  heardSentence(said);
}
setInterval(endpointCheck, 80);

/* How many words in `a` are not in `b`. Used for one thing: telling somebody
   talking over him apart from his own voice coming back through the speaker.
   Deliberately blunt -- a bag of words, no order -- because the recogniser is
   hearing a mixture of both and a careful comparison of a mixture is a careful
   comparison of nothing. */
const bag = (t) => String(t || "").toLowerCase().replace(/[^a-z0-9' ]/g, " ").split(/\s+/).filter(Boolean);
function novelWords(a, b) {
  const have = new Set(bag(b));
  let n = 0;
  for (const w of bag(a)) if (w.length > 2 && !have.has(w)) n++;
  return n;
}
let ttsText = "";
/* What it takes to stop him mid-sentence.

   The word test was right and the arithmetic around it was not. It counted
   novel words in the WHOLE transcript and stopped at two -- so over a ten
   second reply, any two stray words at any two moments were enough, and a
   recogniser has only one thing it can turn a cough or a television into:
   words. He interrupted himself constantly, two words into his own answer,
   and there was no getting the answer back.

   Same principle as the endpointer, then, applied the other way round: judge
   it on words, and on words that arrive like somebody TALKING. Two things
   have to be true.

   - `gap`: the words have to keep coming. A transcript that has not changed
     for this long is a room, not a sentence, and the count starts over. Note
     that it is the TRANSCRIPT changing, not the novel count going up: somebody
     saying "hang on, wait, what about the other one" is talking the whole way
     through, and the fact that "about" and "the" are words he happened to use
     as well does not mean they stopped. Keyed on the count, that sentence
     reset its own burst two words from the end and let it through.
   - `grace`: nothing counts for the first stretch of his reply. When he starts
     talking, the transcript still holds the tail of the question that prompted
     him, and every word of it is novel by construction. That window is the
     baseline, not an interruption.

   cfg.barge is the number of words in one burst that it takes. Zero means
   nothing does: he finishes every thought, and recognition is paused while he
   talks, so he cannot hear himself at all. */
const BARGE = { gap: 900, grace: 700 };
let bargeN = 0, bargeBase = 0, bargeLast = 0, bargeFrom = 0, bargeLive = "";
function bargeWatch(live) {
  const now = performance.now();
  if (live === bargeLive) return;            // nothing new was said
  const quiet = bargeLast ? now - bargeLast : 1e9;
  bargeLive = live; bargeLast = now;
  const n = novelWords(live, ttsText);
  if (now < bargeFrom) { bargeBase = bargeN = n; return; }
  // the transcript restarted -- a new utterance, not a longer one
  if (n < bargeN || quiet > BARGE.gap) bargeBase = n === 0 ? 0 : bargeN;
  bargeN = n;
  if (n - bargeBase >= cfg.barge) bargeIn();
}
function bargeIn() {
  if (!ttsPlaying) return;
  hush();

  lastHeard = "";
  pauseSTT();
  setTimeout(resumeSTT, 200);

}
function mark(k) { clock[k] = performance.now(); }
function reportTiming() {
  const ms = (a, b) => Math.round(clock[b] - clock[a]);
  const parts = [];
  if (clock.endpoint) parts.push("endpoint " + clock.endpoint + "ms");
  if (clock.firstTok) {
    // split the wait: what Claude spent, and what the trip cost on top
    const think = ms("t0", "firstTok");
    parts.push(clock.claudeMs
      ? "think " + think + "ms (claude " + clock.claudeMs + (clock.via ? " via " + clock.via : "")
        + ", net " + Math.max(0, think - clock.claudeMs) + ")"
      : "think " + think + "ms");

       One slow answer and two dead round trips add up to the same number and
       want completely different fixes. */
    const legs = clock.legs && Object.keys(clock.legs);
    if (legs && legs.length > 1)
      parts.push("tried " + legs.map((k) => k + " " + clock.legs[k] + "ms").join(" then "));
  }
  if (clock.lastTok) parts.push("write " + ms("firstTok", "lastTok") + "ms");
  if (clock.audio) parts.push("voice " + ms("lastTok", "audio") + "ms");
  const total = clock.audio ? ms("t0", "audio") : 0;
  // from when the talking stopped, because that is when the waiting starts
  if (total) parts.push("= " + (total + clock.endpoint) + "ms to first sound");
  lastTiming = parts.join("   ");
  if (!lastTiming) return;
  console.log("orb timing:", lastTiming);
  // append rather than re-render: the reply text lives in the DOM already and
  // this fires after the last caption() call, which would otherwise hide it
  const i = document.createElement("i");
  i.textContent = lastTiming;
  cap.appendChild(i);
}

async function ask(text) {

  clock.endpoint = endpointMs; endpointMs = 0; clock.via = ""; clock.legs = null;

         was standing, and is the kind of gap that reads as the feature being
         broken rather than unwired. */

      body: JSON.stringify({ messages: brain.history, images: imageList || [],

     sound does. Mouthing early and letting audio catch up puts the two out of
     step, which reads worse than the wait. */
  const spoke = await playReply(full);
  // playReply reports once audio starts; without a voice nothing ever would,
  // and the legs before the voice are exactly the ones worth seeing
  if (!spoke) { planSpeech(full); reportTiming(); }
  setState("speaking");
  if (pendingShow) flashAtWord(pendingShow, full, planMs);
  /* Muted. Duet used to pick the longest word out of every reply and spell it,
     which means a picture on every answer whether or not there was anything
     worth picturing -- and the field cannot be a word and a mouth at once, so
     the cost of a picture nobody asked for is the reaction to the voice saying
     it. Drawing a word is worth keeping for when the reply turns on one: a
     name, a colour, a number. That is a judgement, and the longest word in the
     sentence is not it. The machinery stays; nothing calls it. */
  if (cfg.autoWord > 0.5 && echoMode === 2 && !shown) answerVisual(full, planMs);
}

/* A glimpse, timed to the word it is a picture of.

   Two things were wrong with throwing it up as soon as the text arrived. It sat
   there for five seconds, which is most of a spoken reply, and the field cannot
   be a word and a mouth at once -- so the sentence the word was meant to
   punctuate went by with nothing moving. And it appeared at the start whatever
   the word was, when the word it draws is usually somewhere in the middle: shown
   first and said later reads as two unrelated events.

   So it waits for the audio, finds its own word in the reply, and lands there --
   a little early, because a picture arriving with the word reads as arriving
   late. Then it goes, and the mouth has the rest of the sentence back. */
const FLASH_S = 0.55;
function flashAtWord(spec, text, ms) {
  const w = String(text || "").toLowerCase().match(/[a-z']+/g) || [];
  const key = String(spec.text || spec.image || "").toLowerCase().replace(/[^a-z']/g, "");
  let at = key ? w.indexOf(key) : -1;
  // an emoji, or a picture named for something said a different way, has no
  // position in the sentence -- those simply come up now
  const delay = at < 0 || !ms ? 0 : Math.max(0, (at / w.length) * ms - 260);
  clearTimeout(answerAt);
  answerAt = setTimeout(() => {
    if (!((form3d || menuOn) && formWant)) setFormation(spec, FLASH_S);
  }, delay);
}

/* The other half of duet. A trigger word inside the reply wins outright -- it
   says "I'm Glorb" and spells GLORB, says congratulations and the sky goes up --
   and otherwise the longest word carrying any weight stands in for the
   sentence. Timed to where that word actually falls, so the picture and the
   voice land together instead of the picture leading by a sentence. */
const FILLER = new Set(("a about all also am an and any are as at be been but by can could did do does " +
  "for from get got had has have here how i if in is it its just like made make me more most my no not " +
  "now of on one only or our out so some than that the their them then there these they thing things " +
  "this those to too up us very was way we well were what when where which who why will with would you " +
  "your im ive dont thats youre").split(" "));
let answerAt = 0;

function answerVisual(text, ms) {
  const w = String(text || "").toLowerCase().match(/[a-z']+/g);
  if (!w || !w.length) return;
  let at = -1, spec = null;
  for (let i = 0; i < w.length && !spec; i++)
    if (TRIGGERS[w[i]]) { at = i; spec = TRIGGERS[w[i]]; }
  if (!spec) {
    let best = -1;
    for (let i = 0; i < w.length; i++)
      if (w[i].length >= 4 && !FILLER.has(w[i]) && (best < 0 || w[i].length > w[best].length)) best = i;
    if (best < 0) return;
    at = best; spec = { text: w[best].toUpperCase() };
  }
  // the picture has to be up slightly before the word is said, not after it
  const delay = Math.max(0, (at / w.length) * (ms || 0) - 260);
  answerAt = setTimeout(() => {
    if (!((form3d || menuOn) && formWant)) setFormation(spec, FLASH_S);
  }, delay);
}

/* ---------------- voice out ----------------
   The reply is played AND analysed. Once real audio exists there is no reason
   to keep guessing at syllables: the speaking state reads the same five
   channels off its own voice that listening reads off the microphone, which is
   what the drive seam was for. The scripted plan stays as the fallback for
   when no voice is configured or the request fails. */
let ttsCtx = null, ttsAn = null, ttsFreq = null, ttsTime = null, ttsPrev = null;
let ttsGain = null;
let ttsPlaying = false;
const tts = { scale:0, spectrum:new Float32Array(BANDS), turbulence:0, impulse:0, hue:0 };

// Built on a real click, because Safari will not start an AudioContext
// anywhere else -- and by the time the reply lands we are long past the gesture.
function ensureTtsCtx() {
  if (!ttsCtx) {
    ttsCtx = new (window.AudioContext || window.webkitAudioContext)();
    ttsAn = ttsCtx.createAnalyser();
    ttsAn.fftSize = 2048; ttsAn.smoothingTimeConstant = 0.62;

    /* The reply used to go straight from the decoder to the speakers at
       whatever level the voice was rendered at, which is a long way below full
       scale -- a phone at maximum still sounded like someone talking in the
       next room. Boost, then limit: gain alone would just clip the peaks into
       distortion, and a compressor alone cannot make anything louder.

       And then MAKE UP what the limiter took, which is the part that was
       missing. A WebAudio compressor has no makeup gain of its own, so pushing
       harder into a -6 dB ceiling bought a little more average level and gave
       the whole ceiling away: peaks landed at -3 dBFS with the phone at maximum,
       and next to a music track it read as half as loud.

       Measured offline through this exact graph, on a syllable-rate source at
       three different input levels spanning 3.3x:

           before  rms 0.108 / 0.181 / 0.245   spread 2.26x
           after   rms 0.196 / 0.221 / 0.257   spread 1.31x   (music sits at 0.22)

       So the quiet end comes up by 81% and, more useful than the loudness, the
       three land within a third of each other instead of a factor of two. A
       lower threshold with a gentler ratio is what does that -- it is levelling
       rather than limiting, which is the right instrument for a voice whose
       render level nobody controls. Peak 0.93 with no clipped samples.

       The analyser stays where it was, tapping the signal BEFORE all of it. The
       mouth animation is tuned against those numbers, and moving the tap would
       have quietly re-tuned the speaking state along with the volume. */
    ttsGain = ttsCtx.createGain();
    ttsGain.gain.value = cfg.volume;
    const lim = ttsCtx.createDynamicsCompressor();
    lim.threshold.value = -18; lim.knee.value = 2; lim.ratio.value = 8;
    lim.attack.value = 0.003; lim.release.value = 0.25;
    const makeup = ttsCtx.createGain();
    makeup.gain.value = 1.52;
    ttsAn.connect(ttsGain); ttsGain.connect(lim);
    lim.connect(makeup); makeup.connect(ttsCtx.destination);
    ttsFreq = new Uint8Array(ttsAn.frequencyBinCount);
    ttsPrev = new Float32Array(ttsAn.frequencyBinCount);
    ttsTime = new Float32Array(ttsAn.fftSize);
  }
  if (ttsCtx.state === "suspended") ttsCtx.resume();
}

function analyseTts() {
  if (!ttsPlaying || !ttsAn) return;
  ttsAn.getByteFrequencyData(ttsFreq);
  ttsAn.getFloatTimeDomainData(ttsTime);

  let sum = 0, zc = 0, last = ttsTime[0];
  for (let i = 0; i < ttsTime.length; i++) {
    const v = ttsTime[i]; sum += v * v;
    if ((v >= 0) !== (last >= 0)) zc++;
    last = v;
  }
  const rms = Math.sqrt(sum / ttsTime.length);
  const zcr = zc / ttsTime.length;

  // No adaptive floor here: this is a clean rendered file, not a room.
  const db = 20 * Math.log10(rms + 1e-7);
  let lvl = (db + 52) / 34;
  if (lvl < 0) lvl = 0; else if (lvl > 1) lvl = 1;
  const k = lvl > tts.scale ? cfg.attack : cfg.release;
  tts.scale += (lvl - tts.scale) * k;

  const N = ttsFreq.length;
  for (let b = 0; b < BANDS; b++) {
    const lo = Math.floor(Math.pow(b / BANDS, 2) * N);
    const hi = Math.max(lo + 1, Math.floor(Math.pow((b + 1) / BANDS, 2) * N));
    let acc = 0;
    for (let i = lo; i < hi; i++) acc += ttsFreq[i];
    tts.spectrum[b] += (acc / (hi - lo) / 255 - tts.spectrum[b]) * 0.35;
  }
  let cn = 0, cd = 0, flux = 0;
  for (let i = 0; i < N; i++) {
    const val = ttsFreq[i] / 255;
    cn += i * val; cd += val;
    const diff = val - ttsPrev[i];
    if (diff > 0) flux += diff;
    ttsPrev[i] = val;
  }
  let centroid = cd > 0.001 ? cn / cd / N : 0;
  centroid = (centroid - 0.03) / 0.20;
  if (centroid < 0) centroid = 0; else if (centroid > 1) centroid = 1;
  const g = Math.min(1, Math.max(0, (tts.scale - cfg.gateFloor) / 0.12));
  tts.hue += (centroid * g - tts.hue) * 0.06;
  tts.turbulence += (Math.min(1, zcr * 26) * g - tts.turbulence) * 0.16;
  tts.impulse = Math.max(tts.impulse * 0.86, Math.min(1, flux * 0.05) * g);
}

/* ---------------- the mouths ----------------

   These are the Preston Blair chart, which is why there is an `etc` and a
   `rest`: etc is the generic consonant -- C, D, G, K, N, R, S, Th, Y, Z, every
   sound the mouth barely changes for -- and rest is the closed idle. Ten
   shapes has been the working set for hand-drawn animation since the forties
   because it is the fewest that still reads as speech, so it is a good pick to
   have sculpted toward.

   TIMED FROM THE TEXT, ANCHORED TO THE AUDIO. Driving mouths off the live
   waveform alone is the obvious approach and it is the weaker one: a level
   meter knows how LOUD he is, not what he is saying, so you get a mouth
   flapping open and shut in time with the syllables and forming none of them.
   The reply text is known before the audio plays, and the decoded audio knows
   exactly how long it lasts -- so the letters become a sequence of shapes, the
   sequence is stretched to fit the real duration, and the level is used only
   to close the mouth in the gaps the text cannot predict.

   Letters, not phonemes, and that is a real limit: English spelling lies about
   vowels, so "car" and "cat" get the same shape. A proper job wants a
   pronunciation dictionary or the phoneme timings from the voice API. This is
   close enough to tell you whether the idea is worth sculpting for. */
const VIS_DIR = "images/phonemes/";
const VIS_NAMES = ["AI", "E", "O", "U", "WQ", "L", "FV", "MBP", "etc", "rest"];
const VIS_OF = {
  a: "AI", i: "AI", y: "AI",
  e: "E",
  o: "O",
  u: "U",
  w: "WQ", q: "WQ",
  l: "L",
  f: "FV", v: "FV",
  m: "MBP", b: "MBP", p: "MBP"
};
/* How long each shape wants, relative to the others. A vowel is the part of a
   syllable you can hear; a consonant is mostly the move into it. */
const VIS_HOLD = { AI: 2.2, E: 2.0, O: 2.2, U: 2.0, WQ: 1.6, L: 1.2,
                   FV: 1.2, MBP: 1.0, etc: 1.0, rest: 1.6 };
const vis = { on: 0, imgs: {}, seq: null, at0: 0, dur: 0, shape: "rest", el: null, marked: 0,
              mime: 0 };

/* Whether anything on screen is a mouth right now. The image cards were the
   only consumer for a while, so everything downstream gated on vis.on -- the
   card toggle. Then the particle head arrived, ALSO a mouth, and every one of
   those gates silently kept it shut: no marks requested, no timeline built, no
   shape advanced. He replied out loud with a perfectly still face. */
/* Anything with a mouth on it lip-syncs, not just the particle face.

   This used to be `rig.portrait`, which was true when the only rig that could
   talk was the head the particles were made of. It is the wrong question now:
   his own character is going to be a MESH that walks around and answers you,
   and gating the visemes on the particle mode meant the render everyone
   actually looks at stood there with its mouth shut.

   The right question is whether this mesh has the shapes. visRigFind caches
   the map it resolved, so "did four or more of the rig's shapes land on this
   mesh" is already computed by the time anyone asks -- and a figure with no
   mouth simply never qualifies and costs nothing. */
const visMouth = () => {
  const m = glFace();
  return !!(rig.on && m && m.__visMap && Object.keys(m.__visMap).length >= 4);
};
const visLive = () => vis.on || (rig.on && rig.portrait) || visMouth();

function visLoad() {
  if (vis.el) return;
  const wrap = document.getElementById("vis");
  if (!wrap) return;
  for (const n of VIS_NAMES) {
    const im = document.createElement("img");
    im.src = VIS_DIR + n + ".jpg";
    im.alt = n;
    im.draggable = false;
    wrap.appendChild(im);
    vis.imgs[n] = im;
  }
  vis.el = wrap;
  visShow("rest");
}
function visShow(n) {
  if (!vis.el || vis.showing === n) return;
  const prev = vis.imgs[vis.showing], next = vis.imgs[n];
  if (prev) prev.classList.remove("on");
  if (next) next.classList.add("on");
  vis.showing = n;
  const lab = document.getElementById("visLab");
  if (lab) lab.textContent = n + (vis.marked ? "  \u00b7 marks" : "  \u00b7 guessed");
}

/* text -> a sequence of shapes with weights, then stretched onto the clip. */
function visBuild(text, durSec) {
  const seq = [];
  const push = (sh) => {
    // the same shape twice running is one longer shape, not a flicker
    if (seq.length && seq[seq.length - 1].sh === sh) seq[seq.length - 1].w += VIS_HOLD[sh];
    else seq.push({ sh, w: VIS_HOLD[sh] });
  };
  const src = String(text || "").toLowerCase();
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (c >= "a" && c <= "z") push(VIS_OF[c] || "etc");
    else if (/[.,;:!?]/.test(c)) push("rest");
    // a space inside a phrase is not a pause -- no rest for it
  }
  if (!seq.length) { vis.seq = null; return; }
  let tot = 0;
  for (const s2 of seq) tot += s2.w;
  const k = (durSec || 1) / tot;
  let acc = 0;
  for (const s2 of seq) { s2.t0 = acc; acc += s2.w * k; s2.t1 = acc; }
  vis.seq = seq;
  vis.dur = acc;
  vis.marked = 0;
}

/* The real thing: a start and an end for every character, from the engine that
   said them.

   Two problems this fixes that guessing could not. Silent letters get a
   near-zero span -- the "gh" in "through" is not spoken and the timings say so
   -- and letters that share one sound get spans that abut, so "ough" collapses
   into one hold instead of four flickers. Both fall out of MERGING: same shape
   running on is one shape, and anything left under MIN_HOLD is absorbed into
   its neighbour rather than shown for two frames.

   That last rule is most of why the guessed version looked bad. A letter is not
   a sound: "through" is seven letters and three sounds, so an even spread gave
   fourteen shapes a second, which is faster than a mouth moves and reads as
   flicker rather than speech. */
const VIS_MIN_HOLD = 0.055;      // seconds; under this a shape cannot be seen
const VIS_REST_GAP = 0.12;       // a space shorter than this is not a pause

/* A viseme is never worth deleting.

   The old rule dropped any shape shorter than VIS_MIN_HOLD and handed its time to
   whatever came before it. In a real sentence that is catastrophic for short
   words: the "I" in "Hello, I am" is one character, maybe 40ms of audio, with a
   space either side -- so it got absorbed into a rest and the mouth simply did
   not move. "Hello" survived because it is five characters and 400ms. The face
   went dead on exactly the words a face should be most alive on.

   Rests are the compressible thing. A 40ms mouth shape still reads as movement;
   a deleted one reads as a dead face. So: absorb short rests, never short
   visemes, and when a viseme is too brief, borrow the time it needs from a rest
   next to it. Total length is untouched, so the audio stays in sync. */
function visTighten(seq) {
  const out = [];
  for (const e of seq) {
    const prev = out[out.length - 1];
    if (e.sh === "rest" && e.t1 - e.t0 < VIS_MIN_HOLD && prev) { prev.t1 = e.t1; continue; }
    out.push({ sh: e.sh, t0: e.t0, t1: e.t1 });
  }
  for (let i = 0; i < out.length; i++) {
    const e = out[i];
    if (e.sh === "rest" || e.t1 - e.t0 >= VIS_MIN_HOLD) continue;
    let need = VIS_MIN_HOLD - (e.t1 - e.t0);
    const nxt = out[i + 1], prv = out[i - 1];
    if (nxt && nxt.sh === "rest") {
      const give = Math.min(need, Math.max(0, (nxt.t1 - nxt.t0) - 0.02));
      e.t1 += give; nxt.t0 += give; need -= give;
    }
    if (need > 0 && prv && prv.sh === "rest") {
      const give = Math.min(need, Math.max(0, (prv.t1 - prv.t0) - 0.02));
      e.t0 -= give; prv.t1 -= give;
    }
    // no rest to borrow from: a short shape beats no shape
  }
  return out.filter((e) => e.t1 > e.t0);
}

function visFromMarks(a, off, add) {
  const O = off || 0;
  const ch = a.characters || [];
  const t0 = a.character_start_times_seconds || [];
  const t1 = a.character_end_times_seconds || [];
  if (!ch.length || ch.length !== t0.length) { vis.seq = null; return; }
  const seq = [];
  for (let i = 0; i < ch.length; i++) {
    const c = String(ch[i]).toLowerCase();
    const s0 = +t0[i] + O, s1 = +(t1[i] != null ? t1[i] : t0[i]) + O;
    if (!(s1 >= s0)) continue;
    let sh;
    if (c >= "a" && c <= "z") sh = VIS_OF[c] || "etc";
    else if (/[.,;:!?]/.test(c)) sh = "rest";
    // a space inside a phrase is not a pause; only a real gap closes the mouth
    else if (c === " ") { if (s1 - s0 < VIS_REST_GAP) continue; sh = "rest"; }
    else continue;
    const last = seq[seq.length - 1];
    if (last && last.sh === sh) last.t1 = s1;      // one sound, however spelt
    else seq.push({ sh, t0: s0, t1: s1 });
  }
  const out = visTighten(seq);
  /* Appended, not replaced, because a reply is spoken in pieces now and each
     piece brings its own alignment starting from zero. `off` is where that
     piece was actually scheduled, so the timeline stays one continuous thing
     and the mouth never notices there was a seam. */
  vis.seq = add && vis.seq && vis.seq.length ? vis.seq.concat(out)
          : (out.length ? out : null);
  vis.dur = vis.seq && vis.seq.length ? vis.seq[vis.seq.length - 1].t1 : 0;
  vis.marked = 1;
  // at0 is set when the clip actually starts, not here
}

function visFrame() {
  if (!visLive()) return;
  /* vis.shape is computed here whether or not the image card exists -- the 3D
     head reads it too, and routing the shape THROUGH visShow meant no card, no
     shape, no mouth. The card is one consumer, not the pipeline.

     A mime run substitutes for a playing clip: no audio exists, so the level
     gate that closes the mouth between words has nothing to read and is
     skipped. */
  const miming = performance.now() < vis.mime;
  let sh = "rest";
  if ((ttsPlaying || miming) && vis.seq) {
    const t = (performance.now() - vis.at0) / 1000;
    /* The level closes it in the gaps. A written sentence has no silences in
       it -- the pauses a person leaves are between the words, not in the
       spelling -- so a purely text-driven mouth keeps shaping through them. */
    if (t <= vis.dur && (miming || tts.scale >= 0.06)) {
      let lo = 0, hi = vis.seq.length - 1;
      while (lo < hi) { const m = (lo + hi) >> 1; if (vis.seq[m].t1 < t) lo = m + 1; else hi = m; }
      sh = vis.seq[lo].sh;
    }
  }
  vis.shape = sh;
  if (vis.on && vis.el) visShow(sh);
}
function visSet(on) {
  vis.on = on ? 1 : 0;
  if (on) visLoad();
  const w = document.getElementById("visWrap");
  if (w) w.className = on ? "on" : "";
  if (!on) visShow("rest");
}

/* ---------------- driving a face with the same timeline ----------------

   The shape names are the interface. The timeline emits "MBP" or "O"; what
   draws that is a detail, and this is the second implementation of it -- the
   jpgs are the first. Nothing above changes to add a face.

   ARKIT NAMES, deliberately. Apple's 52 are the de facto standard and Character
   Creator, MetaHuman, Ready Player Me and Apple's own capture all ship them, so
   a driver written against those names works on any character that exports
   them. That is the answer to "I would have to sculpt every character": the
   sculpting is per character and it has usually already been done by the tool
   -- what has to be standard is the naming, not the geometry.

   Matched loosely, because exporters prefix and re-case: CC writes things like
   "CC_Base_Body.jawOpen", Blender may write "jawOpen.001". */
const VIS_RIG = {
  rest: {},
  MBP:  { mouthClose: 0.92, mouthPressLeft: 0.35, mouthPressRight: 0.35, jawOpen: 0.04 },
  FV:   { mouthLowerDownLeft: 0.45, mouthLowerDownRight: 0.45, mouthShrugUpper: 0.30, jawOpen: 0.10 },
  E:    { jawOpen: 0.26, mouthStretchLeft: 0.52, mouthStretchRight: 0.52,
          mouthSmileLeft: 0.18, mouthSmileRight: 0.18 },
  AI:   { jawOpen: 0.62, mouthStretchLeft: 0.22, mouthStretchRight: 0.22 },
  O:    { jawOpen: 0.44, mouthFunnel: 0.62, mouthPucker: 0.22 },
  U:    { jawOpen: 0.18, mouthPucker: 0.68, mouthFunnel: 0.38 },
  WQ:   { jawOpen: 0.12, mouthPucker: 0.90, mouthFunnel: 0.30 },
  L:    { jawOpen: 0.34, tongueOut: 0.32, mouthStretchLeft: 0.14, mouthStretchRight: 0.14 },
  etc:  { jawOpen: 0.22, mouthStretchLeft: 0.20, mouthStretchRight: 0.20 }
};
/* Above 1 is legal and is the fix for a head that was scaled up after the
   shapes were made: morph deltas are vertex offsets baked in the base
   proportions and they do NOT rescale when the mesh does, so a bigger head
   wearing the same deltas moves proportionally less. */
const VIS_RIG_GAIN = 1.0;

/* Reallusion's own visemes, and the eight of a purpose-sculpted mesh.

   The ARKit set above has to reconstruct a vowel out of a jaw angle plus a
   pucker plus two stretches. A CC mesh ships shapes that ARE the vowels,
   sculpted one per mouth position, and toon_head carries exactly those. Which
   rig a mesh gets is decided by what the mesh actually has, so a head with
   neither still falls back to ARKit and still works. */
const VIS_RIG_CC = {
  rest: {},
  // V_Explosive is the smallest-displacement shape on the whole mesh -- it
  // refines a closure rather than making one, so Mouth_Close does the pressing
  MBP:  { V_Explosive: 1.00, Mouth_Close: 0.60, Mouth_Press_L: 0.40, Mouth_Press_R: 0.40 },
  FV:   { V_Dental_Lip: 1.00 },
  E:    { V_Wide: 0.88 },
  AI:   { V_Open: 0.90, V_Lip_Open: 0.35 },
  O:    { V_Tight_O: 0.92 },
  U:    { V_Tight_O: 0.55, V_Tight: 0.60 },
  WQ:   { V_Tight: 0.95 },
  L:    { V_Lip_Open: 0.50, V_Tongue_Raise: 0.70, V_Tongue_Out: 0.20 },
  etc:  { V_Affricate: 0.80 }
};
const VIS_RIG_MIN = {
  rest: {}, MBP: { viseme_MBP: 1 }, FV: { viseme_FV: 1 }, E: { viseme_E: 1 },
  AI: { viseme_AI: 1 }, O: { viseme_O: 1 }, U: { viseme_U: 1 }, WQ: { viseme_U: 1 },
  L: { viseme_L: 1 }, etc: { viseme_etc: 1 }
};

/* The jaw is a bone, not a shape. Jaw_Open exists on the CC mesh and moves
   nearly five thousand vertices, but opening it changes the render by 0.2%:
   it tidies lips and cheeks around a jaw that CC_Base_JawRoot is supposed to
   swing. Axis and sign were measured rather than assumed -- 21 degrees about
   each of the bone's local axes, watching where the chin landed. Local Z is
   the hinge; the other two swing it sideways. 21 degrees is the model's own
   authored range, rest to open. */
const VIS_JAW_DEG = 21;
const VIS_JAW = { rest:0.02, MBP:0, FV:0.06, E:0.30, AI:0.85, O:0.55, U:0.22,
                  WQ:0.14, L:0.45, etc:0.28 };
let visJawNow = 0;

const visCanon = (x) => x.toLowerCase().replace(/[^a-z]/g, "")
                         .replace(/left$/, "l").replace(/right$/, "r");

/* Which vocabulary does this mesh speak? Sculpted eight first, then CC's
   visemes, then ARKit parts -- best fit to worst, decided once per mesh. */
function visRigPick(mesh) {
  if (mesh.__visRig) return mesh.__visRig;
  const have = Object.keys(mesh.morphTargetDictionary || {}).map(visCanon);
  const score = (rig) => {
    const want = new Set();
    for (const sh in rig) for (const k in rig[sh]) want.add(visCanon(k));
    let hit = 0;
    for (const w of want) if (have.some((h) => h === w || h.includes(w))) hit++;
    return { hit, of: want.size };
  };
  const a = score(VIS_RIG_MIN), b = score(VIS_RIG_CC);
  const rig = a.hit >= a.of - 1 ? VIS_RIG_MIN : b.hit >= b.of - 2 ? VIS_RIG_CC : VIS_RIG;
  console.log("orb visemes:", rig === VIS_RIG_MIN ? "sculpted eight"
    : rig === VIS_RIG_CC ? "Character Creator" : "ARKit",
    "(sculpted " + a.hit + "/" + a.of + ", CC " + b.hit + "/" + b.of + ")");
  mesh.__visRig = rig;
  return rig;
}

/* Whether the jaw is a BONE or a SHAPE, decided by measurement.

   On the Character Creator base it is a bone: Jaw_Open exists as a shape and
   moves five thousand vertices, but opening it changes the render by 0.2% --
   it tidies lips around a jaw that CC_Base_JawRoot is supposed to swing.

   His own head has no armature at all. The one in the file is four bones baked
   in so the passes that need landmarks have them, and the jaw among them
   carries no weight on purpose, because he authored the opening as a shape.
   Rotating that bone moves nothing, so a rig that only knows about bones sits
   there with its mouth shut.

   Neither is a name you can look up -- both files call it Jaw_Open. So: does
   any vertex actually follow this bone? If none does, the bone is a landmark
   and the shape is the jaw. And the shape is chosen the same way, by reach
   rather than by name: measured on his head, jaw_open moves 0.0515 against
   Character Creator's Jaw_Open at 0.0261 and V_Open at 0.0097, so his custom
   one wins on the numbers as well as on his say-so. */
function visJawDriver(mesh) {
  if (mesh.__visJawKind !== undefined) return mesh.__visJawKind;
  const sk = mesh.skeleton;
  let bone = null, bi = -1;
  if (sk) {
    bi = sk.bones.findIndex((b) => /jaw/i.test(b.name) && !/upper/i.test(b.name));
    if (bi >= 0) bone = sk.bones[bi];
  }
  let weighted = false;
  const si = mesh.geometry && mesh.geometry.attributes.skinIndex;
  const sw = mesh.geometry && mesh.geometry.attributes.skinWeight;
  if (bone && si && sw) {
    for (let v = 0; v < si.count && !weighted; v++)
      for (const c of ["getX", "getY", "getZ", "getW"])
        if (si[c](v) === bi && sw[c](v) > 0.02) { weighted = true; break; }
  }
  let morph = null;
  if (!weighted) {
    const dict = mesh.morphTargetDictionary || {};
    const mt = (mesh.geometry.morphAttributes || {}).position || [];
    let best = 0;
    for (const nm of Object.keys(dict)) {
      if (!/jaw/i.test(nm) || /forward|back|up|down|left|right|_l$|_r$/i.test(nm)) continue;
      const a = mt[dict[nm]]; if (!a) continue;
      let mx = 0;
      for (let v = 0; v < a.count; v++) {
        const d = Math.hypot(a.getX(v), a.getY(v), a.getZ(v));
        if (d > mx) mx = d;
      }
      if (mx > best) { best = mx; morph = nm; }
    }
    if (morph) console.log("orb jaw shape:", morph, "reach", best.toFixed(4),
                           "(the jaw bone moves no vertices)");
  }
  mesh.__visJaw = weighted ? bone : null;
  mesh.__visJawRest = weighted && bone ? bone.quaternion.clone() : null;
  mesh.__visJawMorph = morph;
  if (weighted) console.log("orb jaw bone:", bone.name);
  mesh.__visJawKind = weighted ? "bone" : morph ? "shape" : "none";
  return mesh.__visJawKind;
}
function visJawBone(mesh) {
  visJawDriver(mesh);
  return mesh.__visJaw;
}

function visRigFind(mesh) {
  if (mesh.__visMap) return mesh.__visMap;
  const dict = mesh.morphTargetDictionary || {};
  const keys = Object.keys(dict);
  const map = {};
  const want = new Set();
  const RIG = visRigPick(mesh);
  for (const sh of Object.keys(RIG)) for (const k of Object.keys(RIG[sh])) want.add(k);
  /* Canonicalised on both sides, and the Left/Right suffix is the reason.
     ARKit writes mouthStretchLeft; Character Creator writes mouthStretch_L;
     some exporters write mouthStretch.L. Comparing raw names matched six of
     thirteen and silently dropped every paired shape -- which would have looked
     like a face that opens its jaw and cannot shape a vowel, and would have
     been blamed on the shapes rather than on this. */
  const canon = (x) => x.toLowerCase().replace(/[^a-z]/g, "")
                        .replace(/left$/, "l").replace(/right$/, "r");
  const ck = keys.map(canon);
  for (const w of want) {
    const cw = canon(w);
    let i = ck.indexOf(cw);
    // Several shapes can contain the name we want: CC ships Mouth_Funnel_Up_L
    // and Mouth_Funnel_Down_L next to plain Mouth_Funnel. Taking the first
    // match drove O and U off a corner variant -- which does not look like a
    // bug, it looks like the mesh has bad shapes. Shortest name wins: that is
    // the plain shape, and the longer ones are always the variants.
    if (i < 0) for (let j = 0; j < ck.length; j++)
      if (ck[j].includes(cw) && (i < 0 || ck[j].length < ck[i].length)) i = j;
    if (i >= 0) map[w] = dict[keys[i]];
  }
  mesh.__visMap = map;
  visLipCal(mesh, map);
  return map;
}

/* How far MBP is allowed to push the bottom lip up, as a fraction of the
   mouth's own width. Measured on the Character Creator base the rig's weights
   were tuned against, where MBP lifts it 1.07%. */
const VIS_LIP_MAX = 0.018;
/* Per mesh, once, because a weight in the rig is not a distance.
   VIS_RIG_CC says MBP is V_Explosive at 1.00 plus Mouth_Close at 0.60, and
   those numbers were chosen by looking at ONE face. On that face Mouth_Close
   is a modest press. On his it is the second-largest shape on the mesh -- 0.030
   against V_Explosive's 0.009 -- so the same 0.60 hauls the bottom lip up over
   the top one and the whole mouth reads wrong. Measured: 5.64% of mouth width
   against the base head's 1.07%, and MBP is the ONLY viseme that lifts the lip
   at all; every other one opens the jaw and lowers it.
   So the rig states an intent and the mesh is measured against it. Find the
   mouth (the vertices the mapped lip shapes actually move), find its bottom
   half and its width, work out how far each of MBP's shapes lifts it, and if
   the total overshoots, scale back the shape doing the most lifting -- not all
   of them, or the press that makes an M an M goes with it. A face already
   inside the limit is left exactly as it was. */
function visLipCal(mesh, map) {
  if (mesh.__visLipCal) return;
  mesh.__visLipCal = 1;
  const RIG = visRigPick(mesh);
  const mbp = RIG.MBP;
  const geo = mesh.geometry, pos = geo.attributes.position;
  const mt = (geo.morphAttributes || {}).position || [];
  if (!mbp || !pos || !mt.length) return;
  const reach = new Float32Array(pos.count);
  for (const nm in map) {
    const a = mt[map[nm]]; if (!a) continue;
    for (let v = 0; v < pos.count; v++) {
      const q = Math.hypot(a.getX(v), a.getY(v), a.getZ(v));
      if (q > reach[v]) reach[v] = q;
    }
  }
  const idx = Array.from(reach.keys()).sort((a, b) => reach[b] - reach[a]).slice(0, 700);
  if (idx.length < 40) return;
  let my = 0; for (const v of idx) my += pos.getY(v); my /= idx.length;
  const lo = idx.filter((v) => pos.getY(v) < my);
  if (lo.length < 20) return;
  let xl = 1e9, xh = -1e9;
  for (const v of idx) { const x = pos.getX(v); if (x < xl) xl = x; if (x > xh) xh = x; }
  const w = xh - xl;
  if (!(w > 0)) return;
  // how far each of MBP's shapes lifts the bottom lip, at the weight it is given
  let total = 0, worst = null, worstV = 0;
  for (const nm in mbp) {
    const i = map[nm]; if (i == null || !mt[i]) continue;
    let sy = 0;
    for (const v of lo) sy += mt[i].getY(v);
    const rise = (sy / lo.length) * mbp[nm];
    total += rise;
    if (rise > worstV) { worstV = rise; worst = nm; }
  }
  const frac = total / w;
  if (frac <= VIS_LIP_MAX || !worst || worstV <= 0) {
    console.log("orb lips: MBP lifts", (frac * 100).toFixed(2) + "% of mouth width -- within range");
    return;
  }
  // take the overshoot out of the biggest lifter alone
  const over = total - VIS_LIP_MAX * w;
  const k = Math.max(0, (worstV - over) / worstV);
  const tuned = Object.assign({}, mbp);
  tuned[worst] = mbp[worst] * k;
  mesh.__visRig = Object.assign({}, RIG, { MBP: tuned });
  console.log("orb lips: MBP lifted " + (frac * 100).toFixed(2) + "% of mouth width; "
    + worst + " " + mbp[worst].toFixed(2) + " -> " + tuned[worst].toFixed(2)
    + " brings it to " + (VIS_LIP_MAX * 100).toFixed(1) + "%");
}

/* Eased, not switched -- which is the blending the still pictures cannot have.
   A mouth is already moving toward the next shape before it has finished the
   last one, and that is most of the difference between a slideshow of correct
   poses and something that looks like talking. */
function visRig(dt) {
  const mesh = glFace();
  if (!mesh || !mesh.morphTargetInfluences || !mesh.morphTargetInfluences.length) return;
  const map = visRigFind(mesh);
  const RIG = visRigPick(mesh);
  const shape = visLive() ? vis.shape : "rest";
  const target = RIG[shape] || RIG.rest;
  /* Closing your lips is a movement, not a relaxation. Opening fast and closing
     slow reads well for a face relaxing, and badly for an M: the jaw was still
     degrees open when the closure was over and the lips never met. Any
     commanded shape is reached fast; only the drift back to neutral is lazy. */
  const k = 1 - Math.pow(1 - (shape === "rest" ? 0.28 : 0.50), dt / 16.67);
  for (const name in map) {
    const i = map[name];
    const want = (target[name] || 0) * VIS_RIG_GAIN;
    mesh.morphTargetInfluences[i] += (want - mesh.morphTargetInfluences[i]) * k;
  }
  /* The jaw runs whichever way this mesh opens it. Gating on the BONE was the
     last thing keeping his head's mouth shut: the shape driver was found and
     reported and then never asked for a number, because the line above it
     asked for a bone first and there is not one. */
  if (visJawDriver(mesh) !== "none") {
    const jw = VIS_JAW[shape] != null ? VIS_JAW[shape] : 0;
    visJawNow += (jw - visJawNow) * k;
    visApplyJaw();
  }
}

/* Applied twice a frame on purpose. visRig runs early in the frame; the
   animation mixer runs later (updateWorld) and poses every bone from the dance
   clip, jaw included -- so by the time skinPoints reads the skeleton the jaw
   rotation set here has already been stomped. updateFigure calls this again
   right before it skins, which is after the mixer, which is the write that
   sticks. */
function visApplyJaw() {
  const mesh = glFace();
  if (!mesh || !window.THREE) return;
  const kind = visJawDriver(mesh);
  if (kind === "bone") {
    const jaw = mesh.__visJaw;
    if (!jaw || !mesh.__visJawRest) return;
    jaw.quaternion.copy(mesh.__visJawRest).multiply(new window.THREE.Quaternion()
      .setFromAxisAngle(new window.THREE.Vector3(0, 0, 1),
                        visJawNow * VIS_JAW_DEG * Math.PI / 180));
    return;
  }
  if (kind !== "shape") return;
  /* Written straight onto the influence, after the visemes have laid theirs
     down, for the same reason the bone version runs twice a frame: whatever
     set the mouth shape this frame does not know the jaw is a separate
     channel, and the jaw has to survive it. */
  const i = mesh.morphTargetDictionary[mesh.__visJawMorph];
  if (i != null && mesh.morphTargetInfluences) mesh.morphTargetInfluences[i] = visJawNow;
}

/* ---------------- the boom box ----------------

   One model, four meshes, one blend shape called `speakers` on each of them --
   0 retracted, 1 pushed forward. No animation in the file, which is the right
   way round: an animation would have its own clock and this wants somebody
   else's.

   It stands on the floor of the ROOM rather than being attached to him. gl.root
   carries world.x and world.yaw, so anything parented there walks and turns
   when he does, and a stereo that follows a man around the room is a joke
   rather than a stereo. gl.stage is the room; the box goes there and stays
   where it was put.

   Driven by the ONSET in the bass, not the level. drive.hit is already the
   per-band jump above each band's own smoothed self -- the thing that tells a
   kick from a bass note held through the bar -- and the cones want the kick.
   Fast up, slow down, which is what a speaker cone does. */
const BOX = {
  obj: null, loading: 0, on: 0, pump: 0,
  /* All in his heights. The room is framed far tighter than it looks -- at his
     depth the screen is only about half his height wide either side of him --
     so a stereo an arm's length away is off the edge. Measured: side 0.92 put
     its centre at 1.72 in clip space, well past the 1.0 that is the edge of the
     picture. Standing it further BACK is what brings it in, because perspective
     does the work: at side 0.38 and back 0.6 the whole thing sits inside 0.72
     and it looks like it is in the room rather than pressed against the lens. */
  height: 0.46, side: 0.44, back: -0.72,
  gain: 1.8, fall: 5.5      // how hard the cones move, and how fast they relax
};
function boomBox() {
  if (BOX.obj || BOX.loading || !gl.scene || !window.GLTFLoader) return BOX.obj;
  BOX.loading = 1;
  new window.GLTFLoader().load("models/boom_box.glb", (g) => {
    BOX.obj = g.scene;
    BOX.meshes = [];
    BOX.obj.traverse((o) => {
      if (o.isMesh && o.morphTargetInfluences && o.morphTargetInfluences.length) BOX.meshes.push(o);
      if (o.isMesh) o.frustumCulled = false;
    });
    BOX.obj.visible = false;
    gl.stage.add(BOX.obj);
    /* A pool of its own. The box IS standing on the floor -- same plane as the
       grid and the pool under him -- but it stands further back, where nothing
       is drawn, so it reads as hovering. The floor here is mostly implied by
       the light on it; a thing with no light under it is not on it. Same pool
       the figure gets, smaller. */
    BOX.pool = makePool(window.THREE);
    gl.stage.add(BOX.pool);
    BOX.loading = 0;
  }, null, () => { BOX.loading = 0; });
  return null;
}

/* Called every frame from the same place the floor and the pool are placed. */
function boomBoxFrame(dt) {
  const want = (world.seq && world.on > 0.5) ? 1 : 0;
  if (want && !BOX.obj) boomBox();
  BOX.on += (want - BOX.on) * (1 - Math.pow(1 - 0.06, dt / 16.67));
  if (!BOX.obj) return;
  if (BOX.on < 0.002) {
    BOX.obj.visible = false;
