<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#0B0B0B;overflow:hidden;
    font-family:'DM Mono',ui-monospace,monospace;-webkit-tap-highlight-color:transparent}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:fixed;left:14px;top:calc(14px + env(safe-area-inset-top));
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:#4A4A4A;pointer-events:none}
  #meter{position:fixed;left:14px;top:calc(32px + env(safe-area-inset-top));
    font-size:10px;letter-spacing:.1em;color:#3E4A38;pointer-events:none;white-space:pre}
  #tr{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;display:flex;gap:7px}
  button{background:rgba(15,15,15,.85);border:1px solid #262626;color:#7A7A7A;
    font-family:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    padding:7px 12px;border-radius:4px;cursor:pointer}
  button:hover,button:focus-visible{border-color:#C8F49A;color:#E8FFD2}
  button.on{color:#C8F49A;border-color:#C8F49A}
  #err{position:fixed;top:calc(52px + env(safe-area-inset-top));right:14px;left:14px;
    max-width:340px;margin-left:auto;background:rgba(40,16,16,.94);border:1px solid #4A2020;
    color:#D89A94;font-size:11.5px;line-height:1.55;padding:11px 13px;border-radius:6px;display:none}
  /* bottom sheet — the orb stays visible above it while you tune */
  #panel{position:fixed;left:0;right:0;bottom:0;
    background:rgba(10,10,10,.93);border-top:1px solid #2A2A2A;
    border-radius:14px 14px 0 0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));
    max-height:42vh;overflow-y:auto;display:none;
    -webkit-overflow-scrolling:touch;touch-action:pan-y;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    box-shadow:0 -14px 40px rgba(0,0,0,.55)}
  #panel::before{content:"";display:block;width:34px;height:3px;border-radius:2px;
    background:#333;margin:0 auto 12px}
  @media (min-width:900px){
    #panel{left:auto;right:14px;bottom:14px;width:370px;border-radius:10px;
      border:1px solid #2A2A2A;max-height:78vh}
  }
  .grp{margin-bottom:13px}
  .grp>h3{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:#C8F49A;
    margin-bottom:10px;opacity:.75;font-weight:400}
  .sl{margin-bottom:9px}
  .sl .t{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.08em;
    text-transform:uppercase;color:#6B6B6B;margin-bottom:2px}
  .sl .t b{color:#C8F49A;font-weight:400}
  /* touch-action:none is what lets you DRAG the thumb on iOS instead of
     only tapping the track — without it Safari claims the gesture. */
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;
    background:transparent;outline:none;touch-action:none;margin:0}
  input[type=range]::-webkit-slider-runnable-track{height:2px;background:#2E2E2E;border-radius:2px}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
    margin-top:-10px;border-radius:50%;background:#C8F49A;cursor:pointer;
    box-shadow:0 1px 5px rgba(0,0,0,.6)}
  input[type=range]::-moz-range-track{height:2px;background:#2E2E2E;border-radius:2px}
  input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;
    background:#C8F49A;border:none;cursor:pointer}
  #row{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px solid #1E1E1E}
  .brow{display:flex;gap:8px;flex-wrap:wrap}
  input[type=text]{width:100%;background:#101010;border:1px solid #2A2A2A;color:#9A9A9A;
    font-family:inherit;font-size:11px;padding:7px 9px;border-radius:4px;margin-bottom:8px}
  input[type=text]:focus{outline:none;border-color:#C8F49A;color:#E8FFD2}
  #cap{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));
    font-size:12px;line-height:1.5;color:#6B6B6B;pointer-events:none;text-align:center;
    max-width:520px;margin:0 auto}
  #cap b{display:block;color:#C8F49A;font-weight:400;margin-bottom:3px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">— fps</div>
<div id="meter"></div>
<div id="tr">
  <button id="micBtn">enable mic</button>
  <button id="frzBtn" style="display:none">freeze</button>
  <button id="tuneBtn">tune</button>
</div>
<div id="err"></div>
<div id="cap"></div>
<div id="panel"></div>

<script>
"use strict";
const BANDS = 64, TAU = Math.PI * 2;

const DEFAULTS = {
  count:399, radius:0.19, rateX:14000, rateY:23500, bloom:0.43, fit:0.75, contain:0.56,
  shape:2.35, shapeGain:1.35, core:0.18, coreR:0.18,
  speedLo:1, speedHi:3, forceRatio:0.195, fleeRadius:180, fleeMult:4.6,
  rmsGain:1.2, specGain:0.7, membrane:0.8, ellipse:0.4, jaw:0.8, gate:1.0, gateFloor:0.06,
  kickShape:1.0,
  falloffGain:1.7, turbGain:1.1, impulseGain:2.7, hueGain:2.55,
  attack:0.35, release:0.11, dbMargin:12, dbRange:34,
  dot:0.35, sizeHi:32, falloff:210, follow:1.0, split:0.46,
  splitEll:1.6, splitJaw:0.35, splitShape:1.0,
  trail:0.76, rK:-0.5, gK:7, bK:-2, base:120,
  vadOn:0.14, holdMs:700, thinkMs:1500, speakMs:2800, sylRate:4.2
};
const cfg = Object.assign({}, DEFAULTS);

/* Named looks. Each is applied over DEFAULTS, so a preset only has to list what
   it changes. Reconstructed from the commits they were first rendered at and
   re-verified against this build -- the neutralisers matter, since anything
   added later (the deformable split, the growth term, the deform gate) will
   quietly alter a look that predates it. */
const PRESETS = {
  base: {},
  // shaped silhouette: low bloom so the target reads as a line, heavy membrane
  // to hold particles on it, gate 0 so the resting orb keeps its stretch
  shaped: {
    count:570, radius:0.30, rateX:23000, rateY:6500, bloom:0.25, fit:1.19, contain:0.86,
    shape:1, shapeGain:0, core:0, coreR:0.18, kickShape:0, speedLo:3.5, speedHi:19.5, forceRatio:0.045,
    fleeRadius:100, fleeMult:1.8, rmsGain:1.15, specGain:0.65, membrane:1.1,
    ellipse:0.45, jaw:0, gate:0, falloffGain:1.7, turbGain:1.6, impulseGain:2.7,
    hueGain:2.55, attack:0.35, release:0.31, dot:1.0, sizeHi:26, falloff:45,
    follow:0, split:0.46, splitEll:0, splitJaw:0, splitShape:0,
    trail:0.41, rK:-0.5, gK:7, bK:-2, base:130
  },
  // lips: mouth silhouette with a hard centroid ellipse. falloffGain 0 keeps the
  // split at a plain fraction of the ring, which is what this was built against
  mouth: {
    count:900, radius:0.16, rateX:14000, rateY:23500, bloom:0.60, fit:0.75, contain:0.56,
    shape:7, shapeGain:0, core:0, coreR:0.18, kickShape:0, speedLo:1, speedHi:3, forceRatio:0.18,
    fleeRadius:200, fleeMult:4.6, rmsGain:0.9, specGain:0.7, membrane:0.5,
    ellipse:1.8, jaw:1.2, gate:1, falloffGain:0, turbGain:1.1, impulseGain:2.7,
    hueGain:2.55, attack:0.35, release:0.11, dot:0.65, sizeHi:26, falloff:70,
    follow:1, split:0.46, splitEll:0, splitJaw:0, splitShape:0,
    trail:0.46, rK:-0.5, gK:7, bK:-2, base:120
  }
};

/* the only channel audio has into physics */
const drive = { scale:0, spectrum:new Float32Array(BANDS), turbulence:0, impulse:0, hue:0 };

/* ---------------- states ----------------
   idle | listening | thinking | speaking. Every state writes the SAME five
   channels; the visual system never learns which one is talking. That is the
   entire point of the seam -- listening fills them from the microphone, the
   other three from script, and physics cannot tell the difference.

   mic is where analyse() puts its results now. Keeping it separate from drive
   is what lets voice-activity detection keep running while a scripted state
   owns the visuals -- otherwise the orb could never hear you interrupt it. */
const mic  = { scale:0, spectrum:new Float32Array(BANDS), turbulence:0, impulse:0, hue:0 };
const srcD = { scale:0, spectrum:new Float32Array(BANDS), turbulence:0, impulse:0, hue:0 };
const fromD = { scale:0, spectrum:new Float32Array(BANDS), turbulence:0, impulse:0, hue:0 };

const STATES = ["idle", "listening", "thinking", "speaking"];
const BLEND = 260;                       // ms to cross-fade on a state change
let state = "idle", stateT = 0, blendT = 1e9;
let manual = false, heardVoice = false, quietT = 0;

function setState(next) {
  if (next !== state) {
    // snapshot what physics is currently seeing, and ease off it rather than
    // snapping -- a hard cut between sources reads as a glitch, not a mood
    fromD.scale = drive.scale; fromD.hue = drive.hue;
    fromD.turbulence = drive.turbulence; fromD.impulse = drive.impulse;
    fromD.spectrum.set(drive.spectrum);
    state = next; stateT = 0; blendT = 0;
    if (next === "listening") { heardVoice = false; quietT = 0; }
  }
  syncStateBtns();
}

// deterministic per-syllable noise, so speech has structure instead of jitter
const hash = (i) => { const v = Math.sin(i * 12.9898) * 43758.5453; return v - Math.floor(v); };

/* Vowel -> centroid. These are not arbitrary: /i/ and /e/ carry a high second
   formant and spread the lips, /o/ and /u/ are low and round them. Feeding real
   vowels into the hue channel means the mouth shapes the actual words. */
const VOWEL_TONE = { a:0.42, e:0.86, i:0.95, o:0.24, u:0.12, y:0.72 };
let plan = null, planMs = 0;

function planSpeech(text) {
  const out = [];
  for (const word of String(text).toLowerCase().split(/\s+/)) {
    let n = 0, prevVowel = false;
    for (const ch of word) {
      const v = VOWEL_TONE[ch];
      if (v === undefined) { prevVowel = false; continue; }
      if (!prevVowel) { out.push({ v, pause:false }); n++; }  // a vowel run is one syllable
      prevVowel = true;
    }
    // Speech pauses at punctuation, not between every word. A gap per word makes
    // a short sentence take half again as long as it should to say.
    if (n && /[,.;:!?]$/.test(word)) out.push({ v:0.3, pause:true });
  }
  plan = out.length ? out : null;
  planMs = plan ? (plan.length / cfg.sylRate) * 1000 : 0;
}

function srcIdle(t) {
  srcD.scale = 0.05 + 0.035 * Math.sin(t * 0.6);
  srcD.hue = 0.05 + 0.05 * Math.sin(t * 0.17);
  srcD.turbulence = 0.02;
  srcD.impulse = 0;
  for (let b = 0; b < BANDS; b++) srcD.spectrum[b] = 0.04 + 0.03 * Math.sin(b * 0.25 + t * 0.7);
}

function srcThinking(t) {
  // a bright lobe orbits the ring. Nothing about it is random, which is what
  // makes it read as working on something rather than reacting to something.
  const pos = (t * 0.55 % 1) * BANDS;
  for (let b = 0; b < BANDS; b++) {
    let d = Math.abs(b - pos); if (d > BANDS / 2) d = BANDS - d;
    srcD.spectrum[b] = 0.10 + 0.85 * Math.exp(-(d * d) / 26);
  }
  srcD.scale = 0.34 + 0.10 * Math.sin(t * 2.1);
  srcD.hue = 0.5 + 0.42 * Math.sin(t * 0.42);      // sweeps shape and palette
  srcD.turbulence = 0.06;
  srcD.impulse = Math.max(0, Math.sin(t * 2.1)) * 0.10;
}

function srcSpeaking(t) {
  /* A syllable clock, not a noise generator. Each slot gets an envelope, a
     vowel and a chance of being a pause, so the rhythm reads as speech. The
     vowel drives hue, which is the centroid channel -- so the mouth widens and
     the silhouette morphs per syllable exactly as they would on real audio. */
  const sy = t * cfg.sylRate;
  const idx = Math.floor(sy), f = sy - idx;
  // With a plan the syllables are the reply's own; without one it falls back to
  // the scripted babble, which is what runs when no brain is wired up.
  const step = plan ? (idx < plan.length ? plan[idx] : { v:0.3, pause:true }) : null;
  const voiced = step ? !step.pause : hash(idx) > 0.2;
  const env = voiced ? Math.pow(Math.sin(Math.PI * Math.min(1, f * 1.3)), 0.75) : 0;
  const vowel = step ? step.v : hash(idx * 7 + 3);
  const sib = hash(idx * 3 + 11) > 0.65;           // sibilant syllables hiss

  srcD.scale = 0.12 + 0.72 * env;
  srcD.hue += (vowel * env - srcD.hue) * 0.25;
  srcD.turbulence = 0.10 + 0.55 * (sib ? env : 0);
  srcD.impulse = (voiced && f < 0.16) ? 0.9 : srcD.impulse * 0.86;
  for (let b = 0; b < BANDS; b++) {
    const fb = b / BANDS;
    const f1 = Math.exp(-Math.pow((fb - 0.06) / 0.05, 2));               // voice bar
    const f2 = Math.exp(-Math.pow((fb - (0.12 + vowel * 0.45)) / 0.09, 2)); // formant
    srcD.spectrum[b] = env * (0.85 * f1 + 0.6 * f2);
  }
}

function updateState(dt) {
  stateT += dt; blendT += dt;

  if (!manual) {
    // barge-in: voice wins from any state, so it can be interrupted mid-sentence
    if (A && mic.scale > cfg.vadOn) {
      if (state !== "listening") setState("listening");
      heardVoice = true; quietT = 0;
    } else if (state === "listening") {
      quietT += dt;
      if (heardVoice && quietT > cfg.holdMs) setState("thinking");
      else if (!heardVoice && quietT > cfg.holdMs * 3) setState("idle");
    } else if (state === "thinking" && stateT > cfg.thinkMs) {
      // a real request in flight owns the thinking state -- it ends when the
      // reply lands, not when a timer says so
      if (!brain.busy) setState("speaking");
    } else if (state === "speaking" && stateT > (planMs || cfg.speakMs)) {
      plan = null; planMs = 0;
      setState(A ? "listening" : "idle");
    }
  }

  const t = stateT / 1000;
  if (state === "listening") {
    srcD.scale = mic.scale; srcD.hue = mic.hue;
    srcD.turbulence = mic.turbulence; srcD.impulse = mic.impulse;
    srcD.spectrum.set(mic.spectrum);
  } else if (state === "idle") {
    /* A live mic still drives the visuals while idle. Idle means nobody has
       said anything yet -- not that the orb has stopped hearing. Routing idle
       through the scripted breath made it deaf to everything under vadOn and
       painted constants over the tuned resting state. The breath is only for
       when there is no audio source at all. */
    if (A) {
      srcD.scale = mic.scale; srcD.hue = mic.hue;
      srcD.turbulence = mic.turbulence; srcD.impulse = mic.impulse;
      srcD.spectrum.set(mic.spectrum);
    } else srcIdle(t);
  }
  else if (state === "thinking") srcThinking(t);
  else srcSpeaking(t);

  let f = blendT / BLEND; if (f > 1) f = 1;
  const e = f * f * (3 - 2 * f);
  drive.scale += (srcD.scale - drive.scale) * e;
  drive.hue += (srcD.hue - drive.hue) * e;
  drive.turbulence += (srcD.turbulence - drive.turbulence) * e;
  drive.impulse += (srcD.impulse - drive.impulse) * e;
  for (let b = 0; b < BANDS; b++)
    drive.spectrum[b] += (srcD.spectrum[b] - drive.spectrum[b]) * e;
}

/* ---------------- brain ----------------
   Speech in via the browser's own recogniser, thinking out to Claude through a
   proxy, and the reply drives the speaking state. The API key is deliberately
   NOT here: this page is served from GitHub Pages, so anything in it is public
   and a leaked key is billable. worker/ holds the proxy that keeps it server
   side. With no endpoint configured everything below stays dormant and the
   scripted states run instead. */
const cap = document.getElementById("cap");
const brain = {
  url: (() => { try { return localStorage.getItem("orbBrain") || ""; } catch (e) { return ""; } })(),
  history: [],
  busy: false
};

function caption(said, said2) {
  cap.innerHTML = "";
  if (said) { const b = document.createElement("b"); b.textContent = said; cap.appendChild(b); }
  if (said2) cap.appendChild(document.createTextNode(said2));
}

async function ask(text) {
  if (brain.busy) return;
  caption(text, "");
  if (!brain.url) { setState("thinking"); return; }   // scripted reply, no brain wired

  brain.busy = true;
  brain.history.push({ role:"user", content:text });
  // the proxy is stateless, so trimming here is what bounds the token bill
  if (brain.history.length > 20) brain.history.splice(0, brain.history.length - 20);
  setState("thinking");

  let full = "";
  try {
    const res = await fetch(brain.url, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ messages: brain.history })
    });
    if (!res.ok) throw new Error("HTTP " + res.status + " " + (await res.text()).slice(0, 120));

    const reader = res.body.getReader(), dec = new TextDecoder();
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      full += dec.decode(value, { stream:true });
      caption(text, full);
      // start the mouth on the first clause rather than waiting for the full
      // reply -- that wait is the difference between a conversation and a query
      planSpeech(full);
      if (state !== "speaking" && full.length > 12) setState("speaking");
    }
    brain.history.push({ role:"assistant", content: full });
  } catch (err) {
    full = "I couldn't reach my brain.";
    caption(text, full + "  (" + err.message + ")");
    brain.history.pop();
  }

  brain.busy = false;
  planSpeech(full);
  if (state !== "speaking") setState("speaking");
}

/* Recognition is the browser's, not ours -- no key, no proxy. Safari on iOS
   supports it but is stricter about the gesture and drops the session more
   often, hence the restart in onend. */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recOn = false;

function toggleSTT() {
  if (recOn) { recOn = false; if (rec) rec.stop(); talkBtn.classList.remove("on"); talkBtn.textContent = "talk"; return; }
  if (!SR) { caption("", "this browser has no speech recognition"); return; }
  rec = new SR();
  rec.continuous = true; rec.interimResults = true; rec.lang = "en-US";
  rec.onresult = (e) => {
    let heard = "";
    for (let i = e.resultIndex; i < e.results.length; i++)
      if (e.results[i].isFinal) heard += e.results[i][0].transcript;
    heard = heard.trim();
    if (heard) ask(heard);
  };
  rec.onerror = (e) => { if (e.error !== "no-speech") caption("", "speech error: " + e.error); };
  rec.onend = () => { if (recOn) { try { rec.start(); } catch (e) {} } };  // Chrome ends sessions on its own
  try { rec.start(); } catch (e) {}
  recOn = true; talkBtn.classList.add("on"); talkBtn.textContent = "listening";
}

/* ---------------- controls ---------------- */
const SPEC = [
  ["state", [
    ["vadOn","voice threshold",0.02,0.6,0.01],
    ["holdMs","silence hold ms",100,3000,50],
    ["thinkMs","think ms",200,6000,100],
    ["speakMs","speak ms",500,10000,100],
    ["sylRate","syllables / sec",1,8,0.1]]],
  ["audio drive", [
    ["rmsGain","rms → size",0,4,0.05],
    ["specGain","spectrum → ring",0,2.5,0.05],
    ["membrane","membrane",0,3,0.05],
    ["falloffGain","rms → colour split",0,4,0.05],
    ["turbGain","sibilance → turbulence",0,4,0.1],
    ["impulseGain","onset → impulse",0,5,0.1],
    ["kickShape","kick along shape",0,1,0.02],
    ["hueGain","centroid → hue",0,4,0.05],
    ["shapeGain","centroid → shape",0,4,0.05],
    ["ellipse","centroid → ellipse",0,2.5,0.05],
    ["jaw","level → jaw",0,2,0.05],
    ["gate","deform gate",0,1,0.02],
    ["gateFloor","noise gate",0,0.3,0.005],
    ["dbMargin","gate above room",0,30,0.5],
    ["dbRange","dynamic range dB",6,60,1],
    ["attack","attack",0.05,1,0.01],
    ["release","release",0.01,0.5,0.01]]],
  ["form", [
    ["count","count",200,6000,1],
    ["radius","radius",0.05,0.6,0.01],
    ["bloom","bloom",0,1,0.01],
    ["fit","fit to screen",0.5,1.2,0.01],
    ["contain","contain",0.3,1,0.02],
    ["shape","shape",0,8,0.01],
    ["core","core share",0,0.6,0.01],
    ["coreR","core radius",0.05,0.6,0.01],
    ["rateX","rate x",2000,60000,500],
    ["rateY","rate y",2000,60000,500]]],
  ["motion", [
    ["speedLo","speed lo",1,30,0.5],
    ["speedHi","speed hi",1,40,0.5],
    ["forceRatio","force ratio",0.005,0.3,0.005],
    ["fleeRadius","flee radius",0,400,10],
    ["fleeMult","flee mult",0,6,0.1]]],
  ["size & colour", [
    ["dot","dot size",0.1,4,0.05],
    ["sizeHi","size hi",2,80,1],
    ["falloff","falloff",20,600,5],
    ["follow","split follows size",0,1,0.02],
    ["split","split at",0.1,2,0.02],
    ["splitEll","centroid → split wide",0,2.5,0.05],
    ["splitJaw","level → split tall",0,2,0.05],
    ["splitShape","split follows shape",0,1,0.02],
    ["trail","trail",0.02,1,0.01],
    ["rK","red k",-20,20,0.5],
    ["gK","green k",-20,20,0.5],
    ["bK","blue k",-20,20,0.5],
    ["base","base",0,255,5]]]
];

const panel = document.getElementById("panel");
const readouts = {};
SPEC.forEach(([title, rows]) => {
  const g = document.createElement("div"); g.className = "grp";
  g.innerHTML = "<h3>" + title + "</h3>";
  rows.forEach(([key, label, min, max, step]) => {
    const d = document.createElement("div"); d.className = "sl";
    d.innerHTML = '<div class="t"><span>' + label + '</span><b></b></div>';
    const inp = document.createElement("input");

/* ---------------- audio ---------------- */
let A = null, frozen = false;
const errBox = document.getElementById("err");
const micBtn = document.getElementById("micBtn");
const frzBtn = document.getElementById("frzBtn");

const meter = document.getElementById("meter");

micBtn.onclick = async () => {
  micState = "asking"; micBtn.textContent = "…";
  errBox.style.display = "none";
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      throw new Error("getUserMedia unavailable — needs https or localhost");
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation:false, noiseSuppression:false, autoGainControl:false }
    });

    await ac.resume();
    const an = ac.createAnalyser();
    an.fftSize = 2048; an.smoothingTimeConstant = 0.62;
    ac.createMediaStreamSource(stream).connect(an);
    A = { ac, an, stream,
      freq:new Uint8Array(an.frequencyBinCount),
      prev:new Float32Array(an.frequencyBinCount),
      time:new Float32Array(an.fftSize), floorDb:-55, db:-99 };
    micState = "live";
    micBtn.style.display = "none";
    frzBtn.style.display = "";
    analyse();
  } catch (e) {
    micState = "denied";
    micBtn.textContent = "retry mic";
    errBox.style.display = "block";
    errBox.textContent = (e.name || "Error") + ": " + (e.message || String(e));

};
frzBtn.onclick = () => {

  frzBtn.textContent = frozen ? "frozen" : "freeze";
  frzBtn.classList.toggle("on", frozen);

function analyse() {
  if (A && !frozen) {
    A.an.getByteFrequencyData(A.freq);
    A.an.getFloatTimeDomainData(A.time);

    let sum = 0, zc = 0, last = A.time[0];
    for (let i = 0; i < A.time.length; i++) {
      const s = A.time[i]; sum += s * s;
      if ((s >= 0) !== (last >= 0)) zc++;
      last = s;
    }
    const rms = Math.sqrt(sum / A.time.length);
    const zcr = zc / A.time.length;

    /* Loudness is logarithmic and RMS is not. Conversational speech is about
       -30 dBFS, i.e. rms ~0.03, which min(1, rms*6) turned into 0.19 while a
       shout pinned it at 1.0 -- so the form only woke up for shouting even
       though the spectrum bars, which are already dB-scaled by
       getByteFrequencyData, looked perfectly lively. Work in dB instead.

       The floor tracks the room: down fast so a pause recalibrates it in a
       third of a second, up slowly so speech itself cannot desensitise it.
       That makes the response relative to ambient rather than absolute, which
       is what keeps a quiet room from being twitchy and a noisy one from being
       dead. */
    const db = 20 * Math.log10(rms + 1e-7);
    A.db = db;
    A.floorDb += (db - A.floorDb) * (db < A.floorDb ? 0.05 : 0.0006);

    const lo = A.floorDb + cfg.dbMargin;
    let lvl = (db - lo) / cfg.dbRange;
    if (lvl < 0) lvl = 0; else if (lvl > 1) lvl = 1;

    // compare like with like: rms is 0-0.3 but mic.scale is 0-1, so the old
    // test went permanently false above 0.3 and attack was never once applied
    const k = lvl > mic.scale ? cfg.attack : cfg.release;
    mic.scale += (lvl - mic.scale) * k;

    const N = A.freq.length;
    for (let b = 0; b < BANDS; b++) {
      const lo = Math.floor(Math.pow(b / BANDS, 2) * N);
      const hi = Math.max(lo + 1, Math.floor(Math.pow((b + 1) / BANDS, 2) * N));
      let acc = 0;
      for (let i = lo; i < hi; i++) acc += A.freq[i];
      const bandVal = acc / (hi - lo) / 255;
      mic.spectrum[b] += (bandVal - mic.spectrum[b]) * 0.35;
    }
    let cn = 0, cd = 0, flux = 0;
    for (let i = 0; i < N; i++) {
      const val = A.freq[i] / 255;
      cn += i * val; cd += val;
      const diff = val - A.prev[i];
      if (diff > 0) flux += diff;
      A.prev[i] = val;
    }
    let centroid = cd > 0.001 ? cn / cd / N : 0;
    // speech centroid lives around 0.03-0.25 normalised; stretch it so the
    // mapping actually uses its full range instead of the bottom tenth
    centroid = (centroid - 0.03) / 0.20;
    if (centroid < 0) centroid = 0; else if (centroid > 1) centroid = 1;

    /* Noise gate. Below the floor there is no signal, only room tone -- and all
       three timbre channels read HIGH on near-silence, not low: zero-crossing
       rate is high for low-level noise, flux fires on FFT jitter, and the
       centroid of noise is arbitrary. Ungated that means turbulence and impulse
       sit near 1.0 at lvl 0.00 and blow the orb into the containment wall on
       nothing at all. scale and spectrum are already amplitude-proportional, so
       only these three need gating. */
    let g = (mic.scale - cfg.gateFloor) / 0.12;
    if (g < 0) g = 0; else if (g > 1) g = 1;

    mic.hue += (centroid * g - mic.hue) * 0.06;
    mic.turbulence += (Math.min(1, zcr * 26) * g - mic.turbulence) * 0.16;
    mic.impulse = Math.max(mic.impulse * 0.86, Math.min(1, flux * 0.05) * g);
  } else if (A) {
    mic.impulse *= 0.9;
  }
  requestAnimationFrame(analyse);
}

/* ---------------- physics + render ---------------- */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha:false });
const dpr = Math.min(window.devicePixelRatio || 1, 2);
let W = 0, H = 0, cx = 0, cy = 0, scale = 1;

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

/* ---------------- shapes ---------------- */
/* The silhouette is not drawn anywhere — size and colour key off distance from
   centre, so concentric bands are all you ever get from a circular target.
   The only thing that decides the outline is the target itself, so make it a
   radial function r(theta) and morph between them. Audio picks the blend, so
   states stay defined instead of dissolving into displacement. */
const SHAPE_N = 256;
/* r peaks where cos(a - half) is smallest, i.e. a = 0 -- so rot = PI/2 puts a
   vertex at the top of the screen and rot = PI/2 + PI/sides puts a flat edge
   there. Every shape is normalised to a peak radius of 1 so swapping one in
   never changes how far the orb reaches. */
function polyR(t, sides, rot) {
  const seg = TAU / sides, half = Math.PI / sides;
  let a = (t + rot) % seg; if (a < 0) a += seg;
  return Math.cos(half) / Math.cos(a - half);
}
function lobeR(t, k, amp) {
  return (1 + amp * Math.cos(k * (t + Math.PI / 2))) / (1 + amp);
}
const SHAPES = [
  () => 1,                                            // circle
  (t) => polyR(t, 3, Math.PI / 2),                    // triangle, point up
  (t) => polyR(t, 4, Math.PI / 2 + Math.PI / 4),      // square, flat top
  (t) => polyR(t, 5, Math.PI / 2),                    // pentagon, point up
  (t) => polyR(t, 6, Math.PI / 2 + Math.PI / 6),      // hexagon, flat top
  (t) => 0.44 + 0.56 * Math.pow(0.5 + 0.5 * Math.cos(5 * (t + Math.PI / 2)), 0.55),  // star
  (t) => lobeR(t, 6, 0.42),                           // rosette / overlapping circles
  // mouth: |sin| kinks where sin crosses zero, so the corners come out as
  // cusps at left and right — a lens, not a squashed circle. ellipse and jaw
  // then work it like lips.
  (t) => 1 - 0.62 * Math.pow(Math.abs(Math.sin(t)), 0.72)
];
const shapeTab = SHAPES.map((fn) => {
  const tab = new Float32Array(SHAPE_N);
  for (let i = 0; i < SHAPE_N; i++) tab[i] = fn(i / SHAPE_N * TAU);
  return tab;
});
const shapeLut = new Float32Array(SHAPE_N);
let lastMorph = -999;
function buildShapeLut(m) {
  const len = SHAPES.length;
  let w = m % len; if (w < 0) w += len;
  const i0 = w | 0, i1 = (i0 + 1) % len;
  const f = w - i0, e = f * f * (3 - 2 * f);   // smoothstep, so morphs ease in
  const ta = shapeTab[i0], tb = shapeTab[i1];
  for (let i = 0; i < SHAPE_N; i++) shapeLut[i] = ta[i] + (tb[i] - ta[i]) * e;
}
buildShapeLut(0);

const MAX = 6000;
const px = new Float32Array(MAX), py = new Float32Array(MAX);
const vx = new Float32Array(MAX), vy = new Float32Array(MAX);
const bx = new Float32Array(MAX), by = new Float32Array(MAX);
const mSpd = new Float32Array(MAX);
const bnd = new Float32Array(MAX);
const pr = new Float32Array(MAX);

function buildBase(cnt) {
  for (let i = 0; i < cnt; i++) {
    const a = (i / cnt) * TAU;
    bx[i] = Math.cos(a); by[i] = Math.sin(a);
  }
}
let seeded = false;
function seedNear(cnt, spawnR) {
  for (let i = 0; i < cnt; i++) {
    const a = Math.random() * TAU;
    const r = spawnR * (0.2 + Math.random() * 0.9);
    px[i] = cx + Math.cos(a) * r; py[i] = cy + Math.sin(a) * r;
    vx[i] = vy[i] = 0;
  }
}

const LUT_N = 96;
let LUT_LO = -90, LUT_HI = 40;
const lut = new Array(LUT_N);
function toRgb(cr, cg, cb, hueShift) {
  cr /= 255; cg /= 255; cb /= 255;
  const mx = Math.max(cr, cg, cb), mn = Math.min(cr, cg, cb), dd = mx - mn;
  const l = (mx + mn) / 2;
  const s = dd === 0 ? 0 : dd / (1 - Math.abs(2 * l - 1));
  let h = 0;
  if (dd !== 0) {
    if (mx === cr) h = ((cg - cb) / dd) % 6;
    else if (mx === cg) h = (cb - cr) / dd + 2;
    else h = (cr - cg) / dd + 4;
  }
  h = (h * 60 + hueShift + 360) % 360;
  const c2 = (1 - Math.abs(2 * l - 1)) * s;
  const x = c2 * (1 - Math.abs(((h / 60) % 2) - 1));
  const m = l - c2 / 2;
  let R = 0, G = 0, B = 0;
  if (h < 60) { R = c2; G = x; } else if (h < 120) { R = x; G = c2; }
  else if (h < 180) { G = c2; B = x; } else if (h < 240) { G = x; B = c2; }
  else if (h < 300) { R = x; B = c2; } else { R = c2; B = x; }
  return "rgb(" + (((R + m) * 255) | 0) + "," + (((G + m) * 255) | 0) + "," + (((B + m) * 255) | 0) + ")";
}
function buildLut(hueShift) {
  const cl = (ch) => (ch < 0 ? 0 : ch > 255 ? 255 : ch);
  for (let i = 0; i < LUT_N; i++) {
    const size = LUT_LO + (i / (LUT_N - 1)) * (LUT_HI - LUT_LO);
    lut[i] = toRgb(cl(size * cfg.rK + cfg.base), cl(size * cfg.gK + cfg.base), cl(size * cfg.bK + cfg.base), hueShift);
  }
}

let mx = -9999, my = -9999;
const onMove = (e) => { const t = e.touches ? e.touches[0] : e; mx = t.clientX; my = t.clientY; };
const onLeave = () => { mx = my = -9999; };
["pointermove","touchstart","touchmove"].forEach(ev =>
  canvas.addEventListener(ev, onMove, { passive:true }));
["pointerup","pointercancel","pointerleave","touchend","touchcancel"].forEach(ev =>
  canvas.addEventListener(ev, onLeave));

let frame = 0, lastT = performance.now(), acc = 0, frames = 0;
let seededFor = 0, physAcc = 0, lastShift = -999;
const STEP = 1000 / 60;

function loop() {
  const n = Math.min(MAX, Math.round(cfg.count));
  const now = performance.now();
  let dt = now - lastT; lastT = now;
  if (dt > 250) dt = 250;

  // states write drive before anything reads it
  updateState(dt);

  const baseR = cfg.radius * scale;

  if (seededFor !== n) {
    buildBase(n);
    for (let i = 0; i < n; i++) {
      mSpd[i] = cfg.speedLo + Math.random() * (cfg.speedHi - cfg.speedLo);
      // each particle gets its own wall radius, so a saturated orb rests in a
      // fuzzy band instead of tracing the containment ellipse as a hard edge
      bnd[i] = 0.84 + Math.random() * 0.16;
      // fixed lottery ticket per particle. Core membership is pr[i] < core, so
      // the slider re-sorts the field with no reseed, and members are scattered
      // through the index rather than taken as a contiguous arc, which would
      // cut a gap out of the ring.
      pr[i] = Math.random();
    }
    if (!seeded) { seedNear(n, baseR); seeded = true; }
    seededFor = n;
  }

  const fr2 = cfg.fleeRadius * cfg.fleeRadius;
  const hasMouse = mx > -9000;
  const gScale = 1 + drive.scale * cfg.rmsGain;
  const maxR = Math.min(W, H) * 0.5 * cfg.fit;

  // falloff / sizeHi were absolute px, which is why desktop looked nothing
  // like mobile. Normalise against a 400px reference short edge.
  const k = scale / 400;
  // The black ring is wherever size crosses zero, i.e. dist == falloffPx. Fixed
  // in px it stops tracking the orb: shrink radius and the whole thing ends up
  // inside the green zone with no ring and no purple at all. follow blends the
  // split toward a fraction of the current ring radius, so the three layers
  // hold at any size. falloffGain only rides the absolute term — in follow mode
  // gScale already carries loudness.
  const ringNow = baseR * gScale;
  const fAbs = cfg.falloff * k * (1 + drive.scale * cfg.falloffGain);
  // The field spreads outward faster than the ring grows -- median particle
  // distance runs ~0.44 of the ring at rest but ~0.60 under audio -- so a fixed
  // fraction falls behind and every particle ends up on the far side with no
  // negative space left. falloffGain pushes the split out with level to match.
  const fRel = ringNow * cfg.split * (1 + drive.scale * cfg.falloffGain * 0.3);
  const falloffPx = fAbs + (fRel - fAbs) * cfg.follow;
  const sizeHiPx = cfg.sizeHi * k;
  const radCap = 22 * k * cfg.dot;

  // Containment. `fit` only clamps the target ring; momentum, the onset kick
  // and turbulence still throw particles well past it. This is a positional
  // wall, so the orb can explode to the viewport edge and never through it.
  // Ellipse matches the viewport aspect (a phone gets its full height), inset
  // by the largest dot we can draw so blobs don't clip on the edge.
  const hx = Math.max(20, W * 0.5 - radCap);
  const hy = Math.max(20, H * 0.5 - radCap);
  const softSpan = Math.max(0.02, 1 - cfg.contain);
  const wall = 3.5 * k;

  const sIdx = cfg.shape + drive.hue * cfg.shapeGain;
  const mKey = Math.round(sIdx * 128);
  if (mKey !== lastMorph) { buildShapeLut(mKey / 128); lastMorph = mKey; }

  const shift = Math.round(drive.hue * cfg.hueGain * 90);
  const lo = -3.4 * sizeHiPx;
  if (shift !== lastShift || lo !== LUT_LO) {
    LUT_LO = lo; LUT_HI = sizeHiPx; buildLut(shift); lastShift = shift;
  }
  // Vowels really do work this way: /i/ has a high second formant, so a bright
  // centroid spreads the lips wide, and a dark one rounds them tall. jaw then
  // opens it vertically with loudness, which is what reads as talking.
  // drive.hue is 0 at silence, which is one end of the centroid range and not
  // the middle, so an ungated eccentricity leaves the resting orb permanently
  // stretched. gate 1 fades the deformation in with level; gate 0 leaves it
  // always on, which is what the early shaped-silhouette looks were built on.
  const gt = 1 - cfg.gate + cfg.gate * Math.min(1, drive.scale * 3);
  const ecc = (drive.hue - 0.5) * 2 * cfg.ellipse * gt;
  const ex = Math.max(0.15, 1 + ecc * 0.45);
  const ey = Math.max(0.15, 1 - ecc * 0.45) * (1 + drive.scale * cfg.jaw);
  // The negative-space ring is just the set of points where size crosses zero,
  // i.e. dist == falloffPx. A scalar distance makes that a circle no matter what
  // the particles are doing. Give the boundary its own aspect and its own
  // outline and audio can deform the ring itself instead of shoving particles
  // outward to fake it.
  const sEcc = (drive.hue - 0.5) * 2 * cfg.splitEll * gt;
  const fex = Math.max(0.15, 1 + sEcc * 0.45);
  const fey = Math.max(0.15, 1 - sEcc * 0.45) * (1 + drive.scale * cfg.splitJaw);

  const turb = drive.turbulence * cfg.turbGain;
  const kick = drive.impulse * cfg.impulseGain;

  physAcc += dt;
  let steps = 0;
  while (physAcc >= STEP && steps < 4) {
    physAcc -= STEP; steps++; frame++;
    for (let i = 0; i < n; i++) {
      // the core sits out the ring entirely: no spectrum, no shape, no membrane
      // and no kick, so it holds while the silhouette works. It still breathes,
      // because gScale is loudness.
      const isCore = pr[i] < cfg.core;
      let ringR;
      if (isCore) {
        ringR = baseR * gScale * cfg.coreR;
      } else {
        const band = (i * BANDS / n) | 0;
        const sk = (i * SHAPE_N / n) | 0;
        ringR = (baseR * gScale + drive.spectrum[band] * baseR * cfg.specGain) * shapeLut[sk];
      }
      if (ringR > maxR) ringR = maxR;
      // bloom 1 = original (sine swings through zero, target crosses centre)
      // bloom 0 = stable ring. Anything below ~0.6 lets audio actually read.
      const sqx = 1 - cfg.bloom + cfg.bloom * Math.sin(frame / cfg.rateX * i);
      const sqy = 1 - cfg.bloom + cfg.bloom * Math.cos(frame / cfg.rateY * i);
      const tx = cx + bx[i] * ringR * sqx * ex;
      const ty = cy + by[i] * ringR * sqy * ey;
      const maxF = mSpd[i] * cfg.forceRatio;

      const ddx = tx - px[i], ddy = ty - py[i];
      const dd = Math.sqrt(ddx * ddx + ddy * ddy) || 0.0001;
      let spd = mSpd[i];
      if (dd < 500) spd = (dd / 100) * mSpd[i];
      let ax = (ddx / dd) * spd - vx[i];
      let ay = (ddy / dd) * spd - vy[i];
      const am = Math.sqrt(ax * ax + ay * ay);
      if (am > maxF) { ax = ax / am * maxF; ay = ay / am * maxF; }

      if (!isCore && (cfg.membrane > 0.001 || kick > 0.01)) {
        const rx = px[i] - cx, ry = py[i] - cy;
        const rd = Math.sqrt(rx * rx + ry * ry) || 0.0001;
        let th = Math.atan2(ry, rx); if (th < 0) th += TAU;
        let s2 = ((th / TAU) * SHAPE_N) | 0; if (s2 >= SHAPE_N) s2 = SHAPE_N - 1;

        if (cfg.membrane > 0.001) {
          const b2 = ((th / TAU) * BANDS) | 0;
          // sample the shape at the current angle too, otherwise the membrane
          // pulls everything back onto a circle and sands the corners off
          let surf = (baseR * gScale + drive.spectrum[b2] * baseR * cfg.specGain) * shapeLut[s2];
          // radius of the ellipse at this angle, or the membrane rounds the lips
          // straight back off the way it used to round off the corners
          const elx = ey * (rx / rd), ely = ex * (ry / rd);
          surf *= ex * ey / Math.sqrt(elx * elx + ely * ely);
          if (surf > maxR) surf = maxR;
          const push = (surf - rd) * 0.02 * cfg.membrane;
          ax += (rx / rd) * push; ay += (ry / rd) * push;
        }

        // The kick used to fire straight out from centre, identically in every
        // direction -- it can only inflate, never shape, which is why every
        // loud moment collapsed to the same oval. Fire it along the outward
        // normal of the shape instead, so a hit drives edges out as faces and
        // corners along their bisector, exaggerating the silhouette.
        // For P(t) = (r cos t, r sin t) the outward normal is
        // (r cos t + r' sin t, r sin t - r' cos t), which reduces to radial
        // when r' is 0, i.e. on a circle.
        if (kick > 0.01) {
          // Pushing every particle out by the SAME amount adds a constant to
          // r(theta), and adding a constant to a radial function is precisely
          // what rounds it toward a circle -- which is why every onset used to
          // collapse the silhouette. Scale each push by that particle's own
          // shape radius instead: pushing by c*r turns r into r*(1+c), a pure
          // dilation, so the outline stays similar to itself however hard it
          // is hit.
          const mag = 1 + (shapeLut[s2] - 1) * cfg.kickShape;
          ax += (rx / rd) * kick * 1.6 * mag;
          ay += (ry / rd) * kick * 1.6 * mag;
        }
      }

      if (turb > 0.01) {
        ax += (Math.random() - 0.5) * turb * 2.4;
        ay += (Math.random() - 0.5) * turb * 2.4;
      }

      if (hasMouse) {
        const fx = mx - px[i], fy = my - py[i];
        const fd2 = fx * fx + fy * fy;
        if (fd2 < fr2 && fd2 > 0.01) {
          const fd = Math.sqrt(fd2);
          let sx = -(fx / fd) * mSpd[i] - vx[i];
          let sy = -(fy / fd) * mSpd[i] - vy[i];
          const sm = Math.sqrt(sx * sx + sy * sy);
          if (sm > maxF) { sx = sx / sm * maxF; sy = sy / sm * maxF; }
          ax += sx * cfg.fleeMult; ay += sy * cfg.fleeMult;
        }
      }

      vx[i] += ax; vy[i] += ay;
      px[i] += vx[i]; py[i] += vy[i];

      // q is the position in wall units: 1.0 is exactly on the boundary.
      // Names are w-prefixed so they never collide with the membrane block's
      // rx/ry/rd if a transpiler flattens the block scopes.
      const bi = bnd[i];
      const qx = (px[i] - cx) / (hx * bi), qy = (py[i] - cy) / (hy * bi);
      const q = Math.sqrt(qx * qx + qy * qy);
      if (q > cfg.contain) {
        const wx = px[i] - cx, wy = py[i] - cy;
        const wd = Math.sqrt(wx * wx + wy * wy) || 0.0001;
        const wnx = wx / wd, wny = wy / wd;
        // quadratic ramp — barely there at the soft edge, firm at the wall
        let over = (q - cfg.contain) / softSpan; if (over > 1) over = 1;
        const pull = over * over * wall;
        vx[i] -= wnx * pull; vy[i] -= wny * pull;
        if (q > 1) {
          // hard stop. Project back onto the ellipse and drop only the
          // outward velocity — tangential motion survives, so particles graze
          // along the wall instead of piling up dead against it.
          px[i] = cx + (qx / q) * hx * bi; py[i] = cy + (qy / q) * hy * bi;
          const vn = vx[i] * wnx + vy[i] * wny;
          if (vn > 0) { vx[i] -= wnx * vn; vy[i] -= wny * vn; }
        }
      }
    }
  }

  ctx.fillStyle = "rgba(11,11,11," + cfg.trail + ")";
  ctx.fillRect(0, 0, W, H);

  const span = LUT_HI - LUT_LO;
  const shaped = cfg.splitShape > 0.001;
  for (let i = 0; i < n; i++) {
    const ox = px[i] - cx, oy = py[i] - cy;
    let fRad = falloffPx;
    if (shaped) {
      let th = Math.atan2(oy, ox); if (th < 0) th += TAU;
      let si = ((th / TAU) * SHAPE_N) | 0; if (si >= SHAPE_N) si = SHAPE_N - 1;
      fRad *= 1 + (shapeLut[si] - 1) * cfg.splitShape;
    }
    // distance measured against the deformed boundary: 1.0 is exactly on it, so
    // size still crosses zero there and the colour split rides the new outline
    const ndx = ox / (fRad * fex), ndy = oy / (fRad * fey);
    const size = (1 - Math.sqrt(ndx * ndx + ndy * ndy)) * sizeHiPx;
    let li = ((size - LUT_LO) / span * (LUT_N - 1)) | 0;
    if (li < 0) li = 0; else if (li >= LUT_N) li = LUT_N - 1;
    ctx.fillStyle = lut[li];
    // `dot` scales the drawn radius only. `size` (and therefore the LUT
    // index) is deliberately left alone, so this never moves the colour split.
    let rad = Math.abs(size) * 0.5 * cfg.dot;
    if (rad > radCap) rad = radCap;
    if (rad > 0.2) {
      ctx.beginPath();
      ctx.arc(px[i], py[i], rad, 0, 6.2832);
      ctx.fill();
    }
  }

  if (showBars) {
    const bw = W / BANDS;
    ctx.fillStyle = "rgba(200,244,154,0.30)";
    for (let b = 0; b < BANDS; b++) {
      const h = drive.spectrum[b] * 46;
      if (h > 0.5) ctx.fillRect(b * bw + 0.5, H - h, bw - 1, h);
    }
  }

  acc += dt; frames++;
  if (acc > 500) {
    hud.textContent = Math.round(frames / (acc / 1000)) + " fps · " + n + " · " +
                      state + (manual ? " (held)" : "");
    const f2 = (x) => x.toFixed(2);
    meter.textContent = "lvl " + f2(drive.scale) + "  hue " + f2(drive.hue) +
                        "  turb " + f2(drive.turbulence) + "  hit " + f2(drive.impulse) +
                        "\nmic " + micState + "  in " + f2(mic.scale) +
                        (A ? "  dB " + Math.round(A.db) + "  room " + Math.round(A.floorDb) : "");
    acc = 0; frames = 0;
  }
  requestAnimationFrame(loop);
}
syncStateBtns();
buildLut(0);
loop();
</script>
</body>
</html>
