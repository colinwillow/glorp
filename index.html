}

function glInit() {
  if (gl.R || !window.THREE) return gl.ok;
  const T = window.THREE;
  try {
    gl.R = new T.WebGLRenderer({ canvas: glCanvas, antialias: true, alpha: true,
                                 premultipliedAlpha: false });
  } catch (e) { console.log("orb webgl:", e.message); gl.ok = -1; return gl.ok; }
  gl.R.setPixelRatio(dpr);
  gl.R.setClearAlpha(0);
  gl.R.outputColorSpace = T.SRGBColorSpace;
  /* Neutral rather than ACES. ACES is a film curve -- it desaturates and lifts
     the blacks, which is right for a scene with a sky in it and wrong for a
     character standing in a black void, where it read as a grey wash over the
     hoodie. */
  /* Swept against the model's own render: exposure 1.55 with the environment
     at 1.5 washed the denim to grey and the hoodie to mid-tone, which is what
     over-lighting a PBR material with white does -- the albedo stops being
     visible under it. These are two stops down from that. */
  gl.R.toneMapping = T.NeutralToneMapping;
  gl.R.toneMappingExposure = 1.18;
  gl.scene = new T.Scene();
  gl.cam = new T.PerspectiveCamera(40, 1, 1, 40000);
  /* An environment map, from three's own room. This is most of the difference
     between "a mesh with a texture on it" and "a render": a single light gives
     one bright side and one black one, and a room gives soft light from every
     direction with the shape still readable. */
  const pm = new T.PMREMGenerator(gl.R);
  gl.scene.environment = pm.fromScene(new window.RoomEnvironment(), 0.03).texture;
  gl.scene.environmentIntensity = 1.0;
  pm.dispose();
  // and a key, off to the left and above -- the same direction the 2D shading
  // uses, so the figure is lit the way everything else in here is lit
  const key = new T.DirectionalLight(0xFFFFFF, 2.5);
  key.position.set(-5, 6, 7);
  gl.scene.add(key);
  /* A rim from behind and the other side. On a black background the far edge of
     a figure has nothing to separate it from the void, so it dissolves; a rim
     light is what draws the line that says where he stops. */
  const rim = new T.DirectionalLight(0xC9D8FF, 1.45);
  rim.position.set(4, 3, -6);
  gl.scene.add(rim);
  gl.scene.add(new T.AmbientLight(0xFFFFFF, 0.24));
  /* stage (the world, at the fit's scale)
       ground   -- a lattice at the level of his feet, which does not move
       root     -- him: position and facing in the world
         scene  -- the model, offset so the fit centre is the root's origin

     Two groups rather than one because the ground has to STAY when he walks.
     The camera never moves and never tilts: it sits level with his chest, and
     a horizontal plane below a level camera recedes to a horizon on its own.
     Tilting it would have meant tilting the 2D projection to match, and those
     two cameras agreeing is the only reason the particles land on him. */
  gl.stage = new T.Group();
  gl.scene.add(gl.stage);
  gl.root = new T.Group();
  gl.stage.add(gl.root);
  /* Fog, so the lattice goes into the dark rather than stopping at an edge.
     It is the same trick the hologram floor plays with geometric row spacing,
     for free, and it applies to him too when he walks away. */
  gl.scene.fog = new T.Fog(0x0B0B0B, 0.1, 1);
  gl.ok = 1;
  return gl.ok;
}

/* The same file, parsed twice, from one download. three needs the full mesh and
   its own skeleton to render; the particle side needs a decimated copy it can
   skin in JavaScript, because a dot has to have a position on the CPU to be
   drawn as a dot. Fetching it twice for that would be three and a half
   megabytes of nothing. */
function glLoad(buf, src, R) {
  const T = window.THREE;
  return new Promise((res, rej) => {
    new window.GLTFLoader().parse(buf.slice(0), "", (g) => {
      if (gl.group) { gl.root.remove(gl.group); }
      gl.group = new T.Group();
      gl.root.add(gl.group);
      gl.group.add(g.scene);
      if (!gl.ground) gl.ground = makeGround(T);
      if (gl.ground.parent !== gl.stage) gl.stage.add(gl.ground);
      // gl.stage, emphatically not gl.root: these exist to NOT move with him
      if (!gl.motes) gl.motes = makeMotes(T);
      if (gl.motes.parent !== gl.stage) gl.stage.add(gl.motes);
      // under root, not stage: the pool is his, and it walks when he does
      if (!gl.pool) gl.pool = makePool(T);
      if (gl.pool.parent !== gl.root) gl.root.add(gl.pool);
      gl.face = null; gl.headMeshes = []; gl.headGhosts = [];
      let mesh = null;
      /* ALL of them, not just the first.

         A mesh with more than one material does not survive a round trip as
         one object: glTF has a single material per primitive, so the exporter
         splits it and the loader gives back one SkinnedMesh per piece --
         mesh_0, mesh_0_1, mesh_0_2 -- sharing the geometry and the morph
         targets but each with its own material and its own influence array.
         Taking the first and stopping meant his hair, eyes and tongue got no
         texture, no build wipe, and no visemes: three quarters of his head
         rendering flat white through every stage. */
      const skins = [];
      g.scene.traverse((o) => { if (o.isSkinnedMesh) skins.push(o); });
      /* The head, dropped before anything else looks at the list -- so it takes
         no material, no wipe, no ghost and no influence array, and gl.mesh
         cannot accidentally BE it. */
      const G0 = GRAFT[String(src || "").toLowerCase()];
      if (G0 && G0.hide) {
        const re = new RegExp(G0.hide, "i");
        for (let i = skins.length - 1; i >= 0; i--) {
          const tag = (skins[i].name || "") + " "
            + [].concat(skins[i].material).map((m) => (m && m.name) || "").join(" ");
          if (re.test(tag)) { skins[i].visible = false; skins.splice(i, 1); }
        }
      }
      mesh = skins[0] || null;
      if (!mesh) return rej(new Error("no skinned mesh for the renderer"));
      for (const o of skins) {
        // never culled: the wipe means most of it is clipped away most of the
        // time, and a bounding sphere computed on the bind pose is wrong anyway
        o.frustumCulled = false;
        /* One influence array between them. The viseme driver writes to
           gl.mesh and only gl.mesh, and these are pieces of one face -- a jaw
           that opens on the skin and not on the beard is not a jaw. Sharing the
           array rather than copying it each frame means the driver stays a
           driver and never learns that the mesh came back in pieces. */
        if (o !== mesh && o.morphTargetInfluences && mesh.morphTargetInfluences
            && o.morphTargetInfluences.length === mesh.morphTargetInfluences.length) {
          o.morphTargetInfluences = mesh.morphTargetInfluences;
          o.morphTargetDictionary = mesh.morphTargetDictionary;
        }
      }
      if (skins.length > 1)
        console.log("orb rig: " + skins.length + " primitives share one face ("
          + skins.map((o) => (Array.isArray(o.material) ? o.material[0] : o.material).name || "?").join(", ") + ")");
      /* The hood drawing in front of the face.

         The material in this file is `alphaMode: BLEND`, and glTF says a
         blended material does not write depth -- so three, correctly, sets
         depthWrite false. Nothing then occludes anything: every triangle in the
         mesh blends over whatever is already in the buffer, in index order. The
         back of the hood happens to come after the face in that order, so it
         lands on top of it. It reads like a normals problem and it is not; it is
         the depth buffer being switched off.

         Almost always this is an exporter artifact. A character is opaque, and
         the material says BLEND because the DCC tool it came out of had alpha
         blending on by default. That is checkable rather than assumable: if the
         base colour map has no transparency anywhere in it, BLEND cannot be
         doing anything, and promoting it to opaque is a correction rather than
         an override. If the map really does carry alpha, it is left alone and
         the reason is logged -- silently discarding somebody's cutouts to fix
         their hood would be much worse than the hood. */
      /* Decided before a single material is compiled: whether this figure is
         going to borrow a head decides what shader its body gets, and the
         weights have to exist before the ghost is built because the ghost
         shares this geometry. */
      const Gr = G0;
      // only the shader cut needs weights; a named mesh is already gone
      if (Gr && !Gr.hide) { figHeadW(mesh); gl.uHeadCut.value = Gr.cut; }
      else gl.uHeadCut.value = 2;
      const mats = [];
      for (const o of skins)
        for (const m of (Array.isArray(o.material) ? o.material : [o.material]))
          if (m && !mats.includes(m)) mats.push(m);
      for (const m of mats) {
        if (m.transparent) {
          if (R && R.texMinAlpha >= 250) {
            m.transparent = false; m.depthWrite = true; m.depthTest = true;
            m.alphaTest = 0; m.needsUpdate = true;
            console.log("orb rig: material was alphaMode BLEND with a fully " +
                        "opaque map -- promoted to opaque so it writes depth");
          } else {
            m.depthWrite = true; m.needsUpdate = true;
            console.log("orb rig: material is genuinely transparent (map alpha " +
                        "down to " + (R ? R.texMinAlpha : "?") + "); depth " +
                        "write forced on, self-overlap may still sort by index");
          }
        }
        glWipeMat(m, gl.uTex, null, Gr && !Gr.hide ? { cut: gl.uHeadCut, key: "c" } : null);
      }
      const sk2 = SKIN[String(src || "").toLowerCase()];
      if (sk2) for (const m of mats) {
        const want = sk2[m.name];
        if (!want || m.map) continue;
        m.userData.tex = want;
        // black times any texture is still black; the map is the colour now
        m.color.setHex(0xffffff);
      }
      figTextures(mats);
      /* The ghost: the same geometry and the same skeleton, a second time, in
         the orb's own green. It is the "fill" step -- the surface arriving
         before its colours do -- and it is a real second mesh rather than a
         material swap because both have to be on screen at once, one above the
         other, while the texture wipe is between them. */
      /* Opaque, not translucent. A translucent mesh that overlaps ITSELF has
         exactly the problem above -- no depth write, so the far side of the
         hood blends over the near side of the face -- and a ghost with its own
         back showing through its front is not a stage, it is the same bug in
         green. The fill step means "the surface has arrived, its colours have
         not", and a solid surface says that better anyway. Double-sided to
         match the file, because a hood has an inside. */
      const gm = new T.MeshStandardMaterial({
        color: 0x2E7A1C, emissive: 0x8FE05A, emissiveIntensity: 0.30,
        roughness: 0.55, metalness: 0, side: T.DoubleSide
      });
      glWipeMat(gm, gl.uGhoHi, gl.uGhoLo, Gr && !Gr.hide ? { cut: gl.uHeadCut, key: "c" } : null);
      const ghost = new T.SkinnedMesh(mesh.geometry, gm);
      ghost.bind(mesh.skeleton, mesh.bindMatrix);
      ghost.frustumCulled = false;
      mesh.parent.add(ghost);
      gl.mesh = mesh; gl.ghost = ghost;
      /* Worth knowing out loud. colin_slim.glb currently exports with none of
         them, which is the whole reason his face cannot move -- not that the
         shapes are subtle, that they are absent. */
      gl.morphs = mesh.morphTargetDictionary ? Object.keys(mesh.morphTargetDictionary).length : 0;
      console.log("orb figure", src, "blend shapes:", gl.morphs);
      /* Every clip, by name. The dance file had one; this one has thirty-six,
         and the whole sandbox is the difference between "play the animation"
         and "play THAT one". */
      gl.mixer = g.animations.length ? new T.AnimationMixer(g.scene) : null;
      gl.clips = {};
      for (const c of g.animations) gl.clips[c.name] = c;
      gl.action = null;
      gl.speeds = null;
      if (gl.mixer) playClip(pickIdle(), 0);
      /* Measured once, after the build rather than during it: clipSpeed drives
         the mixer's clock to sample, so doing it while the wipes are climbing
         would stutter the thing everyone is looking at. */
      if (gl.mixer) setTimeout(() => {
        for (const nm of Object.keys(gl.clips)) if (/walk|run/.test(nm)) clipSpeed(nm);
        // every clip, because which ones end where they started is not
        // guessable from the name -- and pickTurn needs the answer
        for (const nm of Object.keys(gl.clips)) clipYaw(nm);
        /* Pose signatures for anything that runs as a sequence, for the same
           reason and at the same moment: sampling drives the mixer's clock, and
           doing it at the hand-off would stutter the hand-off. */
        for (const [, list, hold] of ACTS)
          if (hold && list.length > 1) for (const nm of list) if (haveClip(nm)) clipPoses(nm);
      }, 1200);
      gl.src = src;
      /* Last, and allowed to fail. A head that will not load is a figure with
         no face, which is what he had yesterday -- not a figure that does not
         appear at all. */
      glGraft(src, T, mesh).then(() => res(g), (e) => {
        console.log("orb graft failed:", e.message); res(g);
      });
    }, rej);
  });
}

/* Where the model has to stand so that the particles land on it.

   Two coordinate systems, and they disagree about two axes. The 2D renderer is
   left-handed the way a screen is -- x right, y DOWN, z away -- and three is
   right-handed with y up and z toward the viewer. So three gets the model as
   authored, and the PARTICLE side is the one that converts: y and z both
   negated on the way into formation space. Flipping two axes preserves
   handedness, which is the whole reason it can be done at all; flipping one
   would mirror him.

   The camera is not a choice either. The 2D projection is FOC/(FOC + depth)
   with FOC = scale * 1.7 in pixels, which is a pinhole a distance FOC in front
   of a projection plane through the origin. Put three's camera at exactly that
   distance and give it the field of view that makes the viewport's height come
   out at H pixels on that plane, and the two projections are the same
   projection. */
function glFrame(K, FOC) {
  const T = window.THREE;
  if (gl.W !== W || gl.H !== H) { gl.R.setSize(W, H, false); gl.W = W; gl.H = H; }
  gl.cam.aspect = W / H;
  gl.cam.fov = 2 * Math.atan((H / 2) / FOC) * 180 / Math.PI;
  gl.cam.position.set(0, 0, FOC);
  gl.cam.lookAt(0, 0, 0);
  gl.cam.updateProjectionMatrix();
  const f = rig.R.fit;
  gl.stage.scale.setScalar(K);
  gl.stage.position.set(0, 0, 0);
  /* Not -pitch. Screen space and three's space differ by a flip on BOTH y and
     z (the formation builder writes formY = -y and formZ = -z), and flipping
     two of three axes is a rotation, not a mirror -- so a rotation about the
     remaining axis has to keep its sign, not lose it. With the minus the two
     views tipped opposite ways about x: at rest that is a few pixels and reads
     as nothing, but the moment he walks toward the lens the disagreement is
     proportional to how far he has come. Measured at world.z = 4.95 it put the
     particle silhouette 130 px below the figure it is supposed to be. */
  gl.stage.rotation.set(view.pitch * formT, view.yaw, 0);
  floatNow(performance.now() * 0.001);
  eyesNow(gl.dt || 16.67, performance.now());
  blinkNow(performance.now());
  gl.root.position.set(world.x + flo.x, world.y + flo.y, world.z + flo.z);
  gl.root.rotation.set(flo.rx, world.yaw + flo.ry, flo.rz);
  if (gl.group) gl.group.position.set(-f.c[0], -f.c[1], -f.c[2]);
  boomBoxFrame(gl.dt || 16.67);
  if (gl.ground) {
    /* A grid at a portrait angle is not a floor. Measured earlier: at 6 degrees
       the lengthwise lines have nothing on screen and what draws is a stack of
       horizontal rules, which reads as an artefact rather than as ground. So
       the floor's presence is tied to how far the camera is actually looking
       down, and at a flat angle it dissolves and leaves the pool of light doing
       the grounding on its own. */
    const gFade = Math.max(0, Math.min(1, (view.pitch - 0.20) / 0.14));
    gl.ground.visible = world.on > 0.01 && gFade > 0.01;
    // his feet, not the fit centre: the fit is centred on his middle
    gl.ground.position.y = f.lo[1] - f.c[1];
    gl.ground.scale.setScalar(figH1() * WALK.floor);
    gl.ground.material.opacity = world.on * 0.9 * gFade;
  }
  if (gl.motes) {
    /* No pitch gate. The grid has one because a lattice needs to be looked
       down on to read as a plane; a scattering of points does not, and this is
       the only stationary thing on the floor at the angle the room is
       actually shot at. */
    const H2 = figH1();
    gl.motes.visible = world.on > 0.01;
    gl.motes.position.y = f.lo[1] - f.c[1];
    gl.motes.scale.setScalar(H2 * MOTE.r);
    // size is in the disc's own scaled units, so it cancels back out to a
    // constant fraction of his height however far the room is zoomed
    gl.motes.material.size = MOTE.size / MOTE.r;
    gl.motes.material.opacity = world.on * 0.95;
  }
  if (gl.pool) {
    gl.pool.visible = world.on > 0.01;
    /* Under HIM, not under the root. A clip is free to walk him away from the
       node it is played on -- lay him down and his whole body ends up a stride
       forward of it -- and a pool of light left behind at the origin reads as a
       lamp he happens to be near. Averaged over every 16th skinned vertex,
       which is his body's own centre of mass in x and z and therefore lands
       under him standing, sitting or lying. */
    let sx = 0, sz = 0, sn = 0;
    const wp = rig.R && rig.R.wp;
    if (wp) for (let v = 0; v < wp.length; v += 48) { sx += wp[v]; sz += wp[v + 2]; sn++; }
    /* Eased, because a dance clip carries no root motion and his centre of mass
       still swings through one -- measured, the pool slid 0.026 across and
       0.052 forward over six seconds while world.x and world.z were exactly
       zero. A light pool sliding under a man standing on the spot is the second
       half of the floor looking untethered. Slow enough to ignore a beat, quick
       enough to keep up when he actually walks somewhere. */
    if (sn) {
      const tx = sx / sn, tz = sz / sn;
      if (!gl.poolS) gl.poolS = { x: tx, z: tz };
      // 0.045 was measured doing almost nothing -- 0.028 of sway became 0.021.
      // This is about a two-second constant: a beat cannot move it, a walk can.
      const kp = 1 - Math.pow(1 - 0.009, (gl.dt || 16.67) / 16.67);
      gl.poolS.x += (tx - gl.poolS.x) * kp;
      gl.poolS.z += (tz - gl.poolS.z) * kp;
      sx = gl.poolS.x * sn; sz = gl.poolS.z * sn;
    }
    // minus world.y: the pool belongs to the floor, and the root it hangs from
    // is the thing that just moved down to meet it
    gl.pool.position.set(sn ? sx / sn - f.c[0] : 0,
                         f.lo[1] - f.c[1] - world.y + figH1() * 0.004,
                         sn ? sz / sn - f.c[2] : 0);
    gl.pool.scale.setScalar(figH1() * 1.25);
    gl.pool.material.opacity = world.on * 0.75;
    /* Fog distances are measured from the CAMERA, in the same units the camera
       is placed in -- which here is pixels, because the whole projection is
       pinned to the 2D one and that one thinks in pixels. Set to the tens they
       looked like they should be, everything including him sat past the far
       plane and the room rendered black. */
    /* He stands at FOC, so a near plane of 0.75 was already taking a seventh of
       him. The fog is there to dissolve the far edge of the floor, not to grey
       out the person: start it just past where he stands. */
    gl.scene.fog.near = FOC * 1.05;
    gl.scene.fog.far = FOC * 2.6;
  }
  /* The wipes, in the shader's terms. The ghost occupies the band between the
     surface front and the texture front: below the texture line it would be a
     translucent green film over the finished model, which is not a stage, it is
     a mistake. */
  gl.uTex.value = rig.wipe[3];
  gl.uGhoHi.value = rig.wipe[2];
  gl.uGhoLo.value = rig.wipe[3];
  gl.ghost.visible = rig.wipe[2] > rig.wipe[3] + 0.001;
  gl.mesh.visible = rig.wipe[3] > 0.001;
  /* The borrowed head, on the same clock as the body.
     Its vertices are in its own units, so its uLo and uSpan are solved here
     rather than stored: put the bottom of it exactly where the body's cut line
     falls in the build's 0..1, and the top of it a hair over 1. It then arrives
     as the wipe reaches his neck, which is where a head belongs in the order of
     a body being drawn from the feet up. Solved every frame because uLo and
     uSpan belong to the figure and are not set until after it loads. */
  if (gl.face) {
    const f0 = Math.min(0.98, (gl.cutY - gl.uLo.value) / (gl.uSpan.value || 1));
    const band = Math.max(0.02, 1.02 - f0);
    gl.uHeadSpan.value = ((gl.hHi - gl.hLo) || 1) / band;
    gl.uHeadLo.value = gl.hLo - f0 * gl.uHeadSpan.value;
    for (const o of gl.headMeshes) o.visible = gl.mesh.visible;
    for (const o of gl.headGhosts) o.visible = gl.ghost.visible;
  }
  gl.R.render(gl.scene, gl.cam);
}

/* ---------------- the sandbox ----------------
   A room he lives in, rather than a model on a turntable.

   The file that arrived has thirty-six clips in it -- idles, walks, runs, a
   backflip, four dances, a set of drunk animations, a laying pose -- so the
   thing to build is not "play the animation" but a little world where he stands
   on a floor, gets told to do things, and walks to where you tap.

   Three facts about the clips shaped all of it:

   - There is NO ROOT MOTION. A walk cycle moves his legs and leaves him where
     he is, so walking across the room is this file's job: play the cycle, and
     translate him at a speed tuned to match the feet.
   - They are all in-place idles and actions of known length, so an action can
     simply be played once and handed back to an idle when it ends.
   - The skeleton is 82 joints and the poses come out of three's mixer, which
     means the DOTS have to read their pose from three rather than computing
     their own -- otherwise the particles animate one clip while the render
     animates another, with a crossfade between them that only one of the two
     knows about. */
const world = {
  on: 0, x: 0, y: 0, z: 0, yaw: 0, yawWant: 0,
  // pose: he is IN something (sitting, lying, drunk) rather than DOING
  // something, so no timer takes him out of it and the idle rotation leaves
  // him alone. Cleared by walking, or by being told to stand up.
  // turning: pivoting on the spot before a walk, translating nothing.
  // turnOnly: the same pivot as an instruction in its own right -- "face away",
  // "turn around" -- with no walk waiting at the end of it.
  tx: 0, tz: 0, walking: 0, run: 0, turning: 0, turnOnly: 0,
  act: "", actUntil: 0, idleAt: 0, pose: 0,
  // a run of clips played one after another rather than one on repeat -- see
  // playSeq. null whenever a single clip is in charge.
  seq: null,
  // the lowest his current clip has got to, in model units -- see playClip
  groundMin: 1e30
};
/* In HEIGHTS, not in units.

   The working space is whatever the model's exporter happened to use -- this
   one came out of a tool in centimetres, so the numbers are a hundred times
   what the file's POSITION attribute says, and a walk speed of "4.2 units per
   second" meant something completely different before and after that was
   discovered. A person walks about eight tenths of their own height per second
   and runs about twice that, which is true of any model in any units. */
/* How fast a locomotion clip says he is travelling, in his own heights per
   second, measured off the clip itself.

   Every clip in this file was exported WITHOUT root motion -- measured, the
   root and hip bones move 0.000 in all thirty-six of them -- so the walking is
   the program's job. It was doing it with one constant for every walk, and the
   clips do not agree with each other, let alone with the constant:

       walk_fwd_normal  1.036      walk_fwd_strut   0.537
       walk_fwd_upbeat  0.972      walk_fwd_tiptoe  0.277
       run_fwd          2.811      run_fwd_fast     3.214

   Against a fixed 0.78 the strut travels 45% too fast and the normal walk 25%
   too slow, and which one you got was a coin toss on every walk -- which is
   exactly the "sometimes the root motion is much faster than his steps".

   The measurement is the standard one: whichever foot is on the ground is not
   really sliding, the world is moving under it, so the speed the ground foot
   travels backwards through the model IS the speed the body should go forwards.
   Sampled in GROUP space, because that is the only space around here where y is
   up and figH1() is the height -- in the mesh's own space the model is rotated
   and scaled by 0.01, and a first attempt that measured there got a negative
   body height and silently counted nothing. */
function clipSpeed(name) {
  if (!gl.speeds) gl.speeds = {};
  if (gl.speeds[name] != null) return gl.speeds[name];
  gl.speeds[name] = 0;                       // and never try twice, whatever happens
  const T = window.THREE, clip = gl.clips && gl.clips[name];
  if (!clip || !clip.duration || !gl.mixer || !gl.mesh || !gl.mesh.skeleton) return 0;
  const by = {};
  for (const bn of gl.mesh.skeleton.bones) by[bn.name] = bn;
  const feet = [by["mixamorig_LeftToeBase"], by["mixamorig_RightToeBase"]];
  if (!feet[0] || !feet[1]) return 0;
  const inv = new T.Matrix4(), v = new T.Vector3();
  const at = (bn) => v.setFromMatrixPosition(bn.matrixWorld).applyMatrix4(inv).clone();
  const was = gl.mixer.time, keep = gl.action;
  for (const a of gl.mixer._actions.slice()) a.stop();
  const act = gl.mixer.clipAction(clip);
  act.reset(); act.setEffectiveWeight(1); act.play();
  const N = 60, H = figH1() || 1;   // coarser undercounts the stance arc by ~25%
  /* Two passes, and a MEDIAN rather than a mean.

     "The lower foot" is not "the foot on the ground": a run has a flight phase
     with both feet up, and the lower of two airborne feet is still airborne.
     So the clip's own floor is found first and only a foot inside a small band
     above it counts as stance.

     The median matters more. Printing the per-frame stance speeds, a walk is a
     flat plateau -- 0.78 0.79 0.79 0.80 0.80 0.80 0.81 ... -- a foot genuinely
     nailed to the floor. A run has no plateau at all: 0.00 0.95 2.11 2.42 2.60
     3.05 3.40, because the cycle is stylised and the foot keeps moving through
     its lowest moment. Averaging arc length over the contact window let the
     near-zero samples at the very bottom drag the run down to 2.08 and it kept
     skating; the median lands on the representative 2.6 and agrees with the
     walk's plateau to within 0.01 where there IS one. */
  const samp = [];
  let floorY = 1e30;
  for (let k = 0; k <= N; k++) {
    gl.mixer.setTime((k / N) * clip.duration);
    gl.group.updateMatrixWorld(true);
    inv.copy(gl.group.matrixWorld).invert();
    const fp = [at(feet[0]), at(feet[1])];
    samp.push(fp);
    floorY = Math.min(floorY, fp[0].y, fp[1].y);
  }
  const band = floorY + H * 0.06, step = clip.duration / N, sp = [];
  for (let k = 1; k < samp.length; k++)
    for (let f = 0; f < 2; f++)
      if (samp[k][f].y < band && samp[k - 1][f].y < band)
        sp.push(Math.hypot(samp[k][f].x - samp[k - 1][f].x,
                           samp[k][f].z - samp[k - 1][f].z) / H / step);
  sp.sort((a, b) => a - b);
  act.stop();
  if (keep) { keep.reset(); keep.setEffectiveWeight(1); keep.play(); gl.action = keep; }
  gl.mixer.setTime(was);
  gl.speeds[name] = sp.length ? sp[sp.length >> 1] : 0;
  return gl.speeds[name];
}

/* HOW FAR ROUND A CLIP LEAVES HIM, measured the same way and for the same
   reason as clipSpeed above: because the file does not agree with what anyone
   assumed about it.

   The note that used to sit on the turning code said both turn clips "come back
   with 0.0 degrees of net yaw", so they were treated as feet doing something
   while the CONTROLLER changed the heading underneath. Measured properly, off
   the hips' own heading between the first frame and the last:

       idle_turn_left  +102.2 deg      idle_turn_right  -102.2 deg
       dance_uprock_01 +124.0 deg      everything else   under 5

   So a pivot was turning him twice -- a hundred degrees from the animation and
   however much the controller wanted on top -- and then the clip looped and
   snapped the animation's share back to zero. Over-spin, then reset, which is
   exactly what it looked like.

   Worth being precise about what is and is not a problem here: SWING inside a
   clip is fine and often the whole point -- the backflip swings 90 degrees, the
   ninja 112, the drunk walk 82 -- because it comes back. What breaks is a clip
   that ENDS somewhere other than where it started, because the next loop has to
   get back there in one frame. */
function clipYaw(name) {
  if (!gl.yaws) gl.yaws = {};
  if (gl.yaws[name] != null) return gl.yaws[name];
  gl.yaws[name] = 0;                         // and never try twice, whatever happens
  const clip = gl.clips && gl.clips[name];
  if (!clip || !clip.duration || !gl.mixer || !gl.mesh || !gl.mesh.skeleton) return 0;
  let hips = null;
  for (const bn of gl.mesh.skeleton.bones) if (/Hips$/i.test(bn.name)) hips = bn;
  if (!hips) return 0;
  /* The TWIST about the parent's up axis, not the whole rotation. A hips
     quaternion carries lean and tilt as well as heading, and only the heading
     is a turn -- decomposing it is the difference between "he turned round" and
     "he leaned over". */
  const twist = (q) => {
    const s = Math.hypot(q.y, q.w) || 1;
    return 2 * Math.atan2(q.y / s, q.w / s);
  };
  const was = gl.mixer.time, keep = gl.action;
  for (const a of gl.mixer._actions.slice()) a.stop();
  const act = gl.mixer.clipAction(clip);
  act.reset(); act.setEffectiveWeight(1); act.play();
  const at = (t) => { act.time = t; act.paused = true; gl.mixer.update(0); return twist(hips.quaternion); };
  let d = at(Math.max(0, clip.duration - 1e-3)) - at(0);
  while (d > Math.PI) d -= TAU;
  while (d < -Math.PI) d += TAU;
  act.paused = false;
  act.stop();
  if (keep) { keep.reset(); keep.setEffectiveWeight(1); keep.play(); gl.action = keep; }
  gl.mixer.setTime(was);
  gl.yaws[name] = d;
  return d;
}

/* What to play while he pivots on the spot.

   A clip that turns him is exactly the wrong thing here, because the controller
   is already turning him -- so this asks for one that does NOT, and prefers a
   real turn animation if the file ever ships one that stays put. Until then a
   walk cycle: feet doing something while the heading changes underneath, which
   is what the turn clips were wrongly believed to be doing and beats a standing
   figure rotating like a turret.

   Written as a search rather than a name so that the day a proper in-place turn
   arrives it gets used with no code change -- it only has to be called
   something with "turn" in it and end where it began. */
const TURN_OK = 8 * Math.PI / 180;
function pickTurn() {
  const all = Object.keys(gl.clips || {});
  const still = all.filter((n) => /turn|pivot/i.test(n) && Math.abs(clipYaw(n)) < TURN_OK);
  if (still.length) return pickOne(still);
  return haveClip("walk_fwd_normal") ? "walk_fwd_normal" : pickIdle();
}

/* floor is measured in his own heights, edge to edge. Eleven of them was a
   parking lot: the camera sits about 3.4 heights out, so a floor with a
   half-extent of 5.5 puts most of itself level with or behind the lens, and
   the lines running AWAY from the camera -- the only ones that carry the
   perspective -- had nothing left on screen but a sliver at the horizon. What
   rendered was a stack of horizontal rules, which reads as scan lines, not as
   ground. Measured with the two line families coloured apart: at 11 not one
   lengthwise line reached the frame; at 8 the whole lattice converges. */
/* turn is while walking, turnPlace is while pivoting on the spot, both in
   radians a second. 5.0 was 286 deg/s -- he spun like a turret while his legs
   played a forward walk cycle, which is most of the hovering. A walking person
   turns at about 120 deg/s. faceFirst is how far off the target has to be
   before he stops and turns to face it instead of arcing round. */
const WALK = { turn: 2.1, turnPlace: 1.9, faceFirst: 0.85, arrive: 0.10, floor: 8 };
/* The source machine. It stands in the middle of the room, he is built in
   front of it, and the orb lives above it: when the particles assemble him,
   the last arc of the ring does not trace him at all -- it lifts off and
   becomes a small breathing ball of dots hovering over the machine. That is
   where Glorb is while the room is up.

   x/z/r/hover/orbR are in HIS heights, like everything else in the room.
   share is the fraction of the ring that splits off. Drop a custom model in
   at models/portal.glb and it replaces the built one, scaled to the same
   height, no code change. */
/* Beside him, not behind. At a portrait angle every point on the floor plane
   converges toward a horizon that sits at about his head height, so a disc
   standing behind him projects as a ring around his head -- which is a halo,
   not a machine. Off to one side it is unambiguously a separate object standing
   next to him, and it survives the camera going flat. */
/* The small one, in the room. Not a machine any more -- the plinth and then
   the turntable both came out; what is left is him, a ball of the field's own
   particles hanging above and behind Colin at the top of the frame.

   y is in his heights above the floor, so it tracks the figure rather than the
   viewport. share is the fraction of the ring that splits off to be it: about
   340 particles out of 3,085, which is few enough not to matter and enough to
   read as the same object as the big one.

   react is what makes it his: the big orb swells, deforms and roughens with the
   voice, and until now this one only breathed a little. See the block in the
   formation writer. */
/* y is in his heights above the floor, and it is the one number here that has
   to be checked against the screen rather than reasoned about. The field walls
   its particles into an ellipse a bit inside the viewport, so a target placed
   off the top does not put the orb off the top -- it piles every particle
   against the wall in a flat smear that does not move when you change the
   number, which is exactly what 1.92 was doing. Measured: 1.9 puts the target
   at screen y -220, 1.35 at 27, 1.15 at 110. */
/* The orb, once he is standing. It lies FLAT under his feet -- the particles
   draw him, and then, having nothing left to draw, they slip out of him and
   become the real thing on the ground he is standing on.

   r is the ring radius in his heights: the circle where size crosses zero, the
   black gap the field's whole look is built around. flat squashes it toward the
   floor. share is the fraction of the ring lent to it while he is still being
   drawn; full is what it takes once he is finished, which is nearly everything,
   because a built figure's own dots are invisible by then anyway. fat scales
   the dots against the big orb's, which would otherwise be far too heavy for
   something this size. */
/* FLAT, and facing the camera. This is the thing that took longest to see: the
   big orb is not a ball. Every particle in the resting field has pz = 0 -- depth
   only ever leaves zero while a 3D formation is holding -- so it is a disc in
   the screen plane, a ring with a core inside it, and the core is visible
   because there is no near half of a shell in front of it.

   Built as a sphere, the core is behind the shell from every angle and what
   shows is whatever the near side happens not to cover: patchy, off-centre, and
   nothing like the original. Built as a disc it is the original, smaller.

   Above and behind him, so he does not stand in front of the one part that
   makes it read. z is heights behind, y is heights up from the floor. */
/* The small orb is the BIG one, at a smaller size and somewhere else.

   Every previous attempt authored its particles by hand -- a fibonacci spiral,
   a radius distribution, a spectrum term, a turbulence bump -- and each one got
   closer and still did not look like it, because the real orb's appearance is
   not a formula anybody wrote. It emerges: a ring radius per particle with its
   own frequency band, a bloom smearing targets across radii, a chirp along the
   index, a membrane spring, a containment wall, and three thousand particles
   chasing all of it through a capped force.

   None of that can be approximated. It can be REUSED. The whole of the orb's
   behaviour is the physics loop building a target from `cx, cy` and `ringR`,
   so the small one is the same code with two substitutions: the centre becomes
   the orb's own screen position, and ringR is multiplied by k. Everything else
   -- spectrum, bloom, chirp, membrane, force cap, colour, dot size -- follows
   for free, because it is literally the same lines.

   k is its size against the big one. z and y place it behind and above him, in
   his heights. */
/* Both of these are measured against the screen rather than reasoned about.
   k is a multiplier on the ring radius, so k of 0.30 with the perspective
   divide on top came out as a 17px orb against the big one's 78. And y of 1.95
   put its centre at screen y=13, where the field's containment wall squashed
   the whole thing into a 30px vertical smear. */
/* rate: how much of the field can change hands in one frame, as a fraction of
   it, at 60fps. 0.010 is 32 particles at 3200, so the full 55% share takes
   about nine tenths of a second to peel off -- slow enough to read as a stream
   of dots leaving him, fast enough that it is over before the build is. */
const ORB = { z: -0.9, y: 1.15, k: 0.80, fat: 1, tempo: 1.5,
              share: 0.13, full: 0.55, rate: 0.010 };
// where it is on screen this frame, and how big -- see the physics loop
let orbCX = 0, orbCY = 0, orbK = 1, orbT = 1;
// normalised distance from the orb's centre: 0 in the middle, 1 on the ring
// its own painter's-order scratch, since it draws in a pass of its own
const ordOrb = new Int32Array(MAX), zbufOrb = new Float32Array(MAX);

const ROOM = { back: -0.04, down: 0.09 };
// his height in the working space, measured at load
function figH1() { return rig.R ? (rig.R.fit.hi[1] - rig.R.fit.lo[1]) : 1; }

/* Nothing in this room casts a shadow, and on a black floor a shadow could not
   be seen if it did -- you cannot darken black. So the contact cue goes the
   other way: a soft pool of light he stands in, brightest under his feet. It is
   the same object as the mini orb's turntable, which is the point; it says the
   floor is a surface and that he is touching it, and without it he reads as
   pasted over a grid rather than standing on one. */
function makePool(T) {
  const c = document.createElement("canvas");
  c.width = c.height = 128;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0.00, "rgba(168,85,247,0.85)");
  g.addColorStop(0.35, "rgba(140,80,220,0.32)");
  g.addColorStop(0.70, "rgba(90,60,170,0.09)");
  g.addColorStop(1.00, "rgba(0,0,0,0)");
  x.fillStyle = g; x.fillRect(0, 0, 128, 128);
  const m = new T.Mesh(
    new T.PlaneGeometry(1, 1),
    new T.MeshBasicMaterial({ map: new T.CanvasTexture(c), transparent: true,
                              depthWrite: false, blending: T.AdditiveBlending,
                              fog: false }));
  m.rotation.x = -Math.PI / 2;      // flat on the floor
  m.frustumCulled = false;
  return m;
}

/* ---------------- the floor, as something you can actually see ----------------

   The room had no stationary reference frame, and that is the whole of the
   "everything moves with him" complaint.

   Measured: gl.ground is a grid, and its gate needs view.pitch past 0.20 before
   it fades in at all. In the dancing scene the pitch is 0.135 -- so the grid
   never draws, not once, and the only thing on the floor is the pool of light,
   which is parented to gl.root and therefore walks when he does. The floor WAS
   moving with him, because the floor was him. The boom box sits in gl.stage and
   stays put, so half the scene was pinned to the room and half to the man, and
   that reads exactly as wrong as it looked.

   The grid was right to be gated -- at eight degrees a lattice is a stack of
   horizontal rules and reads as an artefact. Points do not have that problem:
   a dot on a plane is a dot on a plane at any angle, and as he walks past them
   they slide, which is the parallax that tells you who is moving. Same language
   as everything else here, and they cost one draw call.

   Scattered on a golden-angle spiral rather than at random, so there are no
   clumps and no bald patches, and by sqrt of the index so the density is even
   across the disc instead of piling up at the middle. */
/* r is in his heights, and 3.4 was too far. The room is shot at about eight
   degrees, so a wide disc projects almost to the horizon -- which sits above
   his head -- and the far half of it scattered across the top of the screen as
   what reads like dust in the air rather than marks on a floor. Kept close
   enough that every mote lands below him and the fog takes the back edge. */
const MOTE = { n: 520, r: 1.9, size: 0.038 };
function makeMotes(T) {
  const N = MOTE.n;
  const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const rr = Math.sqrt((i + 0.5) / N), a = i * 2.399963;
    pos[i * 3] = Math.cos(a) * rr;
    pos[i * 3 + 1] = 0;
    pos[i * 3 + 2] = Math.sin(a) * rr;
    // the field's own two ends, mostly green with the odd magenta among it
    const h = hash(i + 77), g2 = h < 0.68, d = 0.62 + 0.38 * hash(i + 311);
    col[i * 3]     = (g2 ? 0.42 : 0.62) * d;
    col[i * 3 + 1] = (g2 ? 0.80 : 0.26) * d;
    col[i * 3 + 2] = (g2 ? 0.34 : 0.95) * d;
  }
  const geo = new T.BufferGeometry();
  geo.setAttribute("position", new T.BufferAttribute(pos, 3));
  geo.setAttribute("color", new T.BufferAttribute(col, 3));
  const m = new T.Points(geo, new T.PointsMaterial({
    vertexColors: true, sizeAttenuation: true, transparent: true,
    depthWrite: false, fog: true }));
  m.frustumCulled = false;
  return m;
}

/* The machine itself, built from primitives so it exists today: a tiered
   plinth, three prongs leaning in over a glowing throat, and two tilted rings
   precessing above it. Normalised to height 1 with its base at y = 0, so the
   frame code can scale it in his heights and a dropped-in GLB inherits the
   same footing. The rings hang off spinner groups because a torus spinning
   about its own axis is invisible -- the tilt is what makes the motion show. */
function makeGround(T) {
  /* A lattice, not a plane. The same language as the hologram's floor and the
     one thing that makes a horizontal surface read as a surface at all when
     there is nothing else in the room to judge it against. */
  const g = new T.GridHelper(1, 24, 0xA855F7, 0x4E9A5C);
  g.material.transparent = true;
  g.material.opacity = 0.9;
  g.material.depthWrite = false;
  g.frustumCulled = false;
  return g;
}

/* What he can be told to do. First match wins, so the specific ones come
   first -- "sit down" before "down", "lay down" before "walk".

   The third column is the difference between a thing he DOES and a thing he
   IS. A wave is over when the wave is over; sitting down is not over until you
   say so. Marked by hand rather than read off the clip length, because the
   lengths lie in both directions: sitting_ground_beach_pose is 0.03s (a single
   frame the exporter wrote out as an animation) and ended before it could be
   seen, while laying_idle_00 runs 12.5s and stood him back up unasked. A held
   row loops and stays until he is told something else. */
const ACTS = [
  [/\b(back ?flip|flip|somersault)\b/,            ["backflip"]],
  [/\b(dance|dancing|breakdance|bust a move)\b/,  ["dance_uprock_00", "dance_uprock_01",
                                                   "dace_breakdace_k-kick", "dance_breakdance_flares"], 1],
  [/\b(jump|hop|leap)\b/,                         ["idle_jump"]],
  [/\b(wave|waving|say hi|say hello)\b/,          ["idle_waving"]],
  [/\b(lay|lie) (down|back)\b|\blaying\b/,        ["laying_idle_00"], 1],
  [/\b(sit|sit down|sitting|take a seat)\b/,      ["sitting_ground_beach_pose"], 1],
  [/\b(kneel|kneeling|get down)\b/,               ["idle_kneeling"], 1],
  [/\b(stretch|stretching|warm up)\b/,            ["idle_stretch"]],
  [/\b(drunk|drink|have a drink|pint|beer)\b/,    ["drunk_idle_00", "drunk_idle_01"], 1],
  [/\b(stumble|trip)\b/,                          ["drunk_stumble"]],
  [/\b(fight|fighting|box|square up)\b/,          ["idle_ready_to_fight"], 1],
  [/\b(ninja|sneak|karate)\b/,                    ["idle_ninja"], 1],
  [/\b(sad|upset|sulk)\b/,                        ["idle_sad_kick"]],
  [/\b(happy|excited|bounce)\b/,                  ["idle_happy_bob"]],
  [/\b(hot|fan|warm)\b/,                          ["idle_fan_self"]],
  [/\b(nails|bored|boring)\b/,                    ["idle_look_at_nails"]],
  [/\b(fly|swat|bug|mosquito)\b/,                 ["idle_swat_fly"]],
  [/\b(tip ?toe|sneak up|quietly)\b/,             ["walk_fwd_tiptoe"]],
  [/\b(strut|swagger)\b/,                         ["walk_fwd_strut"]]
];
const IDLES = ["idle_neutral_00", "idle_neutral_01", "idle_neutral_02", "idle_neutral_03",
               "idle_happy_bob", "idle_stretch", "idle_look_at_nails", "idle_fan_self"];
const WALKS = ["walk_fwd_normal", "walk_fwd_upbeat", "walk_fwd_strut"];

function haveClip(n) { return gl.clips && gl.clips[n]; }
function pickIdle() {
  const ok = IDLES.filter(haveClip);
  return ok.length ? ok[(Math.random() * ok.length) | 0] : (gl.clips ? Object.keys(gl.clips)[0] : "");
}
function pickOne(list) {
  const ok = list.filter(haveClip);
  return ok.length ? ok[(Math.random() * ok.length) | 0] : "";
}

/* WHERE IN A CLIP TO COME IN.

   A crossfade blends the pose he is in toward the pose the new clip starts on,
   and it is only ever as good as the distance between those two. The flares
   end folded over with both hands near the floor; uprock starts upright with
   its weight on one leg. No fade length makes that read as a move -- a short
   one is the teleport, a long one is a swoop through a pose that is in neither
   clip.

   But a loop's first frame is only one of the poses in it. Sample the whole
   clip once, and at the hand-off start it at whichever frame is CLOSEST to the
   pose he is already standing in. Coming in a third of the way through a dance
   costs nothing -- it is a loop, it will reach its own beginning shortly.

   The signature is joint positions in group space, taken RELATIVE TO THE HIPS
   and divided by his height, so it compares shapes rather than places: two
   crouches match whether or not they are at the same spot on the floor, and
   the number that comes out is in body heights and means the same thing for
   any model that gets loaded here later. */
const POSE_N = 48;
const POSE_BONES = ["mixamorig_Hips", "mixamorig_Spine1", "mixamorig_Head",
  "mixamorig_LeftArm", "mixamorig_LeftForeArm", "mixamorig_LeftHand",
  "mixamorig_RightArm", "mixamorig_RightForeArm", "mixamorig_RightHand",
  "mixamorig_LeftUpLeg", "mixamorig_LeftLeg", "mixamorig_LeftFoot",
  "mixamorig_RightUpLeg", "mixamorig_RightLeg", "mixamorig_RightFoot"];
const POSE_D = POSE_BONES.length * 3;
let poseCur = null, poseTmp = null, poseM4 = null, poseV3 = null;

function poseRead(out) {
  const T = window.THREE;
  if (!gl.mesh || !gl.mesh.skeleton || !gl.group) return null;
  if (!poseM4) { poseM4 = new T.Matrix4(); poseV3 = new T.Vector3(); }
  if (!gl.boneBy) {
    gl.boneBy = {};
    for (const bn of gl.mesh.skeleton.bones) gl.boneBy[bn.name] = bn;
  }
  const hips = gl.boneBy[POSE_BONES[0]];
  if (!hips) return null;
  poseM4.copy(gl.group.matrixWorld).invert();
  const H = figH1() || 1;
  poseV3.setFromMatrixPosition(hips.matrixWorld).applyMatrix4(poseM4);
  const hx = poseV3.x, hy = poseV3.y, hz = poseV3.z;
  for (let i = 0; i < POSE_BONES.length; i++) {
    const bn = gl.boneBy[POSE_BONES[i]];
    if (!bn) { out[i * 3] = 0; out[i * 3 + 1] = 0; out[i * 3 + 2] = 0; continue; }
    poseV3.setFromMatrixPosition(bn.matrixWorld).applyMatrix4(poseM4);
    out[i * 3] = (poseV3.x - hx) / H;
    out[i * 3 + 1] = (poseV3.y - hy) / H;
    out[i * 3 + 2] = (poseV3.z - hz) / H;
