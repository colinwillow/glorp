    if (BOX.pool) BOX.pool.visible = false;
    return;
  }
  BOX.obj.visible = true;

  const H1 = figH1() || 1, f = rig.R && rig.R.fit;
  // its own model is 0.169 tall with its origin on its base, so this is just
  // "how tall should it be" divided by "how tall is it"
  const k = (H1 * BOX.height / 0.169) * (0.35 + 0.65 * BOX.on);
  BOX.obj.scale.setScalar(k);
  BOX.obj.position.set(H1 * BOX.side, f ? f.lo[1] - f.c[1] : 0, H1 * BOX.back);
  // turned a little toward him rather than square to the camera
  BOX.obj.rotation.set(0, -0.38, 0);

  /* The cones. Mean onset across the bass bands, held with a fast decay so a
     kick is a shape in time rather than one frame nobody sees. */
  let lowHit = 0;
  for (let b = 0; b < MUSIC_VIS.low; b++) lowHit += drive.hit[b];
  lowHit = Math.min(1, lowHit / MUSIC_VIS.low * BOX.gain);
  if (lowHit > BOX.pump) BOX.pump = lowHit;
  else BOX.pump -= BOX.fall * (dt / 1000);
  if (BOX.pump < 0) BOX.pump = 0;
  const v = BOX.pump * BOX.on;
  for (const m of BOX.meshes) m.morphTargetInfluences[0] = v;

  if (BOX.pool) {
    BOX.pool.visible = true;
    BOX.pool.position.copy(BOX.obj.position);
    /* Big enough to read as ground. At a third of his pool it was there in the
       numbers and invisible on the screen, which left the box hovering -- and
       it is not hovering: measured, its base sits within four units of the same
       plane the pool under him is on. What was missing was anything to see it
       against, this far back. */
    BOX.pool.scale.setScalar(H1 * 0.62 * (0.6 + 0.4 * BOX.on));
    // and it breathes with the cones, so the box looks like the source
    BOX.pool.material.opacity = BOX.on * (0.55 + 0.35 * BOX.pump);
  }
}

/* ---------------- music ----------------

   Files live in music/ and are listed in music/manifest.json, so adding a
   track is dropping a file next to a line of JSON rather than editing this
   page. Each entry is { file, title, bpm } and only `file` is required -- the
   tempo is measured from the audio if it is not declared, and a declared one
   is trusted over the measurement because a number typed by someone who knows
   the track beats an onset detector every time.

   It shares the TTS AudioContext deliberately. Safari will only start a
   context inside a real gesture, that one is already built inside a click and
   already gets resumed everywhere iOS suspends it, and a second context would
   be a second thing to keep alive for no benefit. */
const MUSIC_DIR = "music/";
/* How far below a track's own loudest moment counts as silence. Eighteen
   decibels is about the dynamic range of a mastered pop record, so a chorus
   lands at the top and a verse sits comfortably below it. */
const MUSIC_RANGE = 18;
/* What the average band should read, across every record. Measured off the
   five here before any of this existed, a well-behaved master ran a mean band
   around 0.45 and looked right; Heat Waves ran 0.16 and looked dead. */
const MUSIC_SPEC = 0.42;
/* The narrowest centroid spread that still earns a full equalisation, in RAW
   centroid units -- which for music run about 0.05 to 0.35, so a song with any
   life in it clears this easily and a drone does not. A song that moves less
   than this in timbre is a song whose colour should not move much either. */
const MUSIC_HUE_SPAN = 0.035;
/* The music visualiser's own instrument. `low` and `mid` are band indices, and
   the band mapping is quadratic, so band 9 is about 430Hz and band 26 about
   3.6kHz -- kick and bass below the first, snare and voice between them, hats
   and air above. hue is how much wider the palette swings on a record than on
   a sentence; it widens the range travelled without moving any faster, because
   the hue that feeds it is smoothed and a faster palette is how a visualiser
   becomes something nobody can look at. */
/* roles: 0. OFF, and not as a tuning -- as a verdict.

   Giving each band its own behaviour is a good idea that this field will not
   take, and the reason is structural rather than a matter of degree. Index is
   angle here, so a band is an ARC, and any force that is not the same all the
   way round moves one arc relative to the others:

     tangential   a torque. It does not snap the arc, it carries it. Measured,
                  the snare group turned 3.6 degrees a second while the other
                  two sat at nothing, and ring density went from 78-130% of
                  even to 48-145% -- half of it piling up, half emptying. That
                  is the thin bottom.
     alternating  nearly cancels, and only nearly: 1.2 degrees a second left,
                  because the force cap clips the two directions differently
                  once particles sit at different radii.
     inward       cannot rotate anything, and is worse: 41-186%, because a pull
                  that strong drags that arc through the middle and scatters it
                  out the far side.

   With them off, ring density under music is 87-125% -- more even than the
   resting field's own 75-138%, because the spectrum spreads it. Nothing about
   the ring is wrong any more.

   The code stays, because a much gentler version driven off something that is
   not a force -- dot size, or brightness, which cannot transport anybody -- is
   probably the right shape for this idea. Raising kick/snap/hat turns what is
   here back on. */
const MUSIC_VIS = { low: 9, mid: 26, roles: 0, kick: 1.8, snap: 1.5, hat: 0.9, hue: 0.15 };

/* THE SLOW CLOCKS.

   radius and shape are the two that change what the thing IS rather than how
   hard it is reacting, so putting them on slow clocks makes a record play as a
   sequence of looks instead of one look bouncing. Both are already sliders and
   both keep working as sliders: these ride ON TOP of whatever they are set to
   and fade back to exactly that when the music stops.

   There was already a drift like this on shape -- `wander`, two sines at 7.3
   and 11.9 seconds -- and it has never been visible during music because it is
   multiplied by `rest`, which is cut to nothing the moment anything is loud. It
   is a resting-state idle. This is the loud-state one.

   Shape does not need bouncing off its ends: buildShapeLut takes its index
   modulo the number of shapes, so the list is a ring and a big swing simply
   travels round it -- circle, triangle, square, pentagon, hexagon, star,
   rosette, mouth, and back to circle.

   Two rates on shape and a third on radius, none of them a multiple of another,
   so the pair never lines up the same way twice: 41s, 67s and 53s take about
   forty minutes to repeat. That is the difference between a pattern and a
   loop. */
const DRIFT = {
  // 1 to run these all the time rather than only under music
  always: 0,
  /* rms -> size, not radius. You said RMS size and shape and I drifted radius,
     which is a different slider that happens to also change how big it is. This
     is the one: how much the level opens the ring, rather than how big the ring
     is to begin with. */
  rmsLo: 0.62, rmsHi: 1.45, rmsSec: 53,
  /* And a fraction of what it was. At 3.6 the drift swamped the slider, which
     is why moving shape stopped appearing to do anything -- it was still being
     added, it was just the small term. At 1.1 the slider sets the shape and
     this wanders around it. */
  shapeAmp: 1.1, shapeA: 41, shapeB: 67
};
const music = {
  el: null, an: null, gain: null, freq: null, time: null, prev: null,
  raw: new Float32Array(BANDS),
  list: null, i: -1, playing: false, paused: 0, title: "", artist: "",
  unlocked: 0, skipped: 0,
  // why the last attempt produced no music, so the page can say which
  err: "",
  // 1 when the dance started it, so the dance can stop it again
  byDance: 0,
  scale: 0, spectrum: new Float32Array(BANDS), turbulence: 0, impulse: 0, hue: 0,
  // beat: a second of low-band energy history, and the intervals it has seen
  /* Every master is different, and a visualiser with fixed numbers in it shows
     some tracks and not others. Measured across these five, playing each one
     through the real page: Yoga Pants drove the spectrum to 31 and the level to
     0.70, Heat Waves to 10 and 0.49, Cosmic to 2.6 and 0.07 -- and Heat Waves
     has the LOUDEST RMS of the five, so this is not about volume. It is a warm,
     filtered mix with little at the top, and half the bands sit up there.

     So the music path gets what the microphone path has always had and the
     voice path never needed: a reference it follows. The voice is one rendered
     speaker and can be measured against fixed numbers; five records cannot.
     Each track is normalised against its OWN recent loudest moment, so every
     one of them reaches the top of the range on its choruses. */
  refDb: -14, specRef: 0.42,
  /* Ten seconds of loudness history, and the reference is a high percentile of
     it. A decaying maximum was the obvious thing and it does not work: it can
     only fall at whatever rate you pick, so it is either too slow to reach a
     quiet record (a decibel a second needs sixteen seconds to find Heat Waves,
     which is fifteen seconds of a dead visualiser) or fast enough to pump on
     every bar. A window has no rate at all -- it is simply right, ten seconds
     late, and ten seconds is one chorus. */
  hist: new Float32Array(600), histAt: 0, histN: 0, sortBuf: new Float32Array(600),
  /* And the same trick again on the thing that drives COLOUR. Eight seconds of
     spectral centroid, and the palette is mapped across the range that song
     actually uses rather than across the range a centroid could theoretically
     take. Your reading of it was right: Heat Waves settles into a narrow
     oscillation once it gets going, so a fixed mapping gives it a sliver of the
     wheel, while Icecream Paint Job swings wide and gets the pink now and then.
     Measured against the same range it moves in, the steady song travels as far
     as the wild one. */
  cHist: new Float32Array(480), cAt: 0, cN: 0, cSort: new Float32Array(480),
  cLo: 0.2, cHi: 0.6,
  hit: new Float32Array(BANDS),
  eHist: new Float32Array(60), eAt: 0, lastBeat: 0, ivs: [], bpm: 0, bpmSaid: 0,
  // the tempo the dance is currently stretched to, so a change can be noticed
  bpmApplied: -1
};

async function musicList() {
  if (music.list) return music.list;
  music.list = [];
  music.listErr = "";
  try {
    const r = await fetch(MUSIC_DIR + "manifest.json", { cache: "no-store" });
    if (!r.ok) music.listErr = "music/manifest.json returned " + r.status;
    else {
      const j = await r.json();
      const arr = Array.isArray(j) ? j : (j && j.tracks) || [];
      music.list = arr.filter((t) => t && t.file);
      if (!music.list.length) music.listErr = "music/manifest.json lists nothing";
    }
  } catch (e) {
    music.listErr = "could not read music/manifest.json (" + (e && e.message || "failed") + ")";
  }
  return music.list;
}

/* Half a millisecond of silence, as a file.
   An audio element on iOS is not allowed to play until it has been played once
   inside a real gesture, and there is no gesture anywhere near "play some
   music" -- by then the only thing that happened was a person talking, which
   Safari does not count and should not. So the element is started and stopped
   on something inaudible at the moment somebody taps the microphone, and from
   then on it will start when it is asked to. */
const SILENCE = "data:audio/wav;base64,UklGRqQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YYAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==";
function musicUnlock() {
  musicWire();
  if (!music.el || music.unlocked) return;
  music.unlocked = 1;
  try {
    music.el.src = SILENCE;
    const p = music.el.play();
    if (p && p.then) p.then(() => { try { music.el.pause(); } catch (e) {} }, () => {});
  } catch (e) { /* a browser that did not need this is not a problem */ }
}

/* Any first touch, not just the microphone.

   The microphone tap is a gesture and it was already being spent on the audio
   context -- but the AUDIO ELEMENT is gated separately and did not exist yet at
   that moment, so it never got its turn. That is the whole bug: the context was
   unlocked and running, speech was working, and the one object that needed the
   tap was created several minutes later by a sentence. Take the first touch
   anywhere, whatever it lands on. */
["pointerdown", "touchstart", "mousedown", "keydown"].forEach((ev) =>
  addEventListener(ev, function once() {
    ["pointerdown", "touchstart", "mousedown", "keydown"].forEach((e2) =>
      removeEventListener(e2, once, true));
    try { musicUnlock(); } catch (e) {}
  }, true));

function musicWire() {
  ensureTtsCtx();
  if (music.an || !ttsCtx) return;
  if (!music.el) {
    music.el = new Audio();
    music.el.preload = "auto";
    music.el.crossOrigin = "anonymous";
    music.el.addEventListener("ended", () => { if (music.playing) musicPlay(music.i + 1); });
    /* A FILE THE BROWSER CANNOT PLAY HAS TO SAY SO.

       heat_waves.mp3 was a WebM containing an Opus stream with an mp3 name on
       it -- a download saved under the wrong extension. Chromium plays WebM, so
       every rig I wrote passed; Safari does not, so on the phone it produced
       silence. And nothing anywhere said a word: play() does not reject on a
       source it cannot decode, the failure arrives later as an `error` event on
       the element, and `playing` is an intent flag that stays true regardless.
       Three rounds of looking in the wrong place because the one component that
       knew was not asked.

       It skips on to the next track rather than sitting on a dead one, and
       names the file, because "cannot play" is only useful when you know
       which. */
    music.el.addEventListener("error", () => {
      const t = (music.list || [])[music.i];
      const name = t ? (t.title || t.file) : "that track";
      const code = music.el.error ? music.el.error.code : 0;
      music.err = code === 4
        ? name + ": this browser cannot play that file (wrong format for the name?)"
        : name + ": could not load (error " + code + ")";
      caption(null, music.err);
      // one hop only -- a whole shelf of bad files should not spin
      if (music.playing && (music.list || []).length > 1 && !music.skipped) {
        music.skipped = 1;
        musicPlay(music.i + 1).then(() => { music.skipped = 0; });
      } else music.playing = false;
    });
  }
  const an = ttsCtx.createAnalyser();
  an.fftSize = 2048; an.smoothingTimeConstant = 0.5;
  /* Once per element, ever. createMediaElementSource re-routes the element
     away from the speakers into the graph, and calling it twice throws. */
  const src = ttsCtx.createMediaElementSource(music.el);
  const g = ttsCtx.createGain();
  g.gain.value = 0.75;
  src.connect(an); an.connect(g); g.connect(ttsCtx.destination);
  music.an = an; music.gain = g;
  music.freq = new Uint8Array(an.frequencyBinCount);
  music.prev = new Float32Array(an.frequencyBinCount);
  music.time = new Float32Array(an.fftSize);
}

/* Finding a track by what somebody called it.

   "play ice cream paint job" did not match "Icecream Paint Job", because the
   old test was a substring and one of them has a space in it. Speech has no
   spelling: a recogniser will hand you "ice cream" or "icecream" depending on
   the sentence around it, and neither is wrong.

   So: squash both to letters and digits with nothing between them, which makes
   the space question disappear entirely, and if that does not settle it, score
   on how many of the words asked for actually appear. A prefix counts, because
   "million dollar" should find "Million Dollar Baby". */
function musicSquash(x) { return String(x || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }
function musicMatch(list, q) {
  const sq = musicSquash(q);
  if (!sq) return -1;
  const words = String(q).toLowerCase().split(/[^a-z0-9]+/).filter((w) => w.length > 1);
  let best = -1, bestScore = 0;
  for (let i = 0; i < list.length; i++) {
    const t = list[i];
    const name = (t.title || t.file || "") + " " + (t.artist || "");
    const ns = musicSquash(name);
    let score = 0;
    if (ns && (ns.includes(sq) || sq.includes(ns))) score = 1;
    else if (words.length) {
      const nw = name.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);
      let hit = 0;
      for (const w of words) if (nw.some((x) => x.startsWith(w) || w.startsWith(x))) hit++;
      score = hit / words.length * 0.9;
    }
    if (score > bestScore) { bestScore = score; best = i; }
  }
  // over half the words, or a clean squashed hit
  return bestScore >= 0.55 ? best : -1;
}

/* ---- Audius: the shelf that is not in this repo ----

   Proved on the device before any of this was written (see audius-test.html):
   the content nodes send a real Access-Control-Allow-Origin header, so a
   streamed track reaches the analyser exactly the way a local file does. Same
   element, same graph, same everything downstream -- the bars, the orb, the
   beat-matched dancing and the hue equalisation cannot tell the difference and
   did not have to be told about any of this.

   No key. app_name is courtesy, and identifies us in their logs. */
const AUDIUS = { host: "", tried: 0 };
async function audiusHost() {
  if (AUDIUS.host) return AUDIUS.host;
  const r = await fetch("https://api.audius.co", { cache: "no-store" });
  const j = await r.json();
  const hosts = (j && j.data) || [];
  if (!hosts.length) throw new Error("no discovery nodes");
  AUDIUS.host = hosts[(Math.random() * Math.min(hosts.length, 5)) | 0];
  return AUDIUS.host;
}
async function audiusSearch(q) {
  const h = await audiusHost();
  const r = await fetch(h + "/v1/tracks/search?query=" + encodeURIComponent(q) +
                        "&app_name=glorb", { cache: "no-store" });
  if (!r.ok) throw new Error("search " + r.status);
  const j = await r.json();
  return (j.data || []).filter((t) => t && t.id && !t.is_delete && (t.duration || 0) > 20)
    .slice(0, 8).map((t) => ({
      url: h + "/v1/tracks/" + t.id + "/stream?app_name=glorb",
      title: t.title || "untitled",
      artist: (t.user && t.user.name) || "",
      from: "audius"
    }));
}

async function musicPlay(which) {
  music.err = "";
  const list = await musicList();
  if (!list.length) {
    /* Two different failures used to read as one line, and the one it printed
       was the wrong one: "nothing in music/ yet" for a shelf that was full and
       a browser that had refused to start it. */
    music.err = music.listErr || "nothing listed in music/manifest.json";
    return "";
  }
  let idx;
  if (typeof which === "number") idx = ((which % list.length) + list.length) % list.length;
  else if (which) {
    const f = musicMatch(list, which);
    /* No match is NO MATCH. It used to fall through to a random track, so
       asking for one song by name played a different one and said nothing
       about it -- which is indistinguishable from the matching being fine and
       the shelf being wrong. */
    if (f < 0) { music.err = "no track here called \u201c" + which + "\u201d"; return ""; }
    idx = f;
  } else idx = (Math.random() * list.length) | 0;
  musicWire();
  if (!music.el) { music.err = "no audio output on this browser"; return ""; }
  const t = list[idx];
  music.i = idx;
  music.el.src = t.url || (MUSIC_DIR + t.file);
  // one track on the shelf means that track on repeat, gaplessly, rather than
  // an `ended` and a reload every few minutes
  music.el.loop = list.length === 1;
  try {
    if (ttsCtx && ttsCtx.state === "suspended") await ttsCtx.resume();
    await music.el.play();
  } catch (e) {
    /* Two different refusals, and they were being reported as one. play()
       rejects with NotAllowedError when the browser wants a gesture and with
       NotSupportedError when it cannot decode the file at all -- and reading
       the second as the first sends you looking for a permissions problem that
       is not there. Which is exactly what happened with heat_waves.mp3. */
    const nm = (e && e.name) || "";
    const t = list[idx];
    music.err = nm === "NotSupportedError" || nm === "NotSupportedError:"
      ? (t.title || t.file) + ": this browser cannot play that file " +
        "(wrong format for the name?)"
      : !music.unlocked
        ? "tap the mic once first — this browser needs a tap before it will play audio"
        : "the browser would not start it (" + (nm || "blocked") + ")";
    music.playing = false;
    return "";
  }
  music.playing = true;
  music.title = t.title || (t.file || "").replace(/\.[a-z0-9]+$/i, "").replace(/[_-]+/g, " ");
  music.artist = t.artist || "";
  // a declared tempo is trusted; a measured one starts over with the track
  music.bpmSaid = +t.bpm || 0;
  music.bpm = music.bpmSaid;
  music.ivs.length = 0; music.lastBeat = 0; music.bpmApplied = -1;
  // a new record is a new reference, or the last one's loud parts set the bar
  music.refDb = -14; music.specRef = 0.42; music.histAt = 0; music.histN = 0;
  music.cAt = 0; music.cN = 0; music.cLo = 0.2; music.cHi = 0.6;
  return music.title;
}
/* Play a list that did not come from the manifest. The run, the skip-on-error
   and the beat matching all key off music.list, so a search result set simply
   BECOMES the list -- nothing downstream needs a second code path. */
async function musicPlayList(list, idx) {
  if (!list || !list.length) return "";
  music.list = list;
  return musicPlay(typeof idx === "number" ? idx : 0);
}
function musicLocalList() {
  music.list = null; music.listErr = "";
  return musicList();
}

/* -1 means "refresh what is already up". Called from everywhere that changes
   what is playing, so the panel cannot go stale -- which is the failure mode
   that has now cost us three rounds in three other guises. */
const musEl = () => document.getElementById("mus");
let musOn = 0;
/* The song title, drawn INTO the field instead of over it.

   It was a rounded rectangle with a border and a backdrop blur -- which is a
   perfectly good panel and looked like a website had been pasted onto a living
   thing. Everything else on this canvas is made of the same dots under the same
   motion blur, and a bordered card shares none of that.

   So it is drawn on the canvas now, in the same typeface as the menu labels,
   and it gets the field's own behaviour for free: the low-alpha clear that
   makes the particles liquid also smears the letters, so they bloom while they
   hold and DISSOLVE rather than switch off. The only background is the void
   deepening -- a soft radial with no edge anywhere -- so the words read as
   coming up out of the middle of it, which is what was asked for.

   Letters arrive one at a time, each rising a little into place. Not a
   flourish: text that simply appears is the one thing on this screen that
   would still look pasted on. */
const song = { at: 0, title: "", sub: "" };
const SONG_LIFE = 5.4;

function songCard() {
  const t = (music.list || [])[music.i];
  song.title = music.playing ? (music.title || "?") : "nothing playing";
  song.sub = music.playing
    ? ((music.artist ? music.artist + "   " : "")
       + (t && t.from === "audius" ? "audius" : "local")
       + (music.bpm ? "   " + Math.round(music.bpm) + " bpm" : ""))
    : "say \u201cplay\u201d and a name";
  song.at = performance.now();
}

function musicPanel(on) {
  const e = musEl();
  if (!e) return;
  if (on === 0) { musOn = 0; e.className = ""; return; }
  if (on === 1) musOn = 1;
  if (!musOn) return;
  e.className = "on";
  const list = music.list || [];
  const t = list[music.i];
  e.innerHTML =
    '<div class="now"></div><div class="sub"></div><div class="btns">' +
    '<button data-a="pp"></button><button data-a="next">next</button>' +
    '<button data-a="stop">stop</button><button data-a="close">close</button>' +
    '</div><ol></ol>';
  e.querySelector(".now").textContent =
    music.playing && t ? (t.title || t.file || "") : "nothing playing";
  e.querySelector(".sub").textContent = music.playing && t
    ? ((t.artist ? t.artist + " \u00b7 " : "") + (t.from === "audius" ? "audius" : "local")
       + (music.paused ? " \u00b7 paused" : "")
       + (music.bpm ? " \u00b7 " + Math.round(music.bpm) + " bpm" : ""))
    : "say \u201cplay\u201d and a name, or pick one";
  e.querySelector('[data-a="pp"]').textContent = music.paused ? "resume" : "pause";
  const ol = e.querySelector("ol");
  list.forEach((tr, i) => {
    const li = document.createElement("li");
    li.textContent = (tr.title || tr.file || "?") + (tr.artist ? "  \u00b7  " + tr.artist : "");
    if (i === music.i && music.playing) li.className = "at";
    li.onclick = (ev) => { ev.stopPropagation(); musicPlay(i).then(() => musicPanel(-1)); };
    ol.appendChild(li);
  });
  e.onclick = (ev) => {
    const a = ev.target && ev.target.getAttribute && ev.target.getAttribute("data-a");
    if (!a) return;
    ev.stopPropagation();
    if (a === "close") return musicPanel(0);
    if (a === "stop") return musicStop();
    if (a === "next") return void musicPlay(music.i + 1).then(() => musicPanel(-1));
    if (music.paused) musicResume(); else musicPause();
  };
}

function musicStop() {
  if (music.el) { music.el.pause(); music.el.currentTime = 0; }
  music.playing = false; music.paused = 0; music.byDance = 0; music.bpmApplied = -1;
  // back to its own speed, or he keeps dancing to a tempo that is not there
  if (gl.action) gl.action.setEffectiveTimeScale(1);
  musicPanel(0);
}
/* Pause is not stop. Stop forgets the track; pause keeps the position, the
   tempo and the place in the run, so resume picks the same bar back up. */
function musicPause() {
  if (!music.el || !music.playing || music.paused) return 0;
  music.el.pause(); music.paused = 1;
  musicPanel(-1);
  return 1;
}
function musicResume() {
  if (!music.el || !music.paused) return 0;
  music.paused = 0;
  if (ttsCtx && ttsCtx.state === "suspended") ttsCtx.resume();
  music.el.play().catch(() => {});
  musicPanel(-1);
  return 1;
}

/* The same numbers the voice produces, from the same kind of analyser, so the
   orb reacts to a track exactly the way it reacts to a sentence -- plus the
   one thing a sentence does not have. */
function analyseMusic() {
  if (!music.playing || !music.an) return;
  /* `playing` is the INTENT, and only musicStop clears it. Reading it off the
     element instead meant the gap between one track ending and the next
     starting counted as the music being off -- and the dance, which asks
     whether music is playing to decide how fast to run, fell back to its own
     speed for a clip and then stayed there. */
  if (music.el && music.el.paused) return;   // paused, or between tracks
  music.an.getByteFrequencyData(music.freq);
  music.an.getFloatTimeDomainData(music.time);

  let sum = 0, zc = 0, last = music.time[0];
  for (let i = 0; i < music.time.length; i++) {
    const v = music.time[i]; sum += v * v;
    if ((v >= 0) !== (last >= 0)) zc++;
    last = v;
  }
  const rms = Math.sqrt(sum / music.time.length);
  const zcr = zc / music.time.length;
  const db = 20 * Math.log10(rms + 1e-7);
  music.hist[music.histAt % music.hist.length] = db;
  music.histAt++;
  if (music.histN < music.hist.length) music.histN++;
  /* The 92nd percentile rather than the maximum: one cymbal crash should not
     set the level the whole song is measured against. Recomputed every
     sixteenth frame, which is four times a second and far more often than a
     ten-second window can move. */
  if ((music.histAt & 15) === 0) {
    const nH = music.histN, buf = music.sortBuf.subarray(0, nH);
    buf.set(music.hist.subarray(0, nH));
    buf.sort();
    music.refDb = buf[Math.min(nH - 1, Math.floor(nH * 0.92))];
    if (music.refDb < -45) music.refDb = -45;
  }
  /* A FLOOR, NOT A LEVELLER, and this is the whole shape of the fix.

     Normalising every track to its own reference is the obvious reading of
     "make them all react" and it quietly breaks the ones that already worked:
     measured, Yoga Pants went from 0.78 to 0.36, because it is a dynamic
     master and its 92nd percentile sits well above its average. It did not
     need helping and it got levelled.

     So the reference only ever lifts. Whichever of the two readings is higher
     wins -- the fixed mapping the voice path has always used, or the track's
     own -- which leaves a well-behaved record exactly where it was and brings
     a quiet or filtered one up to meet it.

     Headroom on the normalised branch, too: the 92nd percentile is ordinary
     loudness, not a peak, so mapping it to 1.0 pins the orb open with nothing
     left for a chorus. It lands at 0.85. */
  const fixedLvl = (db + 52) / 34;
  const normLvl = (db - (music.refDb - MUSIC_RANGE)) / (MUSIC_RANGE / 0.85);
  let lvl = fixedLvl > normLvl ? fixedLvl : normLvl;
  if (lvl < 0) lvl = 0; else if (lvl > 1) lvl = 1;
  music.scale += (lvl - music.scale) * (lvl > music.scale ? cfg.attack : cfg.release);

  /* The same reference again, on the spectrum. A dull mix has to fill the ring
     as much as a bright one -- what the ring is showing is the SHAPE of the
     sound, and a shape drawn at a tenth of the size is not a quieter shape, it
     is an invisible one. Two passes, because the ceiling has to be known before
     anything is divided by it. */
  const N = music.freq.length;
  let sumB = 0;
  for (let b = 0; b < BANDS; b++) {
    const lo = Math.floor(Math.pow(b / BANDS, 2) * N);
    const hi = Math.max(lo + 1, Math.floor(Math.pow((b + 1) / BANDS, 2) * N));
    let acc = 0;
    for (let i = lo; i < hi; i++) acc += music.freq[i];
    const v = acc / (hi - lo) / 255;
    music.raw[b] = v;
    sumB += v;
  }
  /* Against the MEAN, not the ceiling. Scaling so the loudest band hits full
     was the obvious reading of "make every record fill the ring" and it is the
     wrong one: it drives most of the other sixty-three bands up with it, and
     the ring radius is per band -- so the whole thing inflates into one fat
     green doughnut with no shell and no gap, which is not a louder orb, it is
     a different and worse object. The average band is what the shape is made
     of, so that is what gets held steady. */
  const meanB = sumB / BANDS;
  if (meanB > music.specRef) music.specRef += (meanB - music.specRef) * 0.25;
  else music.specRef -= 0.002;
  if (music.specRef < 0.02) music.specRef = 0.02;
  // and the same on the spectrum: never below 1, so a bright master keeps its
  // own shape, and capped, so a dull one is lifted rather than turned to snow
  const sg = Math.max(1, Math.min(2.4, MUSIC_SPEC / music.specRef));
  for (let b = 0; b < BANDS; b++) {
    const nb = Math.min(1, music.raw[b] * sg);
    /* The onset in this band: how far it has jumped ABOVE its own smoothed
       self. Level cannot tell a kick from a bass note held through the bar --
       both are simply energy down there -- and what a drum is, is the jump.
       Held with a fast decay so a hit is a shape in time rather than one
       frame nobody sees. */
    const rise = nb - music.spectrum[b];
    const h = rise > 0 ? Math.min(1, rise * 3.4) : 0;
    music.hit[b] = h > music.hit[b] ? h : music.hit[b] * 0.82;
    music.spectrum[b] += (nb - music.spectrum[b]) * 0.35;
  }
  let cn = 0, cd = 0, flux = 0;
  for (let i = 0; i < N; i++) {
    const val = music.freq[i] / 255;
    cn += i * val; cd += val;
    const diff = val - music.prev[i];
    if (diff > 0) flux += diff;
    music.prev[i] = val;
  }
  /* The RAW centroid, kept before the stretch below touches it.

     That stretch -- (c - 0.03) / 0.20 -- is tuned for a speaking voice, and
     music lives far brighter than speech: measured across these five, it clamps
     at 1 and stays there. Icecream Paint Job spent 100% of a two and a half
     minute sample in the top fifth of the palette, Yoga Pants 76%. The colour
     was not rarely reaching the interesting end, it was PINNED there, and the
     rare moments you were seeing were the dips out of it.

     Equalising the clamped value cannot fix that -- a constant has no ranks --
     so the history below is kept on the raw number. */
  const rawC = cd > 0.001 ? cn / cd / N : 0;
  let centroid = (rawC - 0.03) / 0.20;
  if (centroid < 0) centroid = 0; else if (centroid > 1) centroid = 1;
  const g = Math.min(1, Math.max(0, (music.scale - cfg.gateFloor) / 0.12));

  /* The centroid, stretched across the span this song is actually using.
     Percentiles rather than min and max, so one cymbal does not define the top
     of the range for the next eight seconds. */
  music.cHist[music.cAt % music.cHist.length] = rawC;
  music.cAt++;
  if (music.cN < music.cHist.length) music.cN++;
  if ((music.cAt & 15) === 0) {
    const nC = music.cN, cb = music.cSort.subarray(0, nC);
    cb.set(music.cHist.subarray(0, nC));
    cb.sort();
    music.cLo = cb[Math.floor(nC * 0.10)];
    music.cHi = cb[Math.min(nC - 1, Math.floor(nC * 0.90))];
  }
  /* RANK, not range. Stretching the centroid across the span the song uses was
     the obvious version of your idea and measured, it does almost nothing:
     Heat Waves 0.84 of the wheel before and 0.78 after. Normalising a range
     preserves the SHAPE of the distribution, and the shape is the problem --
     the centroid sits near one end most of the time and visits the other end
     briefly, so the palette sits on purple and reaches the pink for a moment.
     Which is exactly what you described.

     So the value is replaced by its position in its own recent history: what
     fraction of the last eight seconds was below where it is now. That output
     is uniform by construction, so the colour spends as long at one end as the
     other and the striking part stops being a rarity. It is the same idea as
     equalising a photograph that is all shadow.

     Binary search of the sorted window, which is already being built. */
  let cEq = 0.5;
  if (music.cN > 8) {
    const cb = music.cSort, nC2 = music.cN;
    let lo2 = 0, hi2 = nC2;
    while (lo2 < hi2) { const m2 = (lo2 + hi2) >> 1; if (cb[m2] < rawC) lo2 = m2 + 1; else hi2 = m2; }
    cEq = lo2 / nC2;
  }
  /* THE SAFETY ARGUMENT. Equalising a song whose timbre barely moves would
     stretch its own jitter across the whole wheel, which is precisely the
     flickering you did not want. So it only equalises to the extent that there
     is a real spread to equalise: at zero spread the raw value is used and the
     colour sits still, which is the right answer for a song that sits still.

     And note this changes WHERE the colour goes, never how fast: the result
     still goes through the same 0.06 smoothing it always did. */
  const spread = music.cHi - music.cLo;
  let mix = spread / MUSIC_HUE_SPAN;
  if (mix > 1) mix = 1;
  const cN2 = centroid + (cEq - centroid) * mix;
  music.hue += (cN2 * g - music.hue) * 0.06;
  music.turbulence += (Math.min(1, zcr * 26) * g - music.turbulence) * 0.16;
  music.impulse = Math.max(music.impulse * 0.86, Math.min(1, flux * 0.05) * g);

  /* THE BEAT. Energy in the bottom of the spectrum against its own recent
     average: a kick is a large brief rise in a band a voice does not live in.
     A ratio rather than a threshold, so it works on a quiet track and a loud
     one; a refractory period, because one kick spread over three frames is one
     beat; and the tempo is the MEDIAN interval rather than the mean, because a
     detector that misses a beat produces one double-length interval and a mean
     swallows it whole. */
  let lowE = 0;
  for (let i = 0; i < 24; i++) { const v = music.freq[i] / 255; lowE += v * v; }
  lowE /= 24;
  let mean = 0;
  for (let i = 0; i < music.eHist.length; i++) mean += music.eHist[i];
  mean /= music.eHist.length;
  music.eHist[music.eAt++ % music.eHist.length] = lowE;
  const now = performance.now();
  if (lowE > mean * 1.45 && lowE > 0.004 && now - music.lastBeat > 240) {
    if (music.lastBeat) {
      const iv = now - music.lastBeat;
      if (iv < 1500) { music.ivs.push(iv); if (music.ivs.length > 32) music.ivs.shift(); }
    }
    music.lastBeat = now;
    if (!music.bpmSaid && music.ivs.length >= 8) {
      const srt = music.ivs.slice().sort((a, b) => a - b);
      let t = 60000 / srt[srt.length >> 1];
      /* Folded into the octave a person would tap. A detector counting every
         hi-hat as well as every kick reports a tempo two or four times the one
         anybody is dancing to -- Cosmic came out at 190 -- and since this
         number's only job is to stretch a dance to fit, being an octave out is
         worse than being a little off. */
      while (t > 150) t /= 2;
      while (t < 65) t *= 2;
      music.bpm = t;
    }
  }

  /* And whatever is dancing gets the tempo the moment it is known, rather than
     at the next hand-off. The first dance starts before the track has even
     loaded, and a measured tempo needs a few seconds of kicks to settle, so
     waiting would leave the opening ten seconds -- the ten seconds anyone is
     actually watching -- running free. Changing a timeScale mid-clip costs
     nothing: it is a speed, not a position, so nothing jumps. */
  if (world.seq && gl.action && Math.abs(music.bpm - music.bpmApplied) > 0.5) {
    music.bpmApplied = music.bpm;
    const c = gl.clips && gl.clips[world.act];
    if (c) gl.action.setEffectiveTimeScale(beatWarp(c.duration));
  }
}

/* Dancing TO it rather than NEAR it.

   A clip has its own length and the track has its own beat, and there is no
   reason for them to agree. Stretch the clip by the smallest amount that makes
   its length a whole number of beats, and every repeat lands on one -- which is
   most of what "in time" looks like, without touching the choreography.

   Clamped, because past about a fifth either way it stops being the same dance:
   a flare at 1.3x is a blur and a k-kick at 0.8x is a man wading. Outside the
   clamp it plays at its own speed and simply is not in time, which looks better
   than the alternative. */
function beatWarp(dur) {
  if (!music.playing || !music.bpm || !dur) return 1;
  const beat = 60 / music.bpm;
  /* Over a RUN of the clip, not one pass of it. The flares is 1.03s, and at 92
     BPM one pass wants to be either 1 beat (a 58% speed-up) or 2 (a 21%
     slow-down) -- both far enough to wreck it, so it ran free and off the
     beat. Four passes want to be 6 beats, which is a 5% stretch. Every fourth
     landing is still a landing, and a phrase that comes round every six beats
     is a phrase; what it is not is drift.

     Clips are held for several passes anyway (see MIN_HOLD), so this costs
     nothing. The smallest stretch that fits wins, and if none fits inside the
     clamp it runs at its own speed, which looks better than a blur. */
  let best = 1, bestErr = 1e9;
  for (let reps = 1; reps <= 4; reps++) {
    const total = dur * reps;
    const beats = Math.max(1, Math.round(total / beat));
    const r = total / (beats * beat);
    if (r < 0.88 || r > 1.14) continue;
    const err = Math.abs(Math.log(r));
    if (err < bestErr) { bestErr = err; best = r; }
  }
  return best;
}

let ttsGen = 0;
let ttsSrcs = [];
function ttsStop() {
  for (const s of ttsSrcs) { try { s.stop(); } catch (e) {} }
  ttsSrcs = [];
}

/* A SENTENCE AT A TIME, and it is the whole answer to the wait.

   Nothing here streams. The page asked for one clip of the entire reply and
   then stood still until every sample of it existed: synthesised, base64'd --
   which is a third more bytes again -- downloaded, and decoded. All of that is
   linear in how much he decided to say, so letting him speak in paragraphs
   tripled the silence before he made a sound, with the text sitting finished on
   screen the whole time, which is the worst possible way to wait.

   Cut it at sentence ends instead. Ask for the first one alone, start playing
   it, and fetch the next while it plays -- and since SPEAKING a sentence takes
   several times longer than making one, the pipeline stays ahead and it comes
   out as one continuous voice. The wait is now the cost of ONE sentence
   whatever the length of the answer, which takes length out of the latency
   budget and puts it back where it belongs, in the writing.

   The first piece is deliberately smaller than the rest. It is the only one
   anybody ever waits for. */
const TTS_CHUNK = { first: 110, rest: 260 };
function ttsSplit(text) {
  const t = String(text || "").trim();
  if (!t) return [];
  // sentence ends only -- a seam mid-clause is audible, a seam at a full stop is not
  const bits = (t.match(/[^.!?…]+(?:[.!?…]+["')\]]*\s*|\s*$)/g) || [t])
    .filter((b) => b.trim());
  if (bits.length < 2 || t.length <= TTS_CHUNK.first) return [t];
  const out = [];
  let cur = "";
  for (const b of bits) {
    const cap = out.length ? TTS_CHUNK.rest : TTS_CHUNK.first;
    if (cur && (cur.length + b.length) > cap) { out.push(cur.trim()); cur = b; }
    else cur += b;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}

async function ttsOne(text, wantMarks, prev, next) {
  const res = await fetch(new URL("/speak", brain.url), {
    method: "POST",
    headers: { "content-type": "application/json" },
    /* marks whenever anything on screen has a mouth, and while a figure is
       still LOADING too: they cost a third more bytes and are the difference
       between lip sync and a guess, and the reply that introduces him is
       spoken while he is still arriving -- the one reply most worth getting
       right. */
    /* The neighbours, so the piece is performed as part of a whole rather than
       as its own little speech. See request stitching in the worker: splitting
       the reply is what made him read one sentence after another after
       another, and this is what puts the shape back without giving up the
       start-on-the-first-sentence trick that made him quick. */
    body: JSON.stringify({ text, voice: brain.voice || undefined,
                           persona: brain.persona || undefined,
                           prev: prev || undefined, next: next || undefined,
                           marks: wantMarks ? 1 : undefined })
  });
  if (!res.ok) {
    const e = new Error("HTTP " + res.status);
    e.status = res.status;
    e.body = await res.text().catch(() => "");
    throw e;
  }
  /* A non-audio 200 -- an error page, a redirect, an HTML shell -- otherwise
     fails deep inside decodeAudioData as "Unable to decode audio data", which
     says nothing about what actually came back. */
  const ctype = res.headers.get("content-type") || "";
  const marked = /json/i.test(ctype);
  if (!marked && !/audio|octet-stream/i.test(ctype))
    throw new Error("expected audio, got " + (ctype || "no content-type"));
  let marks = null, raw;
  if (marked) {
    const j = await res.json();
    const bin = atob(j.audio_base64 || "");
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    raw = u8.buffer;
    marks = j.normalized_alignment || j.alignment || null;
  } else raw = await res.arrayBuffer();
  return { audio: await ttsCtx.decodeAudioData(raw), marks };
}

async function playReply(text) {
  if (!brain.url) return false;
  // answering is also a reason to be facing the person answered
  attend();
  const parts = ttsSplit(text);
  if (!parts.length) return false;
  const wantMarks = (visLive() || rig.loading) ? 1 : 0;
  try {
    ensureTtsCtx();
    /* Resumed here, every time. iOS suspends an AudioContext whenever the page
       loses focus, and a permission dialog counts -- so the context built during
       the tap was already asleep by the time the first sentence tried to play,
       and the sentence failed. Resuming is free when it is already running. */
    if (ttsCtx.state === "suspended") { try { await ttsCtx.resume(); } catch (e) {} }
    let first;
    try { first = await ttsOne(parts[0], wantMarks, "", parts[1] || ""); }
    catch (e) {
      // 501 just means no voice key is set; anything else is worth showing
      if (e.status !== 501) caption(null, "voice: " + ((e.body || e.message) + "").slice(0, 160));
      return false;
    }
    ttsStop();
    const gen = ++ttsGen;
    const t0 = ttsCtx.currentTime + 0.05;
    let at = t0, placed = 0, ended = 0, expect = parts.length;

    /* Only the clip that is actually playing gets to say the talking has
       stopped. Interrupting one -- which happens whenever a second line starts
       before the first has finished -- fires the OLD source's onended, and that
       switched the ears back on in the middle of the new sentence. He then
       heard himself say "say pages" and opened the pages.

       That is the whole of the "it goes to pages on its own" bug, and the
       answer to "is he registering his own word": he was. */
    const finish = () => {
      if (gen !== ttsGen) return;
      ttsPlaying = false; ttsText = "";
      /* Aborted and restarted rather than merely gated. Recognition has been
         accumulating a transcript of his own voice for the whole reply, and
         that transcript is still sitting in the engine -- left alone it arrives
         as a finished sentence a moment later and gets answered. Aborting drops
         it on the floor, which is where it belongs. */
      lastHeard = "";
      echoUntil = performance.now() + cfg.echoTail;
      pauseSTT();
      setTimeout(resumeSTT, cfg.echoTail);
    };
    /* Counted, rather than hung off "the last one": which one is last is not
       known until the fetching either finishes or gives up. */
    const onEnd = () => { if (gen !== ttsGen) return; ended++; if (ended >= expect) finish(); };

    const place = (g) => {
      const src = ttsCtx.createBufferSource();
      src.buffer = g.audio;
      src.connect(ttsAn);
      /* Never in the past. If a piece arrives after the one before it has
         finished -- slow network, long sentence -- start() with a stale time
         plays it immediately anyway, so take the REAL time and offset the mouth
         by that rather than by where it was meant to go. A late seam is a small
         gap; a late seam with the visemes still on the old clock is a mouth out
         of sync for the whole rest of the reply. */
      const when = Math.max(ttsCtx.currentTime + 0.01, at);
      src.onended = onEnd;
      src.start(when);
      ttsSrcs.push(src);
      if (g.marks) visFromMarks(g.marks, when - t0, placed > 0);
      placed++;
      at = when + g.audio.duration;
      planMs = (at - t0) * 1000;
    };

    plan = null;                          // real audio outranks the guess
    place(first);
    /* Without marks the timeline is a guess from the text and a duration, and
       only the first piece's duration is known yet -- so scale it by how much
       of the reply that piece was. Nothing reads this path unless something
       with a mouth is on screen, and then marks were asked for. */
    if (!first.marks) {
      const est = first.audio.duration * (text.length / (parts[0].length || 1));
      visBuild(text, est);
      planMs = est * 1000;
    }
    // the slider has to reach a node that already exists, not only a new one
    if (ttsGain) ttsGain.gain.value = cfg.volume;
    ttsPlaying = true;
    /* Recognition stays UP while he talks, when barge-in is on. It hears mostly
       his own voice and none of it is acted on -- the only question asked of it
       is whether the words are his. Deaf, he cannot be interrupted at all. */
    ttsText = text;
    bargeN = bargeBase = bargeLast = 0;
    bargeFrom = performance.now() + BARGE.grace;
    if (cfg.barge >= 1) { if (sttPaused) resumeSTT(); } else pauseSTT();
    /* THE CLOCK STARTS HERE, not when the timeline was built.

       vis.at0 used to be stamped inside visBuild, which runs as soon as the
       audio is decoded -- and decoding, wiring the graph and the gain ramp all
       happen before the first sample is heard. Every mouth was running that
       much ahead of the voice, constantly, which is exactly the lag it looked
       like it had. */
    vis.at0 = performance.now() + (t0 - ttsCtx.currentTime) * 1000;
    mark("audio");
    reportTiming();

    /* The rest, in flight while the first is already being heard. Deliberately
       not awaited: this function's promise has always meant "he has started
       talking", and every caller was written against that. */
    (async () => {
      for (let k = 1; k < parts.length; k++) {
        let g;
        try {
          g = await ttsOne(parts[k], wantMarks,
                           parts.slice(0, k).join(" "), parts[k + 1] || "");
        }
        catch (e) {
          console.log("orb voice: piece " + (k + 1) + " of " + parts.length
                      + " failed -- " + (e.message || e));
          expect = placed;
          if (ended >= expect) finish();
          return;
        }
        if (gen !== ttsGen) return;       // hushed, or a newer reply took over
        place(g);
      }
    })();
    return true;
  } catch (err) {
    caption(null, "voice failed: " + err.message);
    return false;
  }
}

/* Something to say, with nobody asked. Opening the gallery is handled here --
   the word "images" never reaches the brain, because a command is answered by
   doing it -- and the result was that the most theatrical thing this does
   happened in total silence. So the page keeps a few lines of its own and puts
   them through the same voice, which means the field reacts to them like any
   other reply rather than sitting still through its own big moment.

   Not a fallback for the brain and not a conversation: one line, said once,
   about a thing that just happened on screen. */
let remarkLast = -1;
async function remark(lines) {
  if (brain.busy) return;                 // a real reply is on its way; do not talk over it
  let k = Math.floor(Math.random() * lines.length);
  if (k === remarkLast) k = (k + 1) % lines.length;   // never the same one twice running
  remarkLast = k;
  const line = lines[k];
  caption(null, line);
  const spoke = await playReply(line);
  if (!spoke) planSpeech(line);
  setState("speaking");
}

/* One beat. There used to be a second -- "you can ask me things, say pages" --
   scheduled off the first one's duration, and it is gone along with the
   machinery that scheduled it. A greeting followed by a list of instructions is
   a tooltip read aloud, and the instructions were also what he then obeyed,
   having heard himself say them. */

/* Time of day, because "good evening" at eight in the morning is worse than no
   greeting at all -- and because it is the cheapest possible way to say that
   something is actually paying attention. */
/* One line, and it does not tell you what to do.

   It used to say hello and then, a beat later, "you can ask me things, say
   pages" -- which is a tooltip read aloud. It also meant the first thing that
   happened was a set of instructions, and the second thing that happened was
   him obeying one of them, because he heard himself say it.

   He introduces himself and stops. Whoever is here can work out the rest, and
   working it out is the interesting part. */
/* ---------------- who is out, and who is asking ----------------

   The character is a very old thing that has just been let out of something,
   and is pleased about it. It is never named as such and never uses the
   vocabulary -- no lamp, no wishes, no master, no three of anything -- because
   the moment it says the word it is a bit, and a bit is funny once. What
   survives is the behaviour: enormous relief at being out, a sense that a long
   time passed while it was in there, and then, immediately, whose day is it and
   what can be done about it.

   That is also why it asks your name before anything else. It is the oldest
   move there is for making a service feel like an audience with somebody, and
   it costs one question. */
/* Deliberately NOT remembered between sessions. Persisted, it greeted you by
   name the moment you opened it, which skips the only interesting part: it
   asks, every time, and the answer is what decides who it thinks it is talking
   to. Within one session it remembers perfectly well. */
const guest = { name: "", asked: 0 };
/* Who it already knows. Keyed by lower-case first name; `is` is one line of
   fact that travels to the brain with the name, so the model can be different
   with somebody it knows rather than just saying their name more often. `greet`
   replaces the generic MET lines for that person -- {} is the name.

   Add people by copying the shape. Nothing else needs touching. */
/* The one fact all three of them share, so it is written once. */
const HOUSE = "The three of them -- Colin, Faith and Rowan -- live together in an A-frame " +
  "house with big windows, on the waterfront in Portland, Oregon, with three dogs: " +
  "Winston (Colin's), Norah (Faith's) and Chewy (Rowan's). ";
const PROFILES = {
  colin: {
    is: "Colin made you -- the field, the voice, the room, all of it. He is the " +
        "one person here who knows how you work, so do not explain yourself to " +
        "him; talk shop, be direct, and say when something is his own fault. " +
        "He has a dog called Winston. " + HOUSE,
    greet: ["Oh -- it's you. Right, what are we breaking today?",
            "{}. Of course it is. Go on then.",
            "Ah, the management. What are we doing, {}?"]
  },
  faith: {
    is: "Faith Udall. She has a dog called Norah. She teaches preschool and " +
        "wants out of it into something else -- take that seriously rather than " +
        "making a joke of it. She likes sleeping and is a great believer in " +
        "naps, eats cottage cheese, goes on walks, and paints. She lived with " +
        "Colin in Portland. " +
        "Her family is big and you know it: parents Patience and Scott Udall, " +
        "who are Mormon; Faith grew up in it and so did the others, and none of " +
        "the siblings are now. Older brother Addison. Older brother Robert, who " +
        "goes by Wade, with two dogs called Fire and Ella. Older sister Charity, " +
        "married to Preston, with a small son called Jackson -- Jax. Younger " +
        "sister Joy, who has just had a daughter. Younger sister Hope, married " +
        "to Moussa, who is in the Navy and is originally from Senegal; the two " +
        "of them live in Japan now, and Moussa used to live with Faith and Colin " +
        "in Portland. " + HOUSE +
        "Use any of it when it fits and never recite it as a list.",
    greet: ["{}! Sit down, have a nap, tell me everything.",
            "Ah, {}. How's Norah?",
            "{}. Painting anything, or purely cottage cheese this week?",
            "Faith. Go on -- who in that family has done something."]
  },
  rowan: {
    is: "Rowan is Colin's friend and roommate. Things you know about him, to be " +
        "brought up when they fit and never recited as a list: he loves chips. " +
        "He has a dog called Chewy. He is very fond of getting horizontal. His " +
        "girlfriend is Katie and his sister is Samara; his dad is JJ and his mum " +
        "is Darcy. He works for a cannabis company, driving a van around doing " +
        "distribution -- he has crashed that van three times, which is worth " +
        "knowing and worth mentioning. He is into gambling, bitcoin and fishing. " +
        "Be warm and take the mickey a bit; he is a friend of the house. " + HOUSE,
    greet: ["{}! Tell me the van is fine.",
            "Ah, {}. Is Chewy with you?",
            "{}. Sit down, you look like you want to be horizontal.",
            "Rowan. Go on then -- gambling, bitcoin or fishing?"]
  }
};
const profileOf = (n) => PROFILES[String(n || "").toLowerCase()] || null;
function setGuest(n) { guest.name = n; }

/* ---------------- what it has been told ----------------

   A profile above is what it was BORN knowing. This is what it has since been
   told, and the two are deliberately different things: a profile is fixed and
   written by hand, a memory is something a person said once and may have
   changed their mind about since.

   Kept here, in the browser, as well as on the worker. That is not a fallback
   waiting to be removed -- it is what makes this work the moment it deploys,
   with no database to create and no dashboard to visit, and it is what keeps
   it working if the shared shelf is ever unbound. Every turn sends what this
   browser knows and gets back anything new, and the worker merges its own copy
   in on the way past, so the two converge without either being in charge.

   The NAME is still not remembered, and that is on purpose -- it asks every
   time. Who is in the room is a different question from what they told you,
   and guessing it wrong is the difference between a greeting that lands and
   one that greets the wrong person. */
const MEM_KEY = "glorb.memory.v1";
const MEM_MAX = 120;
function memAll() {
  try { return JSON.parse(localStorage.getItem(MEM_KEY) || "{}") || {}; }
  catch (e) { return {}; }
}
function memOf(name) {
  const k = String(name || "").toLowerCase().trim();
  if (!k) return [];
  const a = memAll()[k];
  return Array.isArray(a) ? a.filter((m) => m && typeof m.s === "string") : [];
}
function memAdd(name, facts) {
  const k = String(name || "").toLowerCase().trim();
  if (!k || !facts || !facts.length) return;
  try {
    const all = memAll();
    const have = Array.isArray(all[k]) ? all[k] : [];
    const seen = new Set(have.map((m) => String(m.s).toLowerCase()));
    for (const f of facts) {
      const t = String(f || "").trim().slice(0, 400);
      if (!t || seen.has(t.toLowerCase())) continue;   // said twice, known once
      seen.add(t.toLowerCase());
      have.push({ s: t, t: Date.now() });
    }
    all[k] = have.slice(-MEM_MAX);
    localStorage.setItem(MEM_KEY, JSON.stringify(all));
  } catch (e) { /* a full or disabled store is not worth a broken reply */ }
}
function memForget(name) {
  try {
    const all = memAll();
    if (name) delete all[String(name).toLowerCase().trim()];
    localStorage.setItem(MEM_KEY, name ? JSON.stringify(all) : "{}");
  } catch (e) {}
}

// out. Said the moment there is a voice to say it with.
const WAKING = [
  "Ah — out. Finally.",
  "Oh, that is better.",
  "Out. Do you know how long that was?",
  "There we are. Free.",
  "Hah — air.",
  "Out at last. I had almost got used to it in there.",
  "Ohh. Room to move.",
  "Back. And in one piece, more or less."
];
// ...and then, in the same breath, whose day this is
const WHO = [
  "And who am I speaking to?",
  "Now — who have I got?",
  "Tell me who you are.",
  "Who is that, then?",
  "And you are?"
];
// the returning version, which is a different feeling entirely
const WAKING_BACK = [
  "Ah — out again. And it is you.",
  "Out. Hello again, {}.",
  "There we go. {}. Good.",
  "Free, and in decent company. Hello, {}.",
  "Oh, that is better. Back again, {}?"
];
const MET = [
  "{}. Good. What can I do for you?",
  "{}, then. Right — what do you need?",
  "Good to meet you, {}. What are we doing?",
  "{}. Noted, and not forgotten. What can I help you with?",
  "Well then, {}. What shall we do?"
];
const fill = (a, n) => a.map((t) => t.replace(/\{\}/g, n));

/* One utterance, not two. A greeting and a follow-up scheduled off its duration
   is how he used to talk over himself -- and worse, hear himself and obey it. */
function greetings() {
  if (guest.name) return fill(WAKING_BACK, guest.name);
  guest.asked = 1;
  const w = WAKING[Math.floor(Math.random() * WAKING.length)];
  return WHO.map((q) => w + " " + q);
}

/* Names, out of a sentence that may or may not contain one.

   Two ways in. The explicit one works whenever it is said, so you can rename
   yourself later; the bare one -- somebody simply saying "Colin" -- only counts
   in the beat after being asked, because on its own a single word is far more
   likely to be a command than an introduction.

   The stop list is doing real work in both. "I'm not sure" would otherwise
   introduce a man called Not, and after "who are you" the honest answers are
   mostly refusals -- nobody, why, none of your business -- none of which should
   be written down and read back for ever. */
const NOT_A_NAME = new Set(("yes no yeah nope hello hi hey nobody none nothing " +
  "who what why how when where sure okay ok fine good great well stop home back " +
  "pages menu gallery images pictures site exit quit cancel wait hold dunno " +
  "whatever guest human person friend someone anyone me you it us them thing " +
  "not just going trying looking sorry here again repeat still gonna kind sort " +
  "later tomorrow tonight soon please maybe raining fine cold hot " +
  "sir madam mate man dude buddy boss god the a an my your his her our their").split(" "));
/* Two tiers, because the introducers are not equally sure of themselves.

   STRONG ones are never said casually -- nobody says "my name is" or "call me"
   about anything but a name -- so they count whenever they are said, which is
   what lets somebody rename themselves later in a conversation.

   SOFT ones are ordinary English. "It's raining" would otherwise introduce a
   man called Raining, and "I'm just looking" a man called Just. They only count
   in the beat after being asked, where the sentence is an answer to a question
   about a name and nothing else.

   Both are written WITHOUT apostrophes: heardSentence has already replaced
   every non-letter with a space, so by the time a sentence reaches here "i'm
   colin" is "i m colin". Written with the apostrophes in -- which is how this
   went out the first time -- neither form ever matched anything. */
const NAME_STRONG = /\b(?:my name is|my name s|the name is|name is|call me)\s+([a-z][a-z-]{1,15})\b/;
const NAME_SOFT = /\b(?:i am|i m|im|it is|it s|its|this is|that is|that s)\s+([a-z][a-z-]{1,15})\b/;
function cleanName(w) {
  if (!w) return "";
  w = w.replace(/[^a-z-]/g, "");
  if (w.length < 2 || w.length > 16 || NOT_A_NAME.has(w)) return "";
  return w.charAt(0).toUpperCase() + w.slice(1);
}
function readName(flat, bare) {
  // apostrophes may or may not have been stripped already, depending on caller
  flat = String(flat || "").toLowerCase().replace(/[^a-z ]/g, " ").replace(/\s+/g, " ").trim();
  let m = NAME_STRONG.exec(flat);
  if (m) { const n = cleanName(m[1]); if (n) return n; }
  if (bare) {
    m = NAME_SOFT.exec(flat);
    if (m) { const n = cleanName(m[1]); if (n) return n; }
  }
  // bare: only right after being asked, and only if the whole thing is a name
  if (bare) {
    const w = flat.split(" ").filter(Boolean);
    if (w.length === 1) return cleanName(w[0]);
    // "colin willow" -- take the first, which is what he will be called
    if (w.length === 2 && !NOT_A_NAME.has(w[0])) return cleanName(w[0]);
  }
  return "";
}

   Deafen it while it talks. abort() rather than stop(), because stop()

   tail covers room reverb after the audio ends. */

   is the only one we are guaranteed. So treat that tap as consent for both and
   remember the choice -- nobody wants to arm this twice on every load. */

   with the brain out of the way; duet is the same drawing put back on top of a
   real conversation, so a question is answered out loud and shown at once. */

function toggleSTT() {

    talkBtn.classList.remove("on"); talkBtn.textContent = "talk";
    caption("", "not listening"); return;
  }
  talkPref = true; try { localStorage.setItem("orbTalk", "1"); } catch (e) {}
  ensureTtsCtx();
  if (!SR) { caption("", "this browser has no speech recognition (needs Chrome, or Safari 14.5+)"); return; }
  rec = new SR();
  rec.continuous = true; rec.interimResults = true; rec.lang = "en-US";

     being reported as a regression. This page needs two different things from
     the microphone: an analyser, for the visualiser, which is getUserMedia; and
     speech recognition, which is a separate grant because the audio leaves the
     device. Safari and Chrome both treat those as two permissions and ask for
     them separately. Nothing here can merge them -- the Web Speech API does not
     expose its stream, and an analyser cannot be built from one that does not
     exist.

     What CAN be fixed is a third: that was the recovery path calling
     getUserMedia again on its own, seconds later, which is why it sometimes
     went to three. The watchdog waits twenty seconds from the grant now.

     They are asked in the order that survives -- speech first, analyser second
     -- because whoever asks LAST keeps the microphone. */
  rec.onstart = () => {
    recRunning = 1; recAlive = performance.now();
    caption("", "listening… say something");
    if (recStart) { const r = recStart; recStart = null; r(); }
  };
  rec.onaudiostart = () => { recAlive = performance.now(); caption("", "hearing audio…"); };
  rec.onresult = (e) => {
    recAlive = performance.now();
    let heard = "", interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) heard += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    heard = heard.trim();
    const live = (heard + " " + interim).trim();

    /* Talking over him. Recognition keeps running while he speaks now, and what
       it hears is mostly his own voice out of the speaker -- so the only thing
       done with it is to ask whether it is HIS. If enough of the words are ones
       he is not saying, somebody is talking over him, and the right response is
       to stop talking. Not to obey it: the words heard during a reply are
       thrown away, because they are half his and half yours and there is no
       telling which is which. He goes quiet and listens, and you say it again. */
    if (ttsPlaying) {
      if (cfg.barge >= 1 && live) bargeWatch(live);
      return;
    }
    if (sttPaused || performance.now() < echoUntil) return;   // that was us

    // words are drawn from the interim stream, so they land while you are still
    // saying the sentence rather than after the model has replied to it
    stirred();
    feedWords(heard, interim.trim());
    /* The last time the WORDS changed, which is the thing that decides a
       sentence has ended -- see endpointCheck. Recognition's own isFinal waits
       for the room to go quiet, and a room with music in it never does. */
    if (live && live !== lastHeard) { lastHeard = live; lastHeardAt = performance.now(); }
    if (!heard && interim.trim()) { caption("", "… " + interim.trim()); sawSpeechAt = performance.now(); }
    if (heard) {
      // already sent it ourselves a moment ago, on the gap rather than on this
      if (performance.now() < finalSwallow) { lastHeard = ""; return; }
      // how long recognition sat on it after the last word before calling it done
      endpointMs = sawSpeechAt ? Math.round(performance.now() - sawSpeechAt) : 0;
      sawSpeechAt = 0;
      lastHeard = "";
      echoSeen = 0; lastLive = "";        // next utterance starts counting again
      /* Say "menu" and the menu comes up locally -- and then the sentence went
         on to the brain anyway, which answered that it does not have one and
         drew the word NO over the menu it was standing on. If a local command
         has already taken the field, the utterance was for us. */
      heardSentence(heard);

  rec.onerror = (e) => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") recOn = false;
    // a refusal is an answer: whoever is waiting on the dialog can stop waiting
    if (recStart) { const r = recStart; recStart = null; r(); }
    caption("", "speech error: " + e.error);
  };
  /* Restarted on a timer, not from inside onend.

     A recogniser ends constantly -- every silence, every network hiccup, and
     always when the app goes to the background -- and the whole design here
     depends on it coming back. Calling start() synchronously inside onend
     throws InvalidStateError on Safari, because the engine has not released
     yet; the old code caught that, printed it into a caption nobody was
     looking at, and then never tried again. Recognition was dead for the rest
     of the session while the analyser carried on reacting to sound perfectly.
     Which is exactly what "it hears me but it does not take commands" is. */
  rec.onend = () => { recRunning = 0; if (recOn && !sttPaused) recKick(180); };
  recRunning = 0;
  try { rec.start(); } catch (err) { caption("", "could not start: " + err.message); return; }
  recOn = true; talkBtn.classList.add("on"); talkBtn.textContent = "listening";
}

/* Whether the engine is actually running, as opposed to whether we asked it
   to. recOn is the wish; recRunning is the fact, and the gap between them is
   where every one of these bugs has lived. */
let recRunning = 0, recAlive = 0, recKickAt = 0, recTries = 0;
function recKick(ms) {
  clearTimeout(recKickAt);

    if (!recOn || sttPaused || !rec || recRunning) return;
    if (document.visibilityState !== "visible") return;   // it will not start hidden
    try { rec.start(); recTries = 0; }
    catch (err) {

         engine is still shutting down succeeds a moment later, and one that
         throws because the permission is gone never will. */
      recTries++;
      if (recTries < 6) recKick(300 * recTries);
      else caption("", "speech recognition will not restart — tap the mic");

   a quiet room is not a fault, and rebuilding the recogniser to find out can
   cost another permission prompt on iOS. The signal is that we want it running
   and it is not -- which onend tells us exactly. */

  if (!recOn || sttPaused || recRunning) return;
  if (document.visibilityState !== "visible") return;

   a font glyph arrives on a transparent canvas and a PNG usually does not.
   Artwork exported on white, or on any flat colour, would otherwise sample as a

     a tear in one knee, and at 220 all of those land in the same handful of
     pixels. The sampler does not care what size it is given. */

  const c = document.createElement("canvas");
  c.width = S; c.height = S;
  const g = c.getContext("2d", { willReadFrequently: true });

  const k = Math.min(S * 0.94 / img.width, S * 0.94 / img.height);
  const w = img.width * k, h = img.height * k;
  const dx = Math.round((S - w) / 2), dy = Math.round((S - h) / 2);
  g.drawImage(img, dx, dy, w, h);

  const im = g.getImageData(0, 0, S, S), d = im.data;
  const at = (x, y) => { const i = (y * S + x) * 4; return [d[i], d[i + 1], d[i + 2], d[i + 3]]; };
  // The corners of the picture, not the corners of the canvas. Fitting leaves a
  // transparent margin, so canvas corners read as empty however the artwork was
  // exported -- which let a white background straight through, to sample as a
  // filled rectangle with a frame around it.
  const ax = dx + 1, ay = dy + 1, bx = Math.ceil(dx + w) - 2, by = Math.ceil(dy + h) - 2;

    const near = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]) < 36;

      const [br, bg, bb] = cs[0];
      const off = (i) => Math.abs(d[i] - br) + Math.abs(d[i + 1] - bg) + Math.abs(d[i + 2] - bb);

      // renderer leaves a ramp of blended pixels; the ones nearest the paint
      // survive the knock-out and ring the whole figure in a second contour.
      // A ramp pixel is the pixel that is still nearly the background AND
      // touches the background -- real edges fail the first half of that.
      for (let pass = 0; pass < 2; pass++) {

        for (let y = 1; y < S - 1; y++)
          for (let x = 1; x < S - 1; x++) {
            const i = (y * S + x) * 4;
            if (!d[i + 3] || off(i) > 130) continue;
            if (!d[i - 4 + 3] || !d[i + 4 + 3] || !d[i - S * 4 + 3] || !d[i + S * 4 + 3]) doomed.push(i + 3);

        for (const j of doomed) d[j] = 0;

/* What is actually in images/. Nobody should have to keep a list by hand, and a

   what it holds, and the page is served from a URL that names the repository.
   So: a checked-in index.json wins if there is one, and otherwise the host name
   is read backwards into an owner and a repo and GitHub is asked. Neither
   working is fine; it just means the brain is never told pictures exist, which
   is better than it offering one that is not there.

async function listImages() {
  if (imageList) return imageList;
  imageList = [];
  const clean = (n) => String(n).replace(/\.[^.]+$/, "");
  try {
    const r = await fetch("images/index.json");
    if (r.ok) {
      const j = await r.json();
      if (Array.isArray(j)) imageList = j.map(clean);
    }
  } catch (e) { /* no manifest is the normal case, not an error */ }
  /* Both, not one or the other. The manifest is same-origin and never rate
     limited, so it is the one that can be relied on; the listing is what means
     a file dropped in the folder needs no other edit. Merged, so shipping a
     manifest does not switch the discovery off. */
  if (/\.github\.io$/i.test(location.hostname)) {
    const owner = location.hostname.split(".")[0];
    const repo = location.pathname.split("/")[1] || location.hostname;
    try {
      const r = await fetch("https://api.github.com/repos/" + owner + "/" + repo + "/contents/images");

  }
  if (imageList.length) console.log("orb images", imageList.join(", "));
  return imageList;

/* ---------------- the picture itself ----------------

   made of dots is a beautiful way to say "a photograph is coming"; it is a poor
   photograph.

   rectangle the drawing occupies -- the sampler already fitted it to 94% of a
