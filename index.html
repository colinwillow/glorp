              const u = Math.max(0, Math.min(0.999, -(szA[a] + szA[c]) / 2 / dz * 0.5 + 0.5));
              if (((1 - u) * slices | 0) !== d) continue;
            }
            ctx.moveTo(sxA[a], syA[a]); ctx.lineTo(sxA[c], syA[c]);
            drew++;
          }
          if (drew) ctx.stroke();
        }
      }
    } else {
      // fewer depth buckets once a surface is under the outline: the solid is
      // doing the occluding now, so the ordering matters much less
      const BK = solidT > 0.5 ? 2 : 6;
      /* Thinner and softer for a figure. Nine thousand edges over a body 250px
         tall is not a wireframe, it is a grey fill: at full weight the lines
         stage came out as a solid mass with the dots lost inside it. */
      ctx.lineWidth = rig.on ? Math.max(0.5, 0.75 * k) : Math.max(0.6, 1.15 * k);
      if (rig.on) ctx.globalAlpha = wireT * 0.62;
      /* One pass over the edges, not one per bucket. The old shape walked the
         whole list once for every depth bucket and threw away five sixths of it
         each time -- fine at a few hundred edges, and 56,000 wasted iterations
         at a figure's 9,310. Build the paths in a single pass and stroke them
         afterwards. Measured on the figure: 31fps to 44. */
      const wp2 = wirePath;
      for (let b = 0; b < BK; b++) wp2[b] = null;
      for (let e = 0; e < formE.length; e += 2) {
        const a = formE[e], c = formE[e + 1];
        if (a >= n || c >= n || !visA[a] || !visA[c]) continue;
        if (rig.on) {
          // the orb's arc holds no mesh vertices any more; an edge into it is
          // a line from his shoulder to a ball across the room
          if (a >= rig.orbFrom || c >= rig.orbFrom) continue;
          if (figGate3(a, c, undefined, 1) <= 0) continue;
          /* And nothing the surface has already closed over. A wireframe under
             an opaque fill is 9,310 line segments producing a barely visible
             fringe -- it is the single most expensive thing on the screen and
             it is behind something. The lines stay visible exactly where they
             are still the outermost thing: at and above the fill's own front. */
          if (figGate3(a, c, undefined, 2) > 0.9) continue;
        }
        // an edge belongs to the bucket its midpoint falls in
        const u = -(szA[a] + szA[c]) / 2 / (zSpan * 0.72) * 0.5 + 0.5;
        const bk = ((1 - Math.max(0, Math.min(0.999, u))) * BK) | 0;
        const pth = wp2[bk] || (wp2[bk] = new Path2D());
        pth.moveTo(sxA[a], syA[a]); pth.lineTo(sxA[c], syA[c]);
      }
      for (let b = 0; b < BK; b++) {
        if (!wp2[b]) continue;
        const t = 1 - (b + 0.5) / BK;                      // 1 near .. 0 far
        const sz2 = (t * 2 - 1) * sizeHiPx;
        let li2 = ((sz2 - LUT_LO) / span * (LUT_N - 1)) | 0;
        if (li2 < 0) li2 = 0; else if (li2 >= LUT_N) li2 = LUT_N - 1;
        ctx.strokeStyle = lut[li2];
        ctx.stroke(wp2[b]);
      }
    }
    ctx.globalAlpha = 1;
  }

  /* The detonation itself. Every other loud moment in this program is the orb
     getting bigger; a break has to read as light, not size. Radial and growing,
     not a flat fill -- covering the frame evenly reads as a colour filter over
     the scene rather than as something igniting in the middle of it. */
  if (bs) {
    const f = 1 - (now - firing.flashAt) / 170;
    if (f > 0) {
      const R = Math.min(W, H) * (0.16 + 0.55 * (1 - f));
      const g2 = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
      const a = f * f * bs.flash;
      g2.addColorStop(0, "rgba(" + firing.flashRgb + "," + a + ")");
      g2.addColorStop(0.55, "rgba(" + firing.flashRgb + "," + a * 0.45 + ")");
      g2.addColorStop(1, "rgba(" + firing.flashRgb + ",0)");
      ctx.fillStyle = g2;
      ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    }
  }

  drawPages();
  drawGallery(dt);
  drawMini(now, k);

  /* The song title. See songCard() for why this is on the canvas. */
  if (song.at) {
    const e5 = (now - song.at) / 1000;
    if (e5 > SONG_LIFE) song.at = 0;
    else {
      const out5 = Math.min(1, Math.max(0, (SONG_LIFE - e5) / 1.0));
      // clear of his face when he is wearing one, dead centre otherwise
      const ty = rig.on && rig.portrait ? H * 0.19 : cy;
      ctx.save();
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      /* The void deepens. A radial with no edge is not a panel -- there is
         nothing to see except the middle getting darker, which is what lets
         the words read over a bright core without anything being drawn ON. */
      const R5 = Math.min(W, H) * 0.30;
      const gr = ctx.createRadialGradient(cx, ty, 0, cx, ty, R5);
      gr.addColorStop(0, "rgba(6,8,5," + (0.62 * out5).toFixed(3) + ")");
      gr.addColorStop(0.5, "rgba(6,8,5," + (0.34 * out5).toFixed(3) + ")");
      gr.addColorStop(1, "rgba(6,8,5,0)");
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(cx, ty, R5, 0, TAU); ctx.fill();

      const maxW = W * 0.84;
      const line = (txt, size, colour, glow, yy, delay, alpha) => {
        const face = "px ui-monospace, SFMono-Regular, Menlo, monospace";
        const ch = Array.from(txt);
        /* Measured, then shrunk to fit. A song title is somebody else's string
           and can be any length; letter-spaced type runs off a phone fast, and
           text sliding past the edge of the screen is the one failure that
           looks like a bug rather than a style. */
        let sp, wd, tw;
        for (let pass = 0; pass < 6; pass++) {
          ctx.font = "500 " + Math.round(size) + face;
          sp = size * 0.24;
          wd = ch.map((c) => ctx.measureText(c).width);
          tw = -sp;
          for (const w of wd) tw += w + sp;
          if (tw <= maxW || size <= 9) break;
          size = Math.max(9, size * (maxW / tw) * 0.99);
        }
        let x5 = cx - tw / 2;
        for (let ci = 0; ci < ch.length; ci++) {
          const t5 = Math.max(0, Math.min(1, (e5 - delay - ci * 0.028) / 0.44));
          if (t5 > 0) {
            const ez = 1 - Math.pow(1 - t5, 3);
            ctx.globalAlpha = ez * out5 * alpha;
            ctx.shadowColor = glow;
            ctx.shadowBlur = 15 * k * ez;
            ctx.fillStyle = colour;
            ctx.fillText(ch[ci], x5, yy + (1 - ez) * size * 0.55);
          }
          x5 += wd[ci] + sp;
        }
      };
      const ts = Math.max(16, Math.min(31, W * 0.049));
      // just the title. The note was a label on something that does not need
      // one -- you asked what the song was, so the answer is the song
      line(song.title, ts, "#E4F8CB", "rgba(150,240,120,0.85)",
           ty - ts * 0.30, 0, 0.52);
      line(song.sub, ts * 0.52, "#B98BE8", "rgba(139,47,214,0.8)",
           ty + ts * 0.78, 0.18, 0.46);
      ctx.restore();
      ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    }
  }

  /* The photograph, in the rectangle its own drawing occupied. Drawn after the
     particles so the field reads as being behind it, and never scaled past the
     screen: a picture is for looking at. */
  if (photo.t > 0.004 && photo.img && !gallery.on) {
    const s5 = scale * 0.66;
    let hw = photo.half[0] * s5, hh = photo.half[1] * s5;
    const room = Math.min((W * 0.92) / (hw * 2), (H * 0.78) / (hh * 2), 1.6);
    hw *= room; hh *= room;
    ctx.save();
    ctx.globalAlpha = photo.t;
    // up from where the drawing stood, a little, so it arrives rather than cuts
    const rise = (1 - photo.t) * scale * 0.03;
    ctx.drawImage(photo.img, cx - hw, cy - hh + rise, hw * 2, hh * 2);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* Labels in text, not particles. Six words spelled in dots at this size are
     a smear, and the point of a menu is that it can be read at a glance. Same
     canvas and the same typeface as everything else, so it still belongs. */
  if (menuOn && formT > 0.05) {
    const s2 = scale * formS;
    ctx.save();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = Math.round(13 * k) + "px ui-monospace, SFMono-Regular, Menlo, monospace";
    ctx.globalAlpha = Math.min(1, formT * 1.4);
    /* Under the satellite, not through it. The label used to sit in the middle,
       which was empty when a satellite was a ring and is now a bright green
       core -- so it read as text printed over a light. */
    const off = (MENU_SAT_R + 0.20) * s2, pad = 14 * k;
    for (let m = 0; m < menuAt.length; m++) {
      ctx.fillStyle = m === menuHit ? "#EAFBD2" : "#9FB98B";
      const lx = cx + menuAt[m][0] * s2;
      // below by default; above for the one at the bottom of a short viewport,
      // where below is off the end of the canvas
      let ly = cy + menuAt[m][1] * s2 + off;
      if (ly > H - pad) ly = cy + menuAt[m][1] * s2 - off;
      ctx.fillText(menuAt[m][2], lx, ly);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  if (showBars) {
    if (!barPeak) barPeak = new Float32Array(BANDS);
    const half = W / 2, bw = half / BANDS, bwid = Math.max(1, bw - BARS.gap);
    // seconds, clamped, so a stalled frame does not drop every peak at once
    const dts = Math.min(0.1, dt / 1000);
    for (let b = 0; b < BANDS; b++) {
      /* Straight off the music analyser while a record is on, rather than off
         the shared drive. Correct for a music meter -- it is the track being
         drawn, so draw the track -- and it makes this an independent probe of
         the thing you are seeing on Heat Waves. The two now fail differently:
         bars moving with a dead orb means the drive is being taken by
         something else; bars dead means the analyser is getting no audio. */
      const src = music.playing ? music.spectrum : drive.spectrum;
      let v = src[b] * (1 + (b / BANDS) * BARS.tilt);
      if (v > 1) v = 1; else if (v < 0) v = 0;
      /* Peak hold. The bar itself is the sound now and the cap is where it has
         been -- it is what makes a meter readable, because the eye cannot
         follow sixty-four things moving at once but it can follow the line they
         leave behind. Up instantly, down slowly. */
      if (v > barPeak[b]) barPeak[b] = v;
      else { barPeak[b] -= BARS.fall * dts; if (barPeak[b] < v) barPeak[b] = v; }

      /* Coloured out of the orb's OWN palette, sampled at the height the bar
         has reached, so the meter is made of the same light as the thing above
         it and shifts with it when the palette turns. A flat green strip is a
         piece of UI sitting on top of a picture. */
      let li = (((v * sizeHiPx) - LUT_LO) / (LUT_HI - LUT_LO) * (LUT_N - 1)) | 0;
      if (li < 0) li = 0; else if (li > LUT_N - 1) li = LUT_N - 1;
      const col = lut[li];
      const hB = v * BARS.h, pB = barPeak[b] * BARS.h;
      const off = b * bw + (bw - bwid) / 2;
      // right of centre, and its mirror image left of it
      const xR = half + off, xL = half - off - bwid;

      ctx.globalAlpha = BARS.alpha;
      ctx.fillStyle = col;
      if (hB > 0.6) { barRect(xR, H - hB, bwid, hB); barRect(xL, H - hB, bwid, hB); }
      if (pB > 1.5) {
        ctx.globalAlpha = BARS.peakA;
        barRect(xR, H - pB - 2, bwid, 2); barRect(xL, H - pB - 2, bwid, 2);
      }
    }
    ctx.globalAlpha = 1;
  }

  acc += dt; frames++;
  if (acc > 500) {
    hud.textContent = BUILD + " · " + Math.round(frames / (acc / 1000)) + " fps · " + n + " · " +
                      state + (manual ? " (held)" : "") +
                      (formLabel ? " · " + formLabel : "") +
                      (bs ? " · " + firing.name : "");
    const f2 = (x) => x.toFixed(2);
    meter.textContent = "lvl " + f2(drive.scale) + "  hue " + f2(drive.hue) +
                        "  turb " + f2(drive.turbulence) + "  hit " + f2(drive.impulse) +
                        "\nmic " + micWord() +
                        "  hear " + (!recOn ? "off" : recRunning ? "on" : "stalled") +
                        "  in " + f2(mic.scale) +
                        (standalone ? "  [standalone]" : "") +
                        (brain.url ? "" : "  [no endpoint]") +
                        (A ? "  dB " + Math.round(A.db) + "  room " + Math.round(A.floorDb) : "");
    acc = 0; frames = 0;
  }
  requestAnimationFrame(loop);
}
syncStateBtns();
caption("", (standalone ? "home screen app · " : "") + (brain.url
  ? "I\u2019m Glorb. tap enable mic and talk to me \u2014 or say \u201cmenu\u201d"
  : "no brain endpoint set \u2014 open tune and paste the worker url"));
syncBare();
buildLut(0);
loop();
</script>
</body>
</html>
