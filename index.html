}

/* Sampled the same way clipSpeed samples, and for the same reason it is done
   after the build rather than during it: driving the mixer's clock stutters
   whatever is on screen. */
function clipPoses(name) {
  if (!gl.poses) gl.poses = {};
  if (gl.poses[name] !== undefined) return gl.poses[name];
  gl.poses[name] = null;                     // and never try twice, whatever happens
  const clip = gl.clips && gl.clips[name];
  if (!clip || !clip.duration || !gl.mixer || !gl.mesh) return null;
  if (!poseTmp) { poseTmp = new Float32Array(POSE_D); poseCur = new Float32Array(POSE_D); }
  /* Position AND velocity, in that order, 2*POSE_D wide.

     Position alone is not enough and the flares showed why. It picks the
     instant inside the spin where his limbs are arranged most like the next
     dance -- and that instant is mid-spin, travelling fast in a direction the
     next dance is not going. The pose matches and the motion reverses, which
     reads as a stumble rather than a cut. Matching where he IS and where he is
     GOING picks a slower moment that agrees about both. */
  const data = new Float32Array(POSE_N * POSE_D * 2);
  const was = gl.mixer.time, keep = gl.action;
  for (const a of gl.mixer._actions.slice()) a.stop();
  const act = gl.mixer.clipAction(clip);
  act.reset(); act.setEffectiveWeight(1); act.play();
  const W = POSE_D * 2;
  for (let k = 0; k < POSE_N; k++) {
    gl.mixer.setTime((k / POSE_N) * clip.duration);
    gl.group.updateMatrixWorld(true);
    if (poseRead(poseTmp)) data.set(poseTmp, k * W);
  }
  // central difference round the loop, in body heights per second
  const step = clip.duration / POSE_N;
  for (let k = 0; k < POSE_N; k++) {
    const a = ((k + 1) % POSE_N) * W, b = ((k + POSE_N - 1) % POSE_N) * W;
    for (let j = 0; j < POSE_D; j++)
      data[k * W + POSE_D + j] = (data[a + j] - data[b + j]) / (2 * step);
  }
  act.stop();
  if (keep) { keep.reset(); keep.setEffectiveWeight(1); keep.play(); gl.action = keep; }
  gl.mixer.setTime(was);
  gl.poses[name] = data;
  return data;
}

// distance between two signatures, in body heights per joint. Rows in a clip's
// table are 2*POSE_D wide -- position then velocity -- so ao strides by that.
function poseDist(a, ao, b) {
  let d = 0;
  for (let j = 0; j < POSE_D; j++) { const e = a[ao + j] - b[j]; d += e * e; }
  return Math.sqrt(d / POSE_BONES.length);
}

/* How much the direction of travel counts against the pose itself. Velocities
   here run a few body heights a second against positions of a few tenths of a
   body height, so this is mostly a units conversion with a thumb on it. */
const POSE_VW = 0.08;

/* The best way from one clip into another: WHERE TO LEAVE and WHERE TO ARRIVE.

   Searching only the arrival is the obvious half and it is the weaker one.
   Measured across the four dances, mean distance between the two poses:

     leave at frame 0, arrive at frame 0      0.264      (what it did)
     leave at frame 0, search the arrival     0.204
     search both                              0.134

   and the worst pair 0.365 -> 0.225. The three that do not involve the flares
   collapse to 0.05, which is nothing at all. The flares is the one you named
   and it is genuinely the hard case -- a flare is inverted on the hands for its
   whole length, and no upright dance contains anything like it -- but every
   route out of it wants to leave at phase 0.32, the instant he is most upright
   inside the spin, and that is worth 0.32 -> 0.21 on its own.

   2304 pairs of 45 numbers per link, once, cached. */
function clipLink(from, to) {
  if (!gl.link) gl.link = {};
  const key = from + ">" + to;
  if (gl.link[key] !== undefined) return gl.link[key];
  gl.link[key] = null;
  const A = clipPoses(from), B = clipPoses(to);
  if (!A || !B) return null;
  const W = POSE_D * 2;
  let best = 1e30, be = 0, bn = 0, bp = 0;
  for (let e = 0; e < POSE_N; e++) {
    const ao = e * W;
    for (let k = 0; k < POSE_N; k++) {
      const bo = k * W;
      let dp = 0, dv = 0;
      for (let j = 0; j < POSE_D; j++) {
        const q = A[ao + j] - B[bo + j]; dp += q * q;
        const r = A[ao + POSE_D + j] - B[bo + POSE_D + j]; dv += r * r;
      }
      const d = dp + POSE_VW * POSE_VW * dv;
      if (d < best) { best = d; be = e; bn = k; bp = dp; }
    }
  }
  gl.link[key] = { exit: be / POSE_N, entry: bn / POSE_N,
                   // the fade is paid for by the POSE gap; velocity only chose where
                   dist: Math.sqrt(bp / POSE_BONES.length) };
  return gl.link[key];
}
/* How long to take over it. A blend is a straight line between two poses and
   nothing in the middle of it is a pose either clip contains, so a long one is
   only worth paying for when the ends are far apart -- and a far pair given a
   short one is the teleport. */
function linkFade(d) { return Math.max(0.3, Math.min(0.75, 0.25 + d * 2.2)); }

/* Told to dance, he dances -- he does not play one dance for ever.

   Held acts used to pick one clip out of their list and loop it until they were
   told to stop, which is fine when the list is one long idle and dull when it
   is four dances. A run instead: shuffled once so the same request twice is not
   the same performance, then round and round.

   MIN_HOLD is why a clip is repeated rather than cut short. The list is not
   uniform -- the flares are 1.03s and uprock_01 is 13s -- so playing each one
   through once shows the short ones for a blink. Each gets whole repeats until
   it has had four seconds.

   And it does not hand over on a loop boundary. It hands over at the moment in
   the outgoing clip that is closest to a pose the incoming clip actually
   contains -- see clipLink. The next clip is known as soon as the current one
   starts, so the exit is scheduled the moment it begins. */
const MIN_HOLD = 4000;
function playSeq(list, fade) {
  const ok = list.filter(haveClip);
  if (!ok.length) return "";
  for (let i = ok.length - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const t = ok[i]; ok[i] = ok[j]; ok[j] = t;
  }
  world.seq = { list: ok, i: 0, until: 0 };
  return seqNext(fade, 0);
}
function seqNext(fade, atTime) {
  const s = world.seq;
  const nm = s.list[s.i % s.list.length];
  s.i++;
  /* In time with whatever is playing. The clip is stretched so its length is a
     whole number of beats, which puts every repeat and every hand-off on one.
     Worked out before it starts, because the timeScale has to be in place
     before the crossfade is, and the hold below is measured in the STRETCHED
     length or the exit lands at the wrong phase and undoes the matching. */
  const warp = beatWarp(gl.clips[nm] ? gl.clips[nm].duration : 0);
  const raw = playClip(nm, fade, false, atTime, warp);   // which clears world.seq...
  world.seq = s;                                        // ...so it is only ours if we say so
  const dur = raw / warp;
  /* Whole repeats to the minimum, then out at the exit phase. Landing on the
     exit costs up to one more pass of the clip, so it is taken out of the
     repeats rather than added on top -- a four second minimum stays about four
     seconds instead of becoming eight. */
  const nxt = s.list[s.i % s.list.length];
  const lk = nxt === nm ? null : clipLink(nm, nxt);
  const exit = lk ? lk.exit : 0;
  let hold = dur * Math.max(1, Math.ceil(MIN_HOLD / Math.max(dur * 1000, 1)) - 1) + dur * exit;
  while (hold * 1000 < MIN_HOLD * 0.75) hold += dur;
  s.until = performance.now() + hold * 1000;
  return nm;
}

/* Crossfaded, always. A cut between two poses of the same skeleton is the most
   obviously computed thing a character can do -- it is what separates a puppet
   from a performance, and it costs one call. */
function playClip(name, fade, once, atTime, tScale) {
  if (!gl.mixer || !haveClip(name)) return 0;
  const next = gl.mixer.clipAction(gl.clips[name]);
  /* Asking for the clip he is already doing is not a request to start it again.
     reset() puts the action back to time zero, and with no other action to fade
     from there is nothing to blend it against -- so the one case that CANNOT be
     crossfaded is the one that cuts. "Dance" twice in a row had a one in four
     chance of it, and it reads as a skip in the middle of the performance. */
  if (gl.action === next && next.isRunning()) {
    world.act = name;
    return gl.clips[name].duration;
  }
  next.reset();
  // reset() rewinds to zero; a matched hand-off wants to come in elsewhere
  if (atTime) next.time = atTime;
  // and before the fade is set up, because the fade can be told to warp time
  next.setEffectiveTimeScale(tScale || 1);
  next.setLoop(once ? window.THREE.LoopOnce : window.THREE.LoopRepeat, Infinity);
  next.clampWhenFinished = !!once;
  next.enabled = true;
  next.setEffectiveWeight(1);
  /* Not time-warped. crossFadeFrom's third argument makes the mixer ramp both
     clips' timeScale toward each other through the blend, which is meant for
     a walk becoming a run and is wrong for two dances of unrelated length --
     and it silently overwrites a timeScale set on purpose, which is how the
     beat warp came out as 1.000 every time. Measured with it on and off, the
     blend itself is identical. */
  if (gl.action && gl.action !== next) next.crossFadeFrom(gl.action, fade == null ? 0.28 : fade, false);
  next.play();
  gl.action = next;
  world.act = name;
  /* Any clip started from anywhere else ends the run. playSeq puts it back
     immediately afterwards, so a sequence never has to be cancelled by hand at
     every one of the dozen places that can interrupt it. */
  world.seq = null;
  /* Every clip decides for itself where the floor is. Some of these poses were
     authored off the origin -- laying_idle_00 keeps his lowest vertex 1.98
     units up, more than a third of his height, so played as exported he lies
     down in mid-air. Rather than a per-clip fudge table, take the lowest point
     the pose has reached SINCE IT STARTED and drop him until that point is on
     the ground. It is right for a pose from the first frame, right for a walk
     cycle within one stride, and it does not flatten a jump: a jump starts on
     the ground, so the minimum is set before he leaves it. */
  world.groundMin = 1e30;
  return gl.clips[name].duration;
}

/* Told to do something. Returns the clip it chose, so the caller knows whether
   the word meant anything -- which is what stops "dance" being answered twice,
   once by the room and once by the brain. */
/* Where he goes and which way he points.

   Frame of reference: the VIEWER's, by default. "Go left" said to somebody
   standing in front of you means your left, not theirs -- they are facing you,
   so their left is your right, and nobody means that unless they say it. Saying
   "your left" switches to his own frame, which is the only time it is
   unambiguous enough to be worth honouring.

   Heading is the same angle walkTo derives with atan2(dx, dz), so a heading of
   0 is facing +z, which is facing the camera. That makes the four screen
   directions 0, PI, and +/- PI/2, and "his left" his heading plus PI/2. */
const PACE = 1.15;                 // heights covered by one "go left" or "back up"
const FACE = { me: 0, away: Math.PI, left: -Math.PI / 2, right: Math.PI / 2 };
function faceTo(yaw) {
  world.yawWant = yaw;
  world.turnOnly = 1; world.walking = 0; world.pose = 0; world.actUntil = 0;
  let dy = yaw - world.yaw;
  while (dy > Math.PI) dy -= TAU;
  while (dy < -Math.PI) dy += TAU;
  // feet doing something while the heading changes underneath. NOT the turn
  // clips: those carry a hundred degrees of their own -- see clipYaw
  if (Math.abs(dy) > 0.12) playClip(pickTurn(), 0.22);
}
function stepBy(ax, az) {
  const H1 = figH1();
  walkTo(world.x + ax * PACE * H1, world.z + az * PACE * H1, 0);
}
function sandboxMove(flat) {
  const mine = /\b(your|his|him)\b/.test(flat);      // his frame, not the screen's
  const h = world.yaw;
  // --- facing, which is a turn and nothing else
  if (/\b(turn|spin) (round|around)\b|\bother way\b|\bturn your back\b/.test(flat)) {
    faceTo(h + Math.PI); return "face";
  }
  /* Away BEFORE toward. "Face away from me" ends in "me", so a toward-me test
     that only looks for the word grabs it and points him straight back at you,
     which is the exact opposite of what was asked. */
  if (/\b(face|look|turn)\b.*\b(away|back to me|backwards)\b/.test(flat)) { faceTo(FACE.away); return "face"; }
  if (/\b(face|look at|turn to|turn towards?|look towards?)\b.*\b(me|us|here|forward|front|this way|camera)\b/.test(flat)
      || /\b(face|look) (forward|front|me|here)\b/.test(flat)) { faceTo(FACE.me); return "face"; }
  if (/\b(face|look|turn)\b.*\bleft\b/.test(flat)) {
    faceTo(mine ? h + Math.PI / 2 : FACE.left); return "face";
  }
  if (/\b(face|look|turn)\b.*\bright\b/.test(flat)) {
    faceTo(mine ? h - Math.PI / 2 : FACE.right); return "face";
  }
  // --- moving. Toward the lens is +z, which is also heading 0.
  const TOWARD = /\b(come|move|step|walk|get)\b.*\b(here|closer|forward|to me|towards? me|over here|nearer)\b|\bcome (here|over|closer|forward)\b|\bover here\b/;
  const AWAY = /\b(go|move|step|back|get|walk)\b.*\b(away|back|backwards|further|farther)\b|\bback (up|off|away)\b|\bgo away\b/;
  if (TOWARD.test(flat)) { stepBy(0, 1); return "toward"; }
  if (AWAY.test(flat)) { stepBy(0, -1); return "away"; }
  if (/\b(go|move|step|walk|slide|shuffle)\b.*\bleft\b|\bto (the|your) left\b/.test(flat)) {
    if (mine) stepBy(Math.sin(h + Math.PI / 2), Math.cos(h + Math.PI / 2));
    else stepBy(-1, 0);
    return "left";
  }
  if (/\b(go|move|step|walk|slide|shuffle)\b.*\bright\b|\bto (the|your) right\b/.test(flat)) {
    if (mine) stepBy(Math.sin(h - Math.PI / 2), Math.cos(h - Math.PI / 2));
    else stepBy(1, 0);
    return "right";
  }
  return "";
}

/* Music is not a sandbox thing -- it plays whether or not he is standing in a
   room -- so it is answered before anything that needs him to be. */
function musicSay(flat) {
  /* Closing first. "Close the music player" contains "music player", so the
     opener matched it and opened what was being dismissed. */
  if (/\b(hide|close|dismiss|get rid of)\b/.test(flat)
      && /\b(music|player|playlist|selector|picker|song list|track list)\b/.test(flat)) {
    musicPanel(0); caption(null, "closed"); return "closed";
  }
  /* "What is this song" is a question about the SONG, answered with the card
     -- not a request for the whole player. Before the opener, because several
     of its phrasings mention music. */
  if (/\b(what|whats|name|who)\b/.test(flat)
      && /\b(song|track|tune|playing|sings|singer|artist|band)\b/.test(flat)
      && !/\b(player|selector|playlist|list|have|got)\b/.test(flat)) {
    songCard();
    caption(null, music.playing
      ? music.title + (music.artist ? " \u00b7 " + music.artist : "")
      : "nothing playing");
    return "song card";
  }
  /* Scrolling the selector by voice, while it is up. */
  if (musOn && /\b(scroll|page)\b/.test(flat)) {
    const e = musEl(), ol = e && e.querySelector("ol");
    if (ol) {
      const up = /\b(up|back|top)\b/.test(flat);
      if (/\b(top|start|beginning)\b/.test(flat)) ol.scrollTo({ top: 0, behavior: "smooth" });
      else if (/\b(bottom|end)\b/.test(flat)) ol.scrollTo({ top: 1e6, behavior: "smooth" });
      else ol.scrollBy({ top: (up ? -1 : 1) * ol.clientHeight * 0.8, behavior: "smooth" });
      caption(null, up ? "\u2191" : "\u2193");
      return "scrolled";
    }
  }
  if (/\b(music player|music selector|song selector|music selection|song selection|playlist|play list|song list|track list|music list|music picker|song picker|show the music|now playing)\b/.test(flat)) {
    musicPanel(1);
    if (!music.list) musicLocalList().then(() => musicPanel(-1)); else musicPanel(-1);
    caption(null, music.playing ? music.title : "music player");
    return "music player";
  }

  if (/\b(stop|kill|turn off|no more|enough)\b.*\b(music|song|track|tune)\b/.test(flat) ||
      /\b(music|song|track|tune)\b.*\b(off|stop)\b/.test(flat)) {
    if (!music.playing) { caption(null, "nothing playing"); return "music off"; }
    musicStop(); caption(null, "music off"); return "music off";
  }
  /* Resume before pause, and both before play: "unpause" contains "pause", and
     a bare "play" while paused means carry on rather than start something. */
  if (/\b(resume|unpause|carry on|keep going|continue|play it)\b/.test(flat) ||
      (music.paused && /^\s*play\s*$/.test(flat))) {
    if (musicResume()) { caption(null, music.title); return "resume"; }
  }
  if (/\b(pause|freeze it)\b/.test(flat) && music.playing && !music.paused) {
    if (musicPause()) { caption(null, "paused \u00b7 " + music.title); return "pause"; }
  }
  if (/\b(next|another|skip|different)\b.*\b(song|track|tune|one)\b/.test(flat) && music.playing) {
    musicPlay(music.i + 1).then((t) => { if (t) caption(null, t); musicPanel(-1); });
    return "next track";
  }
  const m = flat.match(/\bplay\b(?:\s+(?:me|us|the|some|a))*\s*(.*)$/);
  if (m && /\b(play|put on)\b/.test(flat)) {
    const want = (m[1] || "")
      .replace(/\b(music|song|songs|track|tune|please|for me|some|by)\b/g, "").trim();
    musicWant(want);
    return "music";
  }
  return "";
}

/* The shelf first, then the network.

   Local because it is five tracks somebody chose, it is instant, and it works
   with no signal. Audius only when the name is not on the shelf -- which is
   also the only time a search could tell you anything you did not know. */
async function musicWant(want) {
  await musicLocalList();
  if (!want) {
    const t0 = await musicPlay();
    caption(null, t0 ? t0 : (music.err || "no music"));
    musicPanel(-1);
    return;
  }
  const local = await musicPlay(want);
  if (local) { caption(null, local); musicPanel(-1); return; }
  caption(null, "looking for \u201c" + want + "\u201d\u2026");
  try {
    const found = await audiusSearch(want);
    if (!found.length) { caption(null, "nothing found for \u201c" + want + "\u201d"); return; }
    const t1 = await musicPlayList(found, 0);
    caption(null, t1 ? t1 + (music.artist ? " \u00b7 " + music.artist : "")
                     : (music.err || "could not play that"));
    musicPanel(-1);
  } catch (e) {
    caption(null, "no track called \u201c" + want + "\u201d, and the search is unreachable");
  }
}

function sandboxSay(flat) {
  if (!world.on) return "";
  /* Said anything to him at all, and the director stands down for a while --
     not only when the words turn out to be an instruction. Somebody talking is
     somebody engaged, and a character who wanders off because your sentence
     did not match a regex is worse than one who never wanders at all. */
  mindHold();
  /* Out of a pose first. Nothing in the table means "stand up", so a phrase
     that does has to be caught before it can match something that doesn't. */
  if (world.pose && /\b(stand( up)?|get up|sit up|up you get|enough|as you were)\b/.test(flat)) {
    if (music.byDance) musicStop();
    world.pose = 0; world.actUntil = 0; playClip(pickIdle(), 0.45);
    world.idleAt = performance.now() + 5000;
    return "up";
  }
  for (const [re, list, hold] of ACTS) {
    if (!re.test(flat)) continue;
    // a held act with somewhere to go runs as a sequence rather than a loop
    if (hold && list.filter(haveClip).length > 1) {
      /* Asked to dance, put something on. Only for the dances, only if nothing
         is already playing, and flagged so that standing up stops it again --
         he started it, so it is his to stop. */
      if (/dance/.test(list[0] || "") && !music.playing)
        musicPlay().then((t) => {
          if (t) { music.byDance = 1; caption(null, t); }
          else if (music.err) caption(null, music.err);
        });
      const nm = playSeq(list, 0.3);
      if (!nm) continue;
      world.walking = 0; world.pose = 1; world.actUntil = 0;
      caption(null, nm.replace(/_/g, " "));
      return nm;
    }
    const nm = pickOne(list);
    if (!nm) continue;
    const dur = playClip(nm, 0.3, /idle_(jump|waving|sad_kick|swat_fly)|backflip|stumble/.test(nm));
    world.walking = 0;
    world.pose = hold ? 1 : 0;
    world.actUntil = hold ? 0 : performance.now() + dur * 1000;
    caption(null, nm.replace(/_/g, " "));
    return nm;
  }
  const d = sandboxMove(flat);
  if (d) return d;
  if (/\b(stop|stay|wait|hold on)\b/.test(flat) && world.walking) {
    world.walking = 0; playClip(pickIdle(), 0.3); return "stop";
  }
  return "";
}

/* ---------------- shoving him about ----------------

   Swipe across him and he takes it: staggers if you were gentle, goes over if
   you were not, slides the way you swiped, lies there a moment and gets up.

   This is not physics and deliberately so. The animations already contain the
   fall -- five of them, authored, each one a whole convincing spill -- and
   nothing a solver produces in an evening is going to beat a hand-made one. So
   the only thing simulated is WHERE he ends up: a velocity along the swipe,
   decaying, clamped to the room. The clip supplies the performance and the
   program supplies the travel, which is the division of labour that made the
   walking work too.

   Every clip in the file has zero root motion -- measured, all forty-nine --
   so sliding him is not fighting the animation for control of the same value.
   It is the only way he moves at all. */
const HIT = {
  reach: 0.30,      // how near the swipe must pass him, as a fraction of the short side
  soft: 0.55,       // px/ms: under this it is a shove and he stays up
  hard: 1.9,        // and over this he leaves the floor first
  push: 0.055,      // heights per second of travel, per px/ms of swipe
  cap: 5.5,         // heights per second, whatever the swipe says
  drag: 2.2,        // how fast the slide dies, per second
  down: [500, 1400],// how long he stays on the floor
  hold: 2600,       // how long the director keeps out of it afterwards
};
const HIT_STAY = ["reaction_shoved", "reaction_swivel"];
const HIT_FALL = ["hit_legs_trip_fall", "hit_roll_fall", "hit_shoulder_and_fall",
                  "hit_stumble_fall", "trip_fall_flat"];
const HIT_AIR  = ["in_air_floating", "in_air_falling"];
const HIT_UP   = ["kip_up_from_laying", "stand_up_from_laying"];
const hit = { on: 0, stage: "", until: 0, vx: 0, vz: 0 };

/* Where a swipe on the glass points in the room he stands in.

   The stage carries the pitch and the yaw, so screen-right is only world-right
   when the camera happens to be square on. Worked out rather than guessed: a
   stage-local direction u appears on screen at Rx(pitch)Ry(yaw)u, so the
   direction that comes back as screen-right is the transpose applied to
   (1,0,0), which drops to (cos yaw, 0, sin yaw) once the ground plane takes the
   pitch out of it. Screen-UP lands on (sin yaw, 0, -cos yaw), which at yaw 0 is
   straight away from the camera -- as it should be. */
function hitDir(dx, dy) {
  const cy = Math.cos(view.yaw), sy = Math.sin(view.yaw);
  const x = dx * cy - dy * sy;
  const z = dx * sy + dy * cy;
  const L = Math.hypot(x, z) || 1;
  return [x / L, z / L];
}

/* Did the swipe actually cross him, or just the screen next to him? Distance
   from his chest to the SEGMENT, not to either end -- a swipe that starts and
   ends well clear of him can still pass straight through. */
function hitNear(x0, y0, x1, y1) {
  if (!gl.ready || !gl.cam || !gl.mesh || !gl.mesh.skeleton) return 0;
  const T = window.THREE;
  let b = null;
  for (const bn of gl.mesh.skeleton.bones)
    if (/Spine1$|Spine2$/i.test(bn.name)) { b = bn; break; }
  if (!b) for (const bn of gl.mesh.skeleton.bones) if (/Hips$/i.test(bn.name)) b = bn;
  if (!b) return 0;
  gl.group.updateMatrixWorld(true);
  const v = b.getWorldPosition(new T.Vector3()).project(gl.cam);
  const cx = (v.x * 0.5 + 0.5) * W, cy2 = (-v.y * 0.5 + 0.5) * H;
  const ax = x1 - x0, ay = y1 - y0;
  const len2 = ax * ax + ay * ay;
  const t = len2 ? Math.max(0, Math.min(1, ((cx - x0) * ax + (cy2 - y0) * ay) / len2)) : 0;
  const d = Math.hypot(x0 + ax * t - cx, y0 + ay * t - cy2);
  return d < HIT.reach * Math.min(W, H) ? 1 : 0;
}

/* One swipe, turned into a shove. speed is in px/ms. */
function hitGo(dx, dy, speed) {
  if (!world.on || rig.out) return 0;
  const [ux, uz] = hitDir(dx, dy);
  const v = Math.min(HIT.cap, speed * HIT.push * 60) * figH1();
  hit.on = 1; hit.vx = ux * v; hit.vz = uz * v;
  world.walking = 0; world.turning = 0; world.turnOnly = 0;
  world.seq = null; world.actUntil = 0;
  world.pose = 1;                 // he is IN something; nothing else may pose him
  mindHold(HIT.hold);
  if (speed < HIT.soft) {
    /* A shove he rides out. He should also give a little ground -- a man who
       does not move at all when pushed reads as bolted down. */
    hit.vx *= 0.5; hit.vz *= 0.5;
    hitStage("stay");
  } else hitStage(speed > HIT.hard ? "air" : "fall");
  return 1;
}

function hitStage(st) {
  const now = performance.now();
  hit.stage = st;
  const pick = (list) => pickOne(list.filter(haveClip));
  if (st === "stay") {
    const nm = pick(HIT_STAY) || pick(HIT_FALL);
    hit.until = now + (nm ? playClip(nm, 0.12, 1) * 1000 : 400);
  } else if (st === "air") {
    const nm = pick(HIT_AIR);
    // the air clip is a LOOP under him while he travels; the landing ends it
    hit.until = now + (nm ? playClip(nm, 0.10) * 1000 : 300);
  } else if (st === "fall") {
    const nm = pick(HIT_FALL);
    hit.until = now + (nm ? playClip(nm, 0.10, 1) * 1000 : 700);
  } else if (st === "down") {
    if (haveClip("laying_idle_00")) playClip("laying_idle_00", 0.35);
    hit.until = now + HIT.down[0] + Math.random() * (HIT.down[1] - HIT.down[0]);
  } else if (st === "up") {
    const nm = pick(HIT_UP);
    hit.until = now + (nm ? playClip(nm, 0.3, 1) * 1000 : 600);
  } else {
    hit.on = 0; hit.stage = ""; world.pose = 0;
    playClip(pickIdle(), 0.4);
    world.idleAt = now + 2500;
    mindHold(HIT.hold);
  }
}

function hitNow(dt, now) {
  if (!hit.on) return;
  const H1 = figH1(), s = dt / 1000;
  // slide, decaying. Per second, so a slow frame does not travel further
  const k = Math.pow(1 / (1 + HIT.drag), s);
  world.x += hit.vx * s; world.z += hit.vz * s;
  hit.vx *= k; hit.vz *= k;
  /* The walls. Same fence walkTo uses, so he cannot be flung anywhere he could
     not have walked -- and hitting one ends the flight rather than the slide:
     in the air, the wall IS the landing. */
  const edge = WALK.floor / 2 - 0.4;
  const lx = H1 * Math.min(2.6, edge), lzB = H1 * Math.min(4.5, edge), lzF = H1 * 0.9;
  let wall = 0;
  if (world.x > lx) { world.x = lx; wall = 1; } else if (world.x < -lx) { world.x = -lx; wall = 1; }
  if (world.z > lzF) { world.z = lzF; wall = 1; } else if (world.z < -lzB) { world.z = -lzB; wall = 1; }
  if (wall) { hit.vx *= -0.25; hit.vz *= -0.25; }
  if (hit.stage === "air" && (wall || Math.hypot(hit.vx, hit.vz) < H1 * 0.6)) {
    hitStage("fall"); return;
  }
  if (now < hit.until) return;
  if (hit.stage === "stay") hitStage("");
  else if (hit.stage === "air") hitStage("fall");
  else if (hit.stage === "fall") { hit.vx *= 0.2; hit.vz *= 0.2; hitStage("down"); }
  else if (hit.stage === "down") hitStage("up");
  else hitStage("");
}
window.__hit = (dx, dy, sp) => hitGo(dx, dy, sp == null ? 1.2 : sp);

/* ---------------- the mind ----------------

   Everything above this is a character who does exactly what he is told and
   nothing otherwise: told to walk he walks, told to dance he dances, and
   between instructions he stands on the spot cycling idles. This is the part
   that gives him something to do when nobody is asking.

   It is deliberately not clever. It owns no movement of its own -- it calls
   walkTo and playClip exactly the way a spoken instruction does, so anything
   it can do you could have asked for, and anything you can ask for it will
   never fight you over. What it adds is a decision and a clock.

   AUTHORITY. The one rule that matters: a person outranks it, always, and it
   backs off for a while afterwards rather than pouncing the moment you stop
   talking. Hands off while he is speaking, while the brain is thinking, and
   for MIND.after past any instruction. mind.mine is how it tells its own
   walkTo from yours -- without it, the hold it sets on your behalf would fire
   on its own commands and it would stop itself forever. */
const MIND = {
  on: 1,
  after: 9000,          // hands off this long after anything you say
  gap: [2600, 8000],    // between decisions, once he has settled
  near: 0.85,           // how close "come and see you" gets, in heights
  far: -1.9,            // and how far "wander off" goes
  wide: 1.7,            // how far to either side he will TRY for
  edge: 0.10,           // and how much of the frame he must stay inside
};

/* Would he still be on screen standing there?

   The room is eight of his heights across and the frame is a phone held
   upright, so most of the floor he is allowed to walk on cannot be seen. He was
   wandering out of shot and staying there, which reads as broken rather than as
   autonomous -- and no constant fixes it, because how much floor is visible
   depends on the camera, which moves.

   So ask. Project the two ends of him and see. Both, because close to the lens
   the crop that gets him is the top of the frame, not the side. */
function figSeen(x, z, m) {
  const T = window.THREE;
  if (!gl.ready || !gl.cam || !gl.stage || !rig.R) return 1;
  gl.stage.updateMatrixWorld(true);
  /* Through the fit, which is the part that catches you out: the group is
     shifted by -fit.c so that he hangs on the origin, so stage-local y zero is
     his MIDDLE and not the floor. Probing at y = 0 and y = one height put both
     samples a whole body too high -- his head came out at the very top of the
     frame while he was standing comfortably inside it, so every spot failed,
     including the one he was already standing on. */
  const f = rig.R.fit, H1 = figH1(), v = new T.Vector3();
  for (const my of [H1 * 0.06, H1 * 1.02]) {
    v.set(x - f.c[0], world.y + my - f.c[1], z - f.c[2])
      .applyMatrix4(gl.stage.matrixWorld).project(gl.cam);
    if (!(Math.abs(v.x) < 1 - m && Math.abs(v.y) < 1 - m)) return 0;
  }
  return 1;
}

/* A place he can go that you can still see him in. Pull it in until it fits
   rather than clamping to a rectangle -- the visible region is a trapezium and
   a rectangle either wastes half of it or lets a corner out. */
function mindSpot(x, z) {
  for (let k = 0; k < 7; k++) {
    if (figSeen(x, z, MIND.edge)) return [x, z];
    x *= 0.76; z *= 0.76;
  }
  return [0, 0];
}
/* In place, and short. These read as somebody occupying themselves rather than
   performing -- which is the difference between a character in a room and a
   character on a stage. */
const MIND_ACTS = ["idle_stretch", "idle_look_at_nails", "idle_fan_self",
                   "idle_swat_fly", "idle_happy_bob", "idle_neutral_02"];
const mind = { at: 0, hold: 0, was: "", mine: 0 };
/* TURN AND LOOK AT ME.

   He was wandering off mid-conversation and answering over his shoulder, and
   the only way to get him back was to tap the floor in front of you. Which is
   not a bug in the wandering -- a person crossing a room and being spoken to
   stops and turns, and then carries on afterwards. So: somebody talks, he
   stops what he was doing and squares up.

   A pose is exempt. If he is sitting or lying down he can answer from there,
   and standing up to be spoken to would be worse than not turning at all. */
function attend() {
  if (!world.on || rig.out || hit.on || world.pose) return;
  mindHold();
  world.walking = 0; world.turning = 0;
  let dy = FACE.me - world.yaw;
  while (dy > Math.PI) dy -= TAU;
  while (dy < -Math.PI) dy += TAU;
  if (Math.abs(dy) > 0.18) faceTo(FACE.me);
}

function mindHold(ms) {
  if (mind.mine) return;                 // its own doing, not yours
  mind.hold = performance.now() + (ms == null ? MIND.after : ms);
}
/* Anything the director does goes through here, so the hold above can tell the
   two apart without every call site having to remember. */
function mindDo(f) { mind.mine = 1; try { f(); } finally { mind.mine = 0; } }

/* Weighted, and never the same thing twice running. A character who alternates
   between two behaviours is as obviously a loop as one who has none. */
function mindPick() {
  const opts = [["wander", 4], ["flourish", 3], ["visit", 2], ["retreat", 2], ["settle", 3]];
  let tot = 0;
  for (const o of opts) { if (o[0] === mind.was) o[1] *= 0.25; tot += o[1]; }
  let r = Math.random() * tot;
  for (const o of opts) { r -= o[1]; if (r <= 0) return o[0]; }
  return "settle";
}

function mindNow(now) {
  if (!MIND.on || !rig.on || rig.out || !gl.ready) return;
  // not while he is still being drawn: the build owns the screen until it ends
  if (world.on < 0.99) { mind.at = now + 1200; return; }
  /* Not over a voice, and not over a thought. Wandering off mid-sentence is
     the single most character-breaking thing this could do. */
  if (ttsPlaying || brain.busy) { mind.hold = now + 2500; return; }
  if (now < mind.hold || now < mind.at) return;
  // busy doing something already -- his own or yours, it makes no difference
  if (world.walking || world.turning || world.turnOnly) return;
  if (world.actUntil && now < world.actUntil) return;
  if (world.seq) return;
  /* A pose is a place to BE, so it is left alone: he sits until you tell him
     to get up, which is what makes sitting different from doing. */
  if (world.pose) return;

  const H1 = figH1();
  const what = mindPick();
  mind.was = what;
  const side = () => (Math.random() * 2 - 1) * MIND.wide * H1;
  mindDo(() => {
    if (what === "wander") {
      walkTo(...mindSpot(side(), (MIND.far + Math.random() * 2.4) * H1), 0);
    } else if (what === "visit") {
      // stops short and square on, rather than walking into the lens
      walkTo(...mindSpot(side() * 0.35, MIND.near * H1), 0);
    } else if (what === "retreat") {
      /* Walking, never running. A person crossing their own room does not
         sprint and then stop dead, and at these distances -- two heights, a
         second and a half -- a run is all acceleration and no travel. Running
         is something to be asked for. */
      walkTo(...mindSpot(side(), MIND.far * H1), 0);
    } else if (what === "flourish") {
      const nm = pickOne(MIND_ACTS);
      if (nm) {
        const dur = playClip(nm, 0.35, /swat_fly|stretch/.test(nm));
        world.actUntil = now + dur * 1000;
      }
    }
    // "settle" is the absence of a decision, and it is a third of them on
    // purpose: something that is always doing something is a screensaver
  });
  mind.at = now + MIND.gap[0] + Math.random() * (MIND.gap[1] - MIND.gap[0]);
}
window.__mind = (v) => { MIND.on = v ? 1 : 0; return MIND.on; };

function walkTo(x, z, run) {
  /* Fenced. The camera sits about three and a half of his heights away, so a
     tap low on the screen maps to a point almost underneath it -- he walks
     there, fills the frame, and his head goes off the top of it. The room he is
     allowed in stops well short of the lens. */
  const H1 = figH1();
  // and inside the floor, which is WALK.floor heights across: walking off the
  // edge of the room is worse than not being able to reach the corner of it
  const edge = WALK.floor / 2 - 0.4;
  world.tx = Math.max(-H1 * Math.min(2.6, edge), Math.min(H1 * Math.min(2.6, edge), x));
  /* 0.9 toward the lens. It was 1.5 when the room pulled the camera back to
     eleven heights and he filled under a quarter of the frame; at the portrait
     framing he fills over 40% standing still, so the same allowance walks him
     straight out of the top of the picture. */
  world.tz = Math.max(-H1 * Math.min(4.5, edge), Math.min(H1 * 0.9, z));
  world.walking = 1; world.run = run ? 1 : 0; world.turning = 0; world.turnOnly = 0;
  world.actUntil = 0; world.pose = 0;      // you cannot walk and be lying down
  playClip(run ? (haveClip("run_fwd") ? "run_fwd" : pickOne(WALKS)) : pickOne(WALKS), 0.25);
  mindHold();
}

/* Where a tap on the floor lands, in the world he stands in. The camera is
   level with his chest and never moves, so a ray through the tap meets the
   ground plane at a real place -- which is the whole reason the camera was left
   alone when the ground went in. */
const rayTmp = { ray: null, plane: null, hit: null };
function groundAt(sx, sy) {
  if (!gl.ready || !gl.cam || !rig.R) return null;
  const T = window.THREE;
  if (!rayTmp.ray) {
    rayTmp.ray = new T.Raycaster();
    rayTmp.plane = new T.Plane();
    rayTmp.hit = new T.Vector3();
    rayTmp.n = new T.Vector3();
    rayTmp.o = new T.Vector3();
    rayTmp.inv = new T.Matrix4();
  }
  /* Against the floor that is actually there. This used to intersect a plane
     with a world-space (0,1,0) normal and then divide by the stage scale --
     which is the right answer only while the stage is unrotated, and the stage
     is rotated by exactly the amount that makes the room a room. At pitch 0.38
     a tap 120 px above the bottom edge came back as a point that projects 401
     px away from the finger: he walked somewhere nobody had pointed at.

     So: take the plane off the ground object's own matrix, and bring the hit
     back through the stage rather than through a lone scalar. Stage-local IS
     the space world.x and world.z are written in, so the answer needs no
     further conversion. */
  if (!gl.ground) return null;
  gl.stage.updateMatrixWorld(true);
  gl.ground.updateMatrixWorld(true);
  rayTmp.ray.setFromCamera(new T.Vector2((sx / W) * 2 - 1, -(sy / H) * 2 + 1), gl.cam);
  rayTmp.plane.setFromNormalAndCoplanarPoint(
    rayTmp.n.set(0, 1, 0).transformDirection(gl.ground.matrixWorld).normalize(),
    rayTmp.o.setFromMatrixPosition(gl.ground.matrixWorld));
  if (!rayTmp.ray.ray.intersectPlane(rayTmp.plane, rayTmp.hit)) return null;
  rayTmp.hit.applyMatrix4(rayTmp.inv.copy(gl.stage.matrixWorld).invert());
  return [rayTmp.hit.x, rayTmp.hit.z];
}

function updateWorld(dt, now) {
  if (!rig.on || !gl.ready) { world.on = 0; return; }
  /* Before the walking, not after: the director's job is to set a target, and
     the code below is what carries him toward one. Deciding after it has
     already run costs a frame every time and shows up as a hitch at the moment
     he starts moving. */
  /* Before the mind, and the mind is told to stay out anyway: being thrown
     across a room is not a moment to decide to go and look at your nails. */
  hitNow(dt, now);
  mindNow(now);
  // the room arrives once he is built, not while he is being drawn
  const want = rig.wipe[3] >= FIG.top && !rig.out ? 1 : 0;
  world.on += (want - world.on) * 0.07;
  if (gl.mixer) gl.mixer.update(dt / 1000);
  if (rig.lowY != null && rig.R) {
    /* Falls instantly, rises only while he is holding a pose. Since-start
       alone was not enough: the crossfade INTO a pose is a blend, so the first
       few frames of "lay down" are still mostly the idle he was standing in and
       their floor is the real floor -- the minimum latched onto that and he
       stayed in the air. A pose is static and authored, so letting the floor
       climb back to it settles him in about a fifth of a second. An action is
       not allowed to climb, which is what stops a jump being flattened into a
       shuffle: mid-air is not the new ground. */
    if (rig.lowY < world.groundMin) world.groundMin = rig.lowY;
    // per-second, not per-frame: a phone at 30 sinks him at the same rate a
    // laptop at 120 does, which is the whole reason this file writes eases
    // this way everywhere else
    else if (world.pose) world.groundMin += (rig.lowY - world.groundMin) *
                                            (1 - Math.pow(1 - 0.08, dt / 16.67));
    const wantY = rig.R.fit.lo[1] - world.groundMin;
    // eased, so the first frame of a new pose is a settle rather than a jolt
    world.y += (wantY - world.y) * (1 - Math.pow(1 - 0.22, dt / 16.67));
  }
  /* The camera pulls back and looks down a little as the room arrives.

     It cannot literally move -- the two projections agree only because they are
     the same projection, and moving three's camera would put the particles
     somewhere else. But both of them read formS and view.pitch, so shrinking
     the scale IS pulling the camera back (the camera sits FOC pixels away, so a
     smaller world puts it further away measured in the world's own units) and
     tilting is a rotation of the whole stage that the 2D side already applies.

     Built at 0.40 he stands eleven of his own units from the lens, which is a
     portrait, not a room -- walking four units toward it nearly doubled his
     size and put his head off the top of the screen. At 0.23 it is twenty. */
  /* How far the camera backs off and how far it looks down once the room has
     arrived. Both were much stronger: 0.42 and 0.33, which put him eleven of
     his own heights away and 22 degrees above -- a wide, high, surveying shot.
     A portrait is taken from further away with a longer lens, and what that
     buys is a subject that fills the frame with the camera near eye level.
     Pulled back this far he was small and looked down on, which reads as a
     diorama rather than as somebody standing in front of you. */
  /* A portrait does not get the room's camera. The room looks slightly DOWN at
     somebody standing in it -- 0.05 plus ROOM.down, about eight degrees -- which
     is right for a figure and puts a face at the floor. This line runs every
     frame, so setting formTilt once when the head was built did nothing at all:
     it was overwritten before the next draw. */
  formS = rig.fs0 * (1 - (rig.portrait ? 0 : ROOM.back) * world.on);
  formTilt = rig.portrait ? 0 : 0.05 + ROOM.down * world.on;
  if (!want) return;

  if (world.turnOnly) {
    let dy = world.yawWant - world.yaw;
    while (dy > Math.PI) dy -= TAU;
    while (dy < -Math.PI) dy += TAU;
    if (Math.abs(dy) < 0.06) {
      world.turnOnly = 0;
      playClip(pickIdle(), 0.35);
      world.idleAt = now + 3000;
    }
  } else if (world.walking) {
    const dx = world.tx - world.x, dz = world.tz - world.z;
    const d = Math.hypot(dx, dz);
    if (d < WALK.arrive * figH1()) {
      world.walking = 0;
      playClip(pickIdle(), 0.35);
      world.idleAt = now + 2000;
    } else {
      /* Facing first, then moving. Sliding sideways toward a target while
         still turning is the thing that reads as a puppet on rails -- and with
         the old 286 deg/s it was a turret slide. Anything more than faceFirst
         off, he stops and pivots: no translation at all until he is pointing
         roughly the right way.

         The turn clips are a shuffle, not a rotation -- measured, both of them
         come back with 0.0 degrees of net yaw, so there is nothing in them to
         drive the heading with. What they are good for is feet that look busy
         while the heading changes underneath, which beats a forward walk cycle
         going sideways. */
      world.yawWant = Math.atan2(dx, dz);
      let dy = world.yawWant - world.yaw;
      while (dy > Math.PI) dy -= TAU;
      while (dy < -Math.PI) dy += TAU;
      if (world.turning) {
        if (Math.abs(dy) < 0.20) {
          world.turning = 0;
          playClip(world.run && haveClip("run_fwd") ? "run_fwd" : pickOne(WALKS), 0.22);
        }
      } else if (Math.abs(dy) > WALK.faceFirst) {
        world.turning = 1;
        playClip(pickTurn(), 0.22);
      } else {
        /* His own stride rate, not a constant. See clipSpeed: with one number
           for every walk, the strut travelled 45% too fast and the normal walk
           25% too slow, and which you got was a coin toss. */
        const sp = clipSpeed(world.act) * figH1() * (dt / 1000);
        const step = Math.min(sp, d);
        world.x += (dx / d) * step;
        world.z += (dz / d) * step;
      }
    }
  } else if (world.seq && now > world.seq.until) {
    /* The fade is as long as the two poses are far apart, and the incoming clip
       starts wherever it comes closest to the one he is leaving. Two dances are
       two whole-body poses moving at speed; a far pair given a quick cut is the
       teleport, and a near pair given a long one is a wallow. */
    const s = world.seq;
    const nxt = s.list[s.i % s.list.length];
    const lk = clipLink(world.act, nxt);
    const nm = seqNext(lk ? linkFade(lk.dist) : 0.5,
                       lk ? lk.entry * gl.clips[nxt].duration : 0);
    caption(null, nm.replace(/_/g, " "));
  } else if (world.actUntil && now > world.actUntil) {
    world.actUntil = 0;
    playClip(pickIdle(), 0.4);
    world.idleAt = now + 4000 + Math.random() * 6000;
  } else if (!world.actUntil && !world.pose && world.idleAt && now > world.idleAt) {
    // a character who plays one idle for ever is a character on a loop
    playClip(pickIdle(), 0.6);
    world.idleAt = now + 6000 + Math.random() * 9000;
  }
  // eased, and by the short way round. He only turns while he is going
  // somewhere -- a standing figure swinging to face a stale heading is the
  // other half of the hovering.
  if (world.walking || world.turnOnly) {
    let dy2 = world.yawWant - world.yaw;
    while (dy2 > Math.PI) dy2 -= TAU;
    while (dy2 < -Math.PI) dy2 += TAU;
    const rate = (world.turning || world.turnOnly) ? WALK.turnPlace : WALK.turn;
    world.yaw += dy2 * Math.min(1, rate * (dt / 1000));
  }
}
function worldReset() {
  visSet(0);
  world.on = 0; world.x = 0; world.y = 0; world.z = 0; world.yaw = 0; world.yawWant = 0;
  world.walking = 0; world.act = ""; world.actUntil = 0; world.idleAt = 0;
  world.pose = 0; world.groundMin = 1e30; world.turning = 0; world.turnOnly = 0;
  world.seq = null;
}

/* ---------------- the figure ----------------
   A rigged model does not arrive, it is BUILT -- and then it keeps moving. Four
   wipes climb it from the floor: dots, then lines between the dots, then the
   surface between the lines, then the colour on the surface. Each starts before
   the one before it has finished, so at any moment somewhere around the middle
   of it you can see all four states at once, stacked up the body. Then it
   dances, and leaving runs the same four wipes back down in the opposite order:
   the colour drains off first, then the surface, then the lines, and the dots
   fall back into the orb.

   The animation runs the WHOLE time, from the first foot. A figure that stands
   still while it assembles and then starts moving reads as two things -- a
   diagram, and then a character. One thing that is alive while it is being made
   is much stranger and much better.

   Everything here gates on ONE number per particle: `figH`, its height up the
   body in the bind pose, 0 at the feet and 1 at the top of the head. Bind pose
   and not the live pose deliberately -- a wipe that follows a waving hand is a
   wipe that goes backwards. */
const figH = new Float32Array(MAX);
const rig = {
  on: 0, R: null, src: "", ord: null, t: 0, at: 0, out: 0,
  wipe: [0, 0, 0, 0], stage: -1, hold: 0, holdName: "", speed: 1,
  // first particle slot of the portal orb's arc; 1e9 = nobody split off
  orbFrom: 1e9
};
/* Seconds each wipe takes to climb the body, and when each one starts. The
   overlap is the whole effect: at 1.5s in, the feet are a surface, the knees
   are a wireframe and the shoulders are still a cloud of dots. */
/* `top` is 1 + soft, not 1. A wipe that stops at exactly 1 leaves the last
   soft-edge band -- the top eighth of the head -- permanently half gated, so
   the finished figure was missing its crown: no surface on it and no texture,
   just dots. Every wipe runs past the top of the body by the width of its own
   soft edge. */
// rim: how much of the texture wipe's travel the silhouette dots fade out over
const FIG = { climb: 1.9, start: [0, 0.85, 1.7, 2.55], soft: 0.13, top: 1.13, rim: 0.34 };
const FIG_FS = 0.40;
const FIG_STAGE = ["dots", "lines", "fill", "texture"];

const rigCache = {};
async function loadRig(src) {
  const key = src.toLowerCase();
  if (rigCache[key]) return rigCache[key];
  caption(null, "loading " + src + "…");
  const named = /\.(glb|gltf)$/i.test(src) || /^https?:/i.test(src);
  const url = named ? src : "models/" + src + ".glb";
  const res = await fetch(url);
  if (!res.ok) throw new Error("HTTP " + res.status);
  const buf = await res.arrayBuffer();
  const R = readGlbRig(buf);
  R.buf = buf;
  R.world = new Array(R.nodes.length);
  R.jm = new Float32Array(R.joints.length * 16);
  R.wp = new Float32Array(R.dec.n * 3);
  R.wn = new Float32Array(R.dec.n * 3);
  rigFit(R);
  R.E = rigEdges(R.dec.T);
  /* Winding reversed once, here. The screen's y grows downward so the fit
     negates y, negating one axis mirrors the mesh, and a mirrored triangle has
     its winding backwards -- which is where the surface culling gets its
     facing from. The static path does this with f.reverse() at load; a rig has
     no face list to reverse afterwards, so it happens on the way in. */
  const T = R.dec.T;
  for (let i = 0; i + 2 < T.length; i += 3) { const t = T[i + 1]; T[i + 1] = T[i + 2]; T[i + 2] = t; }
  await bakeRigTexture(R);
  rigCache[key] = R;
  console.log("orb rig", src, R.verts + "→" + R.dec.n, "verts,", R.faces + "→" + T.length / 3,
              "faces,", R.E.length / 2, "edges,", R.joints.length, "joints,",
              R.dur.toFixed(1) + "s,", R.triCol ? "textured" : "no texture");
  return R;
}

/* One colour per triangle, baked once. The texture coordinates do not change
   when the model moves -- that is the entire point of them -- so a per-frame
   texture lookup would be the same answer every frame at sixty times the price.
   Sampled at the centroid rather than averaged over the triangle's footprint:
   at 3.4k faces a triangle covers a few pixels of a 1024 map and the centroid
   IS the average, near enough.

   Canvas 2D cannot draw a perspective-correct textured triangle, so this is the
   honest version of "textured" for this renderer: the mesh with its own colours
   on it, one flat patch per face. At the size a figure draws at, that reads. */
async function bakeRigTexture(R) {
  R.triCol = null;
  if (!R.img) return;
  let bmp;
  try {
    bmp = await createImageBitmap(new Blob([R.img.bytes], { type: R.img.mime }));
  } catch (e) { console.log("orb rig texture:", e.message); return; }
  const S = Math.min(1024, Math.max(bmp.width, bmp.height));
  const cv = document.createElement("canvas");
  cv.width = Math.max(1, Math.round(bmp.width * S / Math.max(bmp.width, bmp.height)));
  cv.height = Math.max(1, Math.round(bmp.height * S / Math.max(bmp.width, bmp.height)));
  const c2 = cv.getContext("2d", { willReadFrequently: true });
  c2.drawImage(bmp, 0, 0, cv.width, cv.height);
  const px = c2.getImageData(0, 0, cv.width, cv.height).data;
  /* Is there any transparency in this map at all? Asked because the material
     claims there is -- see glLoad -- and the claim is checkable rather than
     something to take on trust. */
  let minA = 255;
  for (let i = 3; i < px.length; i += 4) if (px[i] < minA) { minA = px[i]; if (!minA) break; }
  R.texMinAlpha = minA;
  const UV = R.dec.UV, T = R.dec.T, out = new Array(T.length / 3);
  for (let i = 0, f = 0; i + 2 < T.length; i += 3, f++) {
    const a = T[i], b = T[i + 1], c = T[i + 2];
    let u = (UV[a * 2] + UV[b * 2] + UV[c * 2]) / 3;
    let v = (UV[a * 2 + 1] + UV[b * 2 + 1] + UV[c * 2 + 1]) / 3;
    // glTF wraps by default, and a UV of exactly 1 lands one pixel off the edge
    u -= Math.floor(u); v -= Math.floor(v);
    const x = Math.min(cv.width - 1, (u * cv.width) | 0);
    const y = Math.min(cv.height - 1, (v * cv.height) | 0);
    const o = (y * cv.width + x) * 4;
    out[f] = [px[o], px[o + 1], px[o + 2]];
  }
  R.triCol = out;
  /* Quantised, because the drawing batches by colour and seven thousand
     distinct fillStyles is seven thousand fill calls. A character's map is
     four or five materials -- skin, shirt, trousers, hair -- so a coarse cube
     collapses it to a couple of dozen entries with nothing visibly lost, and
     the surface still draws in a couple of hundred fills. */
  const idx = new Map(), pal = [];
  R.triPal = new Uint8Array(out.length);
  for (let f = 0; f < out.length; f++) {
    const c = out[f];
    const q = ((c[0] >> 5) << 10) | ((c[1] >> 5) << 5) | (c[2] >> 5);
    let j = idx.get(q);
    if (j === undefined) {
      if (pal.length >= 255) j = 0;                   // never overflow the key
      else { j = pal.length; idx.set(q, j); pal.push([c[0], c[1], c[2]]); }
    }
    R.triPal[f] = j;
  }
  R.pal = pal;
  if (bmp.close) bmp.close();
}

// where the fit puts a skinned vertex, in formation space
/* y AND z negated, not just y. The 2D renderer is left-handed the way a screen
   is -- x right, y down, z away -- and glTF is right-handed with y up and z
   toward the viewer. Two flips preserve handedness, which is the only reason
   this conversion is possible at all; one flip would put his parting on the
   wrong side and nobody would be able to say why the figure looked off. The z
   flip was missing while the 2D renderer was the only consumer, because with
   nothing to compare against, a mirrored figure is just a figure. */
/* A portrait's own orientation, applied here and nowhere else.

   Three attempts at baking this into the asset each looked plausible and each
   came out wrong, because the only check was a screenshot of a smooth grey head
   and a smooth grey head looks much the same from several directions. Rotating
   here instead means one place decides, it is two numbers, and changing them
   costs a reload rather than a ninety-second re-export -- so it can actually be
   checked rather than reasoned about.

   Pitch first, then yaw, both about the formation axes: x right, y DOWN, z
   away. */
/* ydeg finishes what xdeg started, and the two belong together.

   The derived basis aims the face down formation -Z, which is at the camera,
   and it is right. Then xdeg turns the whole head ninety degrees about the
   screen's horizontal to stand him up -- and that rotation does not spare the
   direction he is looking in. Worked through: the face is pointing along +Y
   while he is on his back, and ninety about X carries +Y to +Z, which is
   straight away from the viewer. Standing him up turned him round.

   Measured rather than argued this time: the eye bones, which are on the front
   of a head by definition, were sitting 68% of the way from the nearest point
   of the head to the farthest. Half a turn about the vertical puts them back on
   the near side, where a face goes. */
const POSE = { ix: 0, xdeg: 90, ydeg: 180 };

/* The float. A head hanging dead still in space reads as a statue; the same
   head easing up and down with a slow rock reads as something ALIVE and held
   there -- a boat on calm water, which is exactly the reference. Three
   rotations and a lift, all slow, all small, none sharing a period with any
   other so the loop never visibly repeats. Angles in radians, lift in
   formation units (the head is about one unit tall). */
/* He only ever LIFTED before -- one vertical offset and three rotations, which
   from the front reads as a nod rather than as something floating. x and z are
   the sway and the drift toward and away from you, and with all three running
   on periods that do not divide into each other the head never repeats a
   position. Amplitudes roughly doubled: at 0.020 the lift was smaller than the
   per-particle wander sitting on top of it, so the head was jittering more
   than it was moving. */
/* Translation generous, rotation restrained, and the split matters. Sway is
   the head moving THROUGH space, which reads as floating; yaw is the head
   turning, and past about six degrees it stops facing you and the face stops
   being a face. The first pass ran yaw at 0.17 -- ten degrees -- and caught
   frames where the mouth had swung visibly off the midline. */
const BOB = { y: 0.055, x: 0.035, z: 0.060,
              pitch: 0.075, roll: 0.050, yaw: 0.105,
              und: 0.012 };   // und: per-particle wander, the wisp the trail catches

/* Eyes, made of particles, because the mesh has none -- the eyeballs were cut
   for size and only the sockets remain, which read as a skull. The eye BONES
   survived the cut though (CC_Base_L_Eye / R_Eye ride along in every CC skin),
   so the sockets' true positions are known without guessing: each eye is a
   little disc of dots parked on its bone, facing the camera, riding the same
   pose and bob as everything else. */
/* Where he is looking. One gaze for both eyes -- eyes are conjugate -- eased
   toward a target that is either your finger, while it is on the screen, or a
   slow wander with the occasional return to centre. The wander is what makes
   him read as thinking rather than staring. */
const gaze = { x: 0, y: 0, tx: 0, ty: 0, next: 0 };

/* down and apart are OFFSETS now, and default to nothing. They used to be the
   placement itself -- how far down the head the sockets sit, how far apart, as
   fractions of the head's width -- because I had decided the eye bones were
   unusable and was estimating from bounds. The bones work; the estimate is
   gone, and so is the reason for these to carry a value.

   They stay as a trim, because a dial that has been steering a wrong answer
   should not silently stop responding once the answer is right: "eyes down" has
   to keep moving the eyes. Both are fractions of head width, signed, and zero
   means exactly where the model puts them. */
/* Off for now, at your call -- the discs read as a costume rather than as part
   of him. Everything they need is still here and still correct: the bones are
   still found, the sockets are still measured, and the feature mask still uses
   both to know where the eyes are. One flag brings them back. */
const EYE = { on: 0,
              dots: 16, size: 1.35,
              down: 0,       // + moves them down the face
              apart: 0,      // + spreads them
              r: 0.070 };    // eye radius as a fraction of head width
/* Your eye beats my screenshot, so the trim is yours to move out loud while
   looking at him: "eyes down", "eyes up", "eyes wider", "eyes closer", "eyes
   bigger", "eyes smaller". Saved locally so they stick -- under a new key,
   because anything saved before this meant the old absolute placement and would
   now throw them off the head. */
try {
  const e0 = JSON.parse(localStorage.getItem("orbEyeTrim") || "0");
  if (e0) { EYE.down = e0.down || 0; EYE.apart = e0.apart || 0;
            EYE.r = e0.r || EYE.r; }
} catch (e) {}
function eyeSave() {
  try { localStorage.setItem("orbEyeTrim",
    JSON.stringify({ down: EYE.down, apart: EYE.apart, r: EYE.r })); } catch (e) {}
}

/* Which particles are an EYE, a NOSE or a MOUTH -- so the features can be
   drawn in the other half of the palette and read against the green.

   None of it is a hand-placed radius. The mesh already knows two of the three
   exactly: the eye bones say where the sockets are, and every blend shape on
   this head is a mouth or a jaw shape, so the vertices those shapes MOVE are
   the mouth, by definition, on any character that ships visemes. Jaw_Open is
   left out of that -- it swings the whole lower half of the head, and using it
   would paint the chin and the jawline as though they were lips.

   The nose is the one thing with no landmark on a CC rig, so it is derived
   from the other two rather than guessed: it lives in the band between the eye
   line and the mouth, close to the midline, and it is the part of that band
   nearest the camera. A cheek in the same band is simply further back. Done in
   formation space, where x is right, y is down and z is away, so there is no
   axis convention left to get wrong.

   Built once per figure and cached. It is a property of the mesh, not of the
   frame -- the bob moves every particle together and cannot move a nostril
   onto a cheek. */
/* All five sized off measurements, not taste. Eye separation on this head is
   0.594 formation units against a head 1.727 wide, so a socket is about a
   quarter of the separation, not the 1.35 I first wrote -- that was a radius
   wider than the face, which is why the first attempt came out purple from
   the hairline down. And the mouth shapes move 14% of the head above a
   sixteenth of their peak but only 5% above a third, so the ramp sits between:
   lips and the ring around them, not half a cheek. */
const FEAT = { eyeR: 0.26, noseW: 0.26, noseZ: 0.30, lo: 0.22, hi: 0.45 };
function figFeatures(EP, sep) {
  const R = rig.R;
  if (!R || !EP[0] || !EP[1] || !gl.mesh) return null;
  const dn = R.dec.n, REP = R.dec.REP, F = new Float32Array(MAX);
  // a particle is a sample now, so a per-vertex quantity is read across the
  // triangle it landed on rather than straight out of the array
  const S = rig.samp, pn = rig.pn != null ? rig.pn : dn;
  const at = (arr, k) => (S ? sampAt(S, k, arr) : arr[k]);
  const sm = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t));

  // MOUTH -- straight off the blend shapes
  const mt = (gl.mesh.geometry.morphAttributes || {}).position || [];
  const dict = gl.mesh.morphTargetDictionary || {};
  const use = [];
  for (const nm in dict) if (!/jaw_?open/i.test(nm) && mt[dict[nm]]) use.push(mt[dict[nm]]);
  const disp = new Float32Array(dn);
  let dmax = 0;
  for (let v = 0; v < dn; v++) {
    const r = REP[v];
    let m = 0;
    for (let a = 0; a < use.length; a++) {
      const t2 = use[a];
      const d = Math.hypot(t2.getX(r), t2.getY(r), t2.getZ(r));
      if (d > m) m = d;
    }
    disp[v] = m;
    if (m > dmax) dmax = m;
  }
  if (dmax <= 0) return null;

  /* EYES and NOSE, on the FACE's own axes rather than the screen's.

     u is the interocular axis, v runs from the eye line down to the mouth, and
     w is the face normal, u cross v. Measuring against those makes the whole
     thing pose-invariant: the bob yaws and rocks the head a few degrees every
     frame, and an axis-aligned x-band sliced through that at an angle, which
     put the nose visibly off the midline. A band defined by where the eyes and
     the mouth actually are cannot drift, because it moves with them. */
  const sub = (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
  const dot = (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2];
  const norm = (a) => { const L = Math.hypot(a[0],a[1],a[2]) || 1;
                        return [a[0]/L, a[1]/L, a[2]/L]; };
  const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
  const midE = [(EP[0][0]+EP[1][0])/2, (EP[0][1]+EP[1][1])/2, (EP[0][2]+EP[1][2])/2];
  const u = norm(sub(EP[1], EP[0]));
  const eR = sep * FEAT.eyeR;

  let mx2 = 0, my2 = 0, mz2 = 0, mn = 0;
  for (let i = 0; i < rig.ord.length; i++) {
    const vv = rig.ord[i];
    if (vv >= pn) continue;
    const w2 = sm((at(disp, vv) / dmax - FEAT.lo) / (FEAT.hi - FEAT.lo));
    if (w2 > 0) { F[i] = w2; if (w2 > 0.5) { mx2 += formX[i]; my2 += formY[i]; mz2 += formZ[i]; mn++; } }
    for (let e = 0; e < 2; e++) {
      const d = sub([formX[i], formY[i], formZ[i]], EP[e]);
      const we = sm(1 - Math.hypot(d[0], d[1] * 1.2, d[2] * 0.8) / eR);
      if (we > F[i]) F[i] = we;
    }
  }

  // NOSE -- the near part of the band between the eye line and the mouth
  if (mn > 8) {
    const mC = [mx2 / mn, my2 / mn, mz2 / mn];
    const down = sub(mC, midE), len = Math.hypot(down[0], down[1], down[2]) || 1;
    const v2 = norm(down);
    const w3 = norm(cross(u, v2));          // out through the face
    const halfW = sep * FEAT.noseW;
    // which way along w is toward the camera: near is -z in formation space
    const sgn = w3[2] < 0 ? 1 : -1;
    let pLo = 1e30, pHi = -1e30;
    const lat = [], along = [], out2 = [];
    for (let i = 0; i < rig.ord.length; i++) {
      if (rig.ord[i] >= pn) { lat[i] = 1e9; continue; }
      const d = sub([formX[i], formY[i], formZ[i]], midE);
      lat[i] = Math.abs(dot(d, u));
      along[i] = dot(d, v2);
      out2[i] = dot(d, w3) * sgn;
      if (along[i] < 0 || along[i] > len || lat[i] > halfW) continue;
      if (out2[i] < pLo) pLo = out2[i];
      if (out2[i] > pHi) pHi = out2[i];
    }
    const depth = (pHi - pLo) || 1, cut = pHi - depth * FEAT.noseZ;
    for (let i = 0; i < rig.ord.length; i++) {
      if (rig.ord[i] >= pn || lat[i] > halfW) continue;
      if (along[i] < 0 || along[i] > len) continue;
      // fading at the cheeks and at the back of the band, so the nose has an
      // edge rather than a rectangle around it
      const wn = sm(1 - lat[i] / halfW) * sm((out2[i] - cut) / (depth * 0.35));
      if (wn > F[i]) F[i] = wn;
    }
  }
  let c2 = 0;
  for (let i = 0; i < rig.ord.length; i++) if (F[i] > 0.35) c2++;
  console.log("orb features:", c2, "particles marked from", use.length,
              "mouth shapes and", rig.eyeBones.filter(Boolean).length, "eye bones");
  return F;
}

/* A head with nothing under it should not hang there like a photograph.

   The portrait has BOB, but that is the PARTICLE face and it works on the
   formation matrix. This is the rendered mesh, placed in the room by world.x
   and world.yaw like any other figure -- and a figure with legs is supposed to
   stand still. So the float is switched on by the thing that is actually true
   of him: he has no feet. A skeleton with no foot or toe bone in it is not
   standing on anything, so it drifts.

   Six sines on periods that share no common multiple, which is the whole
   reason it does not read as a loop. Amplitudes are in his own height, so this
   is the same drift whatever scale the next model is exported at. */
const FLOAT = { y: 0.030, x: 0.022, z: 0.026, pitch: 0.055, yaw: 0.085, roll: 0.040 };
const flo = { x: 0, y: 0, z: 0, rx: 0, ry: 0, rz: 0 };
function floatNow(t) {
  if (!rig.floats) { flo.x = flo.y = flo.z = flo.rx = flo.ry = flo.rz = 0; return; }
  const H1 = figH1() || 1;
  flo.y = Math.sin(t * 0.53) * FLOAT.y * H1;
  flo.x = Math.sin(t * 0.37 + 2.1) * FLOAT.x * H1;
  flo.z = Math.sin(t * 0.23 + 4.3) * FLOAT.z * H1;
  flo.rx = Math.sin(t * 0.41 + 1.2) * FLOAT.pitch;
  flo.ry = Math.sin(t * 0.19 + 0.6) * FLOAT.yaw;
  flo.rz = Math.sin(t * 0.31 + 3.7) * FLOAT.roll;
}

/* Where he is looking, and the eyes are bones now rather than a drawn disc --
   the builder skins each eyeball to its own bone, so this is a rotation about
   the centre of an eye rather than anything painted on.

   Wander, with the occasional return to centre and a long hold. Eyes are
   conjugate, so both take the same angles; that they move TOGETHER is most of
   what stops it reading as a doll. */
const D2R = Math.PI / 180;
/* `rest` is PER EYE, and that is the whole of the cross-eyed look.

   The bones are fine -- measured, an eye bone's world forward at zero gaze is
   (-0.014, -0.117, 0.993) against the head's own (-0.014, -0.113, 0.994), which
   is the same direction to within a fifth of a degree. What is off is the
   eyeball GEOMETRY: the two balls were modelled looking slightly inward, and
   not by the same amount, so at rest both irises sit toward the nose and one
   sits further than the other.

   That asymmetry is why a single global offset could not work and made it
   worse when tried: rotating both the same way fixes one eye and walks the
   other one out into a divergent stare. Each eye needs its own, and the signs
   are opposite because "outward" is opposite for the two of them. */
const EYES = {
  /* Smaller than it was. The per-eye correction below fixes where the eyes
     REST, and the two eyeballs are still not each other's mirror, so the
     further the wander pushes them the more that asymmetry shows. It was
     always meant to read as micro-movement rather than as looking about the
     room, and thirteen degrees does that and keeps both eyes in the part of
     their travel where they agree. */
  reach: 0.24, ease: 0.10, hold: [0.7, 3.4],
  /* Measured on colin_head with the mixer frozen so every shot was the same
     pose -- without that the idle turns his head between frames and you end up
     comparing two different faces. The two numbers are not each other's
     negative because the two eyeballs are not each other's mirror. */
  rest: { l: { yaw: -10, pitch: 0 }, r: { yaw: 16, pitch: 0 } },
};
window.__eyes = (ly, lp, ry, rp) => {
  EYES.rest.l = { yaw: ly || 0, pitch: lp || 0 };
  EYES.rest.r = { yaw: ry || 0, pitch: rp || 0 };
};
const look = { x: 0, y: 0, tx: 0, ty: 0, next: 0 };
function eyesNow(dt, now) {
  if (now > look.next) {
    if (Math.random() < 0.32) { look.tx = 0; look.ty = 0; }
    else {
      const a = Math.random() * TAU, r = 0.3 + Math.random() * 0.7;
      look.tx = Math.cos(a) * r; look.ty = Math.sin(a) * r * 0.55;
    }
    look.next = now + look.hold0();
  }
  const k = 1 - Math.pow(1 - EYES.ease, dt / 16.67);
  look.x += (look.tx - look.x) * k;
  look.y += (look.ty - look.y) * k;
  const T = window.THREE;
  const fm = glFace();
  if (!T || !fm || !fm.skeleton) return;
  if (!gazeQ) { gazeQ = new T.Quaternion(); gazeE = new T.Euler(); }
  if (!rig.eyeB) {

function bobMatrix(M0, t) {

    cz * cy, cz * sy * sx - sz * cx, cz * sy * cx + sz * sx,
    sz * cy, sz * sy * sx + cz * cx, sz * sy * cx - cz * sx,
    -sy,     cy * sx,                cy * cx,

  for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++)
    out[r * 3 + c] = R[r * 3] * M0[c] + R[r * 3 + 1] * M0[3 + c] + R[r * 3 + 2] * M0[6 + c];

/* Where a head is pointing, solved from the skeleton instead of guessed.

   Every previous attempt picked a rotation by looking at a render and deciding
   it seemed better. That cannot work: a head made of dots seen from above and a
   head seen head-on both look like a lot of dots, and "more rendered detail"
   goes UP when you tilt to show the crown. Four attempts, four wrong answers,
   each one defended with a screenshot.

   The rig already knows. Hips to head is up. The jaw, teeth and tongue hang in
   front of the middle of the skull, so their average points out through the
   face. Two measured directions are enough to define the rotation completely,
   so there is nothing left to choose -- and the result is CHECKED afterwards:
   the chin has to end up below the eyes on screen and the teeth in front of the
   skull, or it says so out loud rather than shipping another wrong guess. */

  const T = window.THREE, sk = gl.mesh && gl.mesh.skeleton;
  if (!T || !sk) return null;
  const B = (re, skip) => sk.bones.find((b) => re.test(b.name) && !(skip && skip.test(b.name)));

  const hip = B(/hip|pelvis|spine|root/i) || sk.bones[0];
  if (!head || !hip) return null;

  /* This is face-test.html's standUp, ported line for line, because that one
     demonstrably produces a face from this exact mesh and five attempts at
     deriving it here did not.

     What kept going wrong was the checking, not the maths. "Tallest per wide"
     is true of a head seen from below -- an open neck is a tall silhouette.
     "Teeth nearer than the skull" is true from below too, because under the
     chin the teeth ARE nearer. Every test I invented passed for a view up
     through his neck, so the search kept choosing it and I kept agreeing.

     So there is no search and nothing to score. Stand him up (hips to head is
     up), turn him to face front (the jaw, teeth and tongue hang in front of the
     middle of the skull), and then apply the one fixed thing the 2D side does:
     it negates y and z, because the screen's y grows downward and glTF's z
     comes toward the viewer. Two flips, a rotation, no freedom left. */
  const grp = (b) => b.getWorldPosition(new T.Vector3()).applyMatrix4(rig.toGroup);
  const hp = grp(head);
  const up = hp.clone().sub(grp(hip));

  const q = new T.Quaternion()
    .setFromAxisAngle(new T.Vector3(0, 1, 0), -Math.atan2(-fwd.x, -fwd.z))

/* ---------------- surface sampling ----------------

   vertex density -- a Character Creator head packs them around the mouth and
   the eyes and spreads them thin across the forehead and the crown. So the
   dots inherited the topology: the lips arrived as a solid merged mass with no
   lips in it while the brow was a loose scatter, and every attempt to fix that
   by changing the dot size traded one of those failures for the other.

   density is whatever we ask for and the mesh's own tessellation stops showing
   through. Each sample is a triangle and three barycentric weights; its
   position each frame is the same lerp across three already-skinned vertices,
   so this rides the bones, the morphs, the pose and the bob without any of
   them knowing it happened.

   walking a cumulative-area table at even intervals, so the samples are spread
   by construction instead of by luck, and rebuilding the same head twice gives
   the same face rather than a reshuffle you can see. */

    const vx = P[c] - P[a], vy = P[c + 1] - P[a + 1], vz = P[c + 2] - P[a + 2];

function rigSamplePN(R, S, k, o) {

  o[1] = wa * P[a + 1] + wb * P[b + 1] + wc * P[c + 1];
  o[2] = wa * P[a + 2] + wb * P[b + 2] + wc * P[c + 2];
  let nx = wa * N[a] + wb * N[b] + wc * N[c];
  let ny = wa * N[a + 1] + wb * N[b + 1] + wc * N[c + 1];
  let nz = wa * N[a + 2] + wb * N[b + 2] + wc * N[c + 2];

  const nx = N[v * 3], ny = -N[v * 3 + 1], nz = -N[v * 3 + 2];

/* Portrait is an ARGUMENT, not a flag somebody sets beforehand and hopes gets

   particle face straight to another figure (the room does exactly that:
   setFormation({figure:"colin_slim"}) lands here) left rig.portrait set. The
   new body inherited the head's eye slots, wore a giant eyeball for a face,
   and the eye particles skittered around loose because nothing was placing
   them any more. Defaulting to off means no route can inherit it. */
async function showFigure(src, portrait) {
  rig.portrait = portrait ? 1 : 0;

  rig.loading = 1;
  /* Whose body is on screen is who is talking. Set before the load rather than
     after it, so a sentence answered while he is still assembling is already
     answered by him. */

    rig.feat = null; rig.eb = null; rig.pose = null; rig.zLo = 0; rig.zHi = 0;

  catch (e) { rig.loading = 0; caption(null, "figure " + src + ": " + e.message); return false; }

     the fit, and the fit is only right once it has been measured in the space
     three answers in -- so a load that happens afterwards is a load that
     silently invalidates every point already placed. */
  gl.ready = 0;

    await threeReady();

      gl.ready = 1;

     frame and its does. Cached on the rig, because a sample list is a property
     of the mesh and re-showing the same head should not reshuffle his face. */
  const S = rig.portrait ? (R.samp || (R.samp = rigSamples(R, SAMP_N))) : null;
  rig.samp = S;

     first attempt claimed slots past the formation and nothing ever drew
     them: the field sizes its particle pool to pts.length, so targets beyond
     it are targets with no particles. If the eyes are not in the list before
     setFormation runs, they do not exist. Positions are placeholders here;
     updateFigure parks them on the eye bones every frame. */

    for (let k = 0; k < EYE.dots * 2; k++) pts.push([0, 0, 0, 0, 0, -1]);
  }

                            label: src, fs: FIG_FS, tilt: 0.05 }, 10 * 60);

     It orders the points by angle so the ring unfolds into the shape rather
     than scrambling through itself -- which means particle i is holding

     position of THAT vertex into THAT particle. Get it wrong and the figure is
     a bag of confetti that moves in time. */
  rig.ord = formOrd ? formOrd.slice() : Int32Array.from({ length: R.dec.n }, (_, i) => i);

     which is fine, as long as we know which slot holds which eye point. */
  rig.eyeBones = null; rig.eyeSlot = null; rig.isEye = null; rig.feat = null;
  rig.pn = pn;
  if (rig.portrait && EYE.on) {
    rig.eyeSlot = new Int32Array(EYE.dots * 2).fill(-1);
    rig.isEye = new Uint8Array(MAX);
