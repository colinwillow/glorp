   lattice, model -- and the split never changes for the life of the formation.
   Walking all of them once per drawing pass, fifteen times a frame, was most of
   the cost of having passes at all. */
let holoE = null;
/* Which particles a formation actually took. A word drawn by the whole field
   leaves nothing outside it, and the ring around a shape is most of what makes
   the shape look like it belongs to something. */
const formOn = new Uint8Array(MAX);
// surface orientation, when the source had one. A glyph does not.
const fnx = new Float32Array(MAX), fny = new Float32Array(MAX), fnz = new Float32Array(MAX);
/* The camera orbits; the world does not. Physics runs in an unrotated frame
   and rotation happens once, at draw, which is why nothing upstream had to
   learn about it. */
/* One full turn and then still, rather than spinning forever. A revolution is
   a look at the thing from every side; past that it is a screensaver. And
   ending on exactly TAU means the view is back where it started -- no residual
   rotation to unwind, and the projection is the identity again. */
const view = { turn: 0, yaw: 0, yaw0: 0, pitch: 0, deep: false };
let formN = 0, formT = 0, formWant = 0, formUntil = 0, formLabel = "", formRate = 0.045;
// held rather than timed: see the note in setFormation
let formHold = 0, formKeepRing = 0;
const HOLD_S = 30;
/* A glyph is flat and fills the frame edge to edge; a solid has a third axis
   and a diagonal, so the same number puts its corners off screen and into the
   containment wall, which then fights the formation for them. */
let form3d = false, formHasN = false, formHasB = false, formS = 0.42;
/* The faces, and how much of a solid the mesh currently is. Separate from the
   wireframe rather than replacing it: the whole point of the sequence is that
   the outline draws itself first and the surface fills in behind it. */
let formTri = null, solidT = 0, solidWant = 0;
// a formation may bring its own camera; null means use the sliders
let formTilt = null, formSpin = null, formWide = 0;
let formHY = 1;                    // the shape's half height, for clearing it
let formE = null;                  // vertex-index pairs, when the source was a mesh
let formOrd = null;                // the angular sort, for anything that has to follow it
const wirePath = new Array(8);     // reused, so a frame does not allocate eight paths
let wireT = 0, wireAt = 0;         // the mesh grows in a beat after the cloud lands
let formCountWas = 0;

/* Draw it, read the pixels back, keep the lit ones. One mechanism covers every
   glyph the font has, which is what makes arbitrary words free.

   But "lit" means two different things. Our own text is painted pure white, so
   every lit pixel is signal and the fill is the drawing. An emoji is painted by
   the font in its own palette and its face is a solid disc -- fill that and the
   eyes and mouth disappear. Those get traced instead: silhouette edges,
   interior colour edges, and the dark features themselves. */
const GLYPH_S = 220;

/* Pixels in, places to be out. Shared, because a font glyph, an emoji and a
   drawing off disk are the same problem once they are pixels -- and the tricky
   half of that problem, deciding what counts as lit, is the same too. */
function samplePixels(d, S) {
  const K = 3, STEP = 2;
  const NB = [[K, 0], [-K, 0], [0, K], [0, -K]];
  const lum = new Float32Array(S * S), on = new Uint8Array(S * S);
  let n = 0, sum = 0, chroma = 0, lo = 1e9, hi = -1e9;
  for (let i = 0; i < S * S; i++) {
    if (d[i * 4 + 3] <= 100) continue;
    const r = d[i * 4], gg = d[i * 4 + 1], b = d[i * 4 + 2];
    const l = 0.299 * r + 0.587 * gg + 0.114 * b;
    on[i] = 1; lum[i] = l; n++; sum += l;
    if (l < lo) lo = l;
    if (l > hi) hi = l;
    const ch = Math.max(r, gg, b) - Math.min(r, gg, b);
    if (ch > chroma) chroma = ch;
  }
  if (!n) return [];
  const flat = chroma < 10 && hi - lo < 10;   // one flat colour: our own text
  const dark = sum / n - 55;

  const at = (x, y) =>
    (x < 0 || y < 0 || x >= S || y >= S || !on[y * S + x]) ? -1 : lum[y * S + x];

  const pts = [];
  for (let y = 0; y < S; y += STEP)
    for (let x = 0; x < S; x += STEP) {
      const i = y * S + x;
      if (!on[i]) continue;
      if (flat) { pts.push([(x / S) * 2 - 1, (y / S) * 2 - 1]); continue; }
      const l = lum[i];
      let keep = l < dark;                    // the features themselves
      for (let k = 0; k < 4 && !keep; k++) {
        const v = at(x + NB[k][0], y + NB[k][1]);
        if (v < 0 || Math.abs(v - l) > 45) keep = true;   // rim, or a colour edge
      }
      if (keep) pts.push([(x / S) * 2 - 1, (y / S) * 2 - 1]);
    }
  return pts;
}

function sampleGlyphs(str) {
  const S = GLYPH_S;
  const c = document.createElement("canvas");
  c.width = S; c.height = S;
  const g = c.getContext("2d", { willReadFrequently: true });
  // Left transparent and thresholded on alpha rather than painted black and
  // thresholded on red -- a multi-coloured glyph has no reliable red channel,
  // and alpha is the one thing every glyph shares. This is what lets emoji in.
  g.fillStyle = "#fff";
  g.textAlign = "center"; g.textBaseline = "middle";
  let size = Math.min(S * 0.8, (S * 1.6) / Math.max(1, str.length));
  g.font = "700 " + size + "px sans-serif";
  const w = g.measureText(str).width || 1;
  if (w > S * 0.92) { size *= (S * 0.92) / w; g.font = "700 " + size + "px sans-serif"; }
  g.fillText(str, S / 2, S / 2);
  return samplePixels(g.getImageData(0, 0, S, S).data, S);
}

/* ---------------- pictures ----------------
   A drawing is a glyph the font does not have. Same sampler, one thing added:
   a font glyph arrives on a transparent canvas and a PNG usually does not.
   Artwork exported on white, or on any flat colour, would otherwise sample as a
   solid rectangle -- so the four corners are read first, and if they agree, that
   colour is the background and gets knocked out. If they disagree the image has
   a real background, and it is left alone rather than guessed at. */
function imageToPoints(img) {
  /* Finer than a glyph. A letter is a shape with five or six strokes in it and
     220 is generous; a rendered character has a hat, a beard, a belt buckle and
     a tear in one knee, and at 220 all of those land in the same handful of
     pixels. The sampler does not care what size it is given. */
  const S = 300;
  const c = document.createElement("canvas");
  c.width = S; c.height = S;
  const g = c.getContext("2d", { willReadFrequently: true });
  // fitted, not stretched: a squashed character is worse than a small one
  const k = Math.min(S * 0.94 / img.width, S * 0.94 / img.height);
  const w = img.width * k, h = img.height * k;
  const dx = Math.round((S - w) / 2), dy = Math.round((S - h) / 2);
  g.drawImage(img, dx, dy, w, h);

  const im = g.getImageData(0, 0, S, S), d = im.data;
  const at = (x, y) => { const i = (y * S + x) * 4; return [d[i], d[i + 1], d[i + 2], d[i + 3]]; };
  // The corners of the picture, not the corners of the canvas. Fitting leaves a
  // transparent margin, so canvas corners read as empty however the artwork was
  // exported -- which let a white background straight through, to sample as a
  // filled rectangle with a frame around it.
  const ax = dx + 1, ay = dy + 1, bx = Math.ceil(dx + w) - 2, by = Math.ceil(dy + h) - 2;
  const cs = [at(ax, ay), at(bx, ay), at(ax, by), at(bx, by)].filter((p) => p[3] > 200);
  if (cs.length >= 3) {
    const near = (a, b) => Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]) < 36;
    if (cs.every((p) => near(p, cs[0]))) {
      const [br, bg, bb] = cs[0];
      const off = (i) => Math.abs(d[i] - br) + Math.abs(d[i + 1] - bg) + Math.abs(d[i + 2] - bb);
      for (let i = 0; i < d.length; i += 4) if (off(i) < 60) d[i + 3] = 0;
      // Then two passes of erosion. Where the background meets the drawing the
      // renderer leaves a ramp of blended pixels; the ones nearest the paint
      // survive the knock-out and ring the whole figure in a second contour.
      // A ramp pixel is the pixel that is still nearly the background AND
      // touches the background -- real edges fail the first half of that.
      for (let pass = 0; pass < 2; pass++) {
        const doomed = [];
        for (let y = 1; y < S - 1; y++)
          for (let x = 1; x < S - 1; x++) {
            const i = (y * S + x) * 4;
            if (!d[i + 3] || off(i) > 130) continue;
            if (!d[i - 4 + 3] || !d[i + 4 + 3] || !d[i - S * 4 + 3] || !d[i + S * 4 + 3]) doomed.push(i + 3);
          }
        for (const j of doomed) d[j] = 0;
      }
    }
  }
  return samplePixels(d, S);
}

/* What is actually in images/. Nobody should have to keep a list by hand, and a
   static host cannot list a directory -- but the repository behind Pages can say
   what it holds, and the page is served from a URL that names the repository.
   So: a checked-in index.json wins if there is one, and otherwise the host name
   is read backwards into an owner and a repo and GitHub is asked. Neither
   working is fine; it just means the brain is never told pictures exist, which
   is better than it offering one that is not there.

   Asked once per load, at startup, so nothing waits on it mid-sentence. */
let imageList = null;
async function listImages() {
  if (imageList) return imageList;
  imageList = [];
  const clean = (n) => String(n).replace(/\.[^.]+$/, "");
  try {
    const r = await fetch("images/index.json");
    if (r.ok) {
      const j = await r.json();
      if (Array.isArray(j)) imageList = j.map(clean);
    }
  } catch (e) { /* no manifest is the normal case, not an error */ }
  /* Both, not one or the other. The manifest is same-origin and never rate
     limited, so it is the one that can be relied on; the listing is what means
     a file dropped in the folder needs no other edit. Merged, so shipping a
     manifest does not switch the discovery off. */
  if (/\.github\.io$/i.test(location.hostname)) {
    const owner = location.hostname.split(".")[0];
    const repo = location.pathname.split("/")[1] || location.hostname;
    try {
      const r = await fetch("https://api.github.com/repos/" + owner + "/" + repo + "/contents/images");
      if (r.ok) {
        const j = await r.json();
        if (Array.isArray(j)) for (const f of j)
          if (f.type === "file" && /\.(png|jpe?g|webp|gif|svg)$/i.test(f.name)
              && !imageList.includes(clean(f.name))) imageList.push(clean(f.name));
      }
    } catch (e) { /* offline, rate limited, private repo -- all the same here */ }
  }
  if (imageList.length) console.log("orb images", imageList.join(", "));
  return imageList;
}
listImages();

/* ---------------- the picture itself ----------------
   The particles trace a picture, and then the picture arrives. Which is the
   point the whole formation system has been walking toward without saying so:
   the field is a way of ANNOUNCING a thing, not a substitute for it. A drawing
   made of dots is a beautiful way to say "a photograph is coming"; it is a poor
   photograph.

   So the bitmap fades up over the drawing it was sampled from, in exactly the
   rectangle the drawing occupies -- the sampler already fitted it to 94% of a
   square, so the same fit reproduces the same box -- and once it is up the
   particles let go and fall back to the orb behind it. Nothing is thrown away:
   the drawing is the transition, the photograph is the destination. */
const photo = { img: null, t: 0, want: 0, half: [1, 1], at: 0 };

const imageCache = {};
async function showImage(src, seconds) {
  takeScreen("photo");
  const key = src.toLowerCase();
  if (!imageCache[key]) {
    caption(null, "loading " + src + "…");
    const named = /\.(png|jpe?g|webp|gif|svg)$/i.test(src) || /^https?:/i.test(src);
    const urls = named ? [src]
      : ["png", "jpg", "jpeg", "webp", "svg"].map((e) => "images/" + src + "." + e);
    let last = null;
    for (const url of urls) {
      try {
        const img = await new Promise((res, rej) => {
          const im2 = new Image();
          im2.onload = () => res(im2);
          im2.onerror = () => rej(new Error("not there"));
          im2.src = url;
        });
        const pts = imageToPoints(img);
        if (!pts.length) throw new Error("nothing in it once the background came off");
        /* The bitmap, and the box it was fitted into. Both, because the drawing
           has to hand over to something that lands in the same place. */
        pts.img = img;
        pts.half = [img.width >= img.height ? 0.94 : (img.width / img.height) * 0.94,
                    img.height >= img.width ? 0.94 : (img.height / img.width) * 0.94];
        imageCache[key] = pts;
        last = null;
        break;
      } catch (e) { last = e; }
    }
    if (last || !imageCache[key]) {
      /* Say why in the caption, then draw the name anyway. A picture that is
         not there is nearly always a picture that is not there YET -- leaving
         the field blank makes it look broken, when what actually happened is
         that a file is waiting to be dropped into images/. */
      caption(null, "image " + src + ": " + ((last && last.message) || "not found"));
      return setFormation({ text: src.slice(0, 14).toUpperCase() }, seconds || 5);
    }
  }
  /* Bigger than a word, and past the wall. A picture is the thing being looked
     at, not a caption on the orb -- at the glyph scale a whole character came
     out a third of the height of the screen. */
  /* If a gallery is open, a picture belongs IN it. Two owners of the same job
     is how a single photograph ended up laid over the grid: the old standalone
     path and the new page both drawing, neither knowing about the other. */
  if (gallery.on && gallery.shots.length) {
    const k = gallery.shots.findIndex((sh) => sh.nm.toLowerCase() === key);
    if (k >= 0) { galleryOpen(k); return true; }
  }
  const hit = imageCache[key];
  const ok = setFormation({ points: hit, label: src, fs: 0.66, wide: 1 }, seconds || 22);
  if (!ok) return false;
  caption(null, src + " · " + hit.length + " points");
  /* A beat for the drawing to land and be read as a drawing, then the picture.
     Any less and the two are one event and the dots were pointless; any more
     and it feels like waiting. */
  photo.img = hit.img; photo.half = hit.half; photo.want = 0; photo.at = performance.now() + 1500;
  return true;
}

function clearPhoto() { photo.want = 0; photo.at = 0; }

/* ---------------- the gallery ----------------
   A page, not a formation. Once pictures are on screen this is somewhere you
   are looking at things: a grid you can drag, tiles that fold in, a tap to open
   one, and it stays until you leave it. The particles do not go away -- they
   line the top and bottom edges, so the field is still there holding the frame
   rather than pretending it is a website.

   Everything is drawn on the same canvas as everything else. A DOM overlay
   would be easier and would immediately stop being the same object. */
const gallery = {
  on: false, mode: "grid", i: 0,
  scroll: 0, vel: 0, at: 0, shots: [],
  drag: null, from: null, shrink: null,
};
/* Where the little one sits. Everything else at the top of the screen has to
   clear it, which is why GRID.top moved down: a gallery whose first row runs
   under the orb is two things fighting for one strip of screen. */
/* His band. Everything at the top of the screen clears it -- which it has to,
   because he swells with the room and a fixed 22px radius is not what is
   actually on the screen when somebody talks. Orb, perch and the loudest swell
   fit between about 60 and 135; content starts below that. */
const MINI_TOP = 96;
/* How much of the bottom is spoken for. The talk button is a primary control
   sitting in the middle of the bottom edge, and it is only there until somebody
   presses it -- so the grids give it room while it exists and take the room
   back afterwards, rather than permanently reserving a strip for a button that
   is usually gone. */
function uiBottom() {
  const btn = micBig && micBig.classList.contains("off") ? 78 : 150;
  // and the bar, when he is lying along the bottom, which is taller than either
  return dock.on ? Math.max(btn, dockBottom() + 58) : btn;
}
const GRID = { cols: 3, gap: 10, edge: 12, top: 168 };

function tileRect(k) {
  const cw = (W - GRID.edge * 2 - GRID.gap * (GRID.cols - 1)) / GRID.cols;
  const col = k % GRID.cols, row = (k / GRID.cols) | 0;
  /* Centred when it is shorter than the space it has. Six square tiles in three
     columns cannot fill a phone however they are arranged, and top-aligning
     them leaves a void underneath that reads as a loading failure. */
  const view = H - GRID.top - uiBottom();
  const tall = gridHeight(gallery.shots.length);
  const top = GRID.top + (tall < view ? (view - tall) / 2 : 0);
  return { x: GRID.edge + col * (cw + GRID.gap),
           y: top - gallery.scroll + row * (cw + GRID.gap), w: cw, h: cw };
}
function gridHeight(n) {
  const cw = (W - GRID.edge * 2 - GRID.gap * (GRID.cols - 1)) / GRID.cols;
  return Math.ceil(n / GRID.cols) * (cw + GRID.gap) - GRID.gap;
}
function scrollMax() {
  return Math.max(0, gridHeight(gallery.shots.length) - (H - GRID.top - uiBottom()));
}

/* Cover, not contain. A grid of pictures with different aspects and letterboxes
   between them is a contact sheet; filling each cell is what makes it read as
   one surface. */
function drawCover(img, x, y, w, h, alpha) {
  const s2 = Math.max(w / img.width, h / img.height);
  const sw = w / s2, sh = h / s2;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, x, y, w, h);
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ---------------- the dock ----------------
   When a page is on screen, the field itself becomes a wide flat bar along the
   bottom. Not a small orb drawn separately at the top -- THE FIELD. The same
   particles that were the orb travel down and lie out in a band, and when the
   page closes they gather back up into the middle. That is the whole point of a
   particle field and it is what the two border lines were not doing: a line
   across the top and a line across the bottom is a sheet, and a sheet collapsing
   into a ball reads as particles arriving from the sides rather than as one
   thing changing shape.

   It also reacts, which a formation normally cannot: a fully formed shape
   overrides the audio deformation completely, which is why the border lines sat
   there dead. The bar's targets are rewritten every frame from the spectrum
   instead -- the same trick the rig uses to animate -- so it is a live meter
   made out of him.

   Tap it to go home. Hold it to open the site. */
/* `share` is the half of this that matters most. Only part of the field goes
   down to the bar; the rest stays where it always is, resting in the middle,
   dimmed, still breathing with the room. So he is never entirely somewhere
   else -- the bar is him lying down and the ring behind the page is still him
   standing there, and you can watch the two halves separate. */
const DOCK = { fs: 0.5, w: 0.37, h: 0.017, amp: 2.6, hold: 420, share: 0.46, dim: 0.34 };
const dock = { on: 0, bx: null, by: null, hw: 1, yc: 0, yc0: 0, at: 0, held: 0 };
/* Above the talk button while the talk button is there. The bar was landing
   exactly on it -- the button is 58px tall sitting 74px off the bottom edge --
   so every tap meant for the bar hit the button instead and nothing reached the
   canvas at all. It moves when the button goes, easing rather than jumping,
   because updateDock rewrites the targets every frame anyway. */
function dockBottom() { return micBig && micBig.classList.contains("off") ? 92 : 158; }

function dockPoints() {
  const s2 = DOCK.fs * scale;
  const hw = (W * DOCK.w) / s2;
  const hh = (H * DOCK.h) / s2;
  const yc = (H / 2 - dockBottom()) / s2;
  dock.hw = hw; dock.yc = yc; dock.yc0 = yc;
  const pts = [], N = 900;
  for (let i = 0; i < N; i++) {
    const a = (i / N) * TAU;
    /* A band rather than an outline: the orb is a shell with a gap and a core,
       and squashing that flat is what keeps it recognisably him rather than a
       progress bar. */
    const rr = 0.50 + 0.62 * hash(i * 2 + 5);
    pts.push([Math.cos(a) * hw * rr, yc + Math.sin(a) * hh * rr]);
  }
  return pts;
}

function dockStart() {
  dock.on = 1; dock.at = performance.now(); dock.held = 0;
  /* Indexed by particle, not packed. Only part of the field is in the bar and
     the ones that are are spread THROUGH the index rather than taken off the
     front -- particles are ordered by angle, so the first 46% of them is a 46%
     arc. Copying formX[0..formN] therefore copied a mixture of bar positions
     and whatever the particles that stayed behind happened to be holding. */
  dock.bx = new Float32Array(MAX);
  dock.by = new Float32Array(MAX);
  for (let i = 0; i < MAX; i++) if (formOn[i]) { dock.bx[i] = formX[i]; dock.by[i] = formY[i]; }
}
function dockStop() { dock.on = 0; dock.bx = null; dock.held = 0; }

function updateDock() {
  if (!dock.on || !dock.bx) return;
  if (!pages.on && !gallery.on) { dockStop(); return; }
  const n = Math.min(MAX, Math.round(cfg.count));
  const s2 = DOCK.fs * scale;
  const amp = DOCK.h * (H / s2) * DOCK.amp;
  // where the bar wants to be this frame, which moves when the button goes
  dock.yc += ((H / 2 - dockBottom()) / s2 - dock.yc) * 0.07;
  for (let i = 0; i < n; i++) {
    if (!formOn[i]) continue;
    const u = (dock.bx[i] / dock.hw + 1) / 2;
    let b = drive.spectrum[Math.max(0, Math.min(BANDS - 1, (u * BANDS) | 0))] || 0;
    b += drive.scale * 0.35;
    // pushed away from the bar's own middle, so it swells rather than slides
    const off = dock.by[i] - dock.yc0;
    formY[i] = dock.yc + off + (off > 0 ? 1 : -1) * b * amp;
    formX[i] = dock.bx[i] * (1 + drive.scale * 0.05);
  }
}
// the bar, in screen pixels, for hit testing
function dockRect() {
  const s2 = DOCK.fs * scale;
  const half = DOCK.h * H * 1.5 + 18;
  return { x: cx - dock.hw * s2, y: cy + dock.yc * s2 - half,
           w: dock.hw * s2 * 2, h: half * 2 };
}
function dockHit(x, y) {
  if (!dock.on || formT < 0.4) return false;
  const r = dockRect();
  return x >= r.x - 20 && x <= r.x + r.w + 20 && y >= r.y - 16 && y <= r.y + r.h + 16;
}

/* Two lines of particles, top and bottom, with a slow wave along them. It is a
   formation like any other, so it breathes with the room -- which is the whole
   reason not to draw a rectangle in the 2D context and call it a frame. */
const EDGE_FS = 0.5;
function edgePoints() {
  /* In screen proportions, not in the field's own. Formation coordinates are
     scaled by min(W, H) on BOTH axes, so x = 1 is already off the side of a
     tall phone and y = 1 is nowhere near the top of it -- the first version
     asked for two straight lines and got two arcs, because the containment wall
     bent the ends of them back in. Solve for the actual half-width and
     half-height instead. */
  const ex = (W * 0.5) / (EDGE_FS * scale) * 0.99;
  const ey = (H * 0.5 - 34) / (EDGE_FS * scale);
  const pts = [], N = 150;
  for (let r = 0; r < 2; r++)
    for (let i = 0; i < N; i++) {
      const u = (i / (N - 1)) * 2 - 1;
      pts.push([u * ex, (r ? 1 : -1) * ey * (1 - 0.018 * Math.sin(i * 0.42))]);
    }
  return pts;
}

async function fetchImage(src) {
  const named = /\.(png|jpe?g|webp|gif|svg)$/i.test(src) || /^https?:/i.test(src);
  const urls = named ? [src] : ["png", "jpg", "jpeg", "webp", "svg"].map((e) => "images/" + src + "." + e);
  for (const url of urls) {
    try {
      return await new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => res(im); im.onerror = () => rej(new Error("no"));
        im.src = url;
      });
    } catch (e) { /* next extension */ }
  }
  return null;
}

async function showGallery() {
  takeScreen("gallery");
  /* Whether the page has to say something itself, decided BEFORE the first
     await. When the brain opened the gallery it is already writing a line about
     it, and by the time the pictures have loaded it may well be speaking -- so
     asking then would find a clear coast and talk over it. Ask now. */
  const quiet = brain.busy || ttsPlaying;
  // glorb is the app's own mark, sat in images/ so the menu slot has something
  // to point at. It is not one of the pictures anybody came to look at.
  const list = (await listImages()).filter((n2) => n2 !== "glorb");
  if (!list.length) { caption(null, "no pictures found — images/ is empty or not committed"); return false; }
  caption(null, "opening " + list.length + " pictures…");
  const shots = [];
  for (const nm of list) {
    const img = await fetchImage(nm);
    if (img) shots.push({ nm, img });
  }
  if (!shots.length) { caption(null, "none of the pictures would load"); return false; }
  gallery.on = true; gallery.mode = "grid"; gallery.shots = shots;
  gallery.scroll = 0; gallery.vel = 0; gallery.i = 0;
  gallery.at = performance.now();
  clearPhoto();
  // the field docks rather than leaving
  setFormation({ points: dockPoints(), label: "dock", fs: DOCK.fs, wide: 1,
                 share: DOCK.share, keepRing: 1 }, 3600);
  dockStart();
  caption(null, shots.length + " pictures · drag to scroll · tap one");
  if (!quiet) remark(GALLERY_LINES);
  return true;
}

/* ---------------- pages ----------------
   The menu is gone. Six labelled satellites on spokes was a diagram of a menu
   rather than a place, and next to a wall of real photographs it looked like
   the part that had not been designed yet.

   What replaces it is the site. Six cards, two columns, and the left column
   arrives from the left and the right column from the right -- literally, which
   is the difference between this and the picture grid, where whole rows fold in
   alternately. Tap one, or say its name, and it opens.

   A page is a `kind` and whatever that kind needs. Three of them already exist
   as features and are simply pointed at; the rest draw themselves and say so.
   Adding one is a line in this array. */
const PAGES = [
  { key: "images", kind: "gallery", blurb: "pictures, full size",
    say: /\b(image|images|picture|pictures|photo|photos|gallery)\b/ },
  { key: "characters", kind: "figure", src: "colin_dance", blurb: "rigged and dancing",
    say: /\b(character|characters|colin|figure|model|models)\b/ },
  { key: "motion", kind: "soon", blurb: "films and loops",
    say: /\b(motion|film|films|video|videos|animation)\b/ },
  { key: "design", kind: "soon", blurb: "the work",
    say: /\b(design|work|portfolio)\b/ },
  { key: "code", kind: "soon", blurb: "this, and the rest",
    say: /\b(code|coding|software|github)\b/ },
  { key: "about", kind: "text", blurb: "who is doing this",
    say: /\b(about|who|bio|contact)\b/,
    lines: ["Colin Willow.", "", "Three-D artist and animator.",
            "Everything here was modelled,", "rigged and animated by hand.", "",
            "Glorb builds it out of particles", "because that seemed better than", "a list of links.", "",
            "colinwillowtree@gmail.com"] }
];

const PG = { cols: 2, gap: 12, edge: 16, top: 168 };
const pages = { on: 0, at: 0, i: -1, open: 0, openAt: 0, from: null, hit: -1, shots: [] };

function pageRect(k) {
  const cw = (W - PG.edge * 2 - PG.gap * (PG.cols - 1)) / PG.cols;
  const rows = Math.ceil(PAGES.length / PG.cols);
  const view = H - PG.top - uiBottom();
  const ch = Math.min(cw * 1.12, (view - PG.gap * (rows - 1)) / rows);
  const tall = ch * rows + PG.gap * (rows - 1);
  const top = PG.top + Math.max(0, (view - tall) / 2);
  const col = k % PG.cols, row = (k / PG.cols) | 0;
  return { x: PG.edge + col * (cw + PG.gap), y: top + row * (ch + PG.gap), w: cw, h: ch };
}

/* Each card draws a little scene out of the same primitives the rest of the
   program is made of -- dots, a line, an arc, the green and the violet. Not
   screenshots: there are no pages to screenshot yet, and a grey rectangle
   saying "coming soon" is worse than nothing. The one page that HAS its
   content already shows it, because it can. */
function cardArt(pg, x, y0, w, h0, t) {
  /* Everything below draws inside an art BOX rather than inside the card, and
     the box is the card minus the strip the label sits in. Sized off the width
     alone, the pictures on the images card ran straight through the word IMAGES
     the moment the cards got shorter -- which they do whenever the talk button
     is on screen, so it depended on whether the microphone had been enabled. */
  const LAB = 46;
  const y = y0 + 8, h = Math.max(20, h0 - LAB);
  const cx2 = x + w / 2, cy2 = y + h * 0.46, s = Math.min(w * 0.92, h);
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y0, w, h0); ctx.clip();
  if (pg.kind === "gallery" && pages.shots.length) {
    // the real pictures, four of them, because this page already exists
    const g = Math.min(4, pages.shots.length), cwv = s * 0.42, gp = s * 0.05;
    for (let i = 0; i < g; i++) {
      const px2 = cx2 + ((i % 2) - 1) * (cwv + gp) + gp / 2;
      const py2 = cy2 + (((i / 2) | 0) - 1) * (cwv + gp) + gp / 2;
      drawCover(pages.shots[i], px2, py2, cwv, cwv, 0.92);
    }
  } else if (pg.kind === "figure") {
    /* A standing figure, not a cloud in the rough shape of one. The first
       version sampled a width function over the whole height and got a blob
       with a ring floating above it -- a silhouette needs its parts stated:
       shoulders, a taper, two legs, and a head that is filled rather than
       outlined. */
    const dot = (px2, py2, rr) => { ctx.beginPath(); ctx.arc(px2, py2, rr, 0, TAU); ctx.fill(); };
    ctx.fillStyle = "#8B2FD6";
    for (let i = 0; i < 160; i++) {
      // stops above the label: the first version ran to 0.88 of the card and the
      // feet stood in the middle of the word CHARACTERS
      const v = hash(i * 3 + 2), yy = 0.28 + v * 0.48;
      let u = hash(i * 3 + 1) * 2 - 1, wid;
      if (yy < 0.36) wid = 0.175;                          // shoulders and arms
      else if (yy < 0.54) wid = 0.175 - (yy - 0.36) * 0.32;  // the taper to the waist
      else { wid = 0.125; u = (u < 0 ? -1 : 1) * (0.32 + 0.68 * Math.abs(u)); }   // two legs
      dot(cx2 + u * wid * s, y + yy * h, 1.4 + 1.3 * hash(i + 9));
    }
    ctx.fillStyle = "#B6E08A";
    for (let i = 0; i < 46; i++) {
      // sqrt, or a disc of random polar samples piles up in the middle
      const a = hash(i + 31) * TAU, rr = s * 0.058 * Math.sqrt(hash(i + 41));
      dot(cx2 + Math.cos(a) * rr, y + h * 0.205 + Math.sin(a) * rr * 1.2, 1.5);
    }
  } else if (pg.kind === "soon" && pg.key === "motion") {
    /* A strip of film, with the sprockets creeping. Horizontal bars read as
       CODE two cards away, and two cards that look alike is worse than one
       card that is dull. */
    ctx.fillStyle = "#6B2FB5";
    const step = h * 0.62 / 6, roll = ((t * 14) % step);
    for (let i = -1; i < 8; i++) {
      const yy = y + h * 0.13 + i * step + roll;
      if (yy < y + h * 0.08 || yy > y + h * 0.80) continue;
      ctx.fillRect(x + w * 0.155, yy, w * 0.055, h * 0.026);
      ctx.fillRect(x + w * 0.79, yy, w * 0.055, h * 0.026);
    }
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = "#3E5C2A";
    ctx.strokeRect(x + w * 0.27, y + h * 0.14, w * 0.46, h * 0.26);
    ctx.strokeStyle = "#B6E08A";
    ctx.strokeRect(x + w * 0.27, y + h * 0.46, w * 0.46, h * 0.26);
    ctx.fillStyle = "#B6E08A";
    const px3 = x + w * 0.44, py3 = y + h * 0.53, ts = s * 0.075;
    ctx.beginPath();
    ctx.moveTo(px3, py3); ctx.lineTo(px3 + ts, py3 + ts * 0.62); ctx.lineTo(px3, py3 + ts * 1.24);
    ctx.closePath(); ctx.fill();
  } else if (pg.kind === "soon" && pg.key === "design") {
    // arcs opening out of a point
    ctx.lineWidth = 1.4;
    for (let i = 1; i <= 5; i++) {
      ctx.strokeStyle = i % 2 ? "#8B2FD6" : "#4E7A34";
      ctx.beginPath();
      ctx.arc(x + w * 0.22, y + h * 0.72, i * s * 0.115, -Math.PI / 2, 0);
      ctx.stroke();
    }
  } else if (pg.kind === "soon" && pg.key === "code") {
    // lines of it, indented the way it actually is
    const ind = [0, 1, 2, 2, 1, 2, 3, 1, 0];
    for (let i = 0; i < ind.length; i++) {
      ctx.fillStyle = i % 3 === 1 ? "#4E7A34" : "#6B2FB5";
      const lw = w * (0.20 + 0.34 * hash(i + 21));
      ctx.fillRect(x + w * 0.14 + ind[i] * w * 0.07, y + h * 0.20 + i * s * 0.062, lw, 2.5);
    }
  } else {
    // about: the orb itself, small
    ctx.fillStyle = "#8B2FD6";
    for (let i = 0; i < 70; i++) {
      const a = (i / 70) * TAU, rr = s * (0.19 + 0.05 * hash(i + 3));
      ctx.beginPath();
      ctx.arc(cx2 + Math.cos(a) * rr, cy2 + Math.sin(a) * rr, 1.6 + 1.2 * hash(i + 7), 0, TAU);
      ctx.fill();
    }
    ctx.fillStyle = "#B6E08A";
    for (let i = 0; i < 20; i++) {
      const a = (i / 20) * TAU, rr = s * 0.045 * hash(i + 11);
      ctx.beginPath();
      ctx.arc(cx2 + Math.cos(a) * rr, cy2 + Math.sin(a) * rr, 1.3, 0, TAU);
      ctx.fill();
    }
  }
  ctx.restore();
}

function pageCard(pg, r, e, lit) {
  const rad = 12;
  ctx.save();
  ctx.globalAlpha = e;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(r.x, r.y, r.w, r.h, rad);
  else ctx.rect(r.x, r.y, r.w, r.h);
  // not quite opaque: the one living behind the site has to be visible through
  // it, or he is only in the gaps and might as well not be there
  ctx.fillStyle = "rgba(14,16,12,0.84)";
  ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = lit ? "#B6E08A" : "#2F3A28";
  ctx.stroke();
  cardArt(pg, r.x, r.y, r.w, r.h, performance.now() / 1000);
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  ctx.font = "600 12px ui-monospace, SFMono-Regular, Menlo, monospace";
  ctx.fillStyle = lit ? "#EAFBD2" : "#B6E08A";
  ctx.fillText(pg.key.toUpperCase().split("").join(" "), r.x + 14, r.y + r.h - 26);
  ctx.font = "10px ui-monospace, SFMono-Regular, Menlo, monospace";
  ctx.fillStyle = "#5A6B4E";
  ctx.fillText(pg.blurb, r.x + 14, r.y + r.h - 12);
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* One place at a time.

   Asking OUT LOUD for a page while the site was on screen loaded it straight
   over the top: cards behind, photographs in front, both live. Tapping a card
   was fine, because tapping goes through pageOpen, which closes the grid before
   it opens anything. The spoken route does not -- a word matches a trigger and
   calls the destination directly -- so the tidying up only existed on one of
   the two paths into the same place.

   It belongs at the destination rather than on the way in. Every place calls
   this first, and whichever one is arriving turns the others off. */
function takeScreen(who) {
  if (who !== "pages" && pages.on) pagesClose();
  if (who !== "gallery" && gallery.on) {
    gallery.on = 0; gallery.mode = "grid"; gallery.shots = []; gallery.drag = null;
  }
  if (who !== "figure" && rig.on) figClear();
  if (who !== "photo") clearPhoto();
  if (who !== "seq") stopSequence();
}

async function showPages() {
  takeScreen("pages");
  pages.on = 1; pages.at = performance.now(); pages.i = -1; pages.open = 0; pages.hit = -1;
  clearPhoto();
  setFormation({ points: dockPoints(), label: "dock", fs: DOCK.fs, wide: 1,
                 share: DOCK.share, keepRing: 1 }, 3600);
  dockStart();
  caption(null, "pages · tap one, or say its name");
  // the pictures page shows the pictures, so it needs a few of them
  if (!pages.shots.length) {
    const list = (await listImages()).filter((n2) => n2 !== "glorb").slice(0, 4);
    const got = [];
    for (const nm of list) { const im = await fetchImage(nm); if (im) got.push(im); }
    pages.shots = got;
  }
  return true;
}
function pagesClose() { pages.on = 0; pages.open = 0; pages.i = -1; }

/* Opening is a move, the same one a photograph makes: the card grows into the
   screen and then hands over to whatever the page actually is. The grow is
   short, because it is a transition and not the content. */
function pageOpen(k) {
  const pg = PAGES[k];
  if (!pg) return false;
  pages.i = k; pages.from = pageRect(k); pages.open = 1; pages.openAt = performance.now();
  stirred();
  setTimeout(() => {
    if (!pages.on || pages.i !== k) return;
    if (pg.kind === "gallery") showGallery(0);          // takeScreen closes the grid
    else if (pg.kind === "figure") showFigure(pg.src);
    else caption(null, pg.key + " · " + pg.blurb);
  }, 340);
  return true;
}
function pageHit(x, y) {
  for (let k = 0; k < PAGES.length; k++) {
    const r = pageRect(k);
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return k;
  }
  return -1;
}
// said out loud rather than touched
function pageSaid(flat) {
  for (let k = 0; k < PAGES.length; k++) if (PAGES[k].say.test(flat)) return k;
  return -1;
}

function drawPages() {
  if (!pages.on) return;
  const now3 = performance.now();
  if (pages.open) {
    /* The one that was tapped, on its way to filling the screen. Text pages
       stop here and draw themselves; the other kinds have handed over by now
       and this is the last frame of the handover. */
    const pg = PAGES[pages.i];
    const raw = Math.min(1, (now3 - pages.openAt) / 380);
    const e = 1 - Math.pow(1 - raw, 3);
    const a = pages.from;
    // clear of the little one, which floats at MINI_TOP and was being cut in
    // half by the top edge of the panel
    const b2 = { x: W * 0.06, y: PG.top - 6, w: W * 0.88, h: H - PG.top - uiBottom() + 40 };
    const L = (p1, p2) => p1 + (p2 - p1) * e;
    const r = { x: L(a.x, b2.x), y: L(a.y, b2.y), w: L(a.w, b2.w), h: L(a.h, b2.h) };
    ctx.save();
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(r.x, r.y, r.w, r.h, 12); else ctx.rect(r.x, r.y, r.w, r.h);
    ctx.fillStyle = "rgba(16,18,14,0.94)";
    ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = "#3C4B32"; ctx.stroke();
    ctx.clip();
    ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
    ctx.globalAlpha = Math.max(0, (e - 0.45) / 0.55);
    ctx.font = "600 15px ui-monospace, SFMono-Regular, Menlo, monospace";
    ctx.fillStyle = "#EAFBD2";
    ctx.fillText(pg.key.toUpperCase().split("").join(" "), r.x + 22, r.y + 46);
    ctx.font = "12.5px ui-monospace, SFMono-Regular, Menlo, monospace";
    const lines = pg.lines || ["Not built yet.", "", pg.blurb + ".", "",
                              "It will be here. Everything else", "on this page was also not here", "a week ago."];
    for (let i = 0; i < lines.length; i++) {
      ctx.fillStyle = i === 0 ? "#B6E08A" : "#7E9070";
      ctx.fillText(lines[i], r.x + 22, r.y + 84 + i * 21);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
    return;
  }
  for (let k = 0; k < PAGES.length; k++) {
    /* Left column from the left, right column from the right. Literally: with
       two columns "the left ones" and "the right ones" are a real thing on the
       screen, which is what makes this read differently from the picture grid,
       where whole rows fold in alternately. */
    const col = k % PG.cols, row = (k / PG.cols) | 0;
    const age = (now3 - pages.at - row * 80) / 400;
    if (age <= 0) continue;
    const e = age >= 1 ? 1 : 1 - Math.pow(1 - age, 3);
    const r = pageRect(k);
    r.x += (1 - e) * (W + PG.edge) * (col === 0 ? -1 : 1);
    pageCard(PAGES[k], r, e, k === pages.hit);
  }
}

/* Where a picture is when it is open, and where it came from. Opening one is a
   move, not a cut: it grows out of the tile that was tapped and shrinks back
   into it, so the grid and the picture are obviously the same object seen at two
   sizes. A cross-fade would say they are two different pictures. */
function fullRect(k) {
  const sh = gallery.shots[k].img;
  const availW = W * 0.94, availH = H - GRID.top - uiBottom();
  const sc = Math.min(availW / sh.width, availH / sh.height);
  const w = sh.width * sc, h = sh.height * sc;
  return { x: cx - w / 2, y: cy - h / 2, w, h };
}

function galleryOpen(k) {
  gallery.i = ((k % gallery.shots.length) + gallery.shots.length) % gallery.shots.length;
  gallery.from = tileRect(gallery.i);
  gallery.mode = "one";
  gallery.at = performance.now();
  caption(null, gallery.shots[gallery.i].nm + " · " + (gallery.i + 1) + " of " + gallery.shots.length);
}

function galleryClose() {
  if (gallery.mode !== "one") return false;
  gallery.from = tileRect(gallery.i);
  gallery.mode = "grid";
  // the grid is already there; only the picture that is leaving needs a beat
  gallery.shrink = { k: gallery.i, at: performance.now() };
  gallery.at = performance.now() - 900;
  caption(null, gallery.shots.length + " pictures · drag to scroll · tap one");
  return true;
}

function galleryGo(d) {
  if (!gallery.on || gallery.mode !== "one") return false;
  galleryOpen(gallery.i + d);
  return true;
}

function galleryHit(x, y) {
  for (let k = 0; k < gallery.shots.length; k++) {
    const r = tileRect(k);
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return k;
  }
  return -1;
}

function drawGallery(dt) {
  if (!gallery.on) return;
  const now3 = performance.now();
  if (gallery.mode === "grid") {
    // inertia, and a wall at each end rather than a bounce
    if (!gallery.drag) {
      gallery.scroll += gallery.vel * (dt / 16.67);
      gallery.vel *= Math.pow(0.94, dt / 16.67);
      if (Math.abs(gallery.vel) < 0.05) gallery.vel = 0;
    }
    const mx2 = scrollMax();
    if (gallery.scroll < 0) { gallery.scroll = 0; gallery.vel = 0; }
    if (gallery.scroll > mx2) { gallery.scroll = mx2; gallery.vel = 0; }

    for (let k = 0; k < gallery.shots.length; k++) {
      /* A row at a time, sliding in from alternate sides: the first row from
         the left, the next from the right. It used to alternate per TILE, which
         with three columns means both directions inside every row and a
         staggered start for each -- so the grid assembled on a diagonal and
         nothing read as coming from one side or the other. A row is the unit
         that reads as horizontal.

         And it starts a full screen out, not 42% of one. A tile in the right
         column offset by 0.42W begins in the middle of the screen and slides a
         short way, which looks like a nudge; travelling the whole width is what
         makes it arrive FROM somewhere. */
      const row = (k / GRID.cols) | 0;
      const age = (now3 - gallery.at - row * 90) / 380;
      if (age <= 0) continue;
      const e = age >= 1 ? 1 : 1 - Math.pow(1 - age, 3);
      const r = tileRect(k);
      if (r.y > H || r.y + r.h < 0) continue;
      if (gallery.shrink && gallery.shrink.k === k) continue;   // it is on its way in
      const side = row % 2 ? 1 : -1;
      const off = (1 - e) * (W + GRID.edge) * side;
      drawCover(gallery.shots[k].img, r.x + off, r.y, r.w, r.h, e);
    }
  } else {
    const raw = Math.min(1, (now3 - gallery.at) / 420);
    const e = 1 - Math.pow(1 - raw, 3);
    const a = gallery.from || fullRect(gallery.i), b2 = fullRect(gallery.i);
    const L = (p1, p2) => p1 + (p2 - p1) * e;
    drawCover(gallery.shots[gallery.i].img,
              L(a.x, b2.x), L(a.y, b2.y), L(a.w, b2.w), L(a.h, b2.h), 1);
  }
  // and one shrinking back into its tile, over the grid it is rejoining
  if (gallery.shrink) {
    const raw = (now3 - gallery.shrink.at) / 420;
    if (raw >= 1) gallery.shrink = null;
    else {
      const e = 1 - Math.pow(1 - raw, 3);
      const a = fullRect(gallery.shrink.k), b2 = tileRect(gallery.shrink.k);
      const L = (p1, p2) => p1 + (p2 - p1) * e;
      drawCover(gallery.shots[gallery.shrink.k].img,
                L(a.x, b2.x), L(a.y, b2.y), L(a.w, b2.w), L(a.h, b2.h), 1);
    }
  }
}


/* ---------------- solids ----------------
   Particles do not need topology, only positions. That is the whole reason this
   works at all: a mesh, a glyph and a ring are the same kind of thing to the
   field -- a list of places to be -- and the difference between them is only
   how the list was made. Everything here returns points in roughly [-1,1]. */
const SOLIDS = {
  sphere: (n) => {
    // Fibonacci, not lat/long: even by area, so the poles do not clot
    const p = [], g = Math.PI * (3 - Math.sqrt(5));
    for (let i = 0; i < n; i++) {
      const y = 1 - (i / (n - 1)) * 2, r = Math.sqrt(Math.max(0, 1 - y * y)), a = g * i;
      p.push([Math.cos(a) * r, y, Math.sin(a) * r]);
    }
    return p;
  },
  cube: (n) => {
    const p = [], per = Math.ceil(n / 6);
    for (let f = 0; f < 6; f++)
      for (let i = 0; i < per; i++) {
        const u = Math.random() * 2 - 1, v = Math.random() * 2 - 1;
        p.push(f === 0 ? [u, v, 1] : f === 1 ? [u, v, -1] : f === 2 ? [u, 1, v]
             : f === 3 ? [u, -1, v] : f === 4 ? [1, u, v] : [-1, u, v]);
      }
    return p;
  },
  torus: (n) => {
    const p = [], R = 0.72, r = 0.28;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, b = Math.random() * TAU;
      p.push([(R + r * Math.cos(b)) * Math.cos(a), r * Math.sin(b),
              (R + r * Math.cos(b)) * Math.sin(a)]);
    }
    return p;
  },
  helix: (n) => {
    const p = [], turns = 3.5;
    for (let i = 0; i < n; i++) {
      const t = i / n, a = t * TAU * turns;
      const w = 0.13 * Math.sqrt(Math.random());
      const wa = Math.random() * TAU;
      p.push([Math.cos(a) * 0.8 + Math.cos(wa) * w, t * 2 - 1 + Math.sin(wa) * w,
              Math.sin(a) * 0.8]);
    }
    return p;
  }
};

/* Centre on the bounding box and scale the longest axis to 1. Without this a

   screen at a thousand times the size -- and it is never obvious which. */
/* ---------------- the little one ----------------
   When something else owns the field there is nothing left of Glorb on the
   screen: a hologram, a knot, a gallery of photographs, and the thing you were
   talking to has simply gone. Which is also why there was no way back except
   saying so out loud -- there was nothing to touch.

   So a small one sits at the top and keeps reacting. It is NOT part of the
   field: the field is busy being a knot, and taking a hundred particles back
   off a formation to staff a second orb would put a hole in the first. It is
   drawn straight from `drive` -- the same seam the big one reads -- which is
   the whole reason that seam exists. Same palette, same LUT, same swell on
   loudness, same per-band deformation. It just has its own dots.

   "nothing makes it go away" is a thing you can see and put your thumb on. */

   whatever the border line is doing. So he gets a perch -- a small disc he rests
   on, which belongs to the page rather than to him, and which MOVES. Where it
   goes is a property of what is on screen, so putting him somewhere else for a
   given page is one line in miniSpot.

  ctx.fillStyle = "rgba(14,16,12,0.96)";

  ctx.lineWidth = 1; ctx.strokeStyle = "#5B2799"; ctx.stroke();

}

     first frame, or he flies in from the top-left corner the first time. */
  const sp = miniSpot();
  /* Out of the middle, not out of nowhere. The first frame put him straight on
     his perch at full size, which reads as an element switching on -- and the
     one thing this program is supposed to be about is that things travel. He

  if (!mini.set) { mini.ax = cx; mini.ay = cy; mini.set = 1; }

     the big one actually IS. The first attempt drew a ring of dots shaded by
     distance and got a bright green hoop with purple flecks in it, which is
     nothing like Glorb: he is a fat violet halo with a small hard green centre
     and black in between. Reproducing the two masses separately is much closer
     than reproducing the formula that happens to produce them.

     Everything below is read straight off `drive` -- the same seam the field
     reads -- so if the big one is moving this one is moving, and if this one is
     still then the microphone is dead. Which makes it a status light too. */

/* The orb, drawn from `drive` at whatever size and strength is asked for. Two
   callers: the little one on his perch, and the one living behind the site. */
function orbDots(X, Y, R, e, now, k) {
  const sw = 1 + drive.scale * 0.5;

  ctx.globalAlpha = e;

    const b = drive.spectrum[(j * BANDS / MINI_SHELL) | 0] || 0;

                         wob * Math.sin(a * 3 + now / 260));

            (1.5 + 1.1 * hash(j + 13)) * k, 0, TAU);

    const a = ((j + hash(j + 71) * 0.9) / NC) * TAU;
    // the core swells harder than the shell, which is what reads as a voice
    const rr = R * 0.30 * (0.25 + 0.80 * hash(j + 91)) * (1 + drive.scale * 0.8);
    ctx.fillStyle = shadeAt(LUT_HI * (0.70 + 0.35 * hash(j + 17)));

/* The one behind the page used to be drawn here -- a second, fake orb at low
   alpha over the top of the real field. It IS the real field now: only part of
   it goes down to the bar, and what stays behind is genuinely him, dimmed. A
   drawn copy of something that could be the thing itself is the wrong answer in
   a program whose whole subject is particles actually travelling. */

  return mini.t > 0.35 && Math.hypot(x - mini.x, y - mini.y) < mini.r * 2.1;

function fitPoints(p) {

  for (const q of p) for (let d = 0; d < 3; d++) {

    if (q[d] > hi[d]) hi[d] = q[d];

  for (let d = 0; d < 3; d++) m = Math.max(m, hi[d] - lo[d]);

  // meaningless and scaling it by a negative would invert the surface

/* ---------------- topology ----------------

   not have to arrive: it grows, by drawing lines between dots that are already

   formation has to BE the vertex list rather than a scatter of surface points.

   Two things have to happen first.

   Welding. glTF splits a vertex at every UV and normal seam -- 47% of the
   vertices in a test head turned out to be duplicates of a position already
   there. Two triangles either side of a seam then share no index, so the edge

/* Scatter points across triangles by area. Shared, because the difference

     area, which is the sampling weight; its direction is the surface normal,
     which is what lets the far side of a solid be hidden. Taking the face

      // away the one thing OBJ carries that GLB cannot
      F.push(line.trim().split(/\s+/).slice(1)

    for (let j = 0; j < n; j++) {

      out[i * n + j] = a.componentType === 5126 ? dv.getFloat32(o, true)
                     : a.componentType === 5125 ? dv.getUint32(o, true)
                     : a.componentType === 5123 ? dv.getUint16(o, true)
                     : a.componentType === 5122 ? dv.getInt16(o, true)
                     : a.componentType === 5120 ? dv.getInt8(o)
                     : dv.getUint8(o);
