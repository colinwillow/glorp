name = "orb-brain"
main = "src/index.ts"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# Variables set in the Cloudflare dashboard survive a CLI deploy. Without this,
# `wrangler deploy` deletes anything not listed below -- which would wipe an
# ORB_PERSONA edited from a phone the next time anyone deploys from a laptop.
keep_vars = true

# The API key is a secret, never a var:
#   npx wrangler secret put ANTHROPIC_API_KEY
#
# Lock the browser origin down once deployed. Without this any page anywhere
# can spend your tokens.
[vars]
ALLOWED_ORIGIN = "https://colinwillow.github.io"
# Default voice -- who speaks when nobody in particular is on screen. The page
# can override it per request from the tune panel, and GET /voices lists what
# this account actually has.
ELEVEN_VOICE_ID = "wyWA56cQNU2KqUW4eCsI"
# And Colin's, cloned from his own voice. One variable per character, named
# ELEVEN_VOICE_<ID> to match the row in CASTS -- the page sends the id "colin"
# and the worker looks the voice up here, so a stranger with the endpoint can
# pick a character that exists and nothing else.
#
# In the file rather than the dashboard because a voice id is not a secret (the
# API key is) and this way it deploys itself. Dashboard still wins for anything
# NOT listed here -- see keep_vars above -- but a key that is listed is set from
# the file on every deploy, so change it here.
ELEVEN_VOICE_COLIN = "kJWUfEv4iADM2zGU2fOf"

# How it is performed. Stability reads backwards: high is not "good", it is
# FLAT -- the model stops varying and every sentence lands at the same pitch and
# pace. Down from the 0.40 default because the complaint is that he reads
# rather than talks, and pausing and intonation are exactly what stability
# suppresses. Style pushes the delivery further towards however the voice was
# performed in the clip it was cloned from.
#
# Both are per-account rather than per-character today. If the orb ends up
# wanting a different setting from his, that is a second pair of variables and a
# lookup, not a rethink.
ELEVEN_STABILITY = "0.28"
ELEVEN_STYLE = "0.45"

# The shared memory. OPTIONAL, and commented out on purpose: a binding naming a
# namespace that does not exist fails the deploy, and this Worker deploys from a
# push to main -- so a wrong id here takes the brain down rather than leaving a
# feature switched off.
#
# Without it the orb still remembers. Memory lives in the browser that heard the
# thing, travels up with every turn and comes back written to. That works today
# and needs nothing. What it does not do is cross devices or people: what you
# tell it on your phone is not there on a laptop, and what somebody else tells
# it is on theirs only.
#
# To make it one shelf that everyone reads and writes:
#   npx wrangler kv namespace create ORB_MEM
# then paste the id it prints below and uncomment all three lines. The browser
# copy keeps working alongside it -- the Worker merges the two and drops
# duplicates -- so nothing is lost by turning this on later rather than now.
#
# [[kv_namespaces]]
# binding = "ORB_MEM"
# id = "paste-the-id-here"
