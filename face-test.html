<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "./vendor/GLTFLoader.js";
import { DRACOLoader } from "./vendor/DRACOLoader.js";
import { RoomEnvironment } from "./vendor/RoomEnvironment.js";

const $ = (id) => document.getElementById(id);

/* A Blender export with "compression" ticked is Draco, and Draco is listed in
   extensionsRequired -- so without a decoder the loader does not degrade, it
   refuses the file outright. One shared loader, so the decoder is fetched and
   the worker spun up once rather than per model. */
const GLTF = new GLTFLoader();
const draco = new DRACOLoader();
draco.setDecoderPath("./vendor/draco/");
draco.setDecoderConfig({ type: "wasm" });
GLTF.setDRACOLoader(draco);
const logEl = $("log");
const line = (s) => { logEl.textContent += s + "\n"; logEl.scrollTop = 1e6; };
const say = (s, cls) => { $("status").textContent = s; $("status").className = cls || ""; };

/* ---- the same ten shapes, and the same ARKit mapping the app uses ---- */
const VIS_OF = { a:"AI", i:"AI", y:"AI", e:"E", o:"O", u:"U", w:"WQ", q:"WQ",
                 l:"L", f:"FV", v:"FV", m:"MBP", b:"MBP", p:"MBP" };
const VIS_HOLD = { AI:2.2, E:2.0, O:2.2, U:2.0, WQ:1.6, L:1.2, FV:1.2, MBP:1.0, etc:1.0, rest:1.6 };
const VIS_RIG = {
  rest: {},
  MBP:  { mouthClose:0.92, mouthPressLeft:0.35, mouthPressRight:0.35, jawOpen:0.04 },
  FV:   { mouthLowerDownLeft:0.45, mouthLowerDownRight:0.45, mouthShrugUpper:0.30, jawOpen:0.10 },
  E:    { jawOpen:0.26, mouthStretchLeft:0.52, mouthStretchRight:0.52,
          mouthSmileLeft:0.18, mouthSmileRight:0.18 },
  AI:   { jawOpen:0.62, mouthStretchLeft:0.22, mouthStretchRight:0.22 },
  O:    { jawOpen:0.44, mouthFunnel:0.62, mouthPucker:0.22 },
  U:    { jawOpen:0.18, mouthPucker:0.68, mouthFunnel:0.38 },
  WQ:   { jawOpen:0.12, mouthPucker:0.90, mouthFunnel:0.30 },
  L:    { jawOpen:0.34, tongueOut:0.32, mouthStretchLeft:0.14, mouthStretchRight:0.14 },
  etc:  { jawOpen:0.22, mouthStretchLeft:0.20, mouthStretchRight:0.20 }
};
/* Reallusion ships its own viseme set on CC meshes, and it is better than
   anything we can build out of ARKit parts. V_Open, V_Tight_O, V_Wide and the
   rest are sculpted phoneme shapes -- one shape per mouth position, made by
   people who do this for a living. The ARKit rig above has to reconstruct a
   vowel from a jaw angle plus a pucker plus two stretches and hope they add up.

   It also sidesteps a real trap. This mesh has no plain Mouth_Funnel or
   Mouth_Pucker, only the four corner variants of each, so the ARKit rig drives
   O and U off Mouth_Funnel_Up_L alone -- one corner of four. Which does not
   look like a bug. It looks like a bad mesh. */
const VIS_RIG_CC = {
  rest: {},
  /* V_Explosive alone does not close a mouth. Measured against every shape on
     the CC mesh it has the smallest displacement of all 46 -- 0.03 against
     Mouth_Close's 0.30. It is a refinement to a closure, not the closure. So
     press the lips with the shape that actually moves them. Mouth_Close at 1.0
     curls the mouth into a smile; 0.6 with a little press is where it reads as
     lips pushed together. */
  MBP:  { V_Explosive: 1.00, Mouth_Close: 0.60, Mouth_Press_L: 0.40, Mouth_Press_R: 0.40 },
  FV:   { V_Dental_Lip: 1.00 },
  E:    { V_Wide: 0.88 },
  AI:   { V_Open: 0.90, V_Lip_Open: 0.35 },
  O:    { V_Tight_O: 0.92 },
  U:    { V_Tight_O: 0.55, V_Tight: 0.60 },
  WQ:   { V_Tight: 0.95 },
  L:    { V_Lip_Open: 0.50, V_Tongue_Raise: 0.70, V_Tongue_Out: 0.20 },
  etc:  { V_Affricate: 0.80 }
};
/* The eight, for a mesh sculpted on purpose.

   This is the set to author if you are sculpting shapes yourself rather than
   inheriting a rig: one shape per mouth position, and nothing else. Reallusion
   arrived at almost exactly this list independently, which is a decent sign it
   is the right size. Sixty shapes exist to drive a whole face -- brows, eyes,
   cheeks, emotions. A mouth needs eight.

   Sculpt them with the JAW SHUT. These are lip shapes; the bone does the
   opening, and it takes the teeth and tongue with it, which no morph can. If
   you sculpt the jaw open into viseme_AI as well you will get twice the drop.
   VIS_JAW below is what says how far the jaw goes for each one.

   WQ reuses U, and rest is the neutral mesh, so eight shapes cover all ten. */
const VIS_RIG_MIN = {
  rest: {},
  MBP:  { viseme_MBP: 1.0 },
  FV:   { viseme_FV: 1.0 },
  E:    { viseme_E: 1.0 },
  AI:   { viseme_AI: 1.0 },
  O:    { viseme_O: 1.0 },
  U:    { viseme_U: 1.0 },
  WQ:   { viseme_U: 1.0 },
  L:    { viseme_L: 1.0 },
  etc:  { viseme_etc: 1.0 }
};

let RIG = VIS_RIG;
let rigName = "";
let GAIN = 1.0;

/* The jaw is a bone, not a shape.

   On this CC export Jaw_Open exists as a blend shape and moves 4872 vertices,
   but the mouth does not open: the shape only tidies the lips and cheeks
   around a jaw that something else is supposed to swing. That something is
   CC_Base_JawRoot. Drive the shapes without the bone and the character mumbles
   with its mouth shut.

   Axis and sign were measured, not assumed -- the model came through Cinema 4D
   and Blender and either could have flipped them. Rotating the bone 21 degrees
   each way about each of its local axes and watching where the chin ended up,
   local Z is the hinge; the other two swing it sideways. */
const JAW = { axis: "z", sign: 1, deg: 21 };   // 21 = your -90 rest to -111 open
const JAW_AXIS = { x: new THREE.Vector3(1,0,0), y: new THREE.Vector3(0,1,0),
                   z: new THREE.Vector3(0,0,1) };
let jawBone = null, jawRest = null, jawNow = 0, jawWant = 0;

// how far each shape drops the jaw, 0..1 of JAW.deg
const VIS_JAW = { rest:0.02, MBP:0, FV:0.06, E:0.30, AI:0.85, O:0.55, U:0.22,
                  WQ:0.14, L:0.45, etc:0.28 };

/* ---- scene ---- */
const canvas = $("view");
const R = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
R.setPixelRatio(Math.min(2, devicePixelRatio || 1));
R.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x08090b);
const pmrem = new THREE.PMREMGenerator(R);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const cam = new THREE.PerspectiveCamera(28, 1, 0.01, 500);
const key = new THREE.DirectionalLight(0xffffff, 2.4); key.position.set(-3, 3.5, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0xc9d8ff, 1.1); rim.position.set(4, 2, -5); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.12));
// the room environment alone lights a clay head almost perfectly evenly, and
// an evenly lit mouth has no readable shape at all -- keep it as fill only
scene.environmentIntensity = 0.3;
const root = new THREE.Group(); scene.add(root);

let model = null, meshes = [], mapped = null, headBox = null, fullBox = null, zoomed = 1;

function resize() {
  const w = innerWidth, h = innerHeight;
  R.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();

/* Framing a head without being told where the head is, on a rig you have never
   seen. Two things went wrong before this, both worth writing down.

   Box3.setFromObject is useless on a skinned mesh. It reports the bind-pose
   geometry box transformed by matrixWorld -- but skinning places vertices from
   the bone matrices, and bindMatrix/bindMatrixInverse absorb any scale
   difference. On the CC export that box read 178 units tall while the character
   is 1.63. Everything measured off it was wrong.

   And nothing says a model is Y-up. This one stands along +Z, so the first
   version dutifully framed the top of the Y axis and found the feet.

   The skeleton has neither problem. Bone world positions are real, correctly
   scaled, and tell you which way is up: the vector from the hips to the head is
   up, by definition, whatever the file thinks. So: stand the model up from its
   own bones, turn it to face the camera, and frame the head from the spread of
   the bones inside the head. No axis conventions assumed anywhere. */

const rx = (re) => (o) => re.test(o.name || "");
function findBone(sk, re, skip) {
  return sk && sk.bones.find((b) => re.test(b.name) && !(skip && skip.test(b.name)));
}
function boneBox(root) {
  const bb = new THREE.Box3(), v = new THREE.Vector3();
  root.traverse((o) => { if (o.isBone) bb.expandByPoint(o.getWorldPosition(v.clone())); });
  return bb;
}

let skel = null, headBoneRef = null;

/* Rotate the model so up is +Y and the face looks down +Z. Returns what it did,
   because when this guesses wrong you want to be told, not left wondering why
   you are looking at an ear. */
function standUp(model) {
  if (!skel) return "no skeleton -- orientation left alone";
  const head = findBone(skel, /head/i, /(end|tip|top)$/i);
  const hip = findBone(skel, /hip|pelvis|spine|root/i) || skel.bones[0];
  headBoneRef = head;
  if (!head || !hip) return "no head or hip bone -- orientation left alone";

  const up = head.getWorldPosition(new THREE.Vector3())
    .sub(hip.getWorldPosition(new THREE.Vector3()));
  if (up.lengthSq() < 1e-12) return "head and hip are in the same place -- left alone";
  up.normalize();
  const q = new THREE.Quaternion().setFromUnitVectors(up, new THREE.Vector3(0, 1, 0));
  model.quaternion.premultiply(q);
  model.updateMatrixWorld(true);

  // Which way is the face? The jaw, teeth and tongue sit in front of the middle
  // of the skull, so their average points out through the mouth.
  const hp = head.getWorldPosition(new THREE.Vector3());
  const fwd = new THREE.Vector3(); let n = 0;
  head.traverse((o) => {
    if (o.isBone && /jaw|teeth|tongue|nose|lip/i.test(o.name)) {
      fwd.add(o.getWorldPosition(new THREE.Vector3()).sub(hp)); n++;
    }
  });
  let facing = "face direction unknown, not turned";
  if (n) {
    fwd.y = 0;
    if (fwd.lengthSq() > 1e-12) {
      fwd.normalize();
      const yaw = Math.atan2(fwd.x, fwd.z);          // rotate fwd onto +Z
      model.rotateY(-yaw);
      model.updateMatrixWorld(true);
      facing = "turned " + Math.round(-yaw * 180 / Math.PI) + "deg to face front";
    }
  }
  return "stood up from " + head.name + " over " + hip.name + "; " + facing;
}

function headSpan() {
  // The bones inside the head span roughly the head: jaw and teeth at the
  // front and bottom, eyes and the skull tip at the top and back.
  if (headBoneRef) {
    const bb = boneBox(headBoneRef);
    if (!bb.isEmpty()) {
      const s = new THREE.Vector3(), c = new THREE.Vector3();
      bb.getSize(s); bb.getCenter(c);
      // the bones stop at the jaw and eyes; the skull carries on past them
      const span = Math.max(s.x, s.y, s.z) * 2.3;
      if (span > 1e-6) {
        line("framing on the bones inside " + headBoneRef.name
             + " (head about " + span.toFixed(3) + " across)");
        return { span, x: c.x, top: c.y + span * 0.5, z: c.z };
      }
    }
    // a head bone with nothing inside it: fall back to human proportion
    const all = boneBox(skel.bones[0]);
    const s = new THREE.Vector3(); all.getSize(s);
    const p = headBoneRef.getWorldPosition(new THREE.Vector3());
    const span = s.y / 7.5;
    line("no bones inside " + headBoneRef.name + " -- guessing a head "
         + span.toFixed(3) + " tall from a " + s.y.toFixed(2) + " figure");
    return { span, x: p.x, top: p.y + span * 0.75, z: p.z };
  }
  const size = new THREE.Vector3(), ctr = new THREE.Vector3();
  fullBox.getSize(size); fullBox.getCenter(ctr);
  const wide = Math.max(size.x, size.z);
  if (size.y > wide * 1.8) {
    line("no skeleton; framing by proportion, " + size.y.toFixed(2) + " tall vs " + wide.toFixed(2) + " wide");
    return { span: size.y * 0.18, x: ctr.x, z: ctr.z, top: fullBox.max.y };
  }
  line("no skeleton; framing the whole model");
  return { span: size.y, x: ctr.x, z: ctr.z, top: fullBox.max.y };
}

/* Orbit. An unknown export can arrive facing any direction, and a mesh whose
   back is to the camera looks exactly like a mesh that is not working. Drag
   also earns its keep on the shapes themselves: pucker and funnel barely read
   head-on and are obvious from the side. */
const camTgt = new THREE.Vector3();
let camDist = 1, yaw = 0, pitch = 0, zoomF = 1;

function place() {
  const d = camDist * zoomF;
  const cp = Math.cos(pitch);
  cam.position.set(camTgt.x + Math.sin(yaw) * cp * d,
                   camTgt.y + Math.sin(pitch) * d,
                   camTgt.z + Math.cos(yaw) * cp * d);
  cam.lookAt(camTgt);
  cam.near = Math.max(0.0005, d * 0.02); cam.far = d * 60;
  cam.updateProjectionMatrix();
}

function frame(head) {
  if (!fullBox) return;
  let span;
  if (head) {
    const h = headSpan();
    span = h.span;
    camTgt.set(h.x, h.top - span * 0.58, h.z);
  } else if (skel) {
    const bb = boneBox(skel.bones[0]);
    const s = new THREE.Vector3(), c = new THREE.Vector3();
    bb.getSize(s); bb.getCenter(c);
    span = Math.max(s.x, s.y) * 1.1; camTgt.copy(c);
  } else {
    const s = new THREE.Vector3(), c = new THREE.Vector3();
    fullBox.getSize(s); fullBox.getCenter(c);
    span = Math.max(s.x, s.y); camTgt.copy(c);
  }
  camDist = (span * 0.5) / Math.tan((cam.fov * Math.PI / 180) / 2) * 1.45;
  place();
}

let drag = null;
canvas.addEventListener("pointerdown", (e) => {
  drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  if (!drag) return;
  yaw -= (e.clientX - drag.x) * 0.006;
  pitch = Math.max(-0.9, Math.min(0.9, pitch + (e.clientY - drag.y) * 0.005));
  drag.x = e.clientX; drag.y = e.clientY;
  place();
});
const stop = () => { drag = null; };
canvas.addEventListener("pointerup", stop);
canvas.addEventListener("pointercancel", stop);
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  zoomF = Math.max(0.25, Math.min(4, zoomF * (1 + Math.sign(e.deltaY) * 0.1)));
  place();
}, { passive: false });

const canon = (x) => x.toLowerCase().replace(/[^a-z]/g,"").replace(/left$/,"l").replace(/right$/,"r");
function buildMap() {
  const want = new Set();
  for (const sh in RIG) for (const k in RIG[sh]) want.add(k);
  const per = [];
  let total = 0;
  for (const m of meshes) {
    const dict = m.morphTargetDictionary || {};
    const keys = Object.keys(dict);
    total += keys.length;
    const ck = keys.map(canon), map = {};
    for (const w of want) {
      const cw = canon(w);
      let i = ck.indexOf(cw);
      // Several shapes can contain the name we want: CC ships Mouth_Funnel_Up_L
      // and Mouth_Funnel_Down_L next to plain Mouth_Funnel. Taking the first
      // match drove O and U off a corner variant -- which does not look like a
      // bug, it looks like the mesh has bad shapes. Shortest name wins: that is
      // the plain shape, and the longer ones are always the variants.
      if (i < 0) for (let j = 0; j < ck.length; j++)
        if (ck[j].includes(cw) && (i < 0 || ck[j].length < ck[i].length)) i = j;
      if (i >= 0) map[w] = dict[keys[i]];
    }
    per.push({ mesh: m, map });
  }
  mapped = per;
  const found = new Set();
  per.forEach((p) => Object.keys(p.map).forEach((k) => found.add(k)));
  const missing = [...want].filter((w) => !found.has(w));
  return { total, found: found.size, want: want.size, missing };
}

async function load(file) {
  say("loading " + file + "…");
  let g;
  try {
    g = await new Promise((res, rej) => GLTF.load("models/" + file, res, null, rej));
  } catch (e) {
    say("could not load models/" + file + " — " + (e.message || e), "bad");
    return;
  }
  try {
    if (model) root.remove(model);
    model = g.scene; meshes = [];
    /* An export stripped of textures has no materials at all, and three.js
       hands those meshes default white -- which blows out under any decent key
       light and hides the one thing we are here to look at. Clay instead. */
    const clay = new THREE.MeshStandardMaterial({
      color: 0xb9b2ab, roughness: 0.72, metalness: 0.0 });
    let fixedNormals = 0;
    model.traverse((o) => {
      if (o.isMesh || o.isSkinnedMesh) {
        o.frustumCulled = false;
        /* An export stripped for size can come with no NORMAL attribute at all.
           glTF says to treat that as flat shading, and GLTFLoader duly sets
           flatShading on the material it builds -- so replacing the material
           throws that away and every surface lights as though it faced the
           camera. A whole face disappears and it looks like the wrong side of
           the head. Compute real normals instead: smooth reads far better on a
           mouth than facets do, and it survives us swapping the material.

           The morph targets carry POSITION only, so these normals do not follow
           the deformation. The shape is right; the shading inside a wide-open
           mouth is slightly stale. That is the correct trade here. */
        if (o.geometry && !o.geometry.attributes.normal) {
          o.geometry.computeVertexNormals(); fixedNormals++;
        }
        const m = o.material;
        const plain = !m || (Array.isArray(m) ? false : !m.map && !m.normalMap);
        if (plain) o.material = clay;
        if (o.morphTargetInfluences && o.morphTargetInfluences.length) meshes.push(o);
      }
    });
    if (dots) { root.remove(dots); dots.geometry.dispose(); dots = null; }
    if (DOTS.on) setTimeout(() => dotsSet(true), 0);
    if (wire) model.traverse((o) => {
      if (!o.isMesh && !o.isSkinnedMesh) return;
      for (const m of (Array.isArray(o.material) ? o.material : [o.material]))
        if (m) m.wireframe = true;
    });
    if (fixedNormals) line("no NORMAL attribute on " + fixedNormals
      + " mesh(es) -- computed them, or everything would light dead flat");
    skel = null; headBoneRef = null; jawBone = null; jawRest = null; jawNow = 0;
    model.traverse((o) => { if (o.isSkinnedMesh && o.skeleton && !skel) skel = o.skeleton; });
    if (skel) {
      jawBone = findBone(skel, /jaw/i, /upper/i);
      if (jawBone) { jawRest = jawBone.quaternion.clone(); line("jaw bone: " + jawBone.name); }
      else line("no jaw bone -- the mouth can only open as far as the shapes take it");
    }
    root.add(model);
    model.updateMatrixWorld(true);
    line(standUp(model));
    fullBox = new THREE.Box3().setFromObject(model);
    frame(zoomed);
    if (!meshes.length) {
      const names = [];
      model.traverse((o) => { if (o.isMesh || o.isSkinnedMesh) names.push(o.name || "(unnamed)"); });
      say(file + " has NO blend shapes — nothing here can move a mouth. Meshes "
        + "found: " + (names.join(", ") || "none") + ". Re-export with morph "
        + "targets enabled (in Character Creator that is the Expression / "
        + "Blend Shape option; in Blender, Shape Keys).", "bad");
      buildSliders([]);
      return;
    }
    /* Which vocabulary does this mesh speak? Purpose-sculpted eight first, then
       Reallusion's visemes, then ARKit parts -- best fit to worst. */
    const have = new Set();
    meshes.forEach((m) => Object.keys(m.morphTargetDictionary || {})
      .forEach((k) => have.add(canon(k))));
    const score = (rig) => {
      const want = new Set();
      for (const sh in rig) for (const k in rig[sh]) want.add(canon(k));
      let hit = 0;
      for (const w of want) if ([...have].some((h) => h === w || h.includes(w))) hit++;
      return { hit, of: want.size };
    };
    const sMin = score(VIS_RIG_MIN), sCC = score(VIS_RIG_CC), sAR = score(VIS_RIG);
    if (sMin.hit >= sMin.of - 1) { RIG = VIS_RIG_MIN; rigName = "the eight"; }
    else if (sCC.hit >= sCC.of - 2) { RIG = VIS_RIG_CC; rigName = "Character Creator visemes"; }
    else { RIG = VIS_RIG; rigName = "ARKit shapes"; }
    line("rig: " + rigName + "  (sculpted " + sMin.hit + "/" + sMin.of
         + ", CC " + sCC.hit + "/" + sCC.of + ", ARKit " + sAR.hit + "/" + sAR.of + ")");

    const r = buildMap();
    buildSliders(r);
    if (!r.found) {
      say(file + ": " + r.total + " blend shapes, but none of them are named like "
        + "ARKit. Open `shapes` to see what is actually in there.", "warn");
    } else if (r.missing.length) {
      say(file + ": " + r.total + " shapes, " + r.found + " of " + r.want
        + " mapped. Missing " + r.missing.join(", "), "warn");
    } else {
      say(file + ": " + r.total + " shapes, all " + r.want + " mapped via "
          + rigName + ". Say something.", "ok");
    }
    if (RIG !== VIS_RIG_MIN && r.missing.length) {
      const eight = [];
      for (const sh in VIS_RIG_MIN) for (const k in VIS_RIG_MIN[sh])
        if (!eight.includes(k)) eight.push(k);
      line("sculpting your own? Author exactly these eight, jaw shut, and this "
           + "page will find them: " + eight.join(", "));
    }
    line(file + " meshes with morphs: " + meshes.map((m) => m.name).join(", "));
  } catch (e) {
    // the file is fine; we broke. Say so, rather than sending them off to
    // re-export a mesh that was never the problem.
    say(file + " loaded, but reading it went wrong — " + (e.message || e)
      + ". That is a bug on this page, not in your model.", "bad");
    console.error(e);
  }
}

/* Every shape on a slider, so the geometry can be judged with no timing in the
   way. If a vowel looks wrong here it is the sculpt; if it only looks wrong
   while speaking it is the timing. */
function buildSliders(r) {
  const jawRow = () => {
    if (!jawBone) return null;
    const d = document.createElement("div"); d.textContent = "JAW BONE (" + jawBone.name + ")";
    const s = document.createElement("input");
    s.type = "range"; s.min = 0; s.max = 1; s.step = 0.01; s.value = 0;
    s.oninput = () => { manual = true; jawWant = +s.value; };
    d.appendChild(s); return d;
  };
  buildSliders.jawRow = jawRow;
  const box = $("sliders"); box.innerHTML = "";
  const jr = jawRow(); if (jr) box.appendChild(jr);
  const names = new Set();
  meshes.forEach((m) => Object.keys(m.morphTargetDictionary || {}).forEach((k) => names.add(k)));
  if (!names.size) { box.appendChild(Object.assign(document.createElement("div"),
    { textContent: "no blend shapes" })); return; }
  [...names].sort().forEach((n) => {
    const d = document.createElement("div");
    d.textContent = n;
    const s = document.createElement("input");
    s.type = "range"; s.min = 0; s.max = 1; s.step = 0.01; s.value = 0;
    s.oninput = () => {
      manual = true;
      meshes.forEach((m) => {
        const i = (m.morphTargetDictionary || {})[n];
        if (i != null) m.morphTargetInfluences[i] = +s.value;
      });
    };
    d.appendChild(s); box.appendChild(d);
  });
}

/* ---- his face, made of the orb ----

   The particles do not sit at fixed points in space; each one is bound to a
   vertex of the head and recomputed every frame through the same morphs and the
   same skinning the solid mesh uses. So the dots ARE the face: the jaw swings
   and they swing with it, a viseme fires and the ones around the mouth move.

   Which is also the answer to the thing that made sculpting feel expensive.
   The shapes stay on the mesh, and the mesh can be invisible -- the particles
   only need somewhere to live. Any character with a head becomes a Glorb by
   pointing this at it.

   Bound to vertices rather than sampled across triangles on purpose. A vertex
   already carries its skin weights and its morph deltas, so following it is a
   lookup; a point on a triangle would have to interpolate all of that every
   frame for no visible gain at this density. */
const DOTS = {
  /* Particles are cheap; the vertices under them are not. The expensive part
     is pushing a vertex through its morphs and bones, and that happens once per
     vertex any particle touches -- so raising this spreads dots over MORE
     distinct triangles and quietly buys more deform work. 9000 cost 4.2ms here
     against 7000's 3.1, for a difference nobody can see. */
  want: 7000,
  size: 0.0040,    // world units, so it scales with the model
  ease: 0.26,      // how hard a dot settles onto its spot. 1 = welded, 0 = ignores it
  drift: 0.0013,   // how far it floats off the skin, so the surface breathes
  lag: 0.55,       // spread in settling speed, so they do not move as one sheet
  /* Where the detail goes. 1 spreads dots by area, perfectly even, and a face
     lit that way is a uniform cloud with no face in it. 0 gives every triangle
     the same number regardless of size -- which is what sitting on the vertices
     did, and why that version read: a modeller puts triangles where the detail
     is, so eyes and lips came out dense and cheeks sparse. That density WAS the
     drawing. Between the two you get even coverage that still thickens where
     the face is interesting. */
  detail: 0.45,
};
let dots = null, dotSrc = [], dotPhase = null, dotLag = null;
/* Grazing, and from the side. A face is a shallow relief: light it from near
   the camera and every dot comes back the same brightness, which is how the
   first lit version still looked like a blob. Rake it across from the left and
   the nose ridge, the lip line and the brow all cast, which is what draws the
   face. */
const LX = -0.79, LY = 0.33, LZ = 0.52;
const _dv = new THREE.Vector3();

function dotSprite() {
  const c = document.createElement("canvas"); c.width = c.height = 64;
  const x = c.getContext("2d");
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0, "rgba(255,255,255,1)");
  g.addColorStop(0.35, "rgba(190,255,215,0.75)");
  g.addColorStop(1, "rgba(140,240,180,0)");
  x.fillStyle = g; x.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* Which vertices are the face? The rig already knows. Anything weighted mostly
   to the head, jaw, tongue or teeth is the head; everything below the neck is
   not. No coordinates, no guessing where a face is on an unfamiliar mesh. */
function faceVerts(mesh) {
  const want = new Set();
  mesh.skeleton.bones.forEach((b, i) => {
    if (/head|jaw|tongue|teeth|eye|nose|lip|cheek|brow/i.test(b.name)
        && !/neck/i.test(b.name)) want.add(i);
  });
  const si = mesh.geometry.attributes.skinIndex, sw = mesh.geometry.attributes.skinWeight;
  if (!si || !sw) return null;
  const out = new Set(), C = ["getX", "getY", "getZ", "getW"];
  for (let i = 0; i < si.count; i++) {
    let w = 0;
    for (const c of C) if (want.has(si[c](i))) w += sw[c](i);
    if (w > 0.6) out.add(i);
  }
  return out;
}

// a fixed sequence, so the same face comes back the same way every reload
let _seed = 0x2f6e2b1;
const rnd = () => (_seed = (_seed * 1664525 + 1013904223) >>> 0) / 4294967296;

function dotsBuild() {
  if (dots) { root.remove(dots); dots.geometry.dispose(); dots = null; }
  dotSrc = [];
  if (!model) return "no model";
  _seed = 0x2f6e2b1;

  /* Scattered across the SURFACE, not sat on the vertices.

     Vertices are where the modeller needed detail, not where you want light --
     packed around the eyes and lips, stretched thin over a cheek. Sampling the
     triangles instead, weighted by area, spreads them evenly and unhooks the
     particle count from the mesh entirely: 9000 dots on a 14k mesh, or on a 2k
     one, and it looks the same.

     It is also barely more expensive, which is not obvious. The costly part is
     pushing a vertex through sixty morph targets and four bones -- so that
     happens ONCE per vertex per frame, into a scratch buffer, and each particle
     is then three multiply-adds against its triangle's three corners. Deform
     count is set by the mesh; particle count is nearly free on top. */
  const found = [];
  const v = new THREE.Vector3();
  model.traverse((o) => {
    if (!o.isSkinnedMesh) return;
    const face = faceVerts(o);
    if (!face || !face.size) return;
    const geo = o.geometry, pos = geo.attributes.position, ix = geo.index;
    const nTri = (ix ? ix.count : pos.count) / 3;
    const tri = [], area = [];
    const A = new THREE.Vector3(), B = new THREE.Vector3(), C = new THREE.Vector3();
    for (let t = 0; t < nTri; t++) {
      const a = ix ? ix.getX(t * 3) : t * 3;
      const b = ix ? ix.getX(t * 3 + 1) : t * 3 + 1;
      const c = ix ? ix.getX(t * 3 + 2) : t * 3 + 2;
      if (!face.has(a) || !face.has(b) || !face.has(c)) continue;
      A.fromBufferAttribute(pos, a); B.fromBufferAttribute(pos, b); C.fromBufferAttribute(pos, c);
      B.sub(A); C.sub(A);
      tri.push(a, b, c);
      area.push(Math.pow(B.cross(C).length() * 0.5, DOTS.detail));
    }
    if (!tri.length) return;
    // share BETWEEN meshes still goes by true area, whatever the detail bias is
    let real = 0;
    for (let t = 0; t < tri.length; t += 3) {
      A.fromBufferAttribute(pos, tri[t]); B.fromBufferAttribute(pos, tri[t + 1]);
      C.fromBufferAttribute(pos, tri[t + 2]);
      real += B.sub(A).cross(C.sub(A)).length() * 0.5;
    }
    found.push({ mesh: o, tri, area, room: real });
  });
  if (!found.length) return "no skinned head found -- dots need a rig";

  /* Shared out by SURFACE AREA, which is the only measure that means anything
     here -- particles cover a surface, so the amount of surface is the amount
     you need. Counting vertices hands the teeth more dots than the entire face
     (6362 of them, all weighted to teeth bones) and builds a set of floating
     dentures. Bounding boxes are not much better: they made the tongue, which
     is mostly a hidden nub, worth a sixth of the whole head. Area is already
     sitting there from the triangle weighting. */
  const total = found.reduce((a, f) => a + f.room, 0);
  let n = 0;
  for (const f of found) {
    const share = Math.max(40, Math.round(DOTS.want * f.room / total));
    const nTri = f.area.length;
    const cum = new Float64Array(nTri);
    let run = 0;
    for (let i = 0; i < nTri; i++) { run += f.area[i]; cum[i] = run; }

    const slot = new Map(), vi = [];
    const local = (g) => {
      let k = slot.get(g);
      if (k === undefined) { k = vi.length; slot.set(g, k); vi.push(g); }
      return k;
    };
    const tri = new Int32Array(share * 3), bary = new Float32Array(share * 3);
    for (let p = 0; p < share; p++) {
      // stratified, so they cover the face rather than clumping by luck
      const target = run * (p + rnd()) / share;
      let lo = 0, hi = nTri - 1;
      while (lo < hi) { const m = (lo + hi) >> 1; if (cum[m] < target) lo = m + 1; else hi = m; }
      // uniform inside the triangle: the sqrt is what stops them piling into a corner
      let u = rnd(), w = rnd();
      const su = Math.sqrt(u);
      const b0 = 1 - su, b1 = su * (1 - w), b2 = su * w;
      tri[p * 3]     = local(f.tri[lo * 3]);
      tri[p * 3 + 1] = local(f.tri[lo * 3 + 1]);
      tri[p * 3 + 2] = local(f.tri[lo * 3 + 2]);
      bary[p * 3] = b0; bary[p * 3 + 1] = b1; bary[p * 3 + 2] = b2;
    }
    dotSrc.push({ mesh: f.mesh, vi: Int32Array.from(vi),
                  dv: new Float32Array(vi.length * 3), tri, bary, at: n, count: share });
    n += share;
  }

  dotPhase = new Float32Array(n);
  dotLag = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    dotPhase[i] = (i * 2.399963) % 6.283185;            // golden angle
    dotLag[i] = 1 - DOTS.lag * rnd();                   // some settle later than others
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute("color", new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  dots = new THREE.Points(g, new THREE.PointsMaterial({
    map: dotSprite(), size: DOTS.size, sizeAttenuation: true,
    transparent: true, depthWrite: false, depthTest: true, vertexColors: true,
    blending: THREE.AdditiveBlending, opacity: 1.0 }));
  dots.frustumCulled = false;
  root.add(dots);
  dotsFrame(1e6);         // one huge step so they start on the face, not at the origin
  return n + " dots: " + dotSrc.map((d) => d.count + " over " + d.vi.length
    + " verts of " + d.mesh.name).join(", ");
}

/* Timed, and reported once, because the honest answer to "will this run on a
   phone" is a number measured on a phone. A software rasteriser in a container
   says nothing: with the mesh drawing depth only, the whole frame actually got
   FASTER with the particles on, which measures the renderer, not this loop. */
let dotMs = 0, dotN = 0;
function dotsFrame(dt) {
  if (!dots || !dotSrc.length) return;
  const t0 = performance.now();
  const arr = dots.geometry.attributes.position.array;
  const cols = dots.geometry.attributes.color.array;
  const kBase = Math.min(1, 1 - Math.pow(1 - DOTS.ease, dt / 16.67));
  const t = performance.now() * 0.001, d = DOTS.drift;

  for (const src of dotSrc) {
    const mesh = src.mesh, geo = mesh.geometry, pos = geo.attributes.position;
    const mt = geo.morphAttributes.position || [];
    const infl = mesh.morphTargetInfluences || [];
    const rel = geo.morphTargetsRelative;
    // only the handful of shapes actually on right now, not all sixty
    const act = [];
    for (let i = 0; i < infl.length; i++) if (infl[i] > 0.002 && mt[i]) act.push(mt[i], infl[i]);
    const mw = mesh.matrixWorld, vi = src.vi, dv = src.dv;

    // once per vertex: morph, skin, into world
    for (let k = 0; k < vi.length; k++) {
      const i = vi[k];
      _dv.fromBufferAttribute(pos, i);
      for (let a = 0; a < act.length; a += 2) {
        const at = act[a], w = act[a + 1];
        if (rel) { _dv.x += at.getX(i) * w; _dv.y += at.getY(i) * w; _dv.z += at.getZ(i) * w; }
        else {
          _dv.x += (at.getX(i) - pos.getX(i)) * w;
          _dv.y += (at.getY(i) - pos.getY(i)) * w;
          _dv.z += (at.getZ(i) - pos.getZ(i)) * w;
        }
      }
      mesh.applyBoneTransform(i, _dv);
      _dv.applyMatrix4(mw);
      const o = k * 3;
      dv[o] = _dv.x; dv[o + 1] = _dv.y; dv[o + 2] = _dv.z;
    }

    // once per particle: three multiply-adds against its triangle, then light it
    const tri = src.tri, bary = src.bary;
    for (let p = 0; p < src.count; p++) {
      const q = p * 3;
      const a = tri[q] * 3, b = tri[q + 1] * 3, c = tri[q + 2] * 3;
      const w0 = bary[q], w1 = bary[q + 1], w2 = bary[q + 2];
      const g = src.at + p, ph = dotPhase[g], o = g * 3;
      const k = Math.min(1, kBase * dotLag[g]);
      const tx = dv[a] * w0 + dv[b] * w1 + dv[c] * w2 + Math.sin(t * 1.7 + ph) * d;
      const ty = dv[a + 1] * w0 + dv[b + 1] * w1 + dv[c + 1] * w2 + Math.sin(t * 2.3 + ph * 1.7) * d;
      const tz = dv[a + 2] * w0 + dv[b + 2] * w1 + dv[c + 2] * w2 + Math.sin(t * 1.3 + ph * 2.9) * d;
      arr[o]     += (tx - arr[o]) * k;
      arr[o + 1] += (ty - arr[o + 1]) * k;
      arr[o + 2] += (tz - arr[o + 2]) * k;

      /* Every dot the same brightness gives you an evenly lit blob with no
         face in it. The old version read only because vertices clump at the
         eyes and lips -- that was the mesh's topology doing the drawing, not
         us. Spread them evenly and the features vanish.

         So light them. The triangle's three deformed corners give a normal for
         free, and a lambert term against the key plus a rim term brings the
         nose, the lips and the sockets straight back -- from shape this time,
         which is what was wanted. */
      const e1x = dv[b] - dv[a], e1y = dv[b + 1] - dv[a + 1], e1z = dv[b + 2] - dv[a + 2];
      const e2x = dv[c] - dv[a], e2y = dv[c + 1] - dv[a + 1], e2z = dv[c + 2] - dv[a + 2];
      let nx = e1y * e2z - e1z * e2y, ny = e1z * e2x - e1x * e2z, nz = e1x * e2y - e1y * e2x;
      const nl = Math.hypot(nx, ny, nz) || 1;
      nx /= nl; ny /= nl; nz /= nl;
      const lam = nx * LX + ny * LY + nz * LZ;
      const face = Math.abs(nz);                      // 1 head-on, 0 at the silhouette
      /* Measured before tuned: the first lit version spanned 0.05..1.44 with a
         mean of 0.42, so the normals were fine all along -- most of the face
         was simply too dim to survive additive blending on black. Lift the
         floor so an unlit dot still reads as skin, and keep the gain high
         enough that a raked highlight still separates from it. */
      const lit = Math.max(0, lam);
      const b0 = 0.26 + 1.15 * Math.pow(lit, 1.3) + 0.30 * (1 - face) * (1 - face);
      cols[o]     = b0 * 0.70;
      cols[o + 1] = b0 * 1.00;
      cols[o + 2] = b0 * 0.80;
    }
  }
  dots.geometry.attributes.position.needsUpdate = true;
  dots.geometry.attributes.color.needsUpdate = true;
  dotMs += performance.now() - t0;
  if (++dotN === 90) {
    line("dots: " + (dotMs / dotN).toFixed(2) + " ms a frame to move "
         + dots.geometry.attributes.position.count + " of them"
         + (dotMs / dotN > 6 ? "  -- heavy; lower DOTS.want" : ""));
    dotMs = 0; dotN = 0;
  }
}

/* The head has to keep hiding its own back.

   Hiding the mesh entirely and drawing additive points was wrong in a specific
   way: with nothing to occlude them, the teeth glowed straight through closed
   lips as a permanent grin, and the back of the skull showed through the face.
   So the mesh stays, drawing nothing but depth. You see only the particles
   actually facing you, the teeth appear when the jaw opens and not before, and
   it costs one invisible pass. polygonOffset pushes that depth a hair back so
   the dots sitting exactly ON the surface are not eaten by it. */
const DOT_MASK = new THREE.MeshBasicMaterial({
  colorWrite: false, polygonOffset: true,
  polygonOffsetFactor: 4, polygonOffsetUnits: 4 });

function dotsSet(on) {
  DOTS.on = on;
  if (on && !dots) line(dotsBuild());
  if (dots) dots.visible = on;
  if (model) model.traverse((o) => {
    if (!o.isMesh && !o.isSkinnedMesh) return;
    if (on) {
      if (!o.userData.skin) o.userData.skin = o.material;
      o.material = DOT_MASK;
    } else if (o.userData.skin) {
      o.material = o.userData.skin; o.userData.skin = null;
    }
  });
  $("dots").textContent = on ? "solid" : "dots";
}

/* ---- the timeline, identical in shape to the app's ---- */
const vis = { seq:null, at0:0, dur:0, shape:"rest", marked:0, playing:false };
let manual = false;
const MIN_HOLD = 0.055;
const REST_GAP = 0.12;   // a space shorter than this is not a pause

/* Lips that have met should stay met for a moment. Not real sticky lips --
   that is per-vertex, the lips peeling apart from the centre outward, and it
   needs its own corrective shape. This is the cheap approximation an animator
   would reach for anyway: hold the closure past what the audio strictly says,
   and let it borrow the time from the vowel beside it. A closure that flickers
   for 40ms between two open vowels never reads as a closure at all. */
const MIN_OF = { MBP: 0.085, FV: 0.075 };
const floorOf = (sh) => MIN_OF[sh] || MIN_HOLD;

/* A viseme is never worth deleting.

   The old rule dropped any shape shorter than MIN_HOLD and handed its time to
   whatever came before it. In a real sentence that is catastrophic for short
   words: the "I" in "Hello, I am" is one character, maybe 40ms of audio, with a
   space either side -- so it got absorbed into a rest and the mouth simply did
   not move. "Hello" survived because it is five characters and 400ms. The face
   went dead on exactly the words a face should be most alive on.

   Rests are the compressible thing. A 40ms mouth shape still reads as movement;
   a deleted one reads as a dead face. So: absorb short rests, never short
   visemes, and when a viseme is too brief, borrow the time it needs from a rest
   next to it. Total length is untouched, so the audio stays in sync. */
function tighten(seq) {
  const out = [];
  for (const e of seq) {
    const prev = out[out.length - 1];
    if (e.sh === "rest" && e.t1 - e.t0 < MIN_HOLD && prev) { prev.t1 = e.t1; continue; }
    out.push({ sh: e.sh, t0: e.t0, t1: e.t1 });
  }
  for (let i = 0; i < out.length; i++) {
    const e = out[i];
    const floor = floorOf(e.sh);
    if (e.sh === "rest" || e.t1 - e.t0 >= floor) continue;
    let need = floor - (e.t1 - e.t0);
    // rests give freely; a real shape gives only down to its own floor, and
    // only to a closure, which is the one thing worth stealing a vowel for
    // rests give freely; a real shape gives only down to its own floor, and
    // only to a closure -- the one thing worth stealing part of a vowel for
    const room = (n) => n.sh === "rest" ? Math.max(0, (n.t1 - n.t0) - 0.02)
      : (MIN_OF[e.sh] ? Math.max(0, (n.t1 - n.t0) - floorOf(n.sh)) * 0.5 : 0);
    /* Grow a closure BACKWARDS first. Lips arriving early is anticipation and
       is what real mouths do; lips leaving late is lag, and lag is the thing
       that made the first version of this whole feature look wrong. Anything
       else can grow either way. */
    const back = { n: out[i - 1], take: (g) => { e.t0 -= g; out[i - 1].t1 -= g; } };
    const fwd  = { n: out[i + 1], take: (g) => { e.t1 += g; out[i + 1].t0 += g; } };
    for (const side of (MIN_OF[e.sh] ? [back, fwd] : [fwd, back])) {
      if (need <= 0 || !side.n) continue;
      const give = Math.min(need, room(side.n));
      if (give > 0) { side.take(give); need -= give; }
    }
    // nothing to borrow from: a short shape still beats no shape
  }
  return out.filter((e) => e.t1 > e.t0);
}

function fromMarks(a) {
  const ch = a.characters || [], t0 = a.character_start_times_seconds || [],
        t1 = a.character_end_times_seconds || [];
  if (!ch.length) return null;
  const seq = [];
  for (let i = 0; i < ch.length; i++) {
    const c = String(ch[i]).toLowerCase();
    const a0 = +t0[i], a1 = +(t1[i] != null ? t1[i] : t0[i]);
    if (!(a1 >= a0)) continue;
    let sh;
    if (c >= "a" && c <= "z") sh = VIS_OF[c] || "etc";
    else if (/[.,;:!?]/.test(c)) sh = "rest";
    /* A space inside a phrase is not a pause. Nobody shuts their mouth between
       "I" and "am" -- letting every space close it made him chew the sentence.
       Only a space long enough to be a real gap gets a rest; shorter ones are
       skipped and the shape before simply holds through them. */
    else if (c === " ") { if (a1 - a0 < REST_GAP) continue; sh = "rest"; }
    else continue;
    const last = seq[seq.length - 1];
    if (last && last.sh === sh) last.t1 = a1; else seq.push({ sh, t0:a0, t1:a1 });
  }
  const out = tighten(seq);
  return out.length ? out : null;
}
function fromText(text, dur) {
  const seq = [];
  const push = (sh) => {
    if (seq.length && seq[seq.length-1].sh === sh) seq[seq.length-1].w += VIS_HOLD[sh];
    else seq.push({ sh, w: VIS_HOLD[sh] });
  };
  for (const c of String(text).toLowerCase()) {
    if (c >= "a" && c <= "z") push(VIS_OF[c] || "etc");
    else if (/[.,;:!?]/.test(c)) push("rest");   // punctuation pauses; a space does not
  }
  if (!seq.length) return null;
  let tot = 0; seq.forEach((s) => tot += s.w);
  let acc = 0;
  seq.forEach((s) => { s.t0 = acc; acc += s.w * (dur / tot); s.t1 = acc; });
  return seq;
}

/* ---- voice ---- */
const BRAIN = (() => { try { return localStorage.getItem("orbBrain") || ""; } catch (e) { return ""; } })()
  || "https://orb-brain.colinwillowtree.workers.dev";
let ac = null, src = null;
async function speak(text) {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === "suspended") await ac.resume();
  say("asking for the voice…");
  let res;
  try {
    res = await fetch(new URL("/speak", BRAIN), {
      method:"POST", headers:{ "content-type":"application/json" },
      body: JSON.stringify({ text, marks: 1 })
    });
  } catch (e) { say("could not reach the worker: " + e.message, "bad"); return; }
  if (!res.ok) { say("voice: " + res.status + " " + (await res.text()).slice(0,140), "bad"); return; }
  const ctype = res.headers.get("content-type") || "";
  let raw, marks = null;
  if (/json/i.test(ctype)) {
    const j = await res.json();
    const bin = atob(j.audio_base64 || "");
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    raw = u8.buffer;
    marks = j.normalized_alignment || j.alignment || null;
    line("marks: " + (marks ? (marks.characters || []).length + " characters" : "none in reply"));
  } else { raw = await res.arrayBuffer(); line("no marks — worker returned " + ctype); }

  const buf = await ac.decodeAudioData(raw);
  vis.seq = (marks && fromMarks(marks)) || fromText(text, buf.duration);
  vis.marked = marks ? 1 : 0;
  vis.dur = vis.seq ? vis.seq[vis.seq.length-1].t1 : 0;
  manual = false;
  if (src) { try { src.stop(); } catch (e) {} }
  src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination);
  src.onended = () => { vis.playing = false; };
  vis.at0 = performance.now();      // the clock starts with the first sample
  vis.playing = true;
  src.start();
  say((vis.marked ? "marks · " : "guessed · ") + vis.seq.length + " shapes over "
      + buf.duration.toFixed(2) + "s", vis.marked ? "ok" : "warn");
}

/* ---- per frame ---- */
let last = performance.now();
function tick() {
  requestAnimationFrame(tick);
  const now = performance.now(), dt = Math.min(100, now - last); last = now;
  if (vis.playing && vis.seq) {
    const t = (now - vis.at0) / 1000;
    if (t > vis.dur) vis.shape = "rest";
    else {
      let lo = 0, hi = vis.seq.length - 1;
      while (lo < hi) { const m = (lo+hi)>>1; if (vis.seq[m].t1 < t) lo = m+1; else hi = m; }
      vis.shape = vis.seq[lo].sh;
    }
  } else vis.shape = "rest";
  $("shape").textContent = vis.shape + (vis.marked ? "  ·  marks" : "");

  if (mapped && !manual) {
    const target = RIG[vis.shape] || RIG.rest;
    /* Closing your lips is a movement, not a relaxation.

       The first cut of this opened fast and closed slow, on the reasoning that
       mouths do that. They do -- when relaxing. But an M is an active gesture:
       the lips are driven shut, hard and quickly. Treating it as a decay left
       the jaw 3.7 degrees open at the end of an 80ms M coming out of a vowel,
       and the lips never met.

       So: any commanded shape is reached fast, in both directions. Only the
       drift back to a neutral face is allowed to be lazy. */
    const fast = 1 - Math.pow(1 - 0.50, dt / 16.67);
    const lazy = 1 - Math.pow(1 - 0.28, dt / 16.67);
    const k = vis.shape === "rest" ? lazy : fast;
    for (const p of mapped) for (const name in p.map) {
      const i = p.map[name];
      const wantV = (target[name] || 0) * GAIN;
      p.mesh.morphTargetInfluences[i] += (wantV - p.mesh.morphTargetInfluences[i]) * k;
    }
    if (!manual) jawWant = VIS_JAW[vis.shape] != null ? VIS_JAW[vis.shape] : 0;
  }
  if (jawBone && jawRest) {
    const k = 1 - Math.pow(1 - (vis.shape === "rest" ? 0.28 : 0.50), dt / 16.67);
    jawNow += (jawWant - jawNow) * k;
    jawBone.quaternion.copy(jawRest).multiply(new THREE.Quaternion()
      .setFromAxisAngle(JAW_AXIS[JAW.axis], JAW.sign * jawNow * JAW.deg * Math.PI / 180));
  }
  if (DOTS.on) dotsFrame(dt);
  R.render(scene, cam);
}
tick();

/* ---- wiring ---- */
/* Anything you drop in models/ under one of these names is picked up. The
   probe is last on purpose: it is a synthetic head with hand-made ARKit shapes
   and it exists to answer one question -- when your own mesh will not move, is
   it the mesh or is it this page? Load the probe. If the probe talks, the page
   is fine and the export dropped its blend shapes. */
const CANDIDATES = ["toon_base.glb","toon_base_opt.glb","face.glb","head.glb","cc_base.glb","cc_tune.glb","tune.glb",
                    "base.glb","colin_face.glb","test_head.glb","colin_slim.glb",
                    "_probe.glb", "_probe8.glb"];
const sel = $("model");
CANDIDATES.forEach((c) => { const o = document.createElement("option");
  o.value = c; o.textContent = c; o.dataset.name = c; sel.appendChild(o); });
sel.onchange = () => load(sel.value);
$("go").onclick = () => speak($("say").value.trim() || "Hello.");
$("say").addEventListener("keydown", (e) => { if (e.key === "Enter") $("go").click(); });
// doubles as the way out of a bad orbit, so it resets the drag too
$("zoom").onclick = () => { zoomed = !zoomed; yaw = pitch = 0; zoomF = 1;
  frame(zoomed); $("zoom").textContent = zoomed ? "head" : "all"; };
/* Run the timeline with no voice at all. The shapes and their order are the
   whole question here; the audio only decides when. Being able to see the
   mouth move before a voice key exists is the difference between "the mesh is
   wrong" and "the timing is wrong", and it costs nothing to ask. */
$("mime").onclick = () => {
  if (!mapped) { say("load a model with blend shapes first.", "warn"); return; }
  const text = $("say").value.trim() || "Hello.";
  vis.seq = fromText(text, Math.max(1.2, text.length * 0.07));
  vis.marked = 0;
  vis.dur = vis.seq[vis.seq.length - 1].t1;
  manual = false; vis.at0 = performance.now(); vis.playing = true;
  setTimeout(() => { vis.playing = false; }, vis.dur * 1000 + 200);
  say("mime · " + vis.seq.length + " shapes over " + vis.dur.toFixed(2)
      + "s, no audio. Timing is a guess; the shapes are real.", "warn");
};
$("pose").onclick = () => { $("sliders").classList.toggle("on");
  if (!$("sliders").classList.contains("on")) manual = false; };
/* Wireframe. Shading is a proxy for geometry and a bad one -- an export with no
   normals lights dead flat and reads as the wrong side of the head. Wireframe
   is not a proxy for anything: if the polygons are there you see them, whatever
   the material is doing. Should have been the first thing on this page. */
let wire = false;
$("wire").onclick = () => {
  wire = !wire;
  if (model) model.traverse((o) => {
    if (!o.isMesh && !o.isSkinnedMesh) return;
    for (const m of (Array.isArray(o.material) ? o.material : [o.material]))
      if (m) m.wireframe = wire;
  });
  $("wire").textContent = wire ? "solid" : "wire";
};
$("dots").onclick = () => dotsSet(!DOTS.on);
$("dbg").onclick = () => logEl.classList.toggle("on");

/* Try each candidate until one loads, so whatever it ends up being called just
   works -- and say which names were tried if none of them do. */
(async () => {
  const here = [];
  await Promise.all(CANDIDATES.map(async (c, i) => {
    let ok = false;
    try { ok = (await fetch("models/" + c, { method:"HEAD" })).ok; } catch (e) {}
    const o = sel.options[i];
    if (ok) here[i] = c; else { o.textContent = c + " — not there"; o.disabled = true; }
  }));
  const first = here.find(Boolean);
  if (first) {
    sel.value = first; await load(first);
    // #dots in the URL so the app can hand you the particle head directly
    if (/dots|particles?/i.test(location.hash)) dotsSet(true);
    return;
  }
  say("no model found. Drop one in models/ named any of: " + CANDIDATES.join(", "), "bad");
})();
</script>
